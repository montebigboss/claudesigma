  var canvas, cctx, parts = [], raf = null;

  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.className = "fx-canvas";
    document.body.appendChild(canvas);
    cctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }

  function resize() {
    if (!canvas) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  var PALETTE = ["#ff4d6d", "#ffd166", "#06d6a0", "#4cc9f0", "#b388ff", "#ffffff"];

  function burst(x, y, count, power) {
    if (!window.Store.state.settings.motion) return;
    ensureCanvas();
    count = count || 28;
    power = power || 7;
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = (0.35 + Math.random()) * power;
      parts.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 2,
        life: 1,
        decay: 0.012 + Math.random() * 0.016,
        size: 3 + Math.random() * 5,
        color: PALETTE[(Math.random() * PALETTE.length) | 0],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
      });
    }
    loop();
  }

  function rain(count) {
    if (!window.Store.state.settings.motion) return;
    ensureCanvas();
    count = count || 90;
    for (var i = 0; i < count; i++) {
      parts.push({
        x: Math.random() * window.innerWidth,
        y: -20 - Math.random() * window.innerHeight * 0.6,
        vx: (Math.random() - 0.5) * 2,
        vy: 2 + Math.random() * 4,
        life: 1,
        decay: 0.004 + Math.random() * 0.005,
        size: 4 + Math.random() * 7,
        color: PALETTE[(Math.random() * PALETTE.length) | 0],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.25,
      });
    }
    loop();
  }

  function loop() {
    if (raf) return;
    var step = function () {
      raf = null;
      cctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.vy += 0.22;
        p.vx *= 0.994;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life -= p.decay;
        if (p.life <= 0 || p.y > window.innerHeight + 40) {
          parts.splice(i, 1);
          continue;
        }
        cctx.save();
        cctx.globalAlpha = Math.max(0, p.life);
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rot);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        cctx.restore();
      }
      if (parts.length) raf = requestAnimationFrame(step);
      else cctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    };
    raf = requestAnimationFrame(step);
  }

  function burstFrom(el, count, power) {
    if (!el) return;
    var r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, count, power);
  }

  /* --------------------------------------------------------------- toasts */
  function toast(opts) {
    var wrap = document.getElementById("toasts");
    if (!wrap) return;
    var t = document.createElement("div");
    t.className = "toast " + (opts.kind || "");
    t.innerHTML =
      '<div class="toast-icon">' +
      (opts.icon || "✨") +
      "</div><div><div class='toast-title'>" +
      esc(opts.title || "") +
      "</div>" +
      (opts.body ? "<div class='toast-body'>" + esc(opts.body) + "</div>" : "") +
      "</div>";
    wrap.appendChild(t);
    requestAnimationFrame(function () {
      t.classList.add("in");
    });
    setTimeout(function () {
      t.classList.remove("in");
      setTimeout(function () {
        t.remove();
      }, 400);
    }, opts.ms || 3200);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function shake(el) {
    if (!el || !window.Store.state.settings.motion) return;
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
  }

  function floatText(el, text, kind) {
    if (!el || !window.Store.state.settings.motion) return;
    var r = el.getBoundingClientRect();
    var d = document.createElement("div");
    d.className = "float-text " + (kind || "");
    d.textContent = text;
    d.style.left = r.left + r.width / 2 + "px";
    d.style.top = r.top + "px";
    document.body.appendChild(d);
    setTimeout(function () {
      d.remove();
    }, 1100);
  }

  window.FX = {
    play: play,
    buzz: buzz,
    burst: burst,
    burstFrom: burstFrom,
    rain: rain,
    toast: toast,
    shake: shake,
    floatText: floatText,
    esc: esc,
  };
})();

</script>
    <script>
/* Tiny DOM helpers shared by every view. */
(function () {
  "use strict";

  var esc = window.FX.esc;

  function h(html) {
    var d = document.createElement("div");
    d.innerHTML = html;
    return d.firstElementChild;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function pick(arr, n) {
    return shuffle(arr).slice(0, n);
  }

  /* Rules the player is weakest on come up more often. */
  function weighted(items, n) {
    var st = window.Store.state;
    var scored = items.map(function (it) {
      var m = it.r ? st.mastery[it.r] || 0 : 0;
      return { it: it, w: (window.Store.MASTERY_CAP + 1 - m) * (0.6 + Math.random()) };
    });
    scored.sort(function (a, b) {
      return b.w - a.w;
    });
    return shuffle(scored.slice(0, Math.max(n, Math.ceil(n * 1.7)))).slice(0, n).map(function (s) {
      return s.it;
    });
  }

  var sheetEl = null;
  function sheet(html) {
    closeSheet();
    var bg = h('<div class="sheet-bg"></div>');
    var s = h(
      '<div class="sheet" role="dialog" aria-modal="true">' +
        '<button class="sheet-close" aria-label="Close">✕</button>' +
        '<div class="sheet-grab"></div>' +
        html +
        "</div>"
    );
    bg.addEventListener("click", closeSheet);
    s.querySelector(".sheet-close").addEventListener("click", closeSheet);
    document.body.appendChild(bg);
    document.body.appendChild(s);
    document.body.classList.add("locked");
    sheetEl = [bg, s];
    return s;
  }

  function closeSheet() {
    if (!sheetEl) return;
    sheetEl.forEach(function (e) {
      e.remove();
    });
    sheetEl = null;
    document.body.classList.remove("locked");
  }

  function ruleById(n) {
    for (var i = 0; i < window.RULES.length; i++)
      if (window.RULES[i].n === n) return window.RULES[i];
    return null;
  }

  function catName(id) {
    for (var i = 0; i < window.CATEGORIES.length; i++)
      if (window.CATEGORIES[i].id === id) return window.CATEGORIES[i].name;
    return id;
  }

  function pips(n) {
    var m = window.Store.state.mastery[n] || 0;
    var out = '<div class="pips' + (m >= window.Store.MASTERY_CAP ? " max" : "") + '">';
    for (var i = 0; i < window.Store.MASTERY_CAP; i++)
      out += "<i" + (i < m ? ' class="on"' : "") + "></i>";
    return out + "</div>";
  }

  function ruleSheet(n) {
    var r = ruleById(n);
    if (!r) return;
    var wasNew = window.Store.markRead(n);
    var body = r.body
      .split("\n\n")
      .map(function (p) {
        return "<p>" + esc(p) + "</p>";
      })
      .join("");
    var s = sheet(
      '<div class="q-tag">Rule #' +
        r.n +
        " · " +
        esc(catName(r.cat)) +
        "</div><h3>" +
        esc(r.title) +
        "</h3>" +
        '<p class="tiny" style="margin:7px 0 10px;font-size:13px;color:var(--gold)">' +
        esc(r.key) +
        "</p>" +
        pips(r.n) +
        '<div style="height:14px"></div><div class="rule-body">' +
        body +
        "</div>" +
        '<div class="sheet-nav">' +
        '<button class="btn ghost" id="rs-prev"' + (r.n <= 1 ? " disabled" : "") + ">← #" + (r.n - 1) + "</button>" +
        '<button class="btn ghost" id="rs-next"' + (r.n >= 101 ? " disabled" : "") + ">#" + (r.n + 1) + " →</button>" +
        "</div>"
    );
    var prev = s.querySelector("#rs-prev");
    var next = s.querySelector("#rs-next");
    if (prev) prev.onclick = function () { ruleSheet(r.n - 1); };
    if (next) next.onclick = function () { ruleSheet(r.n + 1); };
    if (wasNew) {
      window.FX.play("select");
      window.App.refreshChrome();
    }
  }

  function fmt(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  window.UI = {
    h: h,
    esc: esc,
    shuffle: shuffle,
    pick: pick,
    weighted: weighted,
    sheet: sheet,
    closeSheet: closeSheet,
    ruleById: ruleById,
    ruleSheet: ruleSheet,
    catName: catName,
    pips: pips,
    fmt: fmt,
  };
})();

    <script>
/* The shared quiz runner: Rapid Fire, Heresy, Field Research, Campaign
   Commander scenarios and the Gauntlet all run through here. */
(function () {
  "use strict";

  var esc = UI.esc;

  function run(cfg) {
    var host = document.getElementById("view");
    var items = cfg.items;
    var i = 0,
      correct = 0,
      combo = 0,
      bestCombo = 0,
      lives = cfg.lives || 0,
      livesLeft = lives,
      xpRun = 0,
      answered = false,
      startedAt = Date.now(),
      recentCorrectTimes = [],
      timerId = null;

    host.innerHTML =
      '<div class="drill-head">' +
      '<button class="iconbtn" id="d-back" aria-label="Quit">←</button>' +
      (lives ? '<div class="hp" id="d-hp"></div>' : "") +
      '<div class="progress-track"><i id="d-prog" style="width:0%"></i></div>' +
      '<div class="combo" id="d-combo">0×</div>' +
      "</div>" +
      (cfg.seconds ? '<div class="timer-track"><i id="d-timer" style="width:100%"></i></div>' : "") +
      '<div id="d-body"></div>';

    document.getElementById("d-back").onclick = function () {
      stopTimer();
      App.go(cfg.backTo || "home");
    };

    var body = document.getElementById("d-body");
    var comboEl = document.getElementById("d-combo");
    var progEl = document.getElementById("d-prog");

    function drawHP() {
      if (!lives) return;
      var el = document.getElementById("d-hp");
      var s = "";
      for (var k = 0; k < lives; k++)
        s += "<i" + (k >= livesLeft ? ' class="gone"' : "") + ">❤️</i>";
      el.innerHTML = s;
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    /* The player can leave mid-run via the tab bar, which throws away our
       DOM. Anything asynchronous has to check it's still on screen first. */
    function alive() {
      return document.body.contains(body);
    }

    function startTimer() {
      if (!cfg.seconds) return;
      stopTimer();
      var bar = document.getElementById("d-timer");
      var end = Date.now() + cfg.seconds * 1000;
      timerId = setInterval(function () {
        if (!alive() || !bar) return stopTimer();
        var left = end - Date.now();
        bar.style.width = Math.max(0, (left / (cfg.seconds * 1000)) * 100) + "%";
        if (left <= 0) {
          stopTimer();
          if (!answered) answer(-1, null);
        }
      }, 50);
    }

    function render() {
      answered = false;
      progEl.style.width = (i / items.length) * 100 + "%";
      drawHP();
      var it = items[i];
      var card, opts;

      if (it._kind === "binary") {
        card =
          '<div class="q-card"><div class="q-tag">Throssell doctrine — or heresy?</div>' +
          '<div class="q-text">“' + esc(it.s) + '”</div></div>';
        opts =
          '<div class="opts">' +
          '<button class="opt" data-i="0"><span class="key">1</span><span>✅ &nbsp;Throssell would say this</span></button>' +
          '<button class="opt" data-i="1"><span class="key">2</span><span>🔥 &nbsp;Heresy. Burn it.</span></button>' +
          "</div>";
      } else {
        var o = it._opts;
        opts =
          '<div class="opts">' +
          o
            .map(function (t, k) {
              return (
                '<button class="opt" data-i="' +
                k +
                '"><span class="key">' +
                (k + 1) +
                "</span><span>" +
                esc(t) +
                "</span></button>"
              );
            })
            .join("") +
          "</div>";
        card =
          '<div class="q-card"><div class="q-tag">' +
          esc(it._tag || cfg.tag || "Question") +
          '</div><div class="q-text">' +
          esc(it.q) +
          "</div></div>";
      }

      body.innerHTML =
        card + opts + '<div id="d-verdict"></div>' +
        '<div class="kbd-hint">Press 1-4 to answer · Enter for next</div>';

      Array.prototype.forEach.call(body.querySelectorAll(".opt"), function (b) {
        b.onclick = function () {
          answer(parseInt(b.dataset.i, 10), b);
        };
      });
      startTimer();
    }

    function answer(chosen, btn) {
      if (answered || !alive()) return;
      answered = true;
      stopTimer();
      var it = items[i];
      var right, correctIdx;

      if (it._kind === "binary") {
        correctIdx = it.t ? 0 : 1;
      } else {
        correctIdx = it._answerIdx;
      }
      right = chosen === correctIdx;

      var btns = body.querySelectorAll(".opt");
      Array.prototype.forEach.call(btns, function (b, k) {
        b.classList.add("locked");
        if (k === correctIdx) b.classList.add("right");
        else if (k === chosen) b.classList.add("wrong");
        else b.classList.add("faded");
      });

      if (right) {
        correct++;
        combo++;
        if (combo > bestCombo) bestCombo = combo;
        var gain = 30 + Math.min(combo, 12) * 6;
        if (cfg.seconds) gain += 10;
        xpRun += gain;
        Store.addXP(gain);
        Store.noteCombo(combo);
        FX.play("correct", combo);
        FX.buzz(10);
        if (btn) {
          FX.floatText(btn, "+" + gain, "");
          if (combo >= 3) FX.burstFrom(btn, 14 + combo, 5 + Math.min(combo, 8));
        }
        if (combo > 0 && combo % 5 === 0) {
          FX.play("combo");
          FX.toast({ icon: "⚡", title: combo + "× combo!", body: "Multiplier climbing.", kind: "gold", ms: 1700 });
        }
        recentCorrectTimes.push(Date.now());
        recentCorrectTimes = recentCorrectTimes.filter(function (t) {
          return Date.now() - t < 60000;
        });
        if (recentCorrectTimes.length >= 8) Store.grant("eight-emails");
        comboEl.classList.add("pop");
        setTimeout(function () {
          comboEl.classList.remove("pop");
        }, 150);
      } else {
        combo = 0;
        livesLeft--;
        FX.play("wrong");
        FX.buzz(45);
        FX.shake(body.querySelector(".q-card"));
        if (btn) FX.floatText(btn, "✗", "bad");
      }

      comboEl.textContent = combo + "×";
      comboEl.classList.toggle("hot", combo >= 8);

      Store.recordAnswer(cfg.mode, right, it.r);
      Store.bumpMetric("anyCorrect", right ? 1 : 0);
      if (cfg.metric && right) {
        var done = Store.bumpMetric(cfg.metric);
        done.forEach(questToast);
      }

      showVerdict(it, right);
      App.refreshChrome();

      if (lives && livesLeft <= 0) {
        drawHP();
        setTimeout(function () {
          if (alive()) finish(true);
        }, 1500);
      }
    }

    function questToast(def) {
      FX.play("achievement");
      FX.toast({ icon: "🎯", title: "Daily quest complete", body: def.text + " · +" + def.xp + " XP", kind: "mint" });
    }

    function showVerdict(it, right) {
      var v = document.getElementById("d-verdict");
      var ruleLink = it.r
        ? '<span class="vr" onclick="UI.ruleSheet(' + it.r + ')">Read Rule #' + it.r + " →</span>"
        : "";
      v.innerHTML =
        '<div class="verdict ' +
        (right ? "good" : "bad") +
        '"><div class="vh">' +
        (right ? "✅ Correct" : "❌ Not quite") +
        (it._kind === "binary" && !right
          ? " — it's " + (it.t ? "doctrine" : "heresy")
          : "") +
        '</div><div class="vb">' +
        esc(it.why) +
        "</div>" +
        ruleLink +
        "</div>" +
        '<button class="btn" id="d-next" style="margin-top:12px">' +
        (i + 1 >= items.length ? "See results →" : "Next →") +
        "</button>";
      document.getElementById("d-next").onclick = next;
      document.getElementById("d-next").focus();
    }

    function next() {
      if (lives && livesLeft <= 0) return finish(true);
      i++;
      if (i >= items.length) return finish(false);
      render();
    }

    function finish(died) {
      stopTimer();
      progEl.style.width = "100%";
      var secs = Math.round((Date.now() - startedAt) / 1000);
      var acc = i === 0 ? 0 : Math.round((correct / Math.max(1, died ? i + 1 : items.length)) * 100);
      var st = Store.state;
      st.stats.runs++;
      var ctx = {};
      if (!died && correct === items.length && items.length >= 8) ctx.flawless = true;
      if (cfg.mode === "gauntlet") {
        if (!died) {
          st.stats.gauntlets++;
          ctx.gauntlet = true;
          if (livesLeft === lives) ctx.gauntletPerfect = true;
        }
      }
      if (cfg.mode === "heresy" && acc >= 90 && items.length >= 10) ctx.ach = "heresy-hunter";
      if (cfg.mode === "campaign" && !died && correct === items.length) ctx.ach = "commander";
      Store.save();
      Store.checkAch(ctx);

      var newStreak = Store.touchStreak();
      var perfect = correct === items.length;

      if (died) {
        FX.play("fail");
      } else {
        FX.play("finish");
        if (perfect) FX.rain(120);
        else if (acc >= 70) FX.rain(50);
      }

      var host2 = document.getElementById("view");
      host2.innerHTML =
        '<div class="result">' +
        '<div class="big">' + acc + "%</div>" +
        '<div class="lbl">' + (died ? "You ran out of lives" : "accuracy") + "</div>" +
        "<h3>" +
        (died
          ? "Down but not out"
          : perfect
          ? "Flawless."
          : acc >= 80
          ? "Sharp work."
          : acc >= 50
          ? "Getting there."
          : "Back to the Codex.") +
        "</h3>" +
        '<div class="result-stats">' +
        '<div class="rs"><div class="v">' + correct + "/" + (died ? i + 1 : items.length) + '</div><div class="k">Correct</div></div>' +
        '<div class="rs"><div class="v">' + bestCombo + '×</div><div class="k">Best combo</div></div>' +
        '<div class="rs"><div class="v">+' + UI.fmt(xpRun) + '</div><div class="k">XP earned</div></div>' +
        "</div>" +
        (newStreak
          ? '<div class="tiny" style="margin-top:12px">🔥 Streak extended to ' + Store.state.streak.count + " day" + (Store.state.streak.count === 1 ? "" : "s") + "</div>"
          : "") +
        '<div class="tiny" style="margin-top:8px">' + secs + "s · " + UI.fmt(Store.state.xp) + " XP total</div>" +
        '<div class="btn-row" style="margin-top:20px">' +
        '<button class="btn ghost" id="r-home">Home</button>' +
        '<button class="btn" id="r-again">Run it again</button>' +
        "</div></div>";

      document.getElementById("r-home").onclick = function () {
        App.go(cfg.backTo || "home");
      };
      document.getElementById("r-again").onclick = cfg.again;
      App.refreshChrome();
    }

    /* keyboard */
    function keys(e) {
      if (!document.getElementById("d-body")) {
        document.removeEventListener("keydown", keys);
        return;
      }
      if (e.key === "Enter") {
        var nb = document.getElementById("d-next");
        if (nb) {
          e.preventDefault();
          nb.click();
        }
        return;
      }
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= 4 && !answered) {
        var b = body.querySelector('.opt[data-i="' + (n - 1) + '"]');
        if (b) b.click();
      }
    }
    document.addEventListener("keydown", keys);

    render();
  }

  /* ------------------------------------------------------------ builders */

  function prepMCQ(item, tag) {
    var it = Object.create(item);
    var pairs = item.o.map(function (t, k) {
      return { t: t, k: k };
    });
    var sh = UI.shuffle(pairs);
    it._opts = sh.map(function (p) {
      return p.t;
    });
    it._answerIdx = sh.findIndex(function (p) {
      return p.k === item.a;
    });
    it._tag = tag;
    return it;
  }

  function prepBinary(item) {
    var it = Object.create(item);
    it._kind = "binary";
    return it;
  }

  window.Drills = {
    rapidFire: function (n) {
      n = n || 12;
      var picked = UI.weighted(window.RAPID_FIRE, n);
      run({
        mode: "rapid",
        metric: "rapidCorrect",
        seconds: 20,
        items: picked.map(function (x) {
          return prepMCQ(x, "Rule #" + x.r);
        }),
        again: function () {
          Drills.rapidFire(n);
        },
      });
    },
    heresy: function (n) {
      n = n || 15;
      var picked = UI.weighted(window.HERESY, n);
      run({
        mode: "heresy",
        metric: "heresyCorrect",
        seconds: 12,
        items: picked.map(prepBinary),
        again: function () {
          Drills.heresy(n);
        },
      });
    },
    research: function (n) {
      n = n || 10;
      var picked = UI.pick(window.RESEARCH_Q, n);
      run({
        mode: "research",
        metric: "researchCorrect",
        tag: "Market Detective",
        items: picked.map(function (x) {
          return prepMCQ(x, "Field Manual");
        }),
        again: function () {
          Drills.research(n);
        },
      });
    },
    campaignQ: function (n) {
      n = n || 10;
      var picked = UI.pick(window.CAMPAIGN_Q, n);
      run({
        mode: "campaign",
        metric: "campaignCorrect",

      // `flip` swaps which source line lands on which side.
      it._winSide = flip

        '<div class="q-card"><div class="q-tag">Subject Line Lab · Rule #' +

        if (b) b.click();

    function judge(side, btn) {

      var it = items[i];
      var right = side === it._winSide;
      Array.prototype.forEach.call(body.querySelectorAll(".opt"), function (b) {

  function commander(n) {

        fact("Email tolerance", r.tol.name, r.tol.desc) +

        FX.toast({ icon: "🎯", title: "Daily quest complete", body: d.text + " · +" + d.xp + " XP", kind: "mint" });

      document.getElementById("c-verdict").innerHTML =

        '<div class="vb">' + esc(r.tol.name) + " tolerance × " + esc(r.agg.name.replace(" Aggressiveness", "")) +

        '<button class="btn" id="c-next" style="margin-top:12px">' +
        (i + 1 >= rounds.length ? "See results →" : "Next call →") + "</button>";
      document.getElementById("c-next").onclick = function () {
        i++;
        if (i >= rounds.length) return finish();
        render();
      };
      App.refreshChrome();
    }

    function finish() {
      var acc = Math.round((correct / rounds.length) * 100);
      Store.state.stats.runs++;
      Store.save();
      if (correct === rounds.length) Store.grant("commander");
      var streak = Store.touchStreak();
      FX.play("finish");
      if (acc >= 75) FX.rain(acc === 100 ? 110 : 45);
      host.innerHTML =
        '<div class="result"><div class="big">' + acc + '%</div><div class="lbl">frequency calls correct</div>' +
        "<h3>" + (acc === 100 ? "Field Marshal." : acc >= 60 ? "You know the table." : "Study the cheat sheet.") + "</h3>" +
        '<div class="result-stats"><div class="rs"><div class="v">' + correct + "/" + rounds.length + '</div><div class="k">Correct</div></div>' +
        '<div class="rs"><div class="v">+' + UI.fmt(xpRun) + '</div><div class="k">XP earned</div></div>' +
        '<div class="rs"><div class="v">' + Store.state.streak.count + '</div><div class="k">Day streak</div></div></div>' +
        '<div class="btn-row" style="margin-top:20px"><button class="btn ghost" id="cr-manual">See the table</button>' +
        '<button class="btn" id="cr-again">Again</button></div>' +
        '<button class="btn ghost" id="cr-home" style="margin-top:9px">Home</button></div>';
      document.getElementById("cr-again").onclick = function () {
        commander(n);
      };
      document.getElementById("cr-home").onclick = function () {
        App.go("home");
      };
      document.getElementById("cr-manual").onclick = function () {
        App.go("codex");
        setTimeout(function () {
          Views.manualSheet("caesar");
        }, 60);
      };
      App.refreshChrome();
      if (streak) {
        /* streak toast already handled by chrome refresh */
      }
    }

    render();
  }

  window.Labs = { subjectLab: subjectLab, triforce: triforce, commander: commander };
})();

  function drawList() {
    var st = Store.state;
    var term = codexQuery.trim().toLowerCase();
    var list = window.RULES.filter(function (r) {
      if (codexFilter === "todo" && (st.mastery[r.n] || 0) >= Store.MASTERY_CAP) return false;
      if (codexFilter !== "all" && codexFilter !== "todo" && r.cat !== codexFilter) return false;
      if (!term) return true;
      return (
        r.title.toLowerCase().indexOf(term) >= 0 ||
        r.key.toLowerCase().indexOf(term) >= 0 ||
        r.body.toLowerCase().indexOf(term) >= 0 ||
        String(r.n) === term
      );
    });

    var el = document.getElementById("cx-list");
    if (!list.length) {
      el.innerHTML = '<div class="empty"><span class="ee">🕳️</span>Nothing matches that.</div>';
      return;
    }
    el.innerHTML = list
      .map(function (r) {
        return (
          '<button class="rule-row' + (st.read[r.n] ? " read" : "") + '" data-n="' + r.n + '">' +
          '<div class="num">' + r.n + "</div><div style=\"flex:1\">" +
          '<div class="rt">' + esc(r.title) + "</div>" +
          '<div class="rk">' + esc(r.key) + "</div>" +
          UI.pips(r.n) + "</div></button>"
        );
      })
      .join("");
    Array.prototype.forEach.call(el.querySelectorAll(".rule-row"), function (b) {
      b.onclick = function () {
        UI.ruleSheet(parseInt(b.dataset.n, 10));
      };
    });
  }

    var fresh = Store.markManualRead(id);
    var html =
      '<div class="q-tag">Field Manual · ' + esc(m.tag) + "</div><h3>" + esc(m.name) + "</h3>" +
      '<p class="tiny" style="margin:6px 0 16px">' + esc(m.blurb) + "</p>" +
      (m.note ? '<div class="note">' + esc(m.note) + "</div>" : "") +
      m.sections
        .map(function (s) {
          return (
            '<div class="manual-sec"><h4>' + esc(s.h) + "</h4>" +
            (s.lead ? '<p class="lead">' + esc(s.lead) + "</p>" : "") +

            s.items
              .map(function (t) {
                return "<li>" + esc(t) + "</li>";
              })
              .join("") +
            "</ul></div>"
          );

      FX.play("achievement");

  /* ------------------------------------------------------------------ DOJO */

    var st = Store.state;
    var done = Object.keys(st.dojo).filter(function (k) {
      return st.dojo[k].done;
    }).length;

    document.getElementById("view").innerHTML =
      '<div class="hero" style="padding:22px 20px"><h1 style="font-size:24px">The Dojo</h1>' +
      "<p>Knowing 101 rules is worth nothing until your hands know them. Reps are self-scored — be honest, nobody's watching.</p>" +
      '<div class="rank-line"><span class="rank-badge"><span class="em">🥋</span>' + done + "/" + window.DOJO.length + " reps complete</span></div></div>" +

      '<h2 class="sec">Story Vault</h2>' +
      '<div class="card"><div class="tiny" id="vault-prompt" style="color:var(--violet);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px"></div>' +
      '<textarea class="pad" id="vault-in" style="min-height:110px" placeholder="Two sentences. What happened — and how did you react?"></textarea>' +
      '<div class="btn-row"><button class="btn ghost small" id="vault-skip">New prompt</button>' +
      '<button class="btn small" id="vault-save" style="flex:1">Bank it (+40 XP)</button></div>' +
      '<div class="tiny" style="margin-top:10px">Rule #27 — most people have several story-worthy moments a day. Bank them and your story sense compounds.</div></div>' +
      '<div id="vault-list"></div>' +

      '<h2 class="sec">Writing reps</h2><div id="dojo-list"></div>';

    newPrompt();
    document.getElementById("vault-skip").onclick = function () {
      FX.play("tick");
      newPrompt();
    };
    document.getElementById("vault-save").onclick = saveVault;

    list.innerHTML = window.DOJO.map(function (d) {
      var rec = st.dojo[d.id];

        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px">' +
        '<span class="tier-tag tier-' + d.tier + '">Tier ' + d.tier + "</span>" +
        (rec && rec.done ? '<span class="tier-tag" style="color:var(--mint)">✓ Done</span>' : "") +
        "</div>" +
        '<div class="rt">' + esc(d.name) + "</div>" +
        '<div class="rk">' + esc(d.brief.slice(0, 110)) + (d.brief.length > 110 ? "…" : "") + "</div>" +

        "</div></button>"

  var currentPrompt = "";
  function newPrompt() {
    var p = window.VAULT_PROMPTS[(Math.random() * window.VAULT_PROMPTS.length) | 0];
    currentPrompt = p;
    document.getElementById("vault-prompt").textContent = p;
  }

  function saveVault() {
    var ta = document.getElementById("vault-in");
    var text = ta.value.trim();
    if (text.length < 12) {
      FX.play("wrong");
      FX.shake(ta);
      FX.toast({ icon: "✍️", title: "Give it a bit more", body: "At least a sentence or two." });
      return;
    }
    Store.state.vault.unshift({ at: Date.now(), prompt: currentPrompt, text: text });
    Store.addXP(40);
    Store.save();
    Store.bumpMetric("vaultToday").forEach(function (d) {
      FX.toast({ icon: "🎯", title: "Daily quest complete", body: d.text + " · +" + d.xp + " XP", kind: "mint" });
    });
    Store.touchStreak();
    Store.checkAch();
    ta.value = "";
    FX.play("levelup");
    FX.burstFrom(document.getElementById("vault-save"), 26, 8);
    FX.toast({ icon: "🗝️", title: "Banked", body: "+40 XP · " + Store.state.vault.length + " stories in the vault", kind: "gold" });
    newPrompt();
    drawVault();
    App.refreshChrome();
  }

  function drawVault() {
    var v = Store.state.vault;
    var el = document.getElementById("vault-list");
    if (!el) return;
    if (!v.length) {
      el.innerHTML = "";
      return;
    }
    el.innerHTML =
      '<h2 class="sec">' + v.length + " banked</h2>" +
      v
        .slice(0, 12)
        .map(function (it, idx) {
          var d = new Date(it.at);
          return (
            '<div class="vault-item"><div class="vp">' + esc(it.prompt) + "</div>" +
            '<div class="vt">' + esc(it.text) + "</div>" +
            '<div class="vd">' + d.toLocaleDateString() + " · " +
            '<span style="cursor:pointer;text-decoration:underline" data-del="' + idx + '">delete</span></div></div>'
          );
        })
        .join("") +
      (v.length > 12 ? '<div class="tiny" style="text-align:center;padding:8px">…and ' + (v.length - 12) + " more</div>" : "");

    Array.prototype.forEach.call(el.querySelectorAll("[data-del]"), function (b) {
      b.onclick = function () {
        Store.state.vault.splice(parseInt(b.dataset.del, 10), 1);
        Store.save();
        FX.play("tick");
        drawVault();
      };
    });
  }

  function dojoSheet(id) {
    var d = null;
    for (var i = 0; i < window.DOJO.length; i++) if (window.DOJO[i].id === id) d = window.DOJO[i];
    if (!d) return;
    var rec = Store.state.dojo[id] || { done: false, text: "", checks: [] };

    var s = UI.sheet(
      '<div class="q-tag">Dojo rep · Tier ' + d.tier + "</div><h3>" + esc(d.name) + "</h3>" +
      '<div class="tiny" style="margin:8px 0 14px">Rules ' + d.rules.map(function (r) {
        return '<span style="cursor:pointer;color:var(--ice)" onclick="UI.closeSheet();UI.ruleSheet(' + r + ')">#' + r + "</span>";
      }).join(", ") + "</div>" +
      '<div class="lead-quote" style="font-size:15px">' + esc(d.brief) + "</div>" +
      '<div class="note">' + esc(d.kicker) + "</div>" +
      '<textarea class="pad" id="dj-text" placeholder="Write it here. Or write it elsewhere and paste it in — the point is that it exists.">' +
      esc(rec.text || "") + "</textarea>" +
      '<div class="wordcount" id="dj-wc"></div>' +
      '<h2 class="sec">Self-score</h2><div id="dj-checks">' +
      d.rubric
        .map(function (t, k) {
          return (
            '<button class="check' + (rec.checks && rec.checks[k] ? " on" : "") + '" data-k="' + k + '">' +
            '<div class="box">' + (rec.checks && rec.checks[k] ? "✓" : "") + "</div>" +
            '<div class="lb">' + esc(t) + "</div></button>"
          );
        })
        .join("") +
      "</div>" +
      '<button class="btn" id="dj-save" style="margin-top:16px">Save rep</button>' +
      '<button class="btn ghost" onclick="UI.closeSheet()" style="margin-top:9px">Close</button>'
    );

    var checks = (rec.checks || []).slice();
    while (checks.length < d.rubric.length) checks.push(false);

    var ta = s.querySelector("#dj-text");
    var wc = s.querySelector("#dj-wc");
    function count() {
      var w = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
      wc.textContent = w + " word" + (w === 1 ? "" : "s");
    }
    ta.oninput = count;
    count();

    Array.prototype.forEach.call(s.querySelectorAll(".check"), function (b) {
      b.onclick = function () {
        var k = parseInt(b.dataset.k, 10);
        checks[k] = !checks[k];
        b.classList.toggle("on", checks[k]);
        b.querySelector(".box").textContent = checks[k] ? "✓" : "";
        FX.play("select");
      };
    });

    s.querySelector("#dj-save").onclick = function () {
      var ticked = checks.filter(Boolean).length;
      var text = ta.value.trim();
      if (text.length < 30) {
        FX.play("wrong");
        FX.shake(ta);
        FX.toast({ icon: "✍️", title: "Do the rep first", body: "Paste or write your work before saving." });
        return;
      }
      var wasDone = Store.state.dojo[id] && Store.state.dojo[id].done;
      var nowDone = ticked >= Math.ceil(d.rubric.length * 0.7);
      Store.state.dojo[id] = { done: nowDone, text: text, checks: checks, at: Date.now() };
      Store.save();
      if (nowDone && !wasDone) {
        var xp = 200 + d.tier * 100;
        Store.addXP(xp);
        Store.touchStreak();
        Store.checkAch();
        FX.play("levelup");
        FX.rain(90);
        FX.toast({ icon: "🥋", title: "Rep complete", body: d.name + " · +" + xp + " XP", kind: "gold", ms: 4200 });
        UI.closeSheet();
        dojo();
      } else if (!nowDone) {
        Store.addXP(30);
        FX.play("select");
        FX.toast({
          icon: "📝",
          title: "Saved as a draft",
          body: "Tick at least " + Math.ceil(d.rubric.length * 0.7) + " of " + d.rubric.length + " rubric points to complete it.",
        });
      } else {
        FX.play("select");
        FX.toast({ icon: "💾", title: "Updated" });
        UI.closeSheet();
        dojo();
      }
      App.refreshChrome();
    };
  }

        "<h3>Wipe everything?</h3><p class=\"tiny\" style=\"margin:6px 0 16px\">Your XP, rank, mastery map, story vault and every saved Dojo rep will be deleted. There is no undo.</p>" +
        '<button class="btn" id="rs-yes" style="background:linear-gradient(135deg,var(--bad),#a3122c)">Yes, wipe it</button>' +
        '<button class="btn ghost" onclick="UI.closeSheet()" style="margin-top:9px">Cancel</button>'
      );
      document.getElementById("rs-yes").onclick = function () {
        Store.reset();
        UI.closeSheet();
        FX.play("fail");
        App.go("home");
        App.refreshChrome();
      };
    };
  }

  function labelFor(k) {
    return {
      rapid: "Rapid Fire",
      heresy: "Heresy",
      subject: "Subject Lines",
      triforce: "Triforce",
      commander: "Commander",
      campaign: "Campaign Q",
      research: "Field Research",
      gauntlet: "Gauntlet",
    }[k] || k;
  }

  window.Views = {
    home: home,
    codex: codex,
    dojo: dojo,
    progress: progress,
    manualSheet: manualSheet,
    MODES: MODES,
  };
})();

</script>
    <script>
/* Router + chrome. */
(function () {
  "use strict";

  var TABS = [
    { id: "home", icon: "⚡", label: "Train" },
    { id: "codex", icon: "📖", label: "Codex" },
    { id: "dojo", icon: "🥋", label: "Dojo" },
    { id: "progress", icon: "📊", label: "Progress" },
  ];

  var current = "home";

  function go(id) {
    current = id;
    UI.closeSheet();
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    Views[id]();
    drawTabs();
    refreshChrome();
    try {
      history.replaceState(null, "", "#" + id);
    } catch (e) {}
  }

  function drawTabs() {
    document.getElementById("tabbar").innerHTML = TABS.map(function (t) {
      return (
        '<button class="' + (current === t.id ? "on" : "") + '" data-t="' + t.id + '">' +
        '<span class="ic">' + t.icon + "</span>" + t.label + "</button>"
      );
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (b) {
      b.onclick = function () {
        if (current === b.dataset.t) return;
        FX.play("tick");
        go(b.dataset.t);
      };
    });
  }

  function refreshChrome() {
    var st = Store.state;
    var rk = Store.rank();
    document.getElementById("chip-streak").innerHTML = "🔥 " + st.streak.count;
    document.getElementById("chip-xp").innerHTML = "⭐ " + UI.fmt(st.xp);
    document.getElementById("chip-rank").innerHTML = rk.cur.icon + " " + rk.cur.name;
    document.getElementById("xpfill").style.width = rk.pct + "%";
  }

  function boot() {
    Store.load();

    // Some hosts inject this page's markup straight into <body> rather than
    // giving us the whole document. Rescue any <style> from there before we
    // render, and own a root node instead of overwriting the body — otherwise
    // we'd delete our own stylesheet on the first paint.
    Array.prototype.forEach.call(
      document.querySelectorAll("body style"),
      function (s) {
        document.head.appendChild(s);
      }
    );

    var root = document.getElementById("dojo-root");
    if (!root) {
      root = document.createElement("div");
      root.id = "dojo-root";
      document.body.appendChild(root);
    }

    root.innerHTML =
      '<div class="topbar"><div class="topbar-row">' +
      '<div class="brand"><span class="dot"></span>INBOX DOJO</div>' +
      '<div class="stat-chips">' +
      '<span class="chip flame" id="chip-streak">🔥 0</span>' +
      '<span class="chip xp" id="chip-xp">⭐ 0</span>' +
      '<span class="chip rank" id="chip-rank" style="display:none"></span>' +
      "</div></div>" +
      '<div class="xpbar"><i id="xpfill" style="width:0%"></i></div></div>' +
      '<div class="app"><div id="view"></div></div>' +
      '<nav class="tabbar" id="tabbar"></nav>' +
      '<div id="toasts"></div>';

    // The rank chip only fits on wider screens.
    function fitChips() {
      document.getElementById("chip-rank").style.display =
        window.innerWidth > 600 ? "" : "none";
    }
    window.addEventListener("resize", fitChips);
    fitChips();

    window.addEventListener("rankup", function (e) {
      FX.play("levelup");
      FX.rain(140);
      FX.toast({
        icon: e.detail.icon,
        title: "RANK UP — " + e.detail.name,
        body: e.detail.blurb,
        kind: "gold",
        ms: 5200,
      });
    });

    window.addEventListener("achievement", function (e) {
      FX.play("achievement");
      FX.toast({
        icon: e.detail.icon,
        title: "Achievement: " + e.detail.name,
        body: e.detail.desc + " · +150 XP",
        kind: "gold",
        ms: 4600,
      });
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") UI.closeSheet();
    });

    var hash = (location.hash || "").replace("#", "");
    go(TABS.some(function (t) { return t.id === hash; }) ? hash : "home");

    // Welcome the first-timer with the rule everything else hangs off.
    if (Store.state.stats.answered === 0 && !Store.state.read[1]) {
      setTimeout(function () {
        FX.toast({
          icon: "🗿",
          title: "Start with Rule #1",
          body: "The most important word in copywriting isn't 'free'.",
          ms: 5000,
        });
      }, 900);
    }
  }

  window.App = { go: go, refreshChrome: refreshChrome, boot: boot };
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
  </body>
</html>
