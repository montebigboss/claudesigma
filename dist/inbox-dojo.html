<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a12" />
    <title>Inbox Dojo — Throssell Email Copywriting Trainer</title>
    <meta
      name="description"
      content="A high-dopamine trainer for Daniel Throssell's Email Copywriting Compendium, Campaign Conqueror cheat sheet and Market Detective."
    />
    <style>
/* ===========================================================================
   INBOX DOJO — dark, loud, fast.
   =========================================================================== */

:root {
  --bg: #0a0a12;
  --bg-2: #10101c;
  --panel: #15152400;
  --card: rgba(255, 255, 255, 0.045);
  --card-hi: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.1);
  --line-hi: rgba(255, 255, 255, 0.2);
  --text: #f2f2f7;
  --dim: #9a9ab0;
  --dimmer: #6c6c85;

  --hot: #ff2d6f;
  --hot-2: #ff7a45;
  --gold: #ffc93c;
  --mint: #16e0a0;
  --ice: #35c8ff;
  --violet: #a97bff;

  --ok: #16e0a0;
  --bad: #ff3b5c;

  --r: 16px;
  --r-sm: 10px;
  --shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
  background-image: radial-gradient(
      900px 600px at 12% -8%,
      rgba(255, 45, 111, 0.14),
      transparent 60%
    ),
    radial-gradient(800px 520px at 92% 4%, rgba(53, 200, 255, 0.12), transparent 60%),
    radial-gradient(700px 700px at 50% 110%, rgba(169, 123, 255, 0.1), transparent 60%);
  background-attachment: fixed;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
}
a {
  color: var(--ice);
}

::selection {
  background: var(--hot);
  color: #fff;
}

/* ------------------------------------------------------------------ shell */
.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 16px 120px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  margin: 0 -16px 18px;
  padding: 10px 16px 12px;
  background: rgba(10, 10, 18, 0.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}

.topbar-row {
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 900px;
  margin: 0 auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-size: 15px;
  white-space: nowrap;
}
.brand .dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--hot);
  box-shadow: 0 0 14px var(--hot);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.82); }
}

.stat-chips {
  margin-left: auto;
  display: flex;
  gap: 7px;
  align-items: center;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
}
.chip.flame { color: var(--hot-2); border-color: rgba(255, 122, 69, 0.35); }
.chip.xp { color: var(--gold); border-color: rgba(255, 201, 60, 0.3); }
.chip.rank { color: var(--violet); border-color: rgba(169, 123, 255, 0.3); }

.xpbar {
  height: 5px;
  background: rgba(255, 255, 255, 0.07);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 10px;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}
.xpbar > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold), var(--hot-2), var(--hot));
  transition: width 0.65s cubic-bezier(0.2, 0.9, 0.25, 1);
  box-shadow: 0 0 12px rgba(255, 122, 69, 0.6);
}

/* ------------------------------------------------------------------- nav */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  display: flex;
  justify-content: center;
  gap: 2px;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  background: rgba(10, 10, 18, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1;
  max-width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 4px;
  border-radius: 12px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--dimmer);
  transition: color 0.18s, background 0.18s, transform 0.12s;
}
.tabbar button .ic { font-size: 19px; line-height: 1; }
.tabbar button.on { color: var(--text); background: var(--card); }
.tabbar button:active { transform: scale(0.93); }

/* ----------------------------------------------------------------- cards */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 14px;
  backdrop-filter: blur(8px);
}

.hero {
  border-radius: 22px;
  padding: 26px 22px;
  margin-bottom: 18px;
  background: linear-gradient(140deg, rgba(255, 45, 111, 0.16), rgba(169, 123, 255, 0.12) 55%, rgba(53, 200, 255, 0.1));
  border: 1px solid var(--line-hi);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  inset: -40% -10% auto auto;
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, rgba(255, 201, 60, 0.22), transparent 65%);
  pointer-events: none;
}
.hero h1 {
  margin: 0 0 4px;
  font-size: clamp(24px, 5.4vw, 34px);
  letter-spacing: -0.035em;
  line-height: 1.08;
  font-weight: 850;
}
.hero p { margin: 0; color: var(--dim); font-size: 14.5px; max-width: 46ch; }

.rank-line {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.rank-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 13px 7px 9px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--line-hi);
  font-weight: 800;
  font-size: 13.5px;
}
.rank-badge .em { font-size: 17px; }
.rank-next { font-size: 12.5px; color: var(--dim); }

h2.sec {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--dimmer);
  font-weight: 800;
  margin: 26px 0 11px;
}

/* -------------------------------------------------------------- mode grid */
.modes {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
}
@media (min-width: 700px) {
  .modes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

.mode {
  position: relative;
  text-align: left;
  padding: 17px 16px 15px;
  border-radius: var(--r);
  background: var(--card);
  border: 1px solid var(--line);
  overflow: hidden;
  transition: transform 0.15s cubic-bezier(0.2, 0.9, 0.3, 1.4), border-color 0.2s,
    background 0.2s;
  display: block;
  width: 100%;
}
.mode::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--accent, var(--hot));
  opacity: 0.9;
}
.mode:hover {
  transform: translateY(-3px);
  border-color: var(--line-hi);
  background: var(--card-hi);
}
.mode:active { transform: translateY(0) scale(0.985); }
.mode .ic { font-size: 25px; display: block; margin-bottom: 9px; }
.mode .nm {
  font-weight: 800;
  font-size: 15.5px;
  letter-spacing: -0.015em;
  margin-bottom: 3px;
}
.mode .ds { font-size: 12.8px; color: var(--dim); line-height: 1.4; }
.mode .meta {
  margin-top: 10px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent, var(--hot));
}

/* ------------------------------------------------------------- quests */
.quest {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.quest:last-child { border-bottom: 0; }
.quest .box {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 2px solid var(--line-hi);
  display: grid;
  place-items: center;
  font-size: 13px;
  flex-shrink: 0;
  transition: all 0.25s;
}
.quest.done .box {
  background: var(--mint);
  border-color: var(--mint);
  color: #04231a;
  font-weight: 900;
}
.quest .txt { flex: 1; font-size: 14px; }
.quest.done .txt { color: var(--dim); text-decoration: line-through; }
.quest .prog { font-size: 12px; color: var(--dimmer); font-variant-numeric: tabular-nums; font-weight: 700; }
.quest .rew { font-size: 11.5px; font-weight: 800; color: var(--gold); }

/* ------------------------------------------------------------- drill UI */
.drill-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.iconbtn {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 16px;
  transition: background 0.15s;
}
.iconbtn:hover { background: var(--card-hi); }

.hp { display: flex; gap: 4px; }
.hp i {
  font-style: normal;
  font-size: 17px;
  transition: transform 0.25s, opacity 0.25s;
}
.hp i.gone { opacity: 0.22; transform: scale(0.75); filter: grayscale(1); }

.progress-track {
  flex: 1;
  height: 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  overflow: hidden;
}
.progress-track > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--ice), var(--mint));
  border-radius: 999px;
  transition: width 0.35s ease;
}

.combo {
  font-weight: 900;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: var(--gold);
  min-width: 46px;
  text-align: right;
  transition: transform 0.14s;
}
.combo.pop { transform: scale(1.4); }
.combo.hot { color: var(--hot); text-shadow: 0 0 16px rgba(255, 45, 111, 0.8); }

.timer-track {
  height: 4px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 16px;
}
.timer-track > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--mint), var(--gold), var(--hot));
  border-radius: 999px;
}

.q-card {
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px 18px;
  margin-bottom: 14px;
  animation: qin 0.34s cubic-bezier(0.2, 0.9, 0.25, 1);
}
@keyframes qin {
  from { opacity: 0; transform: translateY(14px) scale(0.985); }
  to { opacity: 1; transform: none; }
}
.q-tag {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dimmer);
  margin-bottom: 9px;
}
.q-text {
  font-size: clamp(17px, 3.9vw, 21px);
  font-weight: 750;
  letter-spacing: -0.02em;
  line-height: 1.32;
}
.q-sub { margin-top: 10px; font-size: 14.5px; color: var(--dim); line-height: 1.5; }

.opts { display: grid; gap: 9px; }
.opt {
  text-align: left;
  width: 100%;
  padding: 14px 15px;
  border-radius: 13px;
  background: var(--card);
  border: 1.5px solid var(--line);
  font-size: 15px;
  line-height: 1.4;
  font-weight: 550;
  transition: transform 0.12s, background 0.15s, border-color 0.15s;
  display: flex;
  gap: 11px;
  align-items: flex-start;
}
.opt .key {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.08);
  display: grid;
  place-items: center;
  font-size: 11.5px;
  font-weight: 800;
  color: var(--dim);
  margin-top: 1px;
}
.opt:hover:not(.locked) { background: var(--card-hi); border-color: var(--line-hi); transform: translateX(3px); }
.opt:active:not(.locked) { transform: scale(0.99); }
.opt.locked { cursor: default; }
.opt.right {
  background: rgba(22, 224, 160, 0.16);
  border-color: var(--ok);
  animation: rightpop 0.4s cubic-bezier(0.2, 0.9, 0.25, 1.4);
}
.opt.right .key { background: var(--ok); color: #04231a; }
@keyframes rightpop {
  0% { transform: scale(1); }
  45% { transform: scale(1.035); }
  100% { transform: scale(1); }
}
.opt.wrong { background: rgba(255, 59, 92, 0.14); border-color: var(--bad); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.faded { opacity: 0.42; }

.verdict {
  margin-top: 13px;
  border-radius: 14px;
  padding: 15px 16px;
  border: 1px solid var(--line);
  background: var(--card);
  animation: qin 0.28s ease;
}
.verdict.good { border-color: rgba(22, 224, 160, 0.4); background: rgba(22, 224, 160, 0.08); }
.verdict.bad { border-color: rgba(255, 59, 92, 0.4); background: rgba(255, 59, 92, 0.07); }
.verdict .vh {
  font-weight: 850;
  font-size: 14px;
  letter-spacing: -0.01em;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.verdict .vb { font-size: 14.2px; color: #dcdce8; line-height: 1.52; }
.verdict .vr {
  margin-top: 10px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--violet);
  cursor: pointer;
  display: inline-block;
}
.verdict .vr:hover { text-decoration: underline; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 22px;
  border-radius: 13px;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.01em;
  background: linear-gradient(135deg, var(--hot), var(--hot-2));
  color: #fff;
  box-shadow: 0 10px 26px rgba(255, 45, 111, 0.32);
  transition: transform 0.12s, box-shadow 0.2s, filter 0.2s;
  width: 100%;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: scale(0.98); }
.btn.ghost {
  background: var(--card);
  border: 1px solid var(--line-hi);
  box-shadow: none;
  color: var(--text);
}
.btn.mint {
  background: linear-gradient(135deg, #16e0a0, #0aa87a);
  box-shadow: 0 10px 26px rgba(22, 224, 160, 0.28);
  color: #04231a;
}
.btn.small { padding: 10px 16px; font-size: 13.5px; width: auto; }
.btn-row { display: flex; gap: 9px; margin-top: 12px; }

/* ------------------------------------------------------------- results */
.result { text-align: center; padding: 26px 18px 22px; }
.result .big {
  font-size: clamp(46px, 13vw, 76px);
  font-weight: 900;
  letter-spacing: -0.05em;
  line-height: 1;
  background: linear-gradient(135deg, var(--gold), var(--hot));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: qin 0.5s ease;
}
.result .lbl { color: var(--dim); font-size: 13.5px; margin-top: 4px; }
.result h3 { font-size: 22px; margin: 14px 0 6px; letter-spacing: -0.025em; }
.result-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin: 18px 0 6px;
}
.rs {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 13px 8px;
}
.rs .v { font-size: 22px; font-weight: 850; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.rs .k { font-size: 10.5px; color: var(--dimmer); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-top: 2px; }

/* --------------------------------------------------------------- codex */
.filters { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip {
  white-space: nowrap;
  padding: 7px 13px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--dim);
  transition: all 0.16s;
}
.fchip.on { background: var(--text); color: #0a0a12; border-color: var(--text); }

.search {
  width: 100%;
  padding: 12px 15px;
  border-radius: 13px;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 15px;
  margin-bottom: 12px;
  outline: none;
}
.search:focus { border-color: var(--line-hi); background: var(--card-hi); }
.search::placeholder { color: var(--dimmer); }

.rule-row {
  display: flex;
  gap: 13px;
  align-items: flex-start;
  padding: 13px 14px;
  border-radius: 13px;
  background: var(--card);
  border: 1px solid var(--line);
  margin-bottom: 8px;
  width: 100%;
  text-align: left;
  transition: background 0.15s, transform 0.12s, border-color 0.15s;
}
.rule-row:hover { background: var(--card-hi); transform: translateX(3px); border-color: var(--line-hi); }
.rule-row .num {
  font-weight: 900;
  font-size: 13px;
  color: var(--dimmer);
  font-variant-numeric: tabular-nums;
  min-width: 26px;
  padding-top: 1px;
}
.rule-row.read .num { color: var(--mint); }
.rule-row .rt { font-weight: 720; font-size: 14.8px; letter-spacing: -0.015em; line-height: 1.32; }
.rule-row .rk { font-size: 13px; color: var(--dim); margin-top: 3px; line-height: 1.42; }
.pips { display: flex; gap: 3px; margin-top: 7px; }
.pips i {
  width: 15px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.13);
  display: block;
}
.pips i.on { background: linear-gradient(90deg, var(--gold), var(--hot-2)); }
.pips.max i.on { background: linear-gradient(90deg, var(--mint), var(--ice)); }

.rule-body { font-size: 15.4px; line-height: 1.68; color: #dfdfea; }
.rule-body p { margin: 0 0 15px; }
.rule-body p:last-child { margin-bottom: 0; }

/* ------------------------------------------------------------- manuals */
.manual-sec { margin-bottom: 22px; }
.manual-sec h4 {
  font-size: 15.5px;
  margin: 0 0 9px;
  letter-spacing: -0.02em;
  color: var(--gold);
}
.manual-sec .lead { font-size: 14.5px; color: #dcdce8; margin: 0 0 11px; line-height: 1.6; font-style: italic; }
.manual-sec ul { margin: 0; padding-left: 0; list-style: none; }
.manual-sec li {
  position: relative;
  padding-left: 20px;
  margin-bottom: 9px;
  font-size: 14.6px;
  line-height: 1.58;
  color: #dcdce8;
}
.manual-sec li::before {
  content: "";
  position: absolute;
  left: 3px;
  top: 9px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--hot);
}
.note {
  border-left: 3px solid var(--gold);
  padding: 11px 14px;
  background: rgba(255, 201, 60, 0.07);
  border-radius: 0 10px 10px 0;
  font-size: 14px;
  line-height: 1.55;
  color: #e6e6f0;
  margin-bottom: 18px;
}

/* ---------------------------------------------------------------- dojo */
.tier-tag {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  color: var(--dim);
}
.tier-1 { color: var(--mint); background: rgba(22, 224, 160, 0.14); }
.tier-2 { color: var(--gold); background: rgba(255, 201, 60, 0.14); }
.tier-3 { color: var(--hot); background: rgba(255, 45, 111, 0.16); }

textarea.pad {
  width: 100%;
  min-height: 190px;
  padding: 15px;
  border-radius: 13px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 15px;
  line-height: 1.62;
  font-family: var(--font);
  resize: vertical;
  outline: none;
}
textarea.pad:focus { border-color: var(--line-hi); }

.check {
  display: flex;
  gap: 11px;
