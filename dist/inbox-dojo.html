  "key": "Soft-sell 90% of the time; harvest with short hard sales.",
  "cat": "sell",
  "body": "While I recommend selling in every email.... 90% of the time you should be soft selling. In other words, while you include a link to an offer, and might even talk about how great the offer is, you don't pitch it aggressively. The option to buy is there if someone wants to buy that day; but if not, you are just trying to build the desire to buy over time. Then, at certain intervals, you can do short sales (with discounts, premiums, or some other limited-time incentive) where you actually push harder for the sale. (Rules #87-#100 cover how to run these limited-time sales.) If you hard-sell every day and neglect relationship-building, you'll burn out your list quickly. But if you do it this way, you can nurture your list while regularly 'harvesting' the desire you're building up."
 },
 {
  "n": 19,
  "title": "Are Personal Stories TMI?",
  "key": "People open their inbox to be entertained, not briefed.",
  "cat": "persona",
  "body": "Does sharing personal stuff before the 'value' in your email just turn people off and make them think, 'I don't care, just get to the content?' Not if you do it right. If anything, it's the OPPOSITE: People open their inbox to be entertained. If you strip out all your personality and just \"get to the content\", your emails will be boring and you'll stay unread."
 },
 {
  "n": 20,
  "title": "\"Make Characters Of The People In Your Life\"",
  "key": "Make characters of the people in your life.",
  "cat": "persona",
  "body": "Scott Pape taught me this rule, and it's become one of the guiding philosophies behind my entire email philosophy. The idea is that you should take the people in your life and turn them into characters who feature in your stories. Just like people enjoy watching shows where they grow to love the characters, so you want the characters in your life to feature in your emails."
 },
 {
  "n": 21,
  "title": "Readers Should Know You Better After Every Email",
  "key": "Ask: will they know me better after reading this?",
  "cat": "persona",
  "body": "The single most important \"character\" to develop is your own. And so, I apply a rule to every email I write: \"Will someone know me better after reading this?\" Note that this does not mean they LIKE me more. Many things about me are unlikeable for some — my humour, my kid stories, my obnoxious references to being Christian, my anti-woke views, etc. But they're all ME. That's why every email of mine has at least some quip, or story, or opinion on something: I ALWAYS want you to leave an email knowing \"Daniel Throssell\" better."
 },
 {
  "n": 22,
  "title": "Caricature Everyone - Including Yourself",
  "key": "Caricature everyone — yourself most of all.",
  "cat": "persona",
  "body": "When you're featuring characters in your stories, don't leave people as they are. Just like a writer writes interesting characters, you should amplify the interesting parts of people into caricatures of who they are. And this includes yourself, too. You should have a 'persona' you project in your emails that is an exaggerated version of who you are in real life. I do this all the time in my stories."
 },
 {
  "n": 23,
  "title": "Brands Need A Voice Too",
  "key": "Brands need a single human voice behind them.",
  "cat": "persona",
  "body": "My view is that email marketing works best when there is a single representative behind the brand. For example, the CEO or founder of the company. If you can't, try and retain as much personality as you can. Take stances; give opinions; have interesting and unique ways of speaking."
 },
 {
  "n": 24,
  "title": "A Weird Trick To Psychologically Abuse Your Readers Into Revering You",
  "key": "Cast yourself as an authority figure in your stories.",
  "cat": "persona",
  "body": "A sneaky trick I use to reinforce my status to my list is to paint myself as a character in stories who is some form of an authority figure over them. So I will (jokingly, of course) make myself a teacher while they're a student; a general when they're a soldier; a kidnapper when they're the prisoner; and so on. Admittedly this is weird, and it probably won't work for people who don't have my personality and style. Maybe it won't work for anyone who isn't me. But at least now you know why I seem like such a psycho."
 },
 {
  "n": 25,
  "title": "Exaggeration Is The Most Amazing, Incredible Technique In The History Of Storytelling And There Has NEVER Been Anything Better!!!",
  "key": "Amplify the emotion. Burst into rooms; don't enter them.",
  "cat": "story",
  "body": "Most boring stories copywriters tell in emails could do with a good whack of exaggeration. Amplify the emotion in words. Turn statements into screams. Make people instantly teleport to other places in a room before your eyes when they're excited. \"Burst into\" rooms, don't \"enter\" them. You're not surprised; your eyes are wide with shock. Be exciting. Exaggerate. People love it."
 },
 {
  "n": 26,
  "title": "Write Emails \"Based On A True Story\"",
  "key": "Write the best story, not the most accurate one.",
  "cat": "story",
  "body": "Very rarely does life actually turn out the way a storyteller would tell it. So l hereby give you permission to take creative license with your stories and write the best story, not the most accurate depiction of what happened. Compress timelines if you need to. Eliminate characters when they're not necessary. Rewrite dialogue if it makes it clearer or funnier. Don't lie about stuff, especially to make yourself look better. But I have no hesitation in rewriting my stories to make them more entertaining (and thus more valuable, remember?) to my reader. My philosophy is \"based on a true story\"."
 },
 {
  "n": 27,
  "title": "Always Be On The Lookout For Story Ideas",
  "key": "Small everyday moments beat big life events. Note them daily.",
  "cat": "story",
  "body": "Most people have several story-worthy moments each day. If you can't find them, it's probably because you're looking for BIG things. But most of my good stories have come from fairly everyday events. The time I had to silently scare a random snotty kid at McDonald's so he'd stop touching my kids' food.... the time my \"wind-proof\" umbrella failed me in the middle of a storm ... the time I left my phone in my car and had to find a way to call my wife in the middle of the city, while being too introverted to ask anyone for their phone... the time I sent deeply personal fan-mail to a copywriter and got a brain-dead VA with a templated response asking if she could \"share it with the team\"... and many other \"everyday\" things like that. These things make more relatable, more enjoyable story ideas than \"big\" stories like quitting your job. I constantly note these ideas down on the Notes app on my phone. As you do this, your 'story sense' will get better, and you will begin to get faster at seeing how a scene in your life could be turned into a story."
 },
 {
  "n": 28,
  "title": "The \"Triforce\" Of Email Leads: Relevant, Entertaining, Brief",
  "key": "Leads need relevance, entertainment, brevity — nail two of three.",
  "cat": "story",
  "body": "Let's say you're writing a typical sales email with a lead, that then pivots to a \"tip\" or \"lesson\" or some other light \"value\", and then pivots to a sales pitch. There are three factors you need to keep in mind for the lead of your email: a) relevance to your tip/lesson/pitch; b) entertainment value; and c) brevity. If your lead falls short in any of these three areas, you must compensate in the other two. For example: I write daily emails containing copywriting tips and pitches for copywriting products - but many of my email leads are stories about my daily life, e.g. something my kids did. That's not super relevant to copywriting, so I have to either make the story quick (brevity) - or make it very entertaining. Otherwise, readers wonder \"why am I reading this?\" For each email, ask: \"Is the lead of this email relevant to the tip/pitch at the end? Is it entertaining? And is it quick to read?\" And make sure you can say \"yes\" to at least two."
 },
 {
  "n": 29,
  "title": "Not Every Sales Email Needs A Personal Story",
  "key": "No story? Use PAS: problem, agitate, solution.",
  "cat": "story",
  "body": "Personal stories are great but you can't always get them (especially if you're writing for a client). So a simple and reliable way to do emails without personal stories is the tried-and-true PAS structure: paint the problem, agitate the problem, reveal the solution. You can do this by talking to the reader (Copy Hackers does this style of email a lot), or you can find stories that show someone having the problem. Draw out the conclusions of that problem (agitation)... and then offer the product as a solution. It might seem less elegant than telling fun stories about your day, but it works."
 },
 {
  "n": 30,
  "title": "The Sitcom Secret Behind Telling Great Stories In Emails",
  "key": "Stories exist to show how your character REACTS, not what happened.",
  "cat": "story",
  "body": "If you do tell personal stories in your emails, you need to understand why. We tell stories in emails NOT to relate an interesting series of events ... but to flesh out our own character by showing how they RESPOND to those events. Let me give you an example. In my Inbox Detonator Bunker there's a review of an email selling a marketing agency's services. My student took the \"story + tip\" approach. He opened the email with a story about how he'd gone hiking in the woods with his dad ... had gotten a bit spooked ... turned around ... and later found out there was a grizzly bear sighted in the exact place they were about to go to. It was okay as far as stories go. But the problem was, the story was all about bears. He talked about how bears are scary, how they can smell you far away, how they kill. people, etc.... but the story didn't talk much about his reactions. Which defeats the entire purpose of telling a story in your emails: to tell the reader something about the main characters. Think of how a sitcom (or any TV show) works. You have your cast of characters... and in each episode they face different challenges, trials or situations. You bond to the characters because you watch how they navigate those trials, and it tells you something about the character. And over time you learn who they are by watching how they react to events in their life. It's the same with the stories I tell in my emails. In my reactions to the events that befall me, you learn about my personality; my sense of humour; my beliefs; my quirks; and so on. This ties in with Rule #21. Keep this in mind when you're writing stories, and ask: am I casting myself as the character I want my readers to perceive me as?"
 },
 {
  "n": 31,
  "title": "Finding The Balance Between Telling Stories About Yourself And Talking",
  "key": "Build the relationship and your stories become 'you' content.",
  "cat": "story",
  "body": "One of the big things that confuses copywriters is \"how do I balance telling 'me-focused' stories about myself/the brand with writing 'you, you, you' stuff that's interesting to the reader?\" The answer is that if you build a relationship with your list, you and your stories become interesting to them. The more you can build a relationship and make your customers actually care about you as a brand, the more they will want to hear your stories. It is somewhat of a virtuous circle. And of course (remember Rule #28), if you tell stories relevant to your business and not just your personal life, you don't really have to \"choose\"."
 },
 {
  "n": 32,
  "title": "The \"Small Business Owner Model\" For Relationship-Based Emails",
  "key": "Write like a shop owner chatting to a regular over the counter.",
  "cat": "persona",
  "body": "An approach I find helpful for writing regular emails for businesses is this: Picture the business (even if it's digital) as a brick-and-mortar store with the owner working behind the counter. Then think of the emails as conversations the business owner has with the regular customers who come in. So a bike shop could write emails about the amazing new tyres that a distributor just released and how they're ordering a test batch; the argument the owner had with the distributor from China this morning; the awesome new set of mountain bikes that just arrived; or how they took one of their models for a test ride on the weekend and it performed fantastically. Just picture a small business you visit, where you have a good relationship with the owner, and you have a great model for how to write emails."
 },
 {
  "n": 33,
  "title": "Regular Broadcasts Are Best Written sdrawkcaB (btw that's 'Backwards' ... backwards)",
  "key": "Write backwards: start with the hook, then find the pitch.",
  "cat": "ideas",
  "body": "A student of mine who runs a guitar teaching business, and sends new sales emails a few times a week, once told me he was spending way too long writing his emails. I told him he was doing it the wrong way around: he was starting with something to sell, and then working back to find a good 'hook' to start the email. I suggested doing what I do, which is to write my emails 'in reverse': start with a new or interesting thing you want to talk about, and then figure out what you're going to pitch (and how you'll transition to that pitch). For example, most days I will just have an idea for an email - often, a story moment from my day - and I'll start writing it out. Then, and only then, I'll think about how I can 'pivot' into a tip, and a sales pitch. This takes practice at working out how to spot opportunities to teach and sell from your stories, but once you get good at it, it's MUCH easier to write emails this way — and the emails you write are better."
 },
 {
  "n": 34,
  "title": "Don't \"Write Like You're Writing To A Friend\"",
  "key": "Write an entertainment column, not a letter to a friend.",
  "cat": "persona",
  "body": "\"Write like you would to a friend\" is a common tip for writing emails. But none of my emails truly sound like emails I'd write to an actual friend. If anything, the way I think of it is as writing an entertainment column for a newspaper or magazine. I still write to one reader - \"you\" instead of the cringier \"you guys\". But I almost never use a salutation, I never ask questions of the reader, I tell stories that are far more contrived than I would tell them to an actual friend. etc. Good emails don't have to sound exactly like they're written to a friend."
 },
 {
  "n": 35,
  "title": "Don't Use Questions In Sales Emails",
  "key": "Weak copywriters use questions. Strong copywriters use stories.",
  "cat": "sell",
  "body": "Using questions in sales emails is a tell of an inexperienced copywriter. By questions I mean things like: \"Do you struggle with X?\" \"Have you ever wished you could Y?\" These sound like an amateur sales spiel — not something you should send to a list you are building a relationship with. Weak copywriters use questions; strong copywriters use stories. Instead of opening with \"Do you wish you could get rid of your nagging belly fat?\", try something like \"This morning I read a crazy story about a guy who got fired from his job for being too fat...\" Both will hook the same audience (overweight men), but one just feels like a pitch, whereas the other is entertaining and builds a relationship."
 },
 {
  "n": 36,
  "title": "How To Use Stories To Sell",
  "key": "Pick the story that plants the idea they need the product.",
  "cat": "sell",
  "body": "Most of the stories I tell in emails are designed to entertain and build a relationship (and maybe to pivot into a soft pitch), but not really to sell that hard (Rule #18). And that's okay! But if you want to really sell with a story, one thing matters above all: The story must plant an idea in the reader's mind that makes them desire, or believe they need, the product. For example, if I were trying to sell my Upwork in One Hour course - which contains a lesson on how to navigate client calls, which are incredibly intimidating for a new copywriter - I might relate a story of a time when I had a client call that was a total train wreck, and the client asked me questions I couldn't answer, and I was humiliated. Not only would such a story be irresistible for my target audience of freelance copywriters, but it also plants the idea: \"I need to know how to do client calls so that never happens to me\". That would make a perfect lead for a sales email where I sell Upwork in One Hour because it contains a lesson on that. In short: If you want your email to sell, don't just use any random story. Pick a story that \"plants\" (like the movie Inception) the idea you need someone to believe in order to want the product."
 },
 {
  "n": 37,
  "title": "How To Never Run Out Of Email Ideas, Part I",
  "key": "Villains Gallery: list their pains, fears and enemies.",
  "cat": "ideas",
  "body": "There are many ways to come up with email ideas, even if you're writing as much as daily. One is similar to what Ben Settle calls his 'Villains Gallery': make a long list of the pains, frustrations and fears that afflict your audience; and also, the enemies you fight against on their behalf (fat-cat bankers, the \"gurus\" in your industry, fad diets, Big Pharma, whatever). And then use each of those as themes for different emails. This works because your audience will never get tired of hearing about their problems and tips for how to solve them."
 },
 {
  "n": 38,
  "title": "How To Never Run Out Of Email Ideas, Part II",
  "key": "Be a news desk. Comment on developments in your world.",
  "cat": "ideas",
  "body": "The second way to have an endless supply of ideas is to take inspiration from the one industry which never has and never will run out of ideas: news and commentary. Think about it. Every news outlet in history has created content every single day for its entire existence. And they will never run out. Why? Because they just talk about new developments. You can do the same. Keep up to date with news that affects your field, and offer your commentary on it. Talk about what you think of it; rant about it; break it down for your audience and tell them what it means for them. And it doesn't have to be news for your niche; it can be any news. If you're an expert in your topic, you should be able to find applications for your topic in almost anything."
 },
 {
  "n": 39,
  "title": "How To Never Run Out Of Email Ideas, Part III",
  "key": "Lurk Reddit and forums. Steal the top posts.",
  "cat": "ideas",
  "body": "A third way to never run out of email ideas is to lurk Reddit, forums, etc. where your market hangs out, and take the trending or top posts. These usually make for excellent email material. I show exactly how to do this kind of thing in my Market Detective course."
 },
 {
  "n": 40,
  "title": "How To Never Run Out Of Email Ideas, Part IV",
  "key": "Reprint and reply to reader mail. Angrier is better.",
  "cat": "ideas",
  "body": "An excellent way to get content for emails is to reprint and reply to emails from your email list. The weirder, angrier, or more opinionated it is, the better. People can't resist reading other people's comments and opinions. It's the same psychology behind why we spend so long reading the comments under news articles and YouTube videos, or why talkback radio is so popular, or why there have always been 'Letters to the Editor' sections in newspapers. This works especially well if the letter is disagreeing with (or critical of) you, because that makes conflict (Rule #48)."
 },
 {
  "n": 41,
  "title": "The Simple Email Opener For Using Other People's Stories In Sales Emails",
  "key": "'I read a story the other day about a guy who...' — then go.",
  "cat": "ideas",
  "body": "If you find a good story you want to use in an email, simply introduce it by saying something like: \"I was reading a story the other day about a guy who...\" or \"A friend of mine recently told me about a problem...\" or \"I heard about a girl that...\" or something like that, and just launch right into it. It grips people, throws them straight into the story, and they basically can't stop reading."
 },
 {
  "n": 42,
  "title": "Elevate People's Thinking",
  "key": "Elevate their thinking with bold, contrarian insight.",
  "cat": "list",
  "body": "If you want your emails to be must-read (see Rule #2), you must offer bold new perspectives on your topic that change the way people see it. In my Inbox Detonator Bunker I have a review of an email whose 'tip' was to 'jump up and down' when you felt low-energy. I said this was obvious and low-value. The best insights blow someone's mind and make them say \"oh my gosh, that makes so much sense!\" An example of how I've done this is writing about \"why bullets in sales letters don't work anymore\". This challenged copywriting dogma and yet I gave some fascinating reasons behind it (see Rule #85). I got replies from people telling me it blew their mind. That is the kind of reaction you want. To do this, of course, you need to truly have a deep expertise in your market (or your client must), and have a contrarian perspective worth sharing. There are no 'hacks' to this. But that is why it's so effective. When your insights elevate someone's thinking, they will forever remember that you were the one who did it, and they will be fiercely loyal to your brand."
 },
 {
  "n": 43,
  "title": "The Best Sales Emails Sound Like Stephen King",
  "key": "Horror stories persuade harder than anything else.",
  "cat": "emotion",
  "body": "And by that I mean, the most effective sales emails tell horror stories. Humans are psychologically hard-wired to be more persuaded by horror stories than anything else in the world. It's why Christianity teaches a vivid, literal, fiery hell. It's why so many cultures have legends designed to terrify children into not doing bad things. When you show someone a clear, horrific vision of the awful fate that awaits them if they don't use your solution, you don't have to sell. They persuade themselves that they need your product. An example: once I read a blog post by musician Adam Young about his experience with kidney stones. He described the utterly agonising pain - so bad that you'd just fall down and start crying. He described the ordeal of feeling it start in his back... having to go to hospital ... and the utter agony of passing the stone. And then he said the doctor had told him to drink water to avoid any more. You know what? I'd never drank as much water as I did in the days after reading that blog post. And that wasn't even a sales email! That's why it's so important to find your market's horror stories, show them to the reader, and then show them that your product is the way out. My Market Detective course goes into a lot more detail on this."
 },
 {
  "n": 44,
  "title": "Make Your Emails Taste Like Diet Coke",
  "key": "Be the refreshing drink after the world's bad news.",
  "cat": "emotion",
  "body": "In the news there's a saying: if it bleeds, it leads. And so 90% of the news people see in the media is designed to make them feel bad. Bad news is like high-sodium junk food. People can't help but binge. (It's why you had people watching daily COVID case counts on the news for over a year and a half — people just can't peel their eyes away from stuff that scares them.) But it leaves them feeling thirsty. And they will ALWAYS try and quench that thirst with something refreshing or entertaining. So if your marketing is the good news, the laugh, the smile in their day.... you will be where they WANT to go when they've had enough of the bad news."
 },
 {
  "n": 45,
  "title": "Don't Make People Feel Bad In Emails",
  "key": "Don't leave people feeling sad, guilty or uncomfortable.",
  "cat": "emotion",
  "body": "As a corollary, be very careful about getting heavy or serious - people prefer something fun and lighthearted in their inbox. In my Inbox Detonator Bunker I reviewed an email that walked the reader through the plot of the movie 127 Hours - where the main character cuts his own arm off — in painstaking detail. It was an awful email to read as it made the reader feel totally uncomfortable. This is never a good idea. Sadly, it's the same for email lists that regularly try to guilt people into giving to charities (\"look at this poor hungry child\") or other (quite worthy) causes. You can do it once in a while, but if you constantly make people feel sad or guilty or uncomfortable, they will stop reading your emails. I once scrapped a subject line \"Disappointed in you\" because while I thought it would work well (and obviously, it quickly explained why I wasn't actually disappointed in the reader), they would still experience the discomfort of reading that for a few seconds ... and I didn't want that negativity associated with the act of opening my emails."
 },
 {
  "n": 46,
  "title": "Uh... Make People Feel Bad In Emails?",
  "key": "Paint pain WITH empathy and a way out — that's hope, not misery.",
  "cat": "emotion",
  "body": "How do you reconcile the last two points with the idea of painting horrible visions and digging into pains? Let me clarify. When we're painting horror stories, or talking about their struggles, we're not just saying \"your life sucks, haha, bye\". We need to write with empathy and show that we understand their pains... and that we can help them fix it. There is inherent hope when someone nails our exact pain points in an email, just like there is a sense of hope when the ER doctor diagnoses your exact symptoms - because it means they can help! Also, if we express pain points as stories - like \"I heard this crazy story about a girl who just couldn't get a date ...\" - then we're still targeting their pains (they can see themselves in the horror story) but it's still a story. So it's still entertaining, right? This is the distinction."
 },
 {
  "n": 47,
  "title": "Don't Show Weakness",
  "key": "Never show chinks in your armour. Stay in character.",
  "cat": "persona",
  "body": "If you show weakness, you will attract sympathy and pity from people who want to help you — instead of people who see you as somebody who could help them. So don't be sullen, vulnerable, rattled or upset in your emails. Part of your job as a professional is to stay in character when you write. There are exceptions, of course — moments of tragedy may call for a rare glimpse of grief, or you might get righteously angry for a good cause. But you must always be in control of the character you are projecting. Never show chinks in your armour just because you let emotion get the better of you."
 },
 {
  "n": 48,
  "title": "Fights Get More Attention Than Anything Else",
  "key": "Fights get more attention than anything else. Pick good ones.",
  "cat": "emotion",
  "body": "There is a basic drive in humans to want to watch fights and pick a side. The single best way to whip up a frenzy of attention, controversy and engagement in your emails is to pick a fight with someone. The more 'real' the fight, the bigger the egos, and the higher-profile the people involved, the more attention it gets. For example, back in 2020 a prominent YouTuber made a stir in the copywriting community for calling out a well-known copywriter for making false & unethical claims in his old sales letters. The 'fans' of each side went crazy each defending their man.... and much of the copywriting world was drawn into watching the argument and picking a side. Obviously, when you pick fights, it must be for a good cause. You must actually be calling out evil or unethical behaviour, and standing for something. Otherwise you're just being a jerk, or a bully. Also note that 'fight' doesn't have to mean a full-fledged war against a single person or entity (though that is the most entertaining kind). You can fight against a philosophy in general, or a group (like my personal feud with r/copywriting). Or you can just write an entertaining take-down of someone's point of view/argument/email (including an email from a reader)."
 },
 {
  "n": 49,
  "title": "Play The Ball, Not The Man",
  "key": "Play the ball, not the man. Never appear rattled.",
  "cat": "emotion",
  "body": "When picking a fight or disagreeing with someone, though, in general you should play the ball and not the man. That is, refrain from personal insults and ad hominem attacks (unless it makes sense to do so). When I get a reader email that I want to reply to because it's so wrong or stupid, I generally write an impassioned 'first draft' where I just let it rip - I mock them, ridicule them, or say anything that's on my mind. (Hey, I get emails that are infuriatingly dumb sometimes.) But then I go back through and remove all the nastiness, and in line with Rule #47, make sure I'm not appearing rattled or upset."
 },
 {
  "n": 50,
  "title": "One-Off \"Sales Funnels\" Are Dead Or Dying",
  "key": "The hitman funnel is dead. Take the reins long-term.",
  "cat": "sell",
  "body": "As an email copywriter, I used to have a lot of clients come to me to \"write a sales funnel\" for a course they wanted to sell. Usually, these were lists that they had neglected, or just spammed with offers and no relationship-building. In this case, no matter how good your sales funnel is, it's not going to work. In my view, today, unlike in the past, the 'hitman' model of a copywriter who comes in, writes a sales letter, and makes a fortune is outdated. It's more about taking the reins on an email list over a longer period of time, and building a relationship with good emails that sell over time."
 },
 {
  "n": 51,
  "title": "Never Hard-Sell In Your Emails",
  "key": "Never be needy. Offer the privilege of buying from you.",
  "cat": "sell",
  "body": "Even when you're selling hard, you must never be needy about it. Instead, offer people the privilege of buying from you. This mindset shift is simple but incredibly powerful."
 },
 {
  "n": 52,
  "title": "When You Have An Amazing Deal, Get Excited",
  "key": "You can't fake excitement. Actually be excited.",
  "cat": "sell",
  "body": "If you're offering an amazing deal, but you're writing with low energy, it will show in the copy. You need to come across as excited, energetic and passionate. That means you have to feel that way to write it. I used to have a mentor send me back to rewrite copy because I turned in copy that tried to act excited, rather than actually being excited. You need to believe in the product you're selling, and believe that it can help solve the problems of the people you're selling it to."
 },
 {
  "n": 53,
  "title": "Single Or Double Opt-In At Sign-Up?",
  "key": "Double opt-in: better leads and an extra page to write copy for.",
  "cat": "list",
  "body": "I prefer double opt-in. Partly because of the increased lead quality, but also because it lets me optimise the copy people see on the 'confirm your email' page (and the confirmation email itself) before they actually make it onto my list. This page actually has a MUCH higher readership rate than your welcome email - which gives you a great chance to 'warm up' new leads, and filter out those who are bad leads before they even confirm."
 },
 {
  "n": 54,
  "title": "Go Ahead, Ask For Names At Sign-Up",
  "key": "Ask for names. The upside beats the opt-in loss.",
  "cat": "list",
  "body": "I believe that the value of capturing names (and full names if you can) outweighs the downsides of any lower opt-ins. Honestly, most people don't mind giving you their real name. And the benefits of what you can do with a name are worth it - like using their names as characters in your emails or stories (people love it), or adding a bit of warmth to your salutations sometime."
 },
 {
  "n": 55,
  "title": "Why You Should Ignore David Ogilvy's Advice For Subject Lines",
  "key": "Your sender name outranks your subject line for real readers.",
  "cat": "subject",
  "body": "Most people blindly parrot David Ogilvy's quote - about the headline being 80% of the ad spend, etc. - and apply it to email. This isn't wise. Ogilvy was right for his time. But subject lines in the inbox to someone on your list are NOT the same as headlines in a newspaper. If you build a relationship, over time, your sender name becomes a more important subject line than whatever you have in your subject — for your regular readers, who are the ones who matter (and who buy your stufff)."
 },
 {
  "n": 56,
  "title": "The Best Way To Write Subject Lines",
  "key": "A subject line poses a question and implies the answer's inside.",
  "cat": "subject",
  "body": "The best way to think of writing subject lines is this: A subject line must set up a question in the reader's mind, and imply the answer is in the email. The more interesting the question you pose, the more likely it will get opened. To illustrate, here are some examples of subject lines and questions they form (uncredited ones are mine): - \"How to stop panic attacks with a tennis ball\" > > \"Wait, you can stop a panic attack with a tennis ball?!? How?\" - \"This is not the email I wanted to send you today\" > > \"Hm? What's inside this email that made him not want to send it? And why did his plans change?\" - \"The $20 copywriting seminar that saved my business\" (Ben Settle) >> \"What's the $20 copywriting seminar that saved his business?\" - \"Hey\" (Barack Obama) >> \"Huh? Why is the President sending me a personal email?!? What's it about?\" (Note how the sender name helps form the question!) - \"Summer breeze, ice cream and sandy shoes\" >> Example of a subject line that does NOT pose a question and thus is not very good This is how I evaluate ALL subject lines (and how I recommend you do, too): I look at it and ask, \"What question does this form in my reader's mind, and how badly would that reader want to know the answer to that question?\""
 },
 {
  "n": 57,
  "title": "The Subject Line \"Double Whammy\" Of Curiosity",
  "key": "Add shock so the question starts with 'Wait —'.",
  "cat": "subject",
  "body": "You might have noticed that several of the questions in the previous rule started with the word \"Wait\" or \"Huh?\" or \"Hang on\" or something like that. I did that deliberately. This is a sign that your subject line also included enough novelty or shock value to surprise the reader as well as make them curious — making it a double whammy when it comes to getting the email read. (Also, this is why I think my \"question\" approach to subject lines is more nuanced than the standard \"information gap\" or \"curiosity gap\" theory most people talk about.)"
 },
 {
  "n": 58,
  "title": "Why I Love Subject Lines That Don't Even Show Up In Full On Your Phone",
  "key": "Long subject lines truncate into curiosity. Front-load them.",
  "cat": "subject",
  "body": "Most people avoid long subject lines, but they can give you more of a \"writing to a friend\" vibe, or allow you to put more sensationalism into your headline. Also, when a subject line is truncated on a phone, it shows with an ellipsis (...') that adds some inherent curiosity. So if you front-load your subject line with interesting words, you can get the best of both worlds. I don't do it all the time, but I'm not afraid to write more than 60 characters in a headline on occasion."
 },
 {
  "n": 59,
  "title": "Pump Up A Subject Line With Specificity + Credibility",
  "key": "Flat subject line? Add specificity or credibility.",
  "cat": "subject",
  "body": "If you have a flat subject line, often you can improve it with one of these two.\n\nOne of my students once submitted a subject line: \"How To Make Your Business Stand Out.\" This was very flat. He could have improved it by using specificity (\"'How to stand out in a sea of freelance copywriters\"; \"How to get 36% more leads in your business in December\") or credibility (\"The Steve Jobs secret to making your business stand out\"; \"How the world's biggest fitness brand carves out its own niche\")."
 },
 {
  "n": 60,
  "title": "Your Subject Line Probably Isn't \"Out There\" Enough",
  "key": "Find the craziest legitimate angle in the body copy.",
  "cat": "subject",
  "body": "A common mistake with subject lines is to not be \"out there\" enough. You want to find the craziest angle you could possibly exploit. In my Inbox Detonator Bunker I have a critique of an email with the subject line \"How to have customers begging you to send emails\". Yet the lead of the email mentioned dating in passing. So I suggested \"Dating advice for business owners\". Another had a subject line \"Why we don't see the world as it is\". I rephrased this to \"You're too biased\", which is a lot more provocative and in-your-face. When thinking up subject lines, I am usually looking for the most interesting, weird or unusual angle I can legitimately pull out of the body copy."
 },
 {
  "n": 61,
  "title": "How To \"Pre-Test\" Your Subject Lines By \"Grafting\" Them Onto Other People",
  "key": "Graft it onto a sender you'd normally ignore. Still open it?",
  "cat": "subject",
  "body": "If you follow a few copywriting email newsletters, there will usually be some you always read ... some you read sometimes ... some you rarely read ... and some you never read. A trick I came up with to pre-test' my subject lines is to take the subject line I'm thinking of using... and spend 5 seconds imagining it got sent to me by someone on the 'rarely' or 'never' list. Would it get me to open their email? Usually I find that what I thought was a cool subject line... actually wouldn't work in that case. In which case, I try another."
 },
 {
  "n": 62,
  "title": "Using Someone's First Name In Subject Lines Boosts Opens, And Using Their",
  "key": "Names lift opens — but don't sound like a bank.",
  "cat": "subject",
  "body": "... don't overdo it. I use names in subject lines sparingly, and honestly, less and less as time goes on. You don't want to be the person that sounds like a bank with subject lines like \"Daniel, check out our new savings accounts.\" \"Daniel, we want your feedback.\" \" Daniel, did you Daniel the Daniel on our new Daniel?\""
 },
 {
  "n": 63,
  "title": "Self-Interest vs. Curiosity",
  "key": "Self-interest generally beats pure curiosity.",
  "cat": "subject",
  "body": "I find that self-interest subject lines (promising a benefit) generally pull better than curiosity subject lines. For this reason I tend to include the word \"copywriting\" in the majority of my subject lines, because it is the one thing I KNOW my audience is interested in (else they wouldn't have opted in)."
 },
 {
  "n": 64,
  "title": "Unsatisfied Curiosity Turns Into Resentment",
  "key": "Unsatisfied curiosity turns into resentment. Pay it off fast.",
  "cat": "subject",
  "body": "Curiosity is powerful, but remember: unsatisfied curiosity turns into resentment. If you tease something and don't pay it off quickly (or worse, don't pay it off at all), people will be mad at you. It's risky to title an email, say, \"12 words that close any sale\" and then, in the email, say that someone has to buy your product to find out the 12 words... because even if you offer some real value in the email, you're not satisfying the curiosity you built. Make sure you clearly and quickly pay off anything you tease - in a subject line, in a link, or anywhere in your copy."
 },
 {
  "n": 65,
  "title": "Join The Conversation In Your Reader's Head",
  "key": "Talk about what they're already thinking about.",
  "cat": "emotion",
  "body": "You've probably heard this phrase, from the Robert Collier Letter Book. The idea is that you should talk about what your reader is already thinking about. That usually means talking about their problems, pains, fears, frustrations and insecurities. Another way is to talk about hot topics that are on the news. But there is one thing to watch out for ..."
 },
 {
  "n": 66,
  "title": "The Double-Edged Sword Of Joining The Conversation In Your Reader's Head",
  "key": "Hot topics hijack their emotional state — pivot carefully.",
  "cat": "emotion",
  "body": "One of my most-successful emails (judged by the amount of people who took the action I wanted) was called \"Why Biden lost\", sent after the first US presidential debate in 2020. (Biden was widely considered to have \"won\" as Trump was rude and brash, hence the interest of my subject line.) But the challenge was that at the end of that email, I was asking people to promote a blog post - yet I was tapping into a very politically-charged topic. The last thing on people's minds, then, would be to share a blog post. This is the problem you face when you rely on current events to get opens: you focus their emotional state on whatever the news is that you used to get their attention. So how did I navigate the problem? Well, with a bit of copywriting ninja work. First, I gave my uncommon opinion on the debate and paid off my subject line. Then I pivoted on Trump: I said, \"and speaking of Trump...\" and smoothly shifted the topic to be about how Trump controls his opponents' attention masterfully. And then, I moved to talking about my blog post on the Parallel Welcome Sequence, which shows how to control your readers' attention. The result was amazing. I had incredible engagement with this email, because I captured a huge amount of traffic with the subject line, and carefully led the reader to my desired action. (Although, in line with the next rule, maybe I shouldn't give too much credit to the email...)"
 },
 {
  "n": 67,
  "title": "Beware Of Judging An Email By Its Results",
  "key": "A single email's results mean nothing without context.",
  "cat": "mind",
  "body": "The same email will perform radically differently depending on the timing and context of its sending. A simple \"Last chance, sale ends today\" email on day 4 of a 4-day sale will generally \"outperform\" an amazing email sent on day 2, due to the power of the deadline. Any given email will perform differently if you send it to a batch of 1,000 fresh subs vs. if you send it to 1,000 less-fresh subscribers who have been on your list for 3 months (this is why welcome series have high open rates). And even if one email sells really well, it might not have worked so well if you hadn't sent 50 other emails before it over the months leading up to it, that all had a cumulative sales effect. The point? Looking at the one-off \"results\" of a single email is almost meaningless without also accounting for the context in which it was sent. This is why blindly imitating \"proven emails\" is misleading if you don't know their context (there's that pesky Rule #1 again)..."
 },
 {
  "n": 68,
  "title": "Never Ask Your List To Do Something For Free",
  "key": "Never ask for a favour. Bribe with self-interest.",
  "cat": "list",
  "body": "When you ask your list to do something for you, always bribe them with something more valuable than the thing you are asking them to do for you. Do not rely on charity or pity; appeal to their self-interest."
 },
 {
  "n": 69,
  "title": "The Ideal Length Of A Welcome Series",
  "key": "Welcome series runs only as long as it beats your live emails.",
  "cat": "list",
  "body": "I generally recommend keeping people out of your \"live\" emails until they've been through a welcome sequence that introduces them to you, your core beliefs, your personality, and the characters in your emails. The downside, of course, is welcome series can feel \"canned\". My rule is that your welcome series should only go for as long as the \"canned\" emails are better than the \"fresh\" ones you're sending to your \"live\" email list. If you have three amazing emails you feel all new subs must read, then use those three. If you have ten, use ten. If you have none, just send one welcome email and then put people onto the live list."
 },
 {
  "n": 70,
  "title": "Never Ask People To Whitelist Your Emails",
  "key": "Don't ask for whitelisting. Bribe them into replying.",
  "cat": "list",
  "body": "Asking people to drag you to the Primary tab — or even worse, add you to their whitelist - has a very low compliance rate. A better way to almost 'automatically' get yourself whitelisted is to get someone to reply to your emails. Replies are deliverability gold. And the best time to do it is in your welcome email, when someone is warm. But don't just ask, like everyone else does. Bribe people into answering by offering to respond to them with something they want (see Rule #68). For my own list, I offer a bribe to anyone who replies to my welcome email. And I give them the option of just sending a blank reply if they find it awkward (which many people do)."
 },
 {
  "n": 71,
  "title": "Make Selling An EXPECTED Part Of Your Business",
  "key": "Sell proudly always, so nobody feels entitled to shame you.",
  "cat": "sell",
  "body": "An agency I once worked with had a client who attracted stay-at-home mums and railed against \"marketers\" often. And guess what? When she tried to launch her first paid course ... her market skewered her. They called her out on FB, wrote nasty tweets, labelled her a \"sell-out\"... and didn't buy. This was HER fault. She'd built a brand where customers did not expect to be sold to ... and instead, she attracted customers who tried to guilt her for selling. You should never let your audience feel they have the right to shame' you for selling to them. Think about it: do people walk into a grocery store and shame them for selling? Do they turn up their nose in \"disappointment\" at Woolworths when the Tim Tams are \"on sale\"? Of course not — because there is an expectation that you pay. Grocery stores are in business to make money. And that's the expectation you need to attach to YOUR brand. That is why you do not apologise for selling. It emboldens people to shame you. Make it very clear that you are a business. And the way you do that is by selling proudly in every email you send (Rule #17). Make people expect that's just the way things work with you. Otherwise, when you introduce a sales pitch into your emails, your audience will turn on you."
 },
 {
  "n": 72,
  "title": "Humour Is A Great Disguise For Hard Sales Tactics",
  "key": "Humour lowers defences to heavy salesmanship.",
  "cat": "sell",
  "body": "One way to subtly 'indoctrinate' your audience into accepting more selling is to use humour to disguise it. Personally, I constantly joke about how hard I am going to sell to people, and how excited I am about that. It's why comedy is one of the few areas where it's still okay to not be politically correct: Humour lowers people's defences to ideologies they wouldn't normally tolerate - including heavy salesmanship."
 },
 {
  "n": 73,
  "title": "Don't Segment Out Buyers",
  "key": "Keep selling to buyers — it re-sells them on using it.",
  "cat": "sell",
  "body": "I'm not against segmenting in all cases, as it obviously has its place. But in general, I don't 'segment out' buyers from receiving emails about products they already own. Firstly, because your emails should be so interesting and valuable that people enjoy getting them even if they already own the product. But more importantly, because by sending buyers sales emails, you re-sell them on actually using the product they bought! Most people never use products they buy - whether info (a course) or a physical product (an Ab King Pro). So if you have a good product that will actually help people if they use it, you do them a favour by continuing to sell. I have had many people tell me they bought this very Compendium you're reading now... but only got around to actually reading it after seeing several more emails for it, sometimes months down the line."
 },
 {
  "n": 74,
  "title": "How To Sell Luxury Goods With Emails",
  "key": "Luxury sells on story, craft, rarity and identity.",
  "cat": "sell",
  "body": "An Inbox Detonator student once asked me about how to sell luxury goods with copywriting. He pointed out that \"simply describing the technical details doesn't seem great either, like the number of facets, etc.\" I disagreed. A lot of effective copy for high-end items DOES focus on things like the number of facets. Look at any Apple sales page and the focus on chips and transistors, etc. Or the ads in magazines for premium coins or collectibles. But more effectively, with luxury goods it is the idea, the story, the image behind it. There are a few ways to do this. You can tell the painstaking story of how the item is created. Show the effort that goes into it; the purity of the material; the craftsmanship; the rarity of what's in it. You can show the kind of people who use it. Usually this is by association with celebrities or something, but you can also have images of 'tough guys', 'exotic Europeans', etc. (Example: There was a story about a question in the application process for Ogilvy & Mather. Applicants were asked how they would sell a penny for more than a penny. One person came up with the idea of dipping the coin into Marilyn Monroe's handbag and then selling it as a coin owned by Marilyn Monroe.) Or you can do both. Peak Design with their Everyday Backpack did an excellent job of this. They told both the painstaking story of the craftsmanship and clever design of the product; and also stuffed their marketing with images of cool people doing cool things wearing the bags. The end goal is to let the prospect tell themselves a story about why they own it. I bought one of those bags, and every time I put it on I remind myself about all the features it has, and I see myself as one of those cool people. If you have Market Detective, I go into this a lot more in the 'identity' part of market profiling."
 },
 {
  "n": 75,
  "title": "How To Sell Wine With Emails",
  "key": "Physical goods sell by word-painting every sense.",
  "cat": "sell",
  "body": "(Or any other physical product! Wine just made for a nice curious headline...) One of the most powerful ways to sell physical goods - cheese, bicycles, fruit, hammers, jackets, houses — is to use word-painting. If you follow my emails, this is something you won't see me do much, since I only sell info-products! But to sell a physical product through emails, you must use vivid prose that engages as many senses as possible, as the customer can't see/taste/smell/touch the product like they would in a store. Let's take wine. Talk about the cool, breezy vineyards where the grapes were picked. Describe the smell of the musty oak barrels where the wine is aged for years. Paint the scene of the reader pouring a glass and watching the brilliant red hue that shows the grapes were picked in their prime. Describe the scent of oak and plum as they gently smell the aroma from the glass. Talk about the fiery notes of cinnamon and chocolate that dance across the palate as they take a sip and swill it across their tongue. This is one of those tricks that works just as well in emails as it did in direct-mail letters 100 years ago, so go to town with it — it's almost impossible to overdo it, really."
 },
 {
  "n": 76,
  "title": "How To Sell Art With Emails",
  "key": "When there's no problem to solve, sell the relationship.",
  "cat": "sell",
  "body": "An artist once asked me how she could write sales emails since what she sells - art - does not solve a \"problem\" for anyone. In this case — common with artists/authors/musicians etc. — you must focus on selling the relationship, not the product. And then follow these pointers: Firstly, make sure your email list targets your previous buyers. People buy more of what they just bought. Your previous buyers are the best place to go. Secondly, you can broaden your net by thinking about what other kinds of things that people who like art want: Home decoration? Art buying guides? Commentary on what's going on in the world of art? Thirdly, artists have an advantage someone like me doesn't have: TRUE scarcity. You can say, \"I painted this one this morning... It evokes _... Perfect for the person who _ ... Would look amazing in your beach house or a sunny wall in a well lit spacious living room. I'm listing this one for $500. First bidder can have it.\" (Note the word-painting!) Finally, in any field you don't only sell to your customers... but you will likely have competitors watching you. In the early days of my list I was writing emails to clients, but I knew I had a TON of copywriters following my emails. So I played to that and began selling them offers! Likewise, you can also attract artists who are watching what you do, and sell them offers for artists."
 },
 {
  "n": 77,
  "title": "Should You Assume People Have Read Your Previous Emails?",
  "key": "Give context — but cultivating super-fans is worth some continuity.",
  "cat": "list",
  "body": "In the original version of this Compendium, I taught that it's never a good idea to assume someone remembers what you said, or even cares: \"If you absolutely must refer to a previous email, recap it or link to it. But it's better to make emails stand alone.\" However, as time goes on I'm personally focusing more on cultivating the 'super-fans' of my brand that actually do read almost all my emails, since these people make up the majority of my actual customers. So while I still usually give context for people who didn't read, I sometimes write emails that are only understandable if you \"follow along\" — and I'm fine with that."
 },
 {
  "n": 78,
  "title": "The Universal 'Mind Refresh' That Dictates How Often You Can Email",
  "key": "Every morning is a mind refresh. Daily is fine if you're interesting.",
  "cat": "list",
  "body": "From a readers' perspective, there is absolutely no reason you cannot email as much as daily, if you're interesting. Think about it: every morning, someone wakes up. It is a new day. They read a new edition of the newspaper. They listen to the daily edition of their favourite talk show. They check their emails. These things are all 'refreshed' each day, and you have a new chance. Nobody wakes up and thinks, \"gee, I read something from X yesterday, so I need a day off reading them today\". If you want to email less than daily, that's fine, but don't project your insecurities onto your reader. They read plenty of things daily. You just need to be interesting enough to be one of them. Note: this doesn't mean daily emails are the best for every business in every case. They're time-consuming and for some lists, just don't make sense. But don't resist them just because you think it's \"too many emails for someone to read\"."
 },
 {
  "n": 79,
  "title": "How Long Should Writing An Email Take?",
  "key": "30-60 minutes per email. Over 2 hours means weak research.",
  "cat": "mind",
  "body": "It depends. I've researched and written 5 sales emails, from scratch, in 30 minutes - for a market I knew NOTHING about. (The full screen recording of this challenge is in my Market Detective course.) On the other hand, I sometimes spend 2 hours writing my own daily emails (though admittedly, 75% of this time is me being a perfectionist about storytelling...). In general, I think 30-60 minutes is a reasonable amount of time for an email in a market you are familiar with. If you have to research the market, it might take longer, but under no circumstances do I think it's reasonable to take more than 2 hours on a single email. If it's taking you that long, you're weak on your research game, and you need to get to know your market more and understand their pains (and the solutions that your product provides to those pains)."
 },
 {
  "n": 80,
  "title": "Can You Reuse Emails?",
  "key": "Reuse an email once a year at most.",
  "cat": "mind",
  "body": "Sure. But I don't like doing it any more frequently than once a year. At that frequency, people can just put their finger on the fact that they saw this email or promo before, but they've forgotten what it said. If you do it every few months (like some brands I know), readers get tired of it, and resentful of you for not respecting their time."
 },
 {
  "n": 81,
  "title": "What's A Good Open Rate?",
  "key": "There's no universal good open rate. Only split-tests compare.",
  "cat": "mind",
  "body": "Trick question. Don't trust anyone who tries to give you a hard-and-fast number (remember Rule #1)? The current trend is that open rates are becoming less and less reliable over time as more and more mail providers block or fudge open rate data. There is no 'universal' open rate that is reasonable to expect for everyone. Open rates are only useful in the context of split-tests to the same list around the same time. Even on the same list, I don't compare open rates on emails that were sent more than a few months apart."
 },
 {
  "n": 82,
  "title": "Multiply Your Feedback By 50x",
  "key": "For every reply, 50 people felt the same and said nothing.",
  "cat": "mind",
  "body": "For every person who sends you an email telling you something, there are 50 people who felt the same but didn't bother to say it. Don't fall into the trap of only looking at absolute numbers."
 },
 {
  "n": 83,
  "title": "Don't Watch Your Subscribers Too Closely",
  "key": "Watching your subscriber list makes no money and only hurts.",
  "cat": "mind",
  "body": "Before I was more well-known, I used to watch who was subscribing to my emails, and got excited when \"famous\" copywriters joined. Some of them would later unsubscribe and it rattled me because I took it personally. Over time I realised how pointless it was to keep track of these things. It makes no money, and it's only ever going to upset you. And besides ..."
 },
 {
  "n": 84,
  "title": "Unsubscribes Are A Good Thing.",
  "key": "Unsubscribes clean the list and prove you're not bland.",
  "cat": "mind",
  "body": "You need to get comfortable with unsubscribes — and even see them as a good thing. Unsubscribes clean your list. Unsubscribes lower your spend on subs who weren't going to buy. Unsubscribes help your deliverability by not sending to non-readers. Unsubscribes mean you're emailing enough (or being controversial enough) to bother people — which means you're making fans out of others. If you worry about unsubscribes, you'll write bland and inoffensive emails and you'll act fearful and needy. Get comfortable with unsubscribes and your emails will become much, much better."
 },
 {
  "n": 85,
  "title": "It's All About The Bullets? Bulldust.",
  "key": "Bullets tell people where to stop reading. Use them sparingly.",
  "cat": "sell",
  "body": "Don't stuff emails with bullets. Bullets tempt you to get lazy and list 'what you get' instead of 'what's in it for me' (see Rule #93). SO many copywriters launch products with an array of bullets of \"what you get\": \"24/7 access to our private Facebook group!\" \"Weekly live chats!\" \"Unlimited access to our training dashboard!\" \"BONUS private Q&A session!\" This is terrible copywriting. Besides, in today's skimming age, people have ADD. They want copy to be new, new, new. And I mean, even every few lines. The argument has to go somewhere new to keep them interested. When you get to a list of bullets, it is an instant sign to your brain that no development in the argument is coming. That is why your eye hits bullets and automatically 'skips' to the bottom of that bulleted list most of the time. In fact, often bullets are (ironically) a way to tell people what NOT to read, because you can see the endpoint to skip to. So use them sparingly."
 },
 {
  "n": 86,
  "title": "Stop Being A Copywriter. Be A Human Being.",
  "key": "Stop being a copywriter. Write like an actual human.",
  "cat": "persona",
  "body": "I reviewed a cart abandonment sequence for a fat-loss supplement, targeted at middle-aged women, from an Inbox Detonator student. It followed a lot of the \"best practices\". It had a headline like \"This Product Is In Your Cart... But It Would Rather Be Burning Your Fat!\" and a huge list of benefits. And the follow-up emails said things like \"Have you given up on losing fat?\" It all came across as very copywriter-y, using \"persuasion hacks\" to push people over the edge. And... it sounded gross. I suggested rewriting the sequence, imagining that we actually were a close friend of the prospect. Would a 50-year-old woman write like a salesman? Heck no. She'd write something like this: \"hey!!! I saw a report from my system today and you didn't end up checking out with those pills! Is there anything wrong? Any questions I can answer? Otherwise you can quickly check out with them here: <LINK> I know you might feel some doubt. But trust me when you see how these shed fat.... you will be amazed. I've got 'em saved for ya, hon. Just click here. Amy x\" Sometimes, you need to stop thinking like a copywriter, and think more like a human being."
 },
 {
  "n": 87,
  "title": "The Optimum Length Of An Email Sales Promotion",
  "key": "Keep promos 3-7 days. Four or five is the sweet spot.",
  "cat": "campaign",
  "body": "After both studying and writing many dozens of email sales promotions ... my recommendation is to keep email promos between 3 and 7 days in length. Beyond 7 days, you're just going to tire people out from your sale. Less than 3 days, you'll get people saying they didn't see the emails. I think 4 or 5 days long is probably best. But that doesn't mean you can't tease a product before it's available for buying ... even many months in advance."
 },
 {
  "n": 88,
  "title": "Start A Sale By Being Up-Front",
  "key": "Open the sale by being totally up-front. Then it's all reminders.",
  "cat": "campaign",
  "body": "When you start an email sale, in your first email, just be up-front about it. Tell people the sale is starting; the details of the offer; what's in the product; and how long the sale is going. This is the place to give detail, and catch the people who are ready to buy immediately. All the emails after that are reminders."
 },
 {
  "n": 89,
  "title": "Being Front-Of-Mind > An Awesome Sales Argument",
  "key": "Front-of-mind beats the perfect sales argument.",
  "cat": "campaign",

    <script>
/* Persistent progress. Everything lives in localStorage — no account, no server. */
(function () {
  "use strict";

  var KEY = "inboxDojo.v1";
  var MASTERY_CAP = 5;

  function today() {
    var d = new Date();
    return (
      d.getFullYear() +
      "-" +
      String(d.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(d.getDate()).padStart(2, "0")
    );
  }

  function daysBetween(a, b) {
    var pa = a.split("-").map(Number);
    var pb = b.split("-").map(Number);
    var da = Date.UTC(pa[0], pa[1] - 1, pa[2]);
    var db = Date.UTC(pb[0], pb[1] - 1, pb[2]);
    return Math.round((db - da) / 86400000);
  }

  function blank() {
    return {
      v: 1,
      xp: 0,
      mastery: {},
      read: {},
      manualsRead: {},
      ach: {},
      streak: { count: 0, last: null, best: 0 },
      daily: { date: null, quests: [], metrics: {} },
      dojo: {},
      vault: [],
      stats: {
        answered: 0,
        correct: 0,
        bestCombo: 0,
        runs: 0,
        gauntlets: 0,
        byMode: {},
      },
      settings: { sound: true, motion: true },
      createdAt: Date.now(),
    };
  }

  var S = blank();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        var fresh = blank();
        Object.keys(fresh).forEach(function (k) {
          if (parsed[k] === undefined) parsed[k] = fresh[k];
        });
        Object.keys(fresh.stats).forEach(function (k) {
          if (parsed.stats[k] === undefined) parsed.stats[k] = fresh.stats[k];
        });
        S = parsed;
      }
    } catch (e) {
      S = blank();
    }
    rollDaily();
    return S;
  }

  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(S));
      } catch (e) {
        /* quota — nothing useful to do */
      }
    }, 120);
  }

  /* ---------------------------------------------------------------- daily */
  function pickQuests(seedDate) {
    var pool = window.QUEST_POOL.slice();
    // Deterministic shuffle so the same day always yields the same three.
    var seed = seedDate.split("-").join("") | 0;
    function rnd() {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      return seed / 0x7fffffff;
    }
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = pool[i];
      pool[i] = pool[j];
      pool[j] = t;
    }
    return pool.slice(0, 3).map(function (q) {
      return { id: q.id, prog: 0, done: false };
    });
  }

  function rollDaily() {
    var t = today();
    if (S.daily.date !== t) {
      S.daily = { date: t, quests: pickQuests(t), metrics: {} };
      save();
    }
  }

  function touchStreak() {
    var t = today();
    if (S.streak.last === t) return false;
    if (S.streak.last && daysBetween(S.streak.last, t) === 1) S.streak.count += 1;
    else S.streak.count = 1;
    S.streak.last = t;
    if (S.streak.count > S.streak.best) S.streak.best = S.streak.count;
    save();
    checkAch();
    return true;
  }

  function bumpMetric(name, by) {
    rollDaily();
    S.daily.metrics[name] = (S.daily.metrics[name] || 0) + (by === undefined ? 1 : by);
    var completed = [];
    S.daily.quests.forEach(function (q) {
      if (q.done) return;
      var def = questDef(q.id);
      if (!def || def.metric !== name) return;
      q.prog = Math.min(def.goal, S.daily.metrics[name] || 0);
      if (q.prog >= def.goal) {
        q.done = true;
        addXP(def.xp);
        completed.push(def);
      }
    });
    save();
    return completed;
  }

  function setMetricMax(name, value) {
    rollDaily();
    if ((S.daily.metrics[name] || 0) >= value) return [];
    S.daily.metrics[name] = value;
    var completed = [];
    S.daily.quests.forEach(function (q) {
      if (q.done) return;
      var def = questDef(q.id);
      if (!def || def.metric !== name) return;
      q.prog = Math.min(def.goal, value);
      if (q.prog >= def.goal) {
        q.done = true;
        addXP(def.xp);
        completed.push(def);
      }
    });
    save();
    return completed;
  }

  function questDef(id) {
    for (var i = 0; i < window.QUEST_POOL.length; i++)
      if (window.QUEST_POOL[i].id === id) return window.QUEST_POOL[i];
    return null;
  }

  /* ------------------------------------------------------------------ xp */
  function addXP(n) {
    var before = rank().index;
    S.xp += n;
    save();
    var after = rank().index;
    if (after > before) {
      window.dispatchEvent(
        new CustomEvent("rankup", { detail: window.RANKS[after] })
      );
    }
    return n;
  }

  function rank() {
    var idx = 0;
    for (var i = 0; i < window.RANKS.length; i++)
      if (S.xp >= window.RANKS[i].xp) idx = i;
    var cur = window.RANKS[idx];
    var next = window.RANKS[idx + 1] || null;
    var pct = next
      ? Math.min(100, ((S.xp - cur.xp) / (next.xp - cur.xp)) * 100)
      : 100;
    return { index: idx, cur: cur, next: next, pct: pct };
  }

  /* -------------------------------------------------------------- mastery */
  function scoreRule(n, correct) {
    if (!n) return;
    var cur = S.mastery[n] || 0;
    S.mastery[n] = correct
      ? Math.min(MASTERY_CAP, cur + 1)
      : Math.max(0, cur - 1);
    save();
  }

  function masteredCount() {
    var c = 0;
    for (var k in S.mastery) if (S.mastery[k] >= MASTERY_CAP) c++;
    return c;
  }

  function markRead(n) {
    if (S.read[n]) return false;
    S.read[n] = true;
    addXP(15);
    bumpMetric("codexRead");
    save();
    checkAch();
    return true;
  }

  function markManualRead(id) {
    if (S.manualsRead[id]) return false;
    S.manualsRead[id] = true;
    addXP(60);
    save();
    checkAch();
    return true;
  }

  /* --------------------------------------------------------- achievements */
  function grant(id) {
    if (S.ach[id]) return false;
    S.ach[id] = Date.now();
    save();
    var def = null;
    for (var i = 0; i < window.ACHIEVEMENTS.length; i++)
      if (window.ACHIEVEMENTS[i].id === id) def = window.ACHIEVEMENTS[i];
    if (def) {
      addXP(150);
      window.dispatchEvent(new CustomEvent("achievement", { detail: def }));
    }
    return true;
  }

  function checkAch(ctx) {
    ctx = ctx || {};
    if (S.stats.correct >= 1) grant("first-blood");
    if (S.stats.bestCombo >= 10) grant("combo-10");
    if (S.stats.bestCombo >= 25) grant("combo-25");
    var readCount = Object.keys(S.read).length;
    if (readCount >= 25) grant("codex-25");
    if (readCount >= 101) grant("codex-all");
    var m = masteredCount();
    if (m >= 10) grant("mastery-10");
    if (m >= 50) grant("mastery-50");
    if (m >= 101) grant("mastery-all");
    if ((S.mastery[1] || 0) >= MASTERY_CAP) grant("rule-1");
    if (S.streak.count >= 3) grant("streak-3");
    if (S.streak.count >= 7) grant("streak-7");
    if (S.streak.count >= 30) grant("streak-30");
    var dojoDone = 0;
    for (var k in S.dojo) if (S.dojo[k] && S.dojo[k].done) dojoDone++;
    if (dojoDone >= 1) grant("dojo-1");
    if (dojoDone >= 5) grant("dojo-5");
    if (dojoDone >= window.DOJO.length) grant("dojo-all");
    if (S.vault.length >= 10) grant("vault-10");
    if (S.vault.length >= 50) grant("vault-50");
    if (Object.keys(S.manualsRead).length >= window.MANUALS.length) grant("manuals");
    var h = new Date().getHours();
    if (h >= 0 && h < 4 && S.stats.answered > 0) grant("night-owl");
    if (ctx.flawless) grant("flawless");
    if (ctx.gauntlet) grant("boss-1");
    if (ctx.gauntletPerfect) grant("boss-perfect");
    if (ctx.ach) grant(ctx.ach);
  }

  /* ---------------------------------------------------------------- stats */
  function recordAnswer(mode, correct, ruleN) {
    S.stats.answered++;
    if (correct) S.stats.correct++;
    if (!S.stats.byMode[mode]) S.stats.byMode[mode] = { a: 0, c: 0 };
    S.stats.byMode[mode].a++;
    if (correct) S.stats.byMode[mode].c++;
    scoreRule(ruleN, correct);
    save();
  }

  function noteCombo(n) {
    if (n > S.stats.bestCombo) {
      S.stats.bestCombo = n;
      save();
      checkAch();
    }
    setMetricMax("bestComboToday", n);
  }

  window.Store = {
    get state() {
      return S;
    },
    load: load,
    save: save,
    reset: function () {
      S = blank();
      rollDaily();
      save();
    },
    today: today,
    rollDaily: rollDaily,
    touchStreak: touchStreak,
    addXP: addXP,
    rank: rank,
    scoreRule: scoreRule,
    masteredCount: masteredCount,
    markRead: markRead,
    markManualRead: markManualRead,
    grant: grant,
    checkAch: checkAch,
    recordAnswer: recordAnswer,
    noteCombo: noteCombo,
    bumpMetric: bumpMetric,
    setMetricMax: setMetricMax,
    questDef: questDef,
    MASTERY_CAP: MASTERY_CAP,
  };
})();

/* Juice: synthesised sound, particles, toasts, shake. No external assets. */
(function () {
  "use strict";

  var ctx = null;
  function audio() {
    if (!window.Store.state.settings.sound) return null;
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function tone(freq, dur, type, gain, delay, slideTo) {
    var a = audio();
    if (!a) return;
    var t0 = a.currentTime + (delay || 0);
    var osc = a.createOscillator();
    var g = a.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain === undefined ? 0.16 : gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(a.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  function noise(dur, gain) {
    var a = audio();
    if (!a) return;
    var len = Math.floor(a.sampleRate * dur);
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = a.createBufferSource();
    src.buffer = buf;
    var g = a.createGain();
    g.gain.value = gain || 0.05;
    var f = a.createBiquadFilter();
    f.type = "highpass";
    f.frequency.value = 1200;
    src.connect(f);
    f.connect(g);
    g.connect(a.destination);

      tone(1318.5, 0.08, "square", 0.06);
