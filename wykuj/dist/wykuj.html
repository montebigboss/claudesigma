    <!-- ekrany -->
    <script>
/* Tryby gry: fiszki, quiz na czas, pary, sortownia, egzamin próbny. */
(function () {
  "use strict";
  var W = window.Wykuj;
  var esc = W.esc;
  var Store = W.Store;
  W.screens = W.screens || {};

  function top(title, sub, right) {
    return (
      '<header class="topbar">' +
      '<button class="icon-btn" data-nav="back" aria-label="Wróć">' + W.icon("back") + "</button>" +
      '<div class="tb-title"><b>' + esc(title) + "</b>" + (sub ? "<span>" + esc(sub) + "</span>" : "") + "</div>" +
      '<div class="tb-right">' + (right || "") + "</div></header>"
    );
  }
  W.top = top;

  /* ================= Fiszki ================= */

  W.screens.cards = function (root, p) {
    var m = W.byId[p.mod];
    var st = Store.state.settings;
    var dir = st.cardDir || "term";
    var allowed = m.concepts.filter(W.allowed);
    var queue;
    if (p.cram) queue = W.sample(allowed, 15);
    else {
      var due = Store.dueCards(m).sort(function (a, b) {
        return Store.card(m.id, a.id).due - Store.card(m.id, b.id).due;
      });
      queue = due.concat(Store.newCards(m).slice(0, 8)).slice(0, 20);
    }

    function boxes() {
      var counts = [0, 0, 0, 0, 0, 0], fresh = 0;
      allowed.forEach(function (c) {
        var s = Store.card(m.id, c.id);
        if (!s) fresh++;
        else counts[s.box]++;
      });
      var cells = '<div class="box new"><b>' + fresh + "</b><span>nowe</span></div>";
      counts.forEach(function (n, i) {
        cells += '<div class="box b' + i + '"><b>' + n + "</b><span>" + (i === 0 ? "do nauki" : "pud. " + i) + "</span></div>";
      });
      return '<div class="boxes" aria-label="Pudełka Leitnera">' + cells + "</div>";
    }

    if (!queue.length) {
      root.innerHTML =
        top("Fiszki", m.title) +
        '<div class="page"><div class="empty"><div class="empty-ic">' + W.icon("check") + "</div>" +
        "<h2>Na dziś wszystko powtórzone</h2><p>Kolejne fiszki wrócą, kiedy przyjdzie ich termin. Im lepiej umiesz kartę, tym rzadziej wraca.</p>" +
        boxes() +
        '<button class="btn primary" data-a="cram">Powtórz 15 losowych mimo to</button></div></div>';
      root.querySelector('[data-a="cram"]').onclick = function () {
        W.go("cards", { mod: m.id, cram: true }, { replace: true });
      };
      return;
    }

    var total = queue.length, done = 0, good = 0, xp = 0, flipped = false, cur = null;
    root.innerHTML =
      top("Fiszki", m.title, '<button class="pill-btn" data-a="dir">' + (dir === "term" ? "Pojęcie → opis" : "Opis → pojęcie") + "</button>") +
      '<div class="page cards-page">' +
      '<div class="lbar slim"><i></i></div>' +
      '<div class="fc-wrap"><button class="fc" aria-live="polite"><div class="fc-in"><div class="fc-face fc-front"></div><div class="fc-face fc-back"></div></div></button></div>' +
      '<p class="fc-tip">Kliknij kartę albo naciśnij spację, żeby ją odwrócić.</p>' +
      '<div class="grade" hidden>' +
      '<button class="btn g-again" data-g="again"><kbd>1</kbd>Nie pamiętam</button>' +
      '<button class="btn g-hard" data-g="hard"><kbd>2</kbd>Z trudem</button>' +
      '<button class="btn g-good" data-g="good"><kbd>3</kbd>Umiem</button></div>' +
      "</div>";
    var $ = function (s) { return root.querySelector(s); };
    var card = $(".fc"), front = $(".fc-front"), back = $(".fc-back"), grade = $(".grade"), tip = $(".fc-tip");

    function faces(c) {
      var termHtml = '<span class="fc-k">Pojęcie</span><h2 class="display">' + esc(c.term) + "</h2>";
      var defHtml = c.plain
        ? '<span class="fc-k">Po ludzku</span><p>' + esc(c.plain) + '</p><span class="fc-k">Na teście</span><p class="fc-def">' + esc(c.def) + "</p>"
        : '<span class="fc-k">Definicja</span><p>' + esc(c.def) + "</p>";
      var badge = W.srcBadge(c.s);
      var unit = m.units[m.unitIdx[c.u]];
      var pic = '<span class="fc-pic">' + W.icon(c.ic || (unit && unit.icon) || "spark") + "</span>";
      var fig = c.fig ? W.figHtml(m, c.fig, true, c.id) : "";
      var s = Store.card(m.id, c.id);
      var meta = '<span class="fc-box">' + (s ? "Pudełko " + s.box : "Nowa karta") + "</span>";
      if (dir === "term") {
        front.innerHTML = meta + pic + termHtml + badge;
        back.innerHTML = defHtml + fig + badge;
      } else {
        front.innerHTML = meta + pic + defHtml + badge;
        back.innerHTML = termHtml + '<p class="fc-small">' + esc(c.sh) + "</p>" + fig + badge;
      }
    }

    function show() {
      if (!queue.length) return end();
      cur = queue.shift();
      flipped = false;
      card.classList.remove("flipped");
      grade.hidden = true;
      tip.hidden = false;
      setTimeout(function () {
        faces(cur);
      }, 120);
      $(".lbar i").style.width = Math.round((done / total) * 100) + "%";
    }

    function flip() {
      flipped = !flipped;
      card.classList.toggle("flipped", flipped);
      W.sound("flip");
      if (flipped) {
        grade.hidden = false;
        tip.hidden = true;
      }
    }

    function rate(g) {
      if (!flipped) return;
      Store.gradeCard(m.id, cur.id, g);
      if (g === "again") {
        queue.splice(Math.min(3, queue.length), 0, cur);
        W.sound("wrong");
      } else {
        done++;
        if (g === "good") good++;
        xp += 1;
        Store.addXP(1);
        W.sound("correct", good);
      }
      var full = allowed.every(function (c) {
        var s = Store.card(m.id, c.id);
        return s && s.box >= 3;
      });
      if (full) Store.unlock("deck");
      Store.save();
      show();
    }

    function end() {
      W.resultScreen(root, {
        title: "Talia powtórzona",
        sub: good + " z " + total + " kart oznaczyłeś jako „umiem”.",
        confetti: good === total,
        stats: [
          { label: "Karty", value: String(total) },
          { label: "Umiem", value: String(good), tone: "good" },
          { label: "XP", value: "+" + xp, tone: "gold" }
        ],
        extra: boxes(),
        actions: [
          { label: "Wróć do modułu", fn: function () { W.back(); } },
          { label: "Jeszcze 15 losowych", fn: function () { W.go("cards", { mod: m.id, cram: true }, { replace: true }); } }
        ]
      });
    }

    card.onclick = flip;
    grade.addEventListener("click", function (e) {
      var b = e.target.closest("[data-g]");
      if (b) rate(b.dataset.g);
    });
    $('[data-a="dir"]').onclick = function () {
      st.cardDir = dir === "term" ? "def" : "term";
      Store.save();
      W.go("cards", p, { replace: true });
    };
    W.setKeys(function (e) {
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        if (!flipped) flip();
        else if (e.key === "Enter") rate("good");
      } else if (flipped && e.key === "1") rate("again");
      else if (flipped && e.key === "2") rate("hard");
      else if (flipped && e.key === "3") rate("good");
    });
    show();
  };

  /* ================= Quiz na czas (Kahoot) ================= */

  var SHAPES = [
    ["k-red", "triangle"], ["k-blue", "diamond"], ["k-yellow", "circle"], ["k-green", "square"]
  ];

  W.screens.kahoot = function (root, p) {
    var m = W.byId[p.mod];
    var pool = m.exercises.filter(function (e) {
      return W.allowed(e) && /^(mcq|tf|which|cloze)$/.test(e.t);
    });
    var items = W.weighted(m.id, pool, 12);
    var i = -1, score = 0, streak = 0, bestStreak = 0, correct = 0;
    var timer = null, startT = 0, limit = 20, answered = false, choice = null;
    var best = Store.mod(m.id).best.kahoot || 0;

    function cleanup() {
      clearInterval(timer);
    }

    function countdown() {
      var n = 3;
      root.innerHTML =
        '<div class="kh kh-intro"><p class="kh-eyebrow">Quiz na czas · 12 pytań</p><div class="kh-count display">3</div>' +
        "<p>Im szybciej, tym więcej punktów. Seria dobrych odpowiedzi daje bonus.</p></div>";
      var el = root.querySelector(".kh-count");
      W.sound("tick");
      timer = setInterval(function () {
        n--;
        if (n <= 0) {
          clearInterval(timer);
          ask();
        } else {
          el.textContent = n;
          W.sound("tick");
        }
      }, 800);
    }

    function ask() {
      i++;
      if (i >= items.length) return end();
      var ex = items[i];
      choice = W.asChoice(ex, m);
      limit = ex.t === "tf" ? 12 : 20;
      answered = false;
      var q = ex.t === "cloze" ? ex.q.replace("___", "_____") : ex.q;
      var isTf = ex.t === "tf";
      var shapes = isTf ? [SHAPES[1], SHAPES[0]] : SHAPES;
      root.innerHTML =
        '<div class="kh">' +
        '<header class="kh-top"><button class="icon-btn" data-nav="back" aria-label="Zakończ">' + W.icon("x") + "</button>" +
        '<span class="kh-n">' + (i + 1) + " / " + items.length + "</span>" +
        '<span class="kh-score"><b>' + score + "</b> pkt</span></header>" +
        '<div class="kh-q"><h2>' + esc(q) + "</h2>" + W.srcBadge(ex.s) + "</div>" +
        '<div class="kh-timer"><span class="kh-sec">' + limit + '</span><div class="kh-tbar"><i></i></div></div>' +
        '<div class="kh-tiles ' + (isTf ? "two" : "") + '">' +
        choice.options
          .map(function (o, j) {
            var sh = shapes[j];
            return '<button class="kt ' + sh[0] + '" data-j="' + j + '">' + W.icon(sh[1], "kt-ic") + "<span>" + esc(o) + "</span><kbd>" + (j + 1) + "</kbd></button>";
          })
          .join("") +
        "</div>" +
        '<div class="kh-reveal" role="status" aria-live="polite" hidden></div></div>';
      var tbar = root.querySelector(".kh-tbar i"), sec = root.querySelector(".kh-sec");
      startT = Date.now();
      requestAnimationFrame(function () {
        tbar.style.transitionDuration = limit + "s";
        tbar.style.width = "0%";
      });
      root.querySelector(".kh-tiles").addEventListener("click", function (e) {
        var b = e.target.closest(".kt");
        if (b) answer(+b.dataset.j);
      });
      var lastShown = limit;
      timer = setInterval(function () {
        var left = Math.max(0, limit - (Date.now() - startT) / 1000);
        var shown = Math.ceil(left);
        if (shown !== lastShown) {
          lastShown = shown;
          sec.textContent = shown;
          if (shown <= 5 && shown > 0) W.sound("tick");
        }
        if (left <= 0) answer(-1);
      }, 100);
    }

    function answer(j) {
      if (answered) return;
      answered = true;
      clearInterval(timer);
      var ex = items[i];
      var elapsed = (Date.now() - startT) / 1000;
      var ok = j === choice.correct;
      Store.record(m.id, ex.id, ok);
      var pts = 0;
      if (ok) {
        streak++;
        bestStreak = Math.max(bestStreak, streak);
        correct++;
        pts = Math.round(1000 * (1 - Math.min(1, elapsed / limit) / 2)) + Math.min(streak - 1, 5) * 100;
        score += pts;
        W.sound("correct", streak);
      } else {
        streak = 0;
        W.sound("wrong");
      }
      var tiles = root.querySelectorAll(".kt");
      tiles.forEach(function (t, k) {
        t.disabled = true;
        if (k === choice.correct) t.classList.add("right");
        else t.classList.add("dim");
        if (k === j && !ok) t.classList.add("wrong");
      });
      var tb = root.querySelector(".kh-tbar i");
      tb.style.transitionDuration = "0s";
      tb.style.width = getComputedStyle(tb).width;
      root.querySelector(".kh-score b").textContent = score;
      var rv = root.querySelector(".kh-reveal");
      rv.className = "kh-reveal " + (ok ? "ok" : "bad");
      rv.innerHTML =
        "<div><b>" + (ok ? "Dobrze! +" + pts : j < 0 ? "Czas minął" : "Niestety nie") + "</b>" +
        (ok && streak >= 2 ? '<span class="kh-streak">' + W.icon("flame") + "seria " + streak + "</span>" : "") +
        (ok ? "" : '<p class="kh-right">Poprawnie: <b>' + esc(choice.options[choice.correct]) + "</b></p>") +
        W.explain(ex, { notes: choice.notes, correctText: choice.options[choice.correct], wrongPicks: !ok && j >= 0 ? [choice.options[j]] : [] }) + "</div>" +
        '<button class="btn primary" data-a="next">' + (i + 1 < items.length ? "Dalej" : "Wynik") + "</button>";
      rv.hidden = false;
      rv.querySelector('[data-a="next"]').onclick = ask;
      rv.querySelector('[data-a="next"]').focus({ preventScroll: true });
    }

    function end() {
      cleanup();
      var rec = score > best;
      if (rec) Store.mod(m.id).best.kahoot = score;
      if (score >= 9000) Store.unlock("kahoot");
      Store.addXP(correct * 2 + 5);
      W.resultScreen(root, {
        title: score + " pkt",
        sub: rec ? "Nowy rekord! Poprzedni: " + best + " pkt." : "Rekord do pobicia: " + best + " pkt.",
        confetti: rec,
        stats: [
          { label: "Poprawne", value: correct + "/" + items.length, tone: "good" },
          { label: "Najdłuższa seria", value: String(bestStreak) },
          { label: "XP", value: "+" + (correct * 2 + 5), tone: "gold" }
        ],
        actions: [
          { label: "Jeszcze raz", fn: function () { W.go("kahoot", p, { replace: true }); } },
          { label: "Wróć do modułu", fn: function () { W.back(); } }
        ]
      });
    }

    W.setKeys(function (e) {
      if (!answered) {
        var n = parseInt(e.key, 10);
        if (choice && n >= 1 && n <= choice.options.length) answer(n - 1);
      } else if (e.key === "Enter") {
        var b = root.querySelector('[data-a="next"]');
        if (b && e.target !== b) {
          e.preventDefault();
          b.click();
        }
      }
    });
    countdown();
    return cleanup;
  };

  /* ================= Pary ================= */

  W.screens.match = function (root, p) {
    var m = W.byId[p.mod];
    var concepts = W.sample(m.concepts.filter(W.allowed), 15);
    var rounds = [concepts.slice(0, 5), concepts.slice(5, 10), concepts.slice(10, 15)].filter(function (r) {
      return r.length >= 2;
    });
    var r = 0, mistakes = 0, start = Date.now(), timer = null;
    var best = Store.mod(m.id).best.match || 0;

    root.innerHTML =
      top("Pary", "Pojęcie i jego sens", '<span class="clock">0.0 s</span>') +
      '<div class="page"><div class="lbar slim"><i></i></div><p class="mg-info">Runda <b class="mg-r">1</b> z ' + rounds.length +
      ' · błąd to +3 s' + (best ? " · rekord " + best.toFixed(1) + " s" : "") + '</p><div class="mg"></div>' +
      '<p class="mg-fb" aria-live="polite">Połącz pojęcie z jego znaczeniem. Pod spodem zobaczysz, co oznacza każda para.</p></div>';
    var clock = root.querySelector(".clock"), grid = root.querySelector(".mg"), mfb = root.querySelector(".mg-fb");
    var byC = {}, missed = {};
    concepts.forEach(function (c) { byC[c.id] = c; });
    function gist(c) {
      return c.plain || c.def;
    }

    function elapsed() {
      return (Date.now() - start) / 1000 + mistakes * 3;
    }
    timer = setInterval(function () {
      clock.textContent = elapsed().toFixed(1) + " s";
    }, 100);

    function round() {
      root.querySelector(".mg-r").textContent = r + 1;
      root.querySelector(".lbar i").style.width = Math.round((r / rounds.length) * 100) + "%";
      var set = rounds[r];
      var L = W.shuffle(set), R = W.shuffle(set);
      grid.innerHTML =
        '<div class="mcol">' + L.map(function (c) { return '<button class="tile big" data-side="L" data-id="' + c.id + '">' + esc(c.term) + "</button>"; }).join("") +
        '</div><div class="mcol">' + R.map(function (c) { return '<button class="tile big" data-side="R" data-id="' + c.id + '">' + esc(c.sh) + "</button>"; }).join("") +
        "</div>";
      var selL = null, selR = null, left = set.length;
      grid.onclick = function (e) {
        var b = e.target.closest(".tile");
        if (!b || b.classList.contains("done")) return;
        W.sound("tap");
        if (b.dataset.side === "L") {
          if (selL) selL.classList.remove("sel");
          selL = b;
        } else {
          if (selR) selR.classList.remove("sel");
          selR = b;
        }
        b.classList.add("sel");
        if (selL && selR) {
          var a = selL, c = selR;
          selL = selR = null;
          if (a.dataset.id === c.dataset.id) {
            a.className = c.className = "tile big done";
            var hit = byC[a.dataset.id];
            mfb.className = "mg-fb ok";
            mfb.innerHTML = "<b>" + esc(hit.term) + ":</b> " + esc(gist(hit));
            left--;
            W.sound("correct", set.length - left);
            if (!left) {
              r++;
              setTimeout(r < rounds.length ? round : end, 350);
            }
          } else {
            mistakes++;
            var cl = byC[a.dataset.id], cr = byC[c.dataset.id];
            missed[cl.id] = missed[cr.id] = true;
            mfb.className = "mg-fb bad";
            mfb.innerHTML = "<b>To nie para.</b> " + esc(W.quote(cl.term)) + " znaczy: " + esc(cl.sh) + ". A " + esc(W.quote(cr.sh)) + " to opis pojęcia " + esc(W.quote(cr.term)) + ".";
            W.sound("wrong");
            W.buzz(30);
            a.classList.add("bad");
            c.classList.add("bad");
            setTimeout(function () {
              a.classList.remove("bad", "sel");
              c.classList.remove("bad", "sel");
            }, 450);
          }
        }
      };
    }

    function end() {
      clearInterval(timer);
      var t = elapsed();
      var rec = !best || t < best;
      if (rec) Store.mod(m.id).best.match = Math.round(t * 10) / 10;
      if (t < 25) Store.unlock("match");
      var xp = 10 + (rec ? 5 : 0);
      Store.addXP(xp);
      var miss = concepts.filter(function (c) { return missed[c.id]; });
      W.resultScreen(root, {
        extra: miss.length
          ? '<h3 class="r-h">Te pary ci się pomyliły</h3><ul class="r-list r-defs">' +
            miss.map(function (c) { return "<li><b>" + esc(c.term) + "</b><span>" + esc(gist(c)) + "</span></li>"; }).join("") + "</ul>"
          : "",
        title: t.toFixed(1) + " s",
        sub: rec ? "Nowy rekord!" : "Rekord: " + best.toFixed(1) + " s",
        confetti: rec,
        stats: [
          { label: "Pary", value: String(concepts.length) },
          { label: "Błędy", value: String(mistakes), tone: mistakes ? "bad" : "good" },
          { label: "XP", value: "+" + xp, tone: "gold" }
        ],
        actions: [
          { label: "Jeszcze raz", fn: function () { W.go("match", p, { replace: true }); } },
          { label: "Wróć do modułu", fn: function () { W.back(); } }
        ]
      });
    }

    round();
    return function () {
      clearInterval(timer);
    };
  };

  /* ================= Sortownia ================= */

  W.screens.sort = function (root, p) {
    var m = W.byId[p.mod];
    var bests = Store.mod(m.id).best.sort || {};

    if (!p.deck) {
      root.innerHTML =
        top("Sortownia", "Przesuń kartę w lewo albo w prawo") +
        '<div class="page"><div class="deck-list">' +
        m.sortDecks
          .map(function (d) {
            var b = bests[d.id];
            return (
              '<button class="deck" data-d="' + d.id + '"><span class="deck-cats"><i>' + esc(d.cats[0]) + "</i><i>" + esc(d.cats[1]) + "</i></span>" +
              "<b>" + esc(d.title) + "</b><span>" + esc(d.sub) + "</span>" +
              '<span class="deck-meta">' + d.items.length + " kart" + (b != null ? " · najlepiej " + Math.round(b * 100) + "%" : "") + "</span></button>"
            );
          })
          .join("") +
        "</div></div>";
      root.querySelector(".deck-list").addEventListener("click", function (e) {
        var b = e.target.closest("[data-d]");
        if (b) W.go("sort", { mod: m.id, deck: b.dataset.d });
      });
      return;
    }

    var deck = m.sortDecks.filter(function (d) { return d.id === p.deck; })[0];
    var items = W.shuffle(deck.items).slice(0, 16);
    var i = 0, correct = 0, wrong = [], busy = false;

    root.innerHTML =
      top(deck.title, "Sortownia", '<span class="clock"><b class="sw-n">1</b>/' + items.length + "</span>") +
      '<div class="page sw-page"><div class="lbar slim"><i></i></div>' +
      '<div class="sw-zones"><div class="sw-z z0">' + W.icon("back") + esc(deck.cats[0]) + '</div><div class="sw-z z1">' + esc(deck.cats[1]) + W.icon("back", "flip") + "</div></div>" +
      '<div class="sw-stage"><div class="sw-card"></div></div>' +
      '<div class="sw-btns"><button class="btn sw-b0" data-c="0"><kbd>←</kbd>' + esc(deck.cats[0]) + '</button><button class="btn sw-b1" data-c="1">' + esc(deck.cats[1]) + "<kbd>→</kbd></button></div>" +
      '<p class="sw-fb" aria-live="polite"></p></div>';
    var card = root.querySelector(".sw-card"), fb = root.querySelector(".sw-fb");

    function show() {
      if (i >= items.length) return end();
      card.className = "sw-card in";
      card.style.transform = "";
      card.textContent = items[i][0];
      root.querySelector(".sw-n").textContent = i + 1;
      root.querySelector(".lbar i").style.width = Math.round((i / items.length) * 100) + "%";
      busy = false;
    }

    var waiting = false;
    function decide(c) {
      if (waiting) return next();
      if (busy) return;
      busy = true;
      var it = items[i];
      var ok = c === it[1];
      var side = it[1] === 0 ? -1 : 1;
      var why = W.sortWhy(deck, it);
      if (ok) {
        correct++;
        W.sound("correct", correct);
        fb.className = "sw-fb ok";
        fb.innerHTML = "<b>" + W.icon("check") + esc(it[0]) + " → " + esc(deck.cats[it[1]]) + ".</b>" + (why ? " " + esc(why) : "");
        card.classList.add("ok");
        card.style.transform = "translateX(" + side * 140 + "%) rotate(" + side * 18 + "deg)";
        setTimeout(next, 260);
      } else {
        wrong.push(it);
        W.sound("wrong");
        W.buzz(30);
        fb.className = "sw-fb bad";
        fb.innerHTML = "<b>" + W.icon("x") + "To jednak: " + esc(deck.cats[it[1]]) + ".</b>" + (why ? " " + esc(why) : "") +
          '<button class="btn primary sw-next" data-a="next">Rozumiem, dalej</button>';
        card.classList.add("bad");
        card.style.transform = "translateX(" + side * 18 + "%)";
        waiting = true;
        fb.querySelector(".sw-next").focus({ preventScroll: true });
      }
    }
    function next() {
      if (waiting) {
        waiting = false;
        var side = items[i][1] === 0 ? -1 : 1;
        card.style.transform = "translateX(" + side * 140 + "%) rotate(" + side * 18 + "deg)";
        return setTimeout(function () {
          i++;
          show();
        }, 220);
      }
      i++;
      show();
    }

    /* drag */
    var sx = null, dx = 0;
    card.addEventListener("pointerdown", function (e) {
      if (busy || waiting) return;
      sx = e.clientX;
      dx = 0;
      card.setPointerCapture(e.pointerId);
      card.classList.add("drag");
    });
    card.addEventListener("pointermove", function (e) {
      if (sx == null) return;
      dx = e.clientX - sx;
      card.style.transform = "translateX(" + dx + "px) rotate(" + dx / 14 + "deg)";
      root.querySelector(".z0").classList.toggle("hot", dx < -50);
      root.querySelector(".z1").classList.toggle("hot", dx > 50);
    });
    function release() {
      if (sx == null) return;
      sx = null;
      card.classList.remove("drag");
      root.querySelectorAll(".sw-z").forEach(function (z) { z.classList.remove("hot"); });
      if (Math.abs(dx) > 80) decide(dx > 0 ? 1 : 0);
      else card.style.transform = "";
    }
    card.addEventListener("pointerup", release);
    card.addEventListener("pointercancel", release);
    root.querySelector(".sw-btns").addEventListener("click", function (e) {
      var b = e.target.closest("[data-c]");
      if (b) decide(+b.dataset.c);
    });
    fb.addEventListener("click", function (e) {
      if (e.target.closest('[data-a="next"]')) next();
    });
    W.setKeys(function (e) {
      if (waiting && (e.key === "Enter" || e.key === " " || e.key === "ArrowLeft" || e.key === "ArrowRight")) {
        e.preventDefault();
        return next();
      }
      if (e.key === "ArrowLeft") decide(0);
      else if (e.key === "ArrowRight") decide(1);
    });

    function end() {
      var acc = correct / items.length;
      var all = Store.mod(m.id).best;
      all.sort = all.sort || {};
      if (all.sort[deck.id] == null || acc > all.sort[deck.id]) all.sort[deck.id] = acc;
      if (!wrong.length) Store.unlock("sort");
      Store.addXP(correct);
      W.resultScreen(root, {
        title: Math.round(acc * 100) + "%",
        sub: wrong.length ? "Te karty warto przejrzeć:" : "Bez ani jednego błędu.",
        confetti: !wrong.length,
        stats: [
          { label: "Dobrze", value: correct + "/" + items.length, tone: "good" },
          { label: "Błędy", value: String(wrong.length), tone: wrong.length ? "bad" : "" },
          { label: "XP", value: "+" + correct, tone: "gold" }
        ],
        extra: wrong.length
          ? '<ul class="r-list r-defs">' + wrong.map(function (w) {
              var why = W.sortWhy(deck, w);
              return "<li><b>" + esc(w[0]) + " → " + esc(deck.cats[w[1]]) + "</b>" + (why ? "<span>" + esc(why) + "</span>" : "") + "</li>";
            }).join("") + "</ul>"
          : "",
        actions: [
          { label: "Jeszcze raz", fn: function () { W.go("sort", p, { replace: true }); } },
          { label: "Inna talia", fn: function () { W.back(); } }
        ]
      });
    }
    show();
  };

  /* ================= Egzamin próbny ================= */

  W.screens.exam = function (root, p) {
    var m = W.byId[p.mod];
    var N = 20;
    var pool = m.exercises.filter(function (e) {
      return e.s !== "D" && /^(mcq|tf|which|cloze)$/.test(e.t);
    });
    var hist = Store.mod(m.id).exams;

    root.innerHTML =
      top("Egzamin próbny", m.title) +
      '<div class="page"><div class="exam-intro">' +
      '<p class="eyebrow">' + esc(m.course.name) + "</p>" +
      '<h1 class="display">Test zamknięty</h1>' +
      "<ul class='rules'><li><b>" + N + " pytań</b> jednokrotnego wyboru, losowanych z całego wykładu</li>" +
      "<li>Bez podpowiedzi. Wynik i omówienie dopiero po oddaniu</li>" +
      "<li>Tylko materiał prowadzącego (" + esc(m.sourceNames.S) + (m.sourceNames.U ? ", " + esc(m.sourceNames.U) : "") + "). Bez dopowiedzeń ★</li>" +
      (m.examNote ? "<li>" + esc(m.examNote) + "</li>" : "<li>Zaliczenie: <b>więcej niż " + Math.round(m.passRatio * 100) + "%</b>, jak na prawdziwym teście</li>") + "</ul>" +
      (hist.length
        ? '<div class="hist"><span>Twoje podejścia</span><div class="hist-bars">' +
          hist.slice(-10).map(function (h) {
            return '<i class="' + (h.pct > m.passRatio ? "pass" : "fail") + '" style="height:' + Math.max(6, Math.round(h.pct * 100)) + '%" title="' + h.date + ": " + Math.round(h.pct * 100) + '%"></i>';
          }).join("") +
          "</div></div>"
        : "") +
      '<button class="btn primary big" data-a="start">Rozpocznij test</button></div></div>';
    root.querySelector('[data-a="start"]').onclick = start;
    W.setKeys(function (e) {
      if (e.key === "Enter") start();
    });

    var qs, ans, at, t0, timer;

    function start() {
      qs = W.sample(pool, N).map(function (e) {
        var c = W.asChoice(e, m);
        c.ex = e;
        return c;
      });
      ans = qs.map(function () { return -1; });
      at = 0;
      t0 = Date.now();
      root.innerHTML =
        top("Egzamin próbny", m.title, '<span class="clock">0:00</span>') +
        '<div class="page exam">' +
        '<div class="ex-dots"></div>' +
        '<div class="ex-sheet"></div>' +
        '<div class="ex-nav"><button class="btn ghost" data-a="prev">Wstecz</button><button class="btn primary" data-a="next">Dalej</button></div>' +
        '<div class="modal" hidden><div class="modal-card"><h3>Oddać test?</h3><p class="mc-p"></p><div class="row"><button class="btn primary" data-a="submit">Oddaj</button><button class="btn ghost" data-a="cancel">Wróć do pytań</button></div></div></div>' +
        "</div>";
      timer = setInterval(function () {
        var c = root.querySelector(".clock");
        if (c) c.textContent = W.fmtTime(Math.round((Date.now() - t0) / 1000));
      }, 1000);
      root.querySelector(".page").addEventListener("click", onClick);
      W.setKeys(function (e) {
        var n = "abcd".indexOf(e.key.toLowerCase());
        var d = parseInt(e.key, 10);
        if (d >= 1 && d <= 4) n = d - 1;
        if (n >= 0 && n < qs[at].options.length) pick(n);
        else if (e.key === "ArrowRight" || e.key === "Enter") go(at + 1);
        else if (e.key === "ArrowLeft") go(at - 1);
      });
      render();
    }

    function render() {
      var q = qs[at];
      var text = q.ex.t === "cloze" ? q.q.replace("___", "_____") : q.q;
      root.querySelector(".ex-dots").innerHTML = qs
        .map(function (_, k) {
          return '<button class="dot ' + (ans[k] >= 0 ? "on " : "") + (k === at ? "cur" : "") + '" data-go="' + k + '" aria-label="Pytanie ' + (k + 1) + '">' + (k + 1) + "</button>";
        })
        .join("");
      root.querySelector(".ex-sheet").innerHTML =
        '<p class="ex-n">Pytanie ' + (at + 1) + " z " + qs.length + "</p>" +
        '<h2 class="ex-q">' + esc(text) + "</h2>" +
        '<div class="ex-opts">' +
        q.options
          .map(function (o, k) {
            return '<button class="ex-o ' + (ans[at] === k ? "sel" : "") + '" data-o="' + k + '"><span class="ex-l">' + "abcd"[k] + ")</span><span>" + esc(o) + "</span></button>";
          })
          .join("") +
        "</div>";
      root.querySelector('[data-a="prev"]').disabled = at === 0;
      root.querySelector('[data-a="next"]').textContent = at === qs.length - 1 ? "Oddaj test" : "Dalej";
    }

    function pick(k) {
      ans[at] = k;
      W.sound("tap");
      render();
    }

    function go(k) {
      if (k >= qs.length) return askSubmit();
      if (k < 0) return;
      at = k;
      render();
    }

    function askSubmit() {
      var empty = ans.filter(function (a) { return a < 0; }).length;
      var mod = root.querySelector(".modal");
      mod.querySelector(".mc-p").textContent = empty
        ? "Bez odpowiedzi zostało " + empty + " pytań. Puste liczą się jako błędne."
        : "Wszystkie pytania mają odpowiedź.";
      mod.hidden = false;
    }

    function onClick(e) {
      var t = e.target.closest("[data-o],[data-go],[data-a]");
      if (!t) return;
      if (t.dataset.o != null) pick(+t.dataset.o);
      else if (t.dataset.go != null) go(+t.dataset.go);
      else if (t.dataset.a === "prev") go(at - 1);
      else if (t.dataset.a === "next") go(at + 1);
      else if (t.dataset.a === "submit") finish();
      else if (t.dataset.a === "cancel") root.querySelector(".modal").hidden = true;
    }

    function finish() {
      clearInterval(timer);
      var secs = Math.round((Date.now() - t0) / 1000);
      var ok = 0, wrongList = [], rightList = [];
      qs.forEach(function (q, k) {
        var good = ans[k] === q.correct;
        Store.record(m.id, q.ex.id, good);
        if (good) {
          ok++;
          rightList.push({ q: q, a: ans[k] });
        } else wrongList.push({ q: q, a: ans[k] });
      });
      function reviewItem(w, good) {
        var right = w.q.options[w.q.correct];
        var text = w.q.ex.t === "cloze" ? w.q.q.replace("___", "_____") : w.q.q;
        return (
          "<li><p>" + esc(text) + "</p>" +
          (good
            ? '<span class="rv-good">Twoja: ' + esc(right) + "</span>"
            : (w.a >= 0 ? '<span class="rv-bad">Twoja: ' + esc(w.q.options[w.a]) + "</span>" : '<span class="rv-bad">Bez odpowiedzi</span>') +
              '<span class="rv-good">Poprawna: ' + esc(right) + "</span>") +
          W.explain(w.q.ex, { notes: w.q.notes, correctText: right, wrongPicks: !good && w.a >= 0 ? [w.q.options[w.a]] : [] }) +
          "</li>"
        );
      }
      var pct = ok / qs.length;
      var pass = pct > m.passRatio;
      hist.push({ date: W.today(), pct: pct, secs: secs });
      if (hist.length > 30) hist.shift();
      if (pass) Store.unlock("exam");
      if (pct >= 0.9) Store.unlock("exam90");
      var xp = ok * 2 + (pass ? 15 : 0);
      Store.addXP(xp);
      W.resultScreen(root, {
        fail: !pass,
        title: Math.round(pct * 100) + "%",
        sub: ok + " z " + qs.length + " punktów · " + W.fmtTime(secs),
        confetti: pass,
        stats: [
          { label: "Wynik", value: pass ? "Zaliczone" : "Niezaliczone", tone: pass ? "good" : "bad" },
          { label: "Próg", value: "> " + Math.round(m.passRatio * 100) + "%" },
          { label: "XP", value: "+" + xp, tone: "gold" }
        ],
        extra:
          '<div class="stamp ' + (pass ? "pass" : "fail") + '">' + (pass ? "ZALICZONE" : "POPRAW") + "</div>" +
          (wrongList.length
            ? '<h3 class="r-h">Do przejrzenia (' + wrongList.length + ")</h3><ol class=\"review\">" +
              wrongList.map(function (w) { return reviewItem(w, false); }).join("") +
              "</ol>"
            : "") +
          (rightList.length
            ? '<details class="r-more"><summary>Dobrze (' + rightList.length + '): zobacz, dlaczego</summary><ol class="review">' +
              rightList.map(function (w) { return reviewItem(w, true); }).join("") +
              "</ol></details>"
            : ""),
        actions: [
          { label: "Nowy test", fn: function () { W.go("exam", p, { replace: true }); } },
          { label: "Wróć do modułu", fn: function () { W.back(); } }
        ]
      });
    }

    return function () {
      clearInterval(timer);
    };
  };
})();

</script>
    <script>
/* Ekrany: start, moduł, ścieżka, lekcja, poprawki, notatki, profil. */
(function () {
  "use strict";
  var W = window.Wykuj;
  var esc = W.esc;
  var Store = W.Store;
  var top = W.top;

  function pct(x) {
    return Math.round(x * 100) + "%";
  }

  function ring(value, max, label) {
    var r = 26, c = 2 * Math.PI * r, f = Math.min(1, value / max);
    return (
      '<div class="ring" role="img" aria-label="' + esc(label) + '"><svg viewBox="0 0 64 64">' +
      '<circle cx="32" cy="32" r="' + r + '" class="ring-bg"/>' +
      '<circle cx="32" cy="32" r="' + r + '" class="ring-fg" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - f)).toFixed(1) + '"/>' +
      '</svg><span><b>' + value + "</b>/" + max + "</span></div>"
    );
  }

  function cloudBadge() {
    var s = Store.cloud;
    if (s === "off") return "";
    var t = { syncing: "Zapisuję…", ok: "Postępy w chmurze", local: "Tylko na tym urządzeniu" }[s];
    return '<span class="cloud ' + s + '" title="' + t + '">' + W.icon("cloud") + "</span>";
  }

  /* ================= Start ================= */

  W.screens.home = function (root) {
    var st = Store.state;
    var rk = W.rank(st.xp);
    var streak = Store.streakAlive();
    var today = Store.todayXP();
    var courses = W.courses();
    var focus = W.lastModule();
    var nu = W.nextUnit(focus);
    var dueN = Store.dueCards(focus).length + Math.min(8, Store.newCards(focus).length);
    var misN = W.mistakes(focus).length;
    var filter = st.settings.homeCourse || "all";
    if (filter !== "all" && !courses.some(function (c) { return c.course.id === filter; })) filter = "all";
    var th = "theme-" + focus.course.theme;
    var tag = esc(focus.course.short) + " · Wykład " + focus.number;

    function coursePct(c) {
      var sum = 0;
      c.modules.forEach(function (m) { sum += W.progress(m).pct; });
      return sum / c.modules.length;
    }

    root.innerHTML =
      '<header class="apphead">' +
      '<div class="brand"><span class="brand-mark">' + W.icon("pencil") + '</span><span class="display">Wykuj</span></div>' +
      '<div class="hstats">' + cloudBadge() +
      '<span class="hs streak ' + (streak ? "on" : "") + '" title="Seria dni">' + W.icon("flame") + "<b>" + streak + "</b></span>" +
      '<span class="hs xp" title="Łącznie XP">' + W.icon("gem") + "<b>" + st.xp + "</b></span>" +
      '<button class="icon-btn" data-go="profile" aria-label="Profil">' + W.icon("user") + "</button></div></header>" +
      '<div class="page home">' +
      '<section class="today">' +
      ring(today, st.goal, "Dzisiejsze XP") +
      '<div class="today-txt"><p class="eyebrow">Dzisiaj</p><h1 class="display">' +
      (today >= st.goal ? "Cel dnia zaliczony." : streak ? "Seria trwa: " + W.days(streak) + "." : "Zacznij serię.") +
      "</h1><p>" +
      (today >= st.goal ? "Każda kolejna powtórka to bonus dla pamięci." : "Brakuje " + (st.goal - today) + " XP do dziennego celu.") +
      '</p><div class="rankline"><span>' + esc(rk.name) + " · poz. " + rk.level + '</span><div class="rbar"><i style="width:' + pct(rk.pct) + '"></i></div>' +
      (rk.nextName ? "<span>" + esc(rk.nextName) + "</span>" : "") + "</div></div></section>" +
      '<div class="focus ' + th + '">' +
      '<p class="focus-k">' + W.icon(focus.course.icon) + "Ostatnio: " + esc(focus.course.name) + "</p>" +
      (nu >= 0
        ? '<button class="cta" data-lesson="' + focus.id + ":" + nu + '"><span class="cta-ic">' + W.icon(focus.units[nu].icon) + "</span>" +
          '<span class="cta-t"><small>' + tag + " · lekcja " + (nu + 1) + "/" + focus.units.length + "</small><b>" +
          esc(focus.units[nu].title) + "</b><span>" + esc(focus.units[nu].sub) + '</span></span><span class="cta-go">Dalej</span></button>'
        : '<button class="cta done" data-go="exam" data-mod="' + focus.id + '"><span class="cta-ic">' + W.icon("crown") + '</span><span class="cta-t"><small>' + tag +
          " · ścieżka ukończona</small><b>Sprawdź się na egzaminie próbnym</b><span>20 pytań zamkniętych</span></span><span class=\"cta-go\">Start</span></button>") +
      '<div class="todo">' +
      '<button class="todo-i" data-go="cards" data-mod="' + focus.id + '">' + W.icon("cards") + "<span><b>" + dueN + "</b> fiszek na dziś</span></button>" +
      '<button class="todo-i" data-go="review" data-mod="' + focus.id + '"' + (misN ? "" : " disabled") + ">" + W.icon("redo") + "<span><b>" + misN + "</b> " + (misN === 1 ? "błąd" : "błędów") + " do poprawki</span></button>" +
      "</div></div>" +
      '<section class="subjects"><div class="subj-head"><h2 class="display">Przedmioty</h2><span>' + courses.length + "</span></div>" +
      '<div class="filter" role="group" aria-label="Filtr przedmiotów">' +
      '<button data-filter="all" class="' + (filter === "all" ? "on" : "") + '">Wszystkie</button>' +
      courses
        .map(function (c) {
          return '<button data-filter="' + c.course.id + '" class="theme-' + c.course.theme + (filter === c.course.id ? " on" : "") + '"><i class="fdot"></i>' + esc(c.course.short) + "</button>";
        })
        .join("") +
      "</div>" +
      courses
        .map(function (c) {
          var n = c.modules.length;
          return (
            '<section class="course theme-' + c.course.theme + '" data-course="' + c.course.id + '"' + (filter !== "all" && filter !== c.course.id ? " hidden" : "") + ">" +
            '<div class="course-h"><span class="course-ic">' + W.icon(c.course.icon) + "</span><div><h3>" + esc(c.course.name) + "</h3><small>" +
            n + (n === 1 ? " wykład" : n < 5 ? " wykłady" : " wykładów") + " · " + pct(coursePct(c)) + " opanowane</small></div>" +
            (W.guide(c.course.id) ? '<button class="guide-btn" data-guide="' + c.course.id + '">' + W.icon("target") + "Jak zdać</button>" : "") + "</div>" +
            '<div class="mods">' +
            c.modules
              .map(function (m) {
                var pr = W.progress(m);
                return (
                  '<button class="modcard" data-go="module" data-mod="' + m.id + '"><span class="mc-num">' + m.number + "</span>" +
                  '<span class="mc-body"><small>Wykład ' + m.number + "</small><b>" + esc(m.title) + "</b>" +
                  '<span class="mc-bar"><i style="width:' + pct(pr.pct) + '"></i></span>' +
                  '<span class="mc-meta">' + pct(pr.pct) + " opanowane · " + pr.stars + "/" + pr.maxStars + " gwiazdek</span></span></button>"
                );
              })
              .join("") +
            '<div class="modcard ghost"><span class="mc-num">' + (n + 1) + '</span><span class="mc-body"><small>Wykład ' + (n + 1) +
            "</small><b>Kolejny wykład</b><span class=\"mc-meta\">Pojawi się tu, gdy dodasz materiały z następnych zajęć.</span></span></div>" +
            "</div></section>"
          );
        })
        .join("") +
      "</section></div>";

    root.addEventListener("click", function (e) {
      var f = e.target.closest("[data-filter]");
      if (f) {
        var id = f.dataset.filter;
        st.settings.homeCourse = id;
        Store.save();
        root.querySelectorAll("[data-filter]").forEach(function (b) { b.classList.toggle("on", b === f); });
        root.querySelectorAll(".course[data-course]").forEach(function (s) { s.hidden = id !== "all" && s.dataset.course !== id; });
        W.sound("tap");
        return;
      }
      var gb = e.target.closest("[data-guide]");
      if (gb) return W.go("guide", { course: gb.dataset.guide });
      var l = e.target.closest("[data-lesson]");
      if (l) {
        var pr = l.dataset.lesson.split(":");
        return W.go("lesson", { mod: pr[0], unit: +pr[1] });
      }
      var g = e.target.closest("[data-go]");
      if (g && !g.disabled) W.go(g.dataset.go, { mod: g.dataset.mod });
    });
  };

  /* ================= Moduł ================= */

  W.screens.module = function (root, p) {
    var m = W.byId[p.mod];
    var pr = W.progress(m);
    var ms = Store.mod(m.id);
    var dueN = Store.dueCards(m).length;
    var newN = Store.newCards(m).length;
    var misN = W.mistakes(m).length;
    var lastExam = ms.exams.length ? ms.exams[ms.exams.length - 1] : null;
    var nu = W.nextUnit(m);
    if (Store.state.lastMod !== m.id) {
      Store.state.lastMod = m.id;
      Store.save();
    }

    /* Plan nauki: cztery kroki w kolejności, w jakiej najłatwiej się uczyć. */
    function plan() {
      var doneUnits = m.units.filter(function (u) { return W.unitDone(m, u.id); }).length;
      var passed = ms.exams.some(function (h) { return h.pct > m.passRatio; });
      var steps = [
        { go: "notes", t: "Przeczytaj", d: m.minimum ? "minimum i schematy w notatkach" : "notatki z wykładu", done: !!ms.read },
        { go: "path", t: "Przejdź ścieżkę", d: doneUnits + " z " + m.units.length + " lekcji", done: nu < 0 },
        { go: "cards", t: "Utrwal fiszkami", d: pr.learned + " z " + pr.total + " opanowanych", done: pr.learned >= Math.ceil(pr.total * 0.8) },
        { go: "exam", t: "Sprawdź się", d: passed ? "egzamin próbny zdany" : "egzamin próbny", done: passed }
      ];
      var next = steps.filter(function (x) { return !x.done; })[0];
      return (
        '<section class="plan" aria-label="Plan nauki"><h2 class="sec-h">Jak się tego nauczyć <small>' + steps.filter(function (x) { return x.done; }).length + "/4</small></h2><ol>" +
        steps.map(function (x, i) {
          return (
            '<li class="' + (x.done ? "done" : x === next ? "next" : "") + '"><button data-go="' + x.go + '"><span class="pl-n">' + (x.done ? W.icon("check") : i + 1) + "</span>" +
            "<b>" + esc(x.t) + "</b><small>" + esc(x.d) + "</small></button></li>"
          );
        }).join("") +
        "</ol></section>"
      );
    }

    var modes = [
      { go: "path", ic: "path", t: "Ścieżka", d: "Lekcje krok po kroku, serca i gwiazdki", meta: nu >= 0 ? "Lekcja " + (nu + 1) + " z " + m.units.length : "Ukończona", hero: true },
      { go: "cards", ic: "cards", t: "Fiszki", d: "Powtórki w odstępach", meta: dueN ? dueN + " do powtórki" : newN ? newN + " nowych" : "Na dziś gotowe", badge: dueN },
      { go: "kahoot", ic: "bolt", t: "Quiz na czas", d: "12 pytań, liczy się refleks", meta: ms.best.kahoot ? "Rekord " + ms.best.kahoot + " pkt" : "Bez rekordu" },
      { go: "match", ic: "pairs", t: "Pary", d: "Pojęcie do znaczenia, na czas", meta: ms.best.match ? "Rekord " + ms.best.match.toFixed(1) + " s" : "Bez rekordu" },
      { go: "sort", ic: "swipe", t: "Sortownia", d: m.sortDecks[0].title + " i inne talie", meta: m.sortDecks.length + " talie" },
      { go: "exam", ic: "exam", t: "Egzamin próbny", d: "20 pytań zamkniętych, próg " + Math.round(m.passRatio * 100) + "%", meta: lastExam ? "Ostatnio " + pct(lastExam.pct) : "Nie podchodziłeś" },
      { go: "review", ic: "redo", t: "Do poprawki", d: "Pytania, na których się potknąłeś", meta: misN ? misN + " pytań" : "Czysto", badge: misN, off: !misN },
      { go: "notes", ic: "book", t: "Notatki", d: "Cały wykład, tabela i ściąga", meta: m.notes.length + " sekcji" }
    ];

    root.innerHTML =
      top(m.course.name, "Wykład " + m.number) +
      '<div class="page">' +
      '<section class="mhero"><p class="eyebrow">' + esc(m.course.short) + " · " + esc(m.term) + "</p>" +
      '<h1 class="display">' + esc(m.title) + "</h1>" +
      (m.official || m.lecturer ? "<p class='lect'>" + esc([m.official ? "Wykład 1: " + m.official : "", m.lecturer || ""].filter(Boolean).join(" · ")).replace("Wykład 1", "Wykład " + m.number) + "</p>" : "") +
      '<div class="mprog"><div class="mprog-bar"><i style="width:' + pct(pr.pct) + '"></i></div><b>' + pct(pr.pct) + "</b></div>" +
      '<div class="mfacts"><span>' + W.icon("star") + pr.stars + "/" + pr.maxStars + " gwiazdek</span><span>" + W.icon("cards") + pr.learned + "/" + pr.total + " fiszek opanowanych</span>" +
      (m.passing ? "<span>" + W.icon("target") + esc(m.passing) + "</span>" : "") + "</div></section>" +
      plan() +
      (W.guide(m.course.id)
        ? '<button class="guide-card" data-guide="' + m.course.id + '"><span class="gc-ic">' + W.icon("target") + "</span><span><b>" + esc(W.guide(m.course.id).title) +
          "</b><small>Zasady egzaminu, kartki próbne z rozwiązaniami, pytania teoretyczne</small></span></button>"
        : "") +
      '<div class="modes">' +
      modes
        .map(function (x) {
          return (
            '<button class="mode ' + (x.hero ? "hero " : "") + (x.off ? "off" : "") + '" data-go="' + x.go + '">' +
            '<span class="mode-ic">' + W.icon(x.ic) + (x.badge ? '<i class="badge">' + x.badge + "</i>" : "") + "</span>" +
            "<b>" + esc(x.t) + "</b><span class='mode-d'>" + esc(x.d) + "</span><span class='mode-m'>" + esc(x.meta) + "</span></button>"
          );
        })
        .join("") +
      "</div></div>";

    var gc = root.querySelector(".guide-card");
    if (gc) gc.onclick = function () { W.go("guide", { course: m.course.id }); };
    root.querySelector(".page").addEventListener("click", function (e) {
      var b = e.target.closest(".modes [data-go], .plan [data-go]");
      if (b) W.go(b.dataset.go, { mod: m.id });
    });
  };

  /* ================= Ścieżka ================= */

  W.screens.path = function (root, p) {
    var m = W.byId[p.mod];
    var ms = Store.mod(m.id);
    var nu = W.nextUnit(m);
    var sel = p.sel != null ? p.sel : nu >= 0 ? nu : null;
    var offsets = [0, 34, 52, 34, 0, -34, -52, -34];

    function draw() {
      root.innerHTML =
        top("Ścieżka", "Wykład " + m.number + ": " + m.title) +
        '<div class="page path-page"><ol class="path">' +
        m.units
          .map(function (u, i) {
            var rec = ms.path[u.id];
            var open = W.unitOpen(m, i);
            var done = rec && rec.stars > 0;
            var state = done ? "done" : open ? "open" : "locked";
            if (i === nu) state += " current";
            var off = offsets[i % offsets.length];
            return (
              '<li class="node ' + state + (u.boss ? " boss" : "") + '" style="--x:' + off + 'px">' +
              (i === nu && sel !== i ? '<span class="start-tag">Start</span>' : "") +
              '<button class="nbtn" data-i="' + i + '" aria-label="' + esc(u.title) + '"' + (open ? "" : " aria-disabled=\"true\"") + ">" +
              W.icon(open ? u.icon : "lock") + "</button>" +
              (done ? W.starRow(rec.stars) : '<span class="stars-ph"></span>') +
              '<span class="nlabel">' + esc(u.title) + "</span>" +
              (sel === i
                ? '<div class="bubble"><b>' + esc(u.title) + "</b><span>" + esc(u.sub) + "</span>" +
                  (open
                    ? '<button class="btn primary" data-start="' + i + '">' + (done ? "Powtórz lekcję" : u.boss ? "Zmierz się z testem" : "Zacznij lekcję") + "</button>" +
                      (done && W.teachable(m, u) ? '<button class="btn ghost" data-teach="' + i + '">Przypomnij teorię</button>' : "") +
                      (done ? '<small>Najlepiej: ' + pct(rec.best) + "</small>" : "")
                    : "<small>Ukończ poprzednią lekcję, żeby odblokować. Albo włącz swobodny dostęp w profilu.</small>") +
                  "</div>"
                : "") +
              "</li>"
            );
          })
          .join("") +
        "</ol></div>";
      var cur = root.querySelector(".node.current, .bubble");
      if (cur && !p._scrolled) {
        p._scrolled = true;
        cur.scrollIntoView({ block: "center" });
      }
    }

    root.addEventListener("click", function (e) {
      var s = e.target.closest("[data-start]");
      if (s) return W.go("lesson", { mod: m.id, unit: +s.dataset.start });
      var t = e.target.closest("[data-teach]");
      if (t) return W.go("lesson", { mod: m.id, unit: +t.dataset.teach, teach: true });
      var b = e.target.closest(".nbtn");
      if (b) {
        var i = +b.dataset.i;
        sel = sel === i ? null : i;
        p.sel = sel;
        W.sound("tap");
        draw();
      }
    });
    draw();
  };

  /* ================= Lekcja ================= */

  /* Czy lekcja ma czego „nauczyć” przed ćwiczeniami (pojęcia albo własne wprowadzenie). */
  W.teachable = function (m, u) {
    if (u.boss) return false;
    return !!u.teach || !!u.table || unitSets(m, u).length > 0 || m.concepts.some(function (c) { return c.u === u.id && W.allowed(c); });
  };

  /* Zestawy z pytań „który to…” w danej lekcji, razem z opisem każdej pozycji. */
  function unitSets(m, u) {
    var seen = {}, out = [];
    m.exercises.forEach(function (e) {
      if (e.u !== u.id || e.t !== "which" || !W.allowed(e)) return;
      var k = e.set || "_zasady";
      if (seen[k]) return;
      seen[k] = true;
      var set = W.whichList(e, m);
      if (set && set.why) out.push({ label: e.set ? set.label : "Dziesięć zasad", items: set.items, why: set.why, numbered: set.numbered });
    });
    return out;
  }

  function tableHtml(t) {
    return (
      '<div class="tscroll"><table><thead><tr>' + t.head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      t.rows.map(function (r) { return "<tr>" + r.map(function (c, i) { return i ? "<td>" + esc(c) + "</td>" : "<th>" + esc(c) + "</th>"; }).join("") + "</tr>"; }).join("") +
      "</tbody></table></div>"
    );
  }

  /* Mini-lekcja przed ćwiczeniami: najpierw krótko teoria, potem pytania. */
  function teach(root, m, u, onGo) {
    var cs = m.concepts.filter(function (c) { return c.u === u.id && W.allowed(c); });
    var figs = [];
    cs.forEach(function (c) { if (c.fig && figs.indexOf(c.fig) < 0) figs.push(c.fig); });
    root.innerHTML =
      top("Najpierw krótko", u.title) +
      '<div class="page teach">' +
      '<p class="eyebrow">Zanim zaczniesz ćwiczenia</p>' +
      '<h1 class="display">' + esc(u.title) + "</h1>" +
      '<p class="teach-lead">Przeczytaj w minutę. Pytania w lekcji sprawdzają dokładnie to, co jest niżej, a po każdej odpowiedzi zobaczysz, dlaczego jest dobra albo zła.</p>' +
      (u.teach ? '<div class="teach-intro">' + u.teach + "</div>" : "") +
      (u.table && m.table ? '<div class="teach-intro note"><h2 class="sec-h">' + esc(m.table.title) + "</h2>" + tableHtml(m.table) + "</div>" : "") +
      figs.slice(0, 1).map(function (k) { return W.figHtml(m, k); }).join("") +
      '<ol class="teach-list">' +
      cs.map(function (c) {
        return (
          '<li class="tc"><div class="tc-h"><b class="display">' + esc(c.term) + "</b>" + W.srcBadge(c.s) + "</div>" +
          (c.plain ? '<p class="tc-plain">' + esc(c.plain) + "</p>" : "") +
          '<p class="tc-def"><span>' + (c.plain ? "Na teście" : "Definicja") + "</span>" + esc(c.def) + "</p></li>"
        );
      }).join("") +
      "</ol>" +
      (cs.length < 2
        ? unitSets(m, u).map(function (set) {
            return (
              '<section class="cheat"><h2 class="sec-h">Ściąga <small>' + esc(set.label) + "</small></h2><dl>" +
              set.items.map(function (it, i) {
                return "<div><dt>" + (set.numbered ? i + 1 + ". " : "") + esc(it) + "</dt><dd>" + esc(set.why[i].charAt(0).toUpperCase() + set.why[i].slice(1)) + "</dd></div>";
              }).join("") +
              "</dl></section>"
            );
          }).join("")
        : "") +
      '<div class="teach-go"><button class="btn primary big" data-a="go">Zaczynam ćwiczenia</button></div></div>';
    root.querySelector('[data-a="go"]').onclick = onGo;
    W.setKeys(function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        onGo();
      }
    });
  }

  W.screens.lesson = function (root, p) {
    var m = W.byId[p.mod];
    var u = m.units[p.unit];
    if (!p.go && W.teachable(m, u) && (p.teach || !W.unitDone(m, u.id))) {
      return teach(root, m, u, function () {
        W.go("lesson", { mod: p.mod, unit: p.unit, go: true }, { replace: true });
      });
    }
    var items = W.buildLesson(m, u);
    W.runSession(root, {
      mod: m,
      unit: u,
      items: items,
      hearts: 3,
      onExit: function () {
        Store.save();
        W.back();
      },
      onFinish: function (r) {
        var ms = Store.mod(m.id);
        if (!r.completed) {
          Store.save();
          return W.resultScreen(root, {
            fail: true,
            title: "Zabrakło serc",
            sub: "Błędy z tej lekcji trafiły do „Do poprawki”. Spróbuj jeszcze raz, pytania się przetasują.",
            stats: [
              { label: "Dobrze za 1. razem", value: r.firstTry + "/" + r.total },
              { label: "Czas", value: W.fmtTime(r.secs) }
            ],
            actions: [
              { label: "Spróbuj ponownie", fn: function () { W.go("lesson", p, { replace: true }); } },
              { label: "Wróć do ścieżki", fn: function () { W.back(); } }
            ]
          });
        }
        var stars = W.starsFor(r.acc);
        var prev = ms.path[u.id] || { stars: 0, best: 0, runs: 0 };
        var bonus = 5 + (r.acc === 1 ? 5 : 0) + (u.boss ? 10 : 0);
        ms.path[u.id] = { stars: Math.max(prev.stars, stars), best: Math.max(prev.best, r.acc), runs: (prev.runs || 0) + 1 };
        Store.unlock("first");
        if (r.acc === 1) Store.unlock("perfect");
        if (W.nextUnit(m) < 0) Store.unlock("path");
        if (m.units.every(function (x) { return ms.path[x.id] && ms.path[x.id].stars === 3; })) Store.unlock("stars");
        Store.addXP(bonus);
        var nextI = p.unit + 1 < m.units.length ? p.unit + 1 : null;
        var actions = [];
        if (nextI != null && W.unitOpen(m, nextI)) {
          actions.push({ label: "Następna lekcja", fn: function () { W.go("lesson", { mod: m.id, unit: nextI }, { replace: true }); } });
        }
        actions.push({ label: "Wróć do ścieżki", fn: function () { W.back(); } });
        actions.push({ label: "Powtórz tę lekcję", fn: function () { W.go("lesson", p, { replace: true }); } });
        W.resultScreen(root, {
          stars: stars,
          title: r.acc === 1 ? "Bezbłędnie!" : stars === 3 ? "Świetna robota!" : stars === 2 ? "Dobrze idzie!" : "Lekcja zaliczona",
          sub: u.title,
          confetti: true,
          stats: [
            { label: "Dobrze za 1. razem", value: pct(r.acc), tone: "good" },
            { label: "Najdłuższa seria", value: String(r.bestCombo) },
            { label: "Czas", value: W.fmtTime(r.secs) },
            { label: "Bonus XP", value: "+" + bonus, tone: "gold" }
          ],
          actions: actions
        });
      }
    });
  };

  /* ================= Do poprawki ================= */

  W.screens.review = function (root, p) {
    var m = W.byId[p.mod];
    var list = W.mistakes(m);
    if (!list.length) {
      root.innerHTML =
        top("Do poprawki", m.title) +
        '<div class="page"><div class="empty"><div class="empty-ic">' + W.icon("check") + "</div><h2>Nie ma czego poprawiać</h2>" +
        "<p>Gdy pomylisz się w lekcji, quizie albo na egzaminie, pytanie trafi tutaj, aż odpowiesz na nie poprawnie.</p></div></div>";
      return;
    }
    var items = W.shuffle(list).slice(0, 15);
    W.runSession(root, {
      mod: m,
      items: items,
      hearts: null,
      onExit: function () {
        Store.save();
        W.back();
      },
      onFinish: function (r) {
        Store.addXP(5);
        var left = W.mistakes(m).length;
        W.resultScreen(root, {
          title: left ? "Poprawione" : "Wszystko poprawione",
          sub: left ? "Zostało jeszcze " + left + " pytań do poprawki." : "Lista błędów jest pusta.",
          confetti: !left,
          stats: [
            { label: "Dobrze za 1. razem", value: r.firstTry + "/" + r.total, tone: "good" },
            { label: "Czas", value: W.fmtTime(r.secs) }
          ],
          actions: left
            ? [
                { label: "Następna porcja", fn: function () { W.go("review", p, { replace: true }); } },
                { label: "Wróć do modułu", fn: function () { W.back(); } }
              ]
            : [{ label: "Wróć do modułu", fn: function () { W.back(); } }]
        });
      }
    });
  };

  /* ================= Notatki ================= */

  W.screens.notes = function (root, p) {
    var m = W.byId[p.mod];
    var st = Store.state.settings;
    Store.unlock("notes");
    Store.mod(m.id).read = true;
    Store.save();

    var SRC = { S: "lg-s", U: "lg-u", K: "lg-k", D: "lg-d" };
    function withFigs(n) {
      var figs = W.figsFor(m, n.id);
      if (!figs) return n.html;
      var cut = n.html.indexOf("<div class='plain'>") === 0 ? n.html.indexOf("</div>") + 6 : 0;
      return n.html.slice(0, cut) + figs + n.html.slice(cut);
    }
    var story = m.story;
    var toc = [];
    if (m.minimum) toc.push(["min", "min"]);
    if (m.deep) toc.push(["deep", "?"]);
    m.notes.forEach(function (n) { toc.push([n.id, n.n ? n.n : "·"]); });
    if (m.table) toc.push(["tab", "tab"]);
    if (story) toc.push(["story", "★"]);
    toc.push(["gloss", "A–Z"]);

    root.innerHTML =
      top("Notatki", "Wykład " + m.number + ": " + m.title) +
      '<div class="page notes ' + (st.extras ? "" : "no-extra") + '">' +
      '<div class="legend">' +
      Object.keys(m.sourceNames)
        .map(function (k) { return '<span><i class="lg ' + SRC[k] + '"></i>' + esc(m.sourceNames[k]) + "</span>"; })
        .join("") +
      '<label class="switch"><input type="checkbox" id="notes-extra" ' + (st.extras ? "checked" : "") + '/><span></span>Pokaż ★</label></div>' +
      '<nav class="toc">' +
      toc.map(function (t) { return '<a href="#n-' + t[0] + '" data-jump="' + t[0] + '">' + t[1] + "</a>"; }).join("") +
      "</nav>" +
      (m.minimum
        ? '<section class="note minimum" id="n-min"><h2>Minimum na zaliczenie</h2><p class="min-k">Jeśli masz mało czasu, opanuj te ' + m.minimum.length +
          " rzeczy. Reszta notatek je rozwija.</p><ol>" +
          m.minimum.map(function (x) { return "<li><b>" + esc(x[0]) + "</b><span>" + x[1] + "</span></li>"; }).join("") +
          "</ol></section>"
        : "") +
      (m.deep
        ? '<section class="note deep" id="n-deep"><h2>Do przemyślenia</h2><p class="min-k">Wątki z wykładu, które łatwo zgłębić. Dobre na powtórkę i do rozmowy na ustnym. Rozwiń, żeby przeczytać.</p>' +
          m.deep
            .map(function (d) {
              return '<details class="dq"><summary>' + esc(d.q) + "</summary><p>" + esc(d.a) + "</p>" + (d.link ? '<p class="dq-link">' + esc(d.link) + "</p>" : "") + "</details>";
            })
            .join("") +
          "</section>"
        : "") +
      m.notes
        .map(function (n) {
          return (
            '<section class="note" id="n-' + n.id + '"><h2>' + (n.n ? '<span class="nn">' + n.n + "</span>" : "") + esc(n.title) + "</h2>" + withFigs(n) + "</section>"
          );
        })
        .join("") +
      (m.table
        ? '<section class="note" id="n-tab"><h2>' + esc(m.table.title) + '</h2><div class="tscroll"><table><thead><tr>' +
          m.table.head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") +
          "</tr></thead><tbody>" +
          m.table.rows.map(function (r) { return "<tr>" + r.map(function (c, i) { return i ? "<td>" + esc(c) + "</td>" : "<th>" + esc(c) + "</th>"; }).join("") + "</tr>"; }).join("") +
          "</tbody></table></div></section>"
        : "") +
      (story
        ? '<section class="note ' + (story.extra ? "extra-sec" : "") + '" id="n-story"><h2>' + esc(story.title) + '</h2><p class="story-k">' + esc(story.intro) + "</p>" +
          (story.ordered
            ? '<ol class="story">' + story.items.map(function (x) { return "<li><b>" + esc(x[0]) + "</b><span>" + esc(x[1]) + "</span></li>"; }).join("") + "</ol>"
            : '<dl class="xlate">' + story.items.map(function (x) { return "<div><dt>" + esc(x[0]) + "</dt><dd>" + esc(x[1]) + "</dd></div>"; }).join("") + "</dl>") +
          "</section>"
        : "") +
      '<section class="note" id="n-gloss"><h2>Słowniczek</h2><input id="gloss-q" class="search" type="search" placeholder="Szukaj pojęcia…" autocomplete="off"/><dl class="gloss">' +
      m.concepts
        .slice()
        .sort(function (a, b) { return a.term.localeCompare(b.term, "pl"); })
        .map(function (c) {
          return (
            '<div class="gi ' + (c.s === "D" ? "extra" : "") + '" data-k="' + esc(W.norm(c.term + " " + c.def + " " + (c.plain || ""))) + '"><dt>' + esc(c.term) + W.srcBadge(c.s) + "</dt>" +
            (c.plain ? '<dd class="gi-plain">' + esc(c.plain) + "</dd>" : "") + "<dd>" + esc(c.def) + "</dd></div>"
          );
        })
        .join("") +
      "</dl></section></div>";

    root.querySelector("#notes-extra").addEventListener("change", function (e) {
      st.extras = e.target.checked;
      Store.save();
      root.querySelector(".notes").classList.toggle("no-extra", !st.extras);
    });
    root.querySelector(".toc").addEventListener("click", function (e) {
      var a = e.target.closest("[data-jump]");
      if (!a) return;
      e.preventDefault();
      var t = root.querySelector("#n-" + a.dataset.jump);
      if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    root.querySelector("#gloss-q").addEventListener("input", function (e) {
      var q = W.norm(e.target.value);
      root.querySelectorAll(".gi").forEach(function (g) {
        g.hidden = q && g.dataset.k.indexOf(q) < 0;
      });
    });
  };

  /* ================= Profil ================= */

  W.screens.profile = function (root) {
    var st = Store.state;
    var rk = W.rank(st.xp);
    var acc = st.stats.answers ? st.stats.correct / st.stats.answers : 0;

    function toggle(id, label, desc, on) {
      return (
        '<label class="set"><span><b>' + esc(label) + "</b><small>" + esc(desc) + '</small></span><span class="switch"><input type="checkbox" id="set-' + id + '" data-set="' + id + '" ' +
        (on ? "checked" : "") + "/><span></span></span></label>"
      );
    }

    root.innerHTML =
      top("Profil", "Postępy i ustawienia") +
      '<div class="page profile">' +
      '<section class="rankcard"><span class="rk-lv display">' + rk.level + '</span><div><p class="eyebrow">Ranga</p><h1 class="display">' + esc(rk.name) + "</h1>" +
      '<div class="rbar"><i style="width:' + pct(rk.pct) + '"></i></div><small>' +
      (rk.to ? st.xp + " / " + rk.to + " XP do rangi „" + esc(rk.nextName) + "”" : st.xp + " XP · najwyższa ranga") + "</small></div></section>" +
      '<div class="pstats">' +
      [
        ["XP łącznie", st.xp],
        ["Seria teraz", W.days(Store.streakAlive())],
        ["Najdłuższa seria", W.days(st.streak.best || 0)],
        ["Odpowiedzi", st.stats.answers],
        ["Trafność", pct(acc)],
        ["Powtórzone fiszki", st.stats.cards || 0]
      ]
        .map(function (s) { return '<div class="ps"><span>' + s[0] + "</span><b>" + s[1] + "</b></div>"; })
        .join("") +
      "</div>" +
      '<h2 class="sec-h">Odznaki <small>' + Object.keys(st.ach).length + "/" + W.ACH.length + "</small></h2>" +
      '<div class="achs">' +
      W.ACH.map(function (a) {
        var got = st.ach[a.id];
        return '<div class="ach ' + (got ? "got" : "") + '"><span class="ach-ic">' + W.icon(got ? "star" : "lock") + "</span><b>" + esc(a.name) + "</b><small>" + esc(a.desc) + "</small></div>";
      }).join("") +
      "</div>" +
      '<h2 class="sec-h">Ustawienia</h2><div class="sets">' +
      '<div class="set"><span><b>Dzienny cel</b><small>Ile XP chcesz zdobywać każdego dnia</small></span><span class="seg">' +
      [20, 50, 100, 150].map(function (g) { return '<button data-goal="' + g + '" class="' + (st.goal === g ? "on" : "") + '">' + g + "</button>"; }).join("") +
      "</span></div>" +
      toggle("sound", "Dźwięki", "Krótkie sygnały przy odpowiedziach", st.settings.sound) +
      toggle("extras", "Materiał spoza wykładu (★)", "Dopowiedzenia z notatek w lekcjach, fiszkach i quizach. Egzamin próbny zawsze je pomija.", st.settings.extras) +
      toggle("free", "Swobodny dostęp do ścieżki", "Wszystkie lekcje otwarte od razu, np. tuż przed egzaminem", st.settings.free) +
      "</div>" +
      '<p class="cloudline">' + W.icon("cloud") +
      ({ off: "Postępy zapisują się w tej przeglądarce.", syncing: "Synchronizuję postępy…", ok: "Postępy zapisują się na Twoim koncie i działają na każdym urządzeniu.", local: "Brak dostępu do zapisu w chmurze. Postępy zapisują się w tej przeglądarce." }[Store.cloud]) +
      "</p>" +
      '<div class="danger"><button class="btn danger-ghost" data-a="reset">Wyzeruj postępy</button>' +
      '<div class="confirm" hidden><p>Na pewno? Znikną XP, gwiazdki, fiszki i odznaki. Tego nie da się cofnąć.</p><div class="row"><button class="btn danger" data-a="reset-yes">Tak, wyzeruj</button><button class="btn ghost" data-a="reset-no">Anuluj</button></div></div></div>' +
      "</div>";

    root.addEventListener("change", function (e) {
      var k = e.target.dataset.set;
      if (!k) return;
      st.settings[k] = e.target.checked;
      Store.save();
    });
    root.addEventListener("click", function (e) {
      var g = e.target.closest("[data-goal]");
      if (g) {
        st.goal = +g.dataset.goal;
        Store.save();
        root.querySelectorAll("[data-goal]").forEach(function (b) { b.classList.toggle("on", b === g); });
        return;
      }
      var a = e.target.closest("[data-a]");
      if (!a) return;
      var c = root.querySelector(".confirm");
      if (a.dataset.a === "reset") c.hidden = false;
      else if (a.dataset.a === "reset-no") c.hidden = true;
      else if (a.dataset.a === "reset-yes") {
        Store.reset();
        W.toast("Postępy wyzerowane", "Zaczynasz od nowa");
        W.go("home", {}, { root: true });
      }
    });
  };
})();

</script>
    <script>
/* Przewodnik po zaliczeniu przedmiotu i trener kartek egzaminacyjnych. */
(function () {
  "use strict";
  var W = window.Wykuj;
  var esc = W.esc;
  var Store = W.Store;
  var top = W.top;

  function courseInfo(id) {
    return W.courses().filter(function (c) { return c.course.id === id; })[0];
  }

  /* ================= Jak zdać ================= */

  W.screens.guide = function (root, p) {
    var g = W.guide(p.course);
    var info = courseInfo(p.course);
    var cs = Store.course(p.course);
    var known = g.theory.filter(function (t, i) { return cs.oral[i]; }).length;
    var inApp = g.theory.filter(function (t) { return t.mod; }).length;

    root.innerHTML =
      top(g.title, info.course.name) +
      '<div class="page guide">' +
      '<section class="g-sec"><h2 class="sec-h">Jak wygląda egzamin</h2>' +
      '<ol class="steps">' +
      g.steps.map(function (s) { return "<li><b>" + esc(s[0]) + "</b><span>" + s[1] + "</span></li>"; }).join("") +
      "</ol>" +
      '<ul class="shortcuts">' + g.shortcuts.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ul>" +
      '<p class="g-note">' + esc(g.rulesNote) + "</p></section>" +

      '<section class="g-sec"><h2 class="sec-h">Kartki próbne <small>z rozwiązaniami</small></h2>' +
      '<p class="g-lead">Takie zadania losujesz na teście praktycznym. Rozwiąż na brudno, odsłoń rozwiązanie i oceń się uczciwie. Do części ustnej trzeba co najmniej 4 z 8.</p>' +
      '<div class="sheet-grid">' +
      g.sheets
        .map(function (s, i) {
          var best = cs.sheets[i];
          var fixes = s.tasks.filter(function (t) { return t.fix; }).length;
          return (
            '<button class="sheet-card" data-sheet="' + i + '"><span class="sc-name display">' + esc(s.name) + "</span>" +
            "<span>" + s.tasks.length + " zadań</span>" + (fixes ? '<span class="sc-fix">' + fixes + (fixes === 1 ? " poprawka" : fixes < 5 ? " poprawki" : " poprawek") + "</span>" : "") +
            '<span class="sc-best ' + (best == null ? "" : best >= 4 ? "pass" : "fail") + '">' + (best == null ? "Nie rozwiązana" : "Najlepiej: " + best + "/" + s.tasks.length) + "</span></button>"
          );
        })
        .join("") +
      "</div></section>" +

      '<section class="g-sec"><h2 class="sec-h">Pytania teoretyczne <small>' + known + "/" + g.theory.length + " umiem</small></h2>" +
      '<p class="g-lead">Lista od prowadzącej. ' + inApp + " tematy są już w aplikacji, z gotowym szkieletem odpowiedzi ustnej. Resztę obejmą kolejne wykłady (w nawiasie rozdział konspektu).</p>" +
      '<ol class="theory">' +
      g.theory
        .map(function (t, i) {
          var tick = '<label class="switch th-ok"><input type="checkbox" id="th-' + i + '" data-th="' + i + '"' + (cs.oral[i] ? " checked" : "") + "/><span></span>umiem</label>";
          if (t.oral) {
            return (
              '<li class="th in"><details><summary><span class="th-q">' + esc(t.q) + '</span><span class="th-tag">w aplikacji</span></summary>' +
              '<div class="th-body"><p class="th-k">Szkielet odpowiedzi ustnej</p><p>' + t.oral + "</p>" +
              '<div class="row"><button class="btn ghost" data-mod="' + t.mod + '">Ćwicz w module</button>' + tick + "</div></div></details></li>"
            );
          }
          return (
            '<li class="th"><div class="th-line"><span class="th-q">' + esc(t.q) + '</span><span class="th-tag later">konspekt ' + esc(t.ks) + "</span></div>" + tick + "</li>"
          );
        })
        .join("") +
      "</ol></section></div>";

    root.addEventListener("click", function (e) {
      var s = e.target.closest("[data-sheet]");
      if (s) return W.go("sheet", { course: p.course, sheet: +s.dataset.sheet });
      var m = e.target.closest("[data-mod]");
      if (m) return W.go("module", { mod: m.dataset.mod });
    });
    root.addEventListener("change", function (e) {
      var k = e.target.dataset.th;
      if (k == null) return;
      cs.oral[k] = e.target.checked;
      Store.save();
      root.querySelector(".theory").closest(".g-sec").querySelector(".sec-h small").textContent =
        g.theory.filter(function (t, i) { return cs.oral[i]; }).length + "/" + g.theory.length + " umiem";
    });
  };

  /* ================= Kartka próbna ================= */

  W.screens.sheet = function (root, p) {
    var g = W.guide(p.course);
    var sheet = g.sheets[p.sheet];
    var tasks = sheet.tasks;
    var i = 0, score = 0, revealed = false;

    function render() {
      var t = tasks[i];
      revealed = false;
      root.innerHTML =
        top(sheet.name, "Zadanie " + (i + 1) + " z " + tasks.length, '<span class="clock">' + score + " pkt</span>") +
        '<div class="page sheet">' +
        '<div class="lbar slim"><i style="width:' + Math.round((i / tasks.length) * 100) + '%"></i></div>' +
        '<article class="task"><span class="task-n display">' + (i + 1) + "</span>" +
        '<h2 class="task-q">' + esc(t.q) + "</h2>" +
        '<div class="task-tags"><span class="th-tag">' + esc(t.topic) + '</span><span class="th-tag later">konspekt ' + esc(t.ks) + "</span>" +
        (t.mod ? '<span class="th-tag">jest w aplikacji</span>' : "") + "</div></article>" +
        '<label class="draft-l" for="draft-' + p.sheet + "-" + i + '">Twoja odpowiedź na brudno (nikt jej nie sprawdza, pomaga się zmierzyć)</label>' +
        '<textarea id="draft-' + p.sheet + "-" + i + '" class="draft" rows="3" placeholder="Napisz albo pomyśl odpowiedź…"></textarea>' +
        '<div class="reveal" hidden>' +
        '<div class="answer"><p class="ans-k">Rozwiązanie' + (t.unsure ? ' <span class="src src-d">niepewne</span>' : "") + "</p><p>" + t.a + "</p></div>" +
        (t.steps ? '<div class="how"><p class="ans-k">Jak to robić</p><p>' + esc(t.steps) + "</p></div>" : "") +
        (t.fix ? '<div class="fixnote"><p class="ans-k">Uwaga na krążącą odpowiedź</p><p>' + t.fix + "</p></div>" : "") +
        "</div>" +
        '<div class="sheet-act"><button class="btn primary big" data-a="show">Pokaż rozwiązanie</button></div>' +
        "</div>";
      root.querySelector('[data-a="show"]').onclick = reveal;
    }

    function reveal() {
      if (revealed) return;
      revealed = true;
      W.sound("flip");
      root.querySelector(".reveal").hidden = false;
      root.querySelector(".sheet-act").innerHTML =
        '<p class="self-k">Jak ci poszło?</p><div class="grade two">' +
        '<button class="btn g-again" data-g="0">Miałem źle</button><button class="btn g-good" data-g="1">Miałem dobrze</button></div>';
      root.querySelector(".grade").addEventListener("click", function (e) {
        var b = e.target.closest("[data-g]");
        if (!b) return;
        if (b.dataset.g === "1") {
          score++;
          W.sound("correct", score);
        } else {
          W.sound("wrong");
        }
        i++;
        if (i < tasks.length) render();
        else end();
      });
      root.querySelector(".reveal").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function end() {
      var cs = Store.course(p.course);
      var prev = cs.sheets[p.sheet];
      if (prev == null || score > prev) cs.sheets[p.sheet] = score;
      var xp = score * 2 + 3;
      Store.addXP(xp);
      var pass = score >= 4;
      W.resultScreen(root, {
        fail: !pass,
        title: score + "/" + tasks.length,
        sub: score === tasks.length
          ? "Bezbłędnie. Na egzaminie dostałbyś tylko 1 pytanie teoretyczne."
          : pass ? "Wystarczy, żeby przejść do części ustnej." : "Za mało do części ustnej (potrzeba co najmniej 4).",
        confetti: pass,
        stats: [
          { label: "Wynik", value: pass ? "Dopuszczenie" : "Brak dopuszczenia", tone: pass ? "good" : "bad" },
          { label: "Próg", value: "4 / 8" },
          { label: "XP", value: "+" + xp, tone: "gold" }
        ],
        actions: [
          { label: "Wróć do przewodnika", fn: function () { W.back(); } },
          { label: "Jeszcze raz tę kartkę", fn: function () { W.go("sheet", p, { replace: true }); } }
        ]
      });
    }

    W.setKeys(function (e) {
      if (e.target && e.target.tagName === "TEXTAREA") return;
      if (e.key === "Enter" || e.key === " ") {
        if (!revealed) {
          e.preventDefault();
          reveal();
        }
      }
    });
    render();
  };
})();

</script>
    <script>
/* Router i start aplikacji. Każdy ekran dostaje świeży kontener. */
(function () {
  "use strict";
  var W = window.Wykuj;
  var Store = W.Store;

  var app = document.getElementById("app");
  var stack = [];
  var cleanup = null;
  var keyFn = null;

  W.setKeys = function (fn) {
    keyFn = fn;
  };

  function render(entry) {
    if (cleanup) {
      try {
        cleanup();
      } catch (e) {
        /* ignore */
      }
    }
    cleanup = null;
    keyFn = null;
    var screen = W.screens[entry.name];
    var root = document.createElement("div");
    root.className = "screen s-" + entry.name;
    var mod = entry.params && W.byId[entry.params.mod];
    if (!mod && entry.params && entry.params.course) {
      mod = W.modules.filter(function (m) { return m.course.id === entry.params.course; })[0];
    }
    if (mod) root.classList.add("theme-" + mod.course.theme);
    app.innerHTML = "";
    app.appendChild(root);
    window.scrollTo(0, 0);
    var r = screen(root, entry.params || {});
    if (typeof r === "function") cleanup = r;
  }

  W.go = function (name, params, opts) {
    opts = opts || {};
    var entry = { name: name, params: params || {} };
    if (opts.root) stack = [entry];
    else if (opts.replace && stack.length) stack[stack.length - 1] = entry;
    else stack.push(entry);
    render(entry);
  };

  W.back = function () {
    if (stack.length > 1) stack.pop();
    render(stack[stack.length - 1]);
  };

  W.refresh = function () {
    var cur = stack[stack.length - 1];
    if (cur && /^(home|module|path|profile)$/.test(cur.name)) render(cur);
  };

  document.addEventListener("click", function (e) {
    if (e.target.closest('[data-nav="back"]')) W.back();
  });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (keyFn) keyFn(e);
  });

  Store.on("remote", W.refresh);
  Store.on("cloud", function () {
    var c = document.querySelector(".cloud");
    if (c) W.refresh();
  });

  W.go("home", {}, { root: true });
  setTimeout(Store.initCloud, 0);
})();

</script>
