    }
    var start = performance.now();
    function frame(t) {
      var el = t - start;
      c.clearRect(0, 0, w, h);
      parts.forEach(function (p) {

        p.vx *= 0.99;

        p.y += p.vy;

        c.rotate(p.r);
        c.fillStyle = p.c;

    var notes = g.notes || {};
    var out = "";
    var why = ex.x || (g.correctText && notes[g.correctText] ? W.quote(g.correctText) + " to " + notes[g.correctText] + "." : "");
    if (why) out += '<p class="why"><b>Dlaczego?</b> ' + esc(why) + "</p>";
    (g.wrongPicks || []).forEach(function (p) {
      var n = notes[p];
      if (!n) return;
      /* W pytaniach „który to…” notatka mówi, czym jest wybrana opcja. */
      if (ex.t === "which") n = "To coś innego: " + n + ".";
      out += '<p class="why-not"><b>A ' + esc(W.quote(p)) + "?</b> " + esc(n.charAt(0).toUpperCase() + n.slice(1)) + "</p>";
    });
    if (g.extra) out += g.extra;
    return out ? '<div class="explain">' + out + "</div>" : "";
  };

  function choice(ex, mod, api) {
    var c = W.asChoice(ex, mod);
    var sel = -1;
    var isTf = ex.t === "tf";
    var html =
      '<div class="opts ' + (isTf ? "opts-tf" : "") + '">' +
      c.options
        .map(function (o, i) {
          return (
            '<button class="opt" data-i="' + i + '"><kbd>' + (i + 1) + "</kbd><span>" + esc(o) + "</span></button>"
          );
        })
        .join("") +
      "</div>";
    var root = el(html);
    function pick(i) {
      if (root.classList.contains("locked")) return;
      sel = i;
      W.sound("tap");
      [].forEach.call(root.children, function (b, j) {
        b.classList.toggle("sel", j === i);
      });
      api.change();
    }
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".opt");
      if (b) pick(+b.dataset.i);
    });
    return {
      el: root,
      ready: function () {
        return sel >= 0;
      },
      grade: function () {
        root.classList.add("locked");
        var ok = sel === c.correct;
        root.children[c.correct].classList.add("right");
        if (!ok && sel >= 0) root.children[sel].classList.add("wrong");
        return {
          ok: ok,
          correct: esc(c.options[c.correct]),
          correctText: c.options[c.correct],
          wrongPicks: !ok && sel >= 0 ? [c.options[sel]] : [],
          notes: c.notes
        };
      },
      key: function (k) {
        var n = parseInt(k, 10);
        if (n >= 1 && n <= c.options.length) pick(n - 1);
      }
    };
  }

  function cloze(ex, mod, api) {
    var correct = ex.a[0];
    var opts = W.shuffle(ex.a);
    var sel = null;
    var parts = ex.q.split("___");
    var root = el(
      '<div class="cloze"><p class="cloze-s">' + esc(parts[0]) + '<span class="blank">&nbsp;</span>' + esc(parts[1] || "") +
        '</p><div class="chips">' +
        opts
          .map(function (o, i) {
            return '<button class="chip" data-i="' + i + '"><kbd>' + (i + 1) + "</kbd>" + esc(o) + "</button>";
          })
          .join("") +
        "</div></div>"
    );
    var blank = root.querySelector(".blank");
    function pick(i) {
      if (root.classList.contains("locked")) return;
      sel = opts[i];
      W.sound("tap");
      blank.textContent = sel;
      blank.classList.add("filled");
      [].forEach.call(root.querySelectorAll(".chip"), function (b, j) {
        b.classList.toggle("sel", j === i);
      });
      api.change();
    }
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".chip");
      if (b) pick(+b.dataset.i);
    });
    return {
      el: root,
      prompt: false,
      ready: function () {
        return sel !== null;
      },
      grade: function () {
        root.classList.add("locked");
        var ok = sel === correct;
        blank.classList.add(ok ? "right" : "wrong");
        var notes = {};
        ex.a.slice(1).forEach(function (o, i) {
          if (ex.w && ex.w[i]) notes[o] = ex.w[i];
        });
        return { ok: ok, correct: esc(correct), correctText: correct, wrongPicks: !ok && sel ? [sel] : [], notes: notes };
      },
      key: function (k) {
        var n = parseInt(k, 10);
        if (n >= 1 && n <= opts.length) pick(n - 1);
      }
    };
  }

  function typed(ex, mod, api) {
    var root = el(
      '<div class="typed"><input id="typed-' + ex.id.replace(/[^a-z0-9]/gi, "") +
        '" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Wpisz odpowiedź…" />' +
        '<p class="hint">Pierwsza litera: <b>' + esc(ex.a[0].charAt(0).toUpperCase()) + "</b> · " + ex.a[0].length + " liter</p></div>"
    );
    var input = root.querySelector("input");
    input.addEventListener("input", api.change);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        api.submit();
      }
    });
    setTimeout(function () {
      input.focus();
    }, 60);
    return {
      el: root,
      ready: function () {
        return W.norm(input.value).length > 0;
      },
      grade: function () {
        input.disabled = true;
        var v = W.norm(input.value);
        var best = 99;
        ex.a.forEach(function (a) {
          best = Math.min(best, W.lev(v, W.norm(a)));
        });
        var tol = ex.a[0].length <= 5 ? 1 : 2;
        var ok = best <= tol;
        input.classList.add(ok ? "right" : "wrong");
        var note = ok && best > 0 ? "Drobna literówka. Poprawnie: „" + ex.a[0] + "”." : null;
        return { ok: ok, correct: esc(ex.a[0]), note: note };
      }
    };
  }

  function match(ex, mod, api) {
    var pairs = ex.pairs;
    var left = W.shuffle(pairs.map(function (p, i) { return { t: p[0], i: i }; }));
    var right = W.shuffle(pairs.map(function (p, i) { return { t: p[1], i: i }; }));
    var root = el(
      '<div class="match"><div class="mcol">' +
        left.map(function (x) { return '<button class="tile" data-side="L" data-i="' + x.i + '">' + esc(x.t) + "</button>"; }).join("") +
        '</div><div class="mcol">' +
        right.map(function (x) { return '<button class="tile" data-side="R" data-i="' + x.i + '">' + esc(x.t) + "</button>"; }).join("") +
        "</div></div>"
    );
    var selL = null, selR = null, done = 0, mistakes = 0;
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".tile");
      if (!b || b.classList.contains("done")) return;
      W.sound("tap");
      if (b.dataset.side === "L") {
        if (selL) selL.classList.remove("sel");
        selL = b;
      } else {
        if (selR) selR.classList.remove("sel");
        selR = b;
      }
      b.classList.add("sel");
      if (selL && selR) {
        var a = selL, c = selR;
        selL = selR = null;
        if (a.dataset.i === c.dataset.i) {
          a.classList.remove("sel");
          c.classList.remove("sel");
          a.classList.add("done");
          c.classList.add("done");
          done++;
          W.sound("correct", done);
          if (done === pairs.length) {
            setTimeout(function () {
              api.done(mistakes <= 1, mistakes);
            }, 250);
          }
        } else {
          mistakes++;
          W.sound("wrong");
          a.classList.add("bad");
          c.classList.add("bad");
          setTimeout(function () {
            a.classList.remove("bad", "sel");
            c.classList.remove("bad", "sel");
          }, 450);
        }
      }
    });
    return {
      el: root,
      auto: true,
      ready: function () {
        return false;
      },
      grade: function () {
        return {
          ok: mistakes <= 1,
          correct: pairs.map(function (p) { return esc(p[0]) + " → " + esc(p[1]); }).join("<br>")
        };
      }
    };
  }

  function multi(ex, mod, api) {
    var opts = W.shuffle(ex.a.concat(ex.o || []));
    var picked = {};
    var root = el(
      '<div class="opts multi">' +
        opts
          .map(function (o, i) {
            return '<button class="opt" data-i="' + i + '" aria-pressed="false"><span class="box-ic"></span><span>' + esc(o) + "</span></button>";
          })
          .join("") +
        '<p class="hint">Poprawnych odpowiedzi może być kilka.</p></div>'
    );
    function toggle(i) {
      if (root.classList.contains("locked")) return;
      picked[i] = !picked[i];
      W.sound("tap");
      var b = root.children[i];
      b.classList.toggle("sel", picked[i]);
      b.setAttribute("aria-pressed", picked[i] ? "true" : "false");
      api.change();
    }
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".opt");
      if (b) toggle(+b.dataset.i);
    });
    return {
      el: root,
      ready: function () {
        return Object.keys(picked).some(function (k) { return picked[k]; });
      },
      grade: function () {
        root.classList.add("locked");
        var ok = true, wrongPicks = [], notes = {};
        (ex.o || []).forEach(function (o, i) {
          if (ex.w && ex.w[i]) notes[o] = ex.w[i];
        });
        opts.forEach(function (o, i) {
          var should = ex.a.indexOf(o) >= 0;
          if (should) root.children[i].classList.add("right");
          else if (picked[i]) {
            root.children[i].classList.add("wrong");
            wrongPicks.push(o);
          }
          if (!!picked[i] !== should) ok = false;
        });
        return { ok: ok, correct: ex.a.map(esc).join(", "), wrongPicks: wrongPicks, notes: notes };
      },
      key: function (k) {
        var n = parseInt(k, 10);
        if (n >= 1 && n <= opts.length) toggle(n - 1);
      }
    };
  }

  function order(ex, mod, api) {
    var pool = W.shuffle(ex.a.map(function (t, i) { return { t: t, i: i }; }));
    var seq = [];
    var root = el('<div class="order"><ol class="ord-seq"></ol><div class="chips ord-pool"></div></div>');
    var seqEl = root.querySelector(".ord-seq"), poolEl = root.querySelector(".ord-pool");
    function paint() {
      seqEl.innerHTML = ex.a
        .map(function (_, k) {
          var it = seq[k];
          return it
            ? '<li><button class="chip sel" data-out="' + k + '">' + esc(it.t) + "</button></li>"
            : '<li class="ord-empty"><span>' + (k + 1) + "</span></li>";
        })
        .join("");
      poolEl.innerHTML = pool
        .map(function (it, k) {
          var used = seq.indexOf(it) >= 0;
          return '<button class="chip" data-in="' + k + '"' + (used ? " hidden" : "") + "><kbd>" + (k + 1) + "</kbd>" + esc(it.t) + "</button>";
        })
        .join("");
      api.change();
    }
    function put(k) {
      if (root.classList.contains("locked")) return;
      var it = pool[k];
      if (seq.indexOf(it) >= 0) return;
      seq.push(it);
      W.sound("tap");
      paint();
    }
    root.addEventListener("click", function (e) {
      if (root.classList.contains("locked")) return;
      var a = e.target.closest("[data-in]");
      if (a) return put(+a.dataset.in);
      var b = e.target.closest("[data-out]");
      if (b) {
        seq.splice(+b.dataset.out, 1);
        W.sound("tap");
        paint();
      }
    });
    paint();
    return {
      el: root,
      ready: function () {
        return seq.length === ex.a.length;
      },
      grade: function () {
        root.classList.add("locked");
        var ok = seq.every(function (it, k) { return it.i === k; });
        [].forEach.call(seqEl.querySelectorAll(".chip"), function (c, k) {
          c.classList.add(seq[k].i === k ? "right" : "wrong");
        });
        return { ok: ok, correct: ex.a.map(function (t, k) { return k + 1 + ". " + esc(t); }).join("<br>") };
      },
      key: function (k) {
        var n = parseInt(k, 10);
        if (n >= 1 && n <= pool.length) put(n - 1);
        if (k === "Backspace" && seq.length) {
          seq.pop();
          paint();
        }
      }
    };
  }

  function sorter(ex, mod, api) {
    var items = W.shuffle(ex.items).slice(0, 6);
    var picks = items.map(function () { return -1; });
    var root = el(
      '<div class="sortex">' +
        items
          .map(function (it, i) {
            return (
              '<div class="srow" data-i="' + i + '"><span class="stext">' + esc(it[0]) + '</span><span class="sbtns">' +
              '<button class="sb" data-c="0">' + esc(ex.cats[0]) + '</button><button class="sb" data-c="1">' + esc(ex.cats[1]) +
              "</button></span></div>"
            );
          })
          .join("") +
        "</div>"
    );
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".sb");
      if (!b || root.classList.contains("locked")) return;
      var row = b.closest(".srow");
      var i = +row.dataset.i;
      picks[i] = +b.dataset.c;
      W.sound("tap");
      [].forEach.call(row.querySelectorAll(".sb"), function (x) {
        x.classList.toggle("sel", x === b);
      });
      api.change();
    });
    return {
      el: root,
      ready: function () {
        return picks.indexOf(-1) === -1;
      },
      grade: function () {
        root.classList.add("locked");
        var wrong = [], notes = [];
        items.forEach(function (it, i) {
          var row = root.children[i];
          var ok = picks[i] === it[1];
          row.classList.add(ok ? "right" : "wrong");
          if (!ok) {
            wrong.push(esc(it[0]) + " → " + esc(ex.cats[it[1]]));
            var why = W.sortWhy(ex, it);
            if (why) notes.push("<li><b>" + esc(it[0]) + ":</b> " + esc(why) + "</li>");
          }
        });
        return {
          ok: wrong.length === 0,
          correct: wrong.join("<br>"),
          extra: notes.length ? '<ul class="why-list">' + notes.join("") + "</ul>" : ""
        };
      }
    };
  }

  /* Dlaczego karta należy do swojej kategorii: notatka przy karcie albo opis kategorii. */
  W.sortWhy = function (deck, it) {
    if (it[2]) return it[2];
    return deck.why ? deck.why[it[1]] : "";
  };

  W.Ex = {
    label: function (ex, mod) {
      if (ex.t === "which") return ex.set ? mod.sets[ex.set].label : mod.whichLabel || "Która to zasada?";
      return LABELS[ex.t] || "";
    },
    render: function (ex, mod, api) {
      switch (ex.t) {
        case "mcq":
        case "which":
        case "tf":
          return choice(ex, mod, api);
        case "cloze":
          return cloze(ex, mod, api);
        case "type":
          return typed(ex, mod, api);
        case "match":
          return match(ex, mod, api);
        case "sort":
          return sorter(ex, mod, api);
        case "multi":
          return multi(ex, mod, api);
        case "order":
          return order(ex, mod, api);
      }
      return choice(ex, mod, api);
    },
    /* Prompt shown above the widget (cloze carries its sentence inline). */
    prompt: function (ex) {
      if (ex.t === "cloze" || ex.t === "match") return "";
      return ex.q;
    },

    /* Generated exercises from flashcard concepts. */
    fromConcept: function (c, mod, reverse) {
      var others = mod.concepts.filter(function (o) {
        return o.id !== c.id && W.allowed(o);
      });
      others = W.sample(others, 3);
      var x = c.plain ? c.plain + " Na teście: " + c.def : c.def;
      if (reverse) {
        return {
          t: "mcq", s: c.s, id: mod.id + ":c:" + c.id + ":r",
          q: "Które pojęcie pasuje do opisu: „" + c.sh + "”?",
          a: [c.term].concat(others.map(function (o) { return o.term; })),
          w: others.map(function (o) { return "To pojęcie oznacza: " + o.sh + "."; }),
          x: x
        };
      }
      return {
        t: "mcq", s: c.s, id: mod.id + ":c:" + c.id,
        q: "Co oznacza pojęcie „" + c.term + "”?",
        a: [c.sh].concat(others.map(function (o) { return o.sh; })),
        w: others.map(function (o) { return "Tak opisujemy inne pojęcie: " + W.quote(o.term) + "."; }),
        x: x
      };
    },
    matchFromConcepts: function (list, mod) {
      return {
        t: "match", s: "S", id: mod.id + ":m:" + list.map(function (c) { return c.id; }).join(","),
        pairs: list.map(function (c) { return [c.term, c.sh]; })
      };
    }
  };

  /* Weighted sampling without replacement (Efraimidis–Spirakis). */
  W.weighted = function (modId, list, n) {
    return list
      .map(function (e) {
        return { e: e, k: Math.pow(Math.random(), 1 / W.Store.weight(modId, e.id)) };
      })
      .sort(function (a, b) {
        return b.k - a.k;
      })
      .slice(0, n)
      .map(function (x) {
        return x.e;
      });
  };

  /* Kolejność w lekcji: najpierw rozpoznawanie (prawda/fałsz, wybór), potem
   * dopasowywanie, na końcu przypominanie z pamięci (układanie, wpisywanie).
   * Lekcje z flagą seq idą w kolejności, w jakiej ćwiczenia stoją w module. */
  var TIER = { tf: 0, which: 1, mcq: 1, cloze: 2, multi: 2, match: 2, sort: 3, order: 3, type: 4 };
  function ramp(list, m, seq) {
    var pos = {};
    m.exercises.forEach(function (e, i) {
      pos[e.id] = i;
    });
    return list
      .map(function (e) {
        var k;
        if (seq) k = pos[e.id] != null ? pos[e.id] : e.t === "match" ? 1e6 : -1;
        else k = (TIER[e.t] != null ? TIER[e.t] : 1) + Math.random() * 1.5;
        return { e: e, k: k };
      })
      .sort(function (a, b) {
        return a.k - b.k;
      })
      .map(function (x) {
        return x.e;
      });
  }

  W.buildLesson = function (m, unit) {
    var all = m.exercises.filter(W.allowed);
    if (unit.boss) {
      var bossPool = all.filter(function (e) {
        return e.t !== "match" && e.t !== "sort";
      });
      return W.shuffle(W.weighted(m.id, bossPool, 15));
    }
    var pool = all.filter(function (e) {
      return e.u === unit.id;
    });
    var picked = W.weighted(m.id, pool, unit.size || 8);
    var concepts = m.concepts.filter(function (c) {
      return c.u === unit.id && W.allowed(c);
    });
    if (concepts.length) {
      var c = concepts[Math.floor(Math.random() * concepts.length)];
      picked.push(W.Ex.fromConcept(c, m, Math.random() < 0.5));
    }
    var hasMatch = picked.some(function (e) {
      return e.t === "match";
    });
    if (!hasMatch && concepts.length >= 2) {
      var fill = m.concepts.filter(function (c2) {
        return c2.u !== unit.id && W.allowed(c2);
      });
      var set = W.sample(concepts, 4);
      if (set.length < 4) set = set.concat(W.sample(fill, 4 - set.length));
      picked.push(W.Ex.matchFromConcepts(set, m));
    }
    var out = ramp(picked, m, unit.seq);
    /* Na koniec 1–2 pytania z wcześniejszych lekcji, żeby nie wypadły z głowy. */
    var idx = m.unitIdx[unit.id];
    var earlier = all.filter(function (e) {
      return m.unitIdx[e.u] < idx && e.t !== "match";
    });
    if (earlier.length) out = out.concat(W.weighted(m.id, earlier, idx >= 3 ? 2 : 1));
    return out;
  };
})();

</script>
    <script>
/* Przebieg lekcji w stylu Duolingo: serca, ponawianie błędów, pasek postępu. */
(function () {
  "use strict";
  var W = window.Wykuj;
  var esc = W.esc;
  var Store = W.Store;

  /* opts: { mod, unit?, items, title, hearts (number|null), onExit(), onFinish(result) } */
  W.runSession = function (root, opts) {
    var m = opts.mod;
    var queue = opts.items.slice();
    var total = queue.length;
    var solved = 0;
    var firstTry = 0;
    var seen = {};
    var hearts = opts.hearts;
    var combo = 0, bestCombo = 0;
    var t0 = Date.now();
    var cur = null, ctrl = null, phase = "answer";

    root.innerHTML =
      '<div class="lesson">' +
      '<header class="l-top">' +
      '<button class="icon-btn" data-act="quit" aria-label="Zakończ lekcję">' + W.icon("x") + "</button>" +
      '<div class="lbar" role="progressbar" aria-label="Postęp lekcji"><i></i></div>' +
      (hearts != null ? '<div class="hearts" aria-label="Serca">' + W.icon("heart") + "<b></b></div>" : "") +
      "</header>" +
      '<div class="combo" hidden></div>' +
      '<main class="l-body"></main>' +
      '<footer class="l-foot"><div class="fb" role="status" aria-live="polite" hidden></div><div class="l-foot-row">' +
      '<button class="btn ghost" data-act="skip">Nie wiem</button>' +
      '<button class="btn primary" data-act="check" disabled>Sprawdź</button></div></footer>' +
      '<div class="modal" hidden><div class="modal-card"><h3>Przerwać lekcję?</h3><p>Postęp tej lekcji przepadnie. XP za poprawne odpowiedzi zostaje.</p>' +
      '<div class="row"><button class="btn primary" data-act="stay">Zostaję</button><button class="btn danger-ghost" data-act="leave">Wyjdź</button></div></div></div>' +
      "</div>";

    var $ = function (s) { return root.querySelector(s); };
    var body = $(".l-body"), foot = $(".l-foot"), fb = $(".fb"), btn = $('[data-act="check"]');
    var skip = $('[data-act="skip"]'), bar = $(".lbar i"), comboEl = $(".combo"), modal = $(".modal");

    function paint() {
      bar.style.width = Math.round((solved / total) * 100) + "%";
      if (hearts != null) $(".hearts b").textContent = hearts;
    }

    function next() {
      if (!queue.length) return finish(true);
      cur = queue.shift();
      phase = "answer";
      foot.className = "l-foot";
      fb.hidden = true;
      btn.textContent = "Sprawdź";
      btn.disabled = true;
      skip.hidden = false;
      var prompt = W.Ex.prompt(cur);
      body.innerHTML =
        '<div class="l-head"><span class="l-label">' + W.Ex.label(cur, m) + "</span>" + W.srcBadge(cur.s) +
        (seen[cur.id] ? '<span class="src src-redo">powtórka błędu</span>' : "") +
        (opts.unit && !opts.unit.boss && cur.u && cur.u !== opts.unit.id && !seen[cur.id] ? '<span class="src src-redo">z wcześniejszej lekcji</span>' : "") + "</div>" +
        (prompt ? '<h2 class="l-q">' + esc(prompt) + "</h2>" : "") +
        '<div class="l-ex"></div>';
      ctrl = W.Ex.render(cur, m, {
        change: function () {
          btn.disabled = !ctrl.ready();
        },
        submit: function () {
          if (ctrl.ready()) check();
        },
        done: function (ok) {
          check(ok);
        }
      });
      body.querySelector(".l-ex").appendChild(ctrl.el);
      if (ctrl.auto) {
        btn.hidden = true;
      } else {
        btn.hidden = false;
      }
      body.scrollTop = 0;
      paint();
    }

    function check(forced) {
      if (phase !== "answer") return;
      phase = "feedback";
      var g = ctrl.grade();
      var ok = forced === undefined ? g.ok : forced;
      if (forced === false && g.ok) ok = false;
      var retry = !!seen[cur.id];
      if (cur.id) Store.record(m.id, cur.id, ok);
      if (ok) {
        solved++;
        if (!retry) firstTry++;
        combo++;
        bestCombo = Math.max(bestCombo, combo);
        Store.addXP(retry ? 1 : 2);
        W.sound("correct", combo);
        W.buzz(10);
      } else {
        combo = 0;
        seen[cur.id] = true;
        if (hearts != null) hearts--;
        queue.push(cur);
        W.sound("wrong");
        W.buzz([30, 40, 30]);
        root.querySelector(".lesson").classList.add("shake");
        setTimeout(function () {
          var l = root.querySelector(".lesson");
          if (l) l.classList.remove("shake");
        }, 400);
      }
      if (combo >= 3 && combo % 1 === 0) {
        comboEl.hidden = false;
        comboEl.innerHTML = W.icon("flame") + combo + " z rzędu";
        comboEl.classList.remove("pop");
        void comboEl.offsetWidth;
        comboEl.classList.add("pop");
      } else {
        comboEl.hidden = true;
      }
      var praise = ["Świetnie!", "Dokładnie tak!", "Brawo!", "Zgadza się!", "Tak trzymaj!"];
      var head = ok ? praise[Math.floor(Math.random() * praise.length)] : "Poprawna odpowiedź:";
      var html = "<b class='fb-h'>" + W.icon(ok ? "check" : "x") + esc(head) + "</b>";
      if (!ok && g.correct) html += "<div class='fb-a'>" + g.correct + "</div>";
      if (g.note) html += "<p class='fb-x'>" + esc(g.note) + "</p>";
      html += W.explain(cur, g);
      fb.innerHTML = html;
      fb.scrollTop = 0;
      fb.hidden = false;
      foot.className = "l-foot " + (ok ? "ok" : "bad");
      skip.hidden = true;
      btn.hidden = false;
      btn.disabled = false;
      btn.textContent = "Dalej";
      paint();
      btn.focus({ preventScroll: true });
    }

    function finish(completed) {
      phase = "done";
      var secs = Math.round((Date.now() - t0) / 1000);
      var acc = total ? firstTry / total : 0;
      var res = {
        completed: completed && (hearts == null || hearts > 0),
        acc: acc,
        firstTry: firstTry,
        total: total,
        secs: secs,
        bestCombo: bestCombo,
        hearts: hearts
      };
      opts.onFinish(res);
    }

    function onClick(e) {
      var a = e.target.closest("[data-act]");
      if (!a) return;
      var act = a.dataset.act;
      if (act === "check") {
        if (phase === "answer") check();
        else if (phase === "feedback") {
          if (hearts != null && hearts <= 0) finish(false);
          else next();
        }
      } else if (act === "skip") {
        if (phase === "answer") check(false);
      } else if (act === "quit") {
        modal.hidden = false;
      } else if (act === "stay") {
        modal.hidden = true;
      } else if (act === "leave") {
        opts.onExit();
      }
    }
    root.addEventListener("click", onClick);

    W.setKeys(function (e) {
      if (!modal.hidden) {
        if (e.key === "Escape") modal.hidden = true;
        return;
      }
      if (e.key === "Escape") {
        modal.hidden = false;
        return;
      }
      if (e.key === "Enter") {
        if (e.target && e.target.tagName === "BUTTON") return;
        e.preventDefault();
        if (!btn.disabled && !btn.hidden) btn.click();
        return;
      }
      if (phase === "answer" && ctrl && ctrl.key && !(e.target && e.target.tagName === "INPUT")) ctrl.key(e.key);
    });

    next();
  };

  W.starsFor = function (acc) {
    return acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1;
  };

  W.starRow = function (n, max) {
    var s = "";
    for (var i = 0; i < (max || 3); i++) s += '<span class="st ' + (i < n ? "on" : "") + '">' + W.icon("star") + "</span>";
    return '<span class="stars">' + s + "</span>";
  };

  W.fmtTime = function (secs) {
    var m = Math.floor(secs / 60), s = secs % 60;
    return m + ":" + ("0" + s).slice(-2);
  };

  /* Ekran wyniku wspólny dla lekcji, quizów i gier. */
  W.resultScreen = function (root, o) {
    root.innerHTML =
      '<div class="result ' + (o.fail ? "fail" : "") + '">' +
      '<div class="r-hero">' +
      (o.stars != null ? '<div class="r-stars">' + W.starRow(o.stars) + "</div>" : "") +
      '<h1 class="display">' + esc(o.title) + "</h1>" +
      (o.sub ? '<p class="r-sub">' + esc(o.sub) + "</p>" : "") +
      "</div>" +
      '<div class="r-stats">' +
      o.stats
        .map(function (s) {
          return '<div class="r-stat ' + (s.tone || "") + '"><span>' + esc(s.label) + "</span><b>" + esc(s.value) + "</b></div>";
        })
        .join("") +
      "</div>" +
      (o.extra || "") +
      '<div class="r-actions">' +
      o.actions
        .map(function (a, i) {
          return '<button class="btn ' + (i === 0 ? "primary" : "ghost") + '" data-r="' + i + '">' + esc(a.label) + "</button>";
        })
        .join("") +
      "</div></div>";
    root.querySelectorAll("[data-r]").forEach(function (b) {
      b.addEventListener("click", function () {
        o.actions[+b.dataset.r].fn();
      });
    });
    W.setKeys(function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        o.actions[0].fn();
      }
    });
    if (!o.fail) {
      W.sound("finish");
      if (o.confetti) W.confetti();
    } else {
      W.sound("fail");
    }
    var first = root.querySelector('[data-r="0"]');
    if (first) first.focus({ preventScroll: true });
  };
})();

</script>

  /* Notatki do czytania. Klasy: .oral = ustnie, .extra = dopowiedzenie (★). */
  notes: [
    { id: "intro", title: "O czym jest ten wykład", html:
      "<div class='plain'><p>Na tych zajęciach nie uczysz się plastyki, tylko tego, jak psycholog prowadzi zajęcia twórcze z dziećmi i nastolatkami. Wykład daje dziesięć zasad, które odróżniają to od szkolnej lekcji i od pracy z dorosłymi.</p></div>" +
      "<p>Wykład otwiera kurs (temat 1 z sylabusa). Pokazuje uniwersalne elementy, które odróżniają zajęcia twórcze z dziećmi i młodzieżą od standardowej edukacji i od pracy z dorosłymi. Prowadząca nazywa je <b>kluczowymi zasadami psychopedagogicznymi</b>, które każdy przyszły psycholog powinien wdrożyć w praktyce.</p>" +
      "<p><b>Zaliczenie:</b> obecność plus egzamin, czyli test pisemny z pytaniami zamkniętymi. Trzeba uzyskać <b>więcej niż 50%</b> punktów.</p>" +
      "<div class='oral'><p><b>Facylitacja</b> to sytuacja, w której obecność psychologa umożliwia rozpoczęcie i kontynuowanie procesu rozmawiania o trudnych emocjach. Obok facylitacji prowadząca wprowadziła pojęcie socjoterapii.</p></div>" +
      "<aside class='extra'><p>Termin „facylitator” spopularyzował m.in. <b>Carl Rogers</b> w nurcie humanistycznym. Facylitator nie jest ekspertem, który „naprawia”. Tworzy warunki, w których proces może zajść sam.</p>" +
      "<p><b>Socjoterapia</b> to grupowa forma pomocy psychologicznej dla dzieci i młodzieży z trudnościami emocjonalnymi i w relacjach. Opiera się na doświadczeniach korektywnych. Cele: terapeutyczne (odreagowanie, korekta przekonań), edukacyjne (umiejętności społeczne, komunikacja) i rozwojowe. Metody twórcze (rysunek, drama, ruch) są jej podstawowym narzędziem. W Polsce spopularyzowała ją m.in. K. Sawicka.</p></aside>" },
    { id: "p1", n: 1, title: "Prymat procesu nad efektem", html:
      "<div class='plain'><p>Ważne jest to, co dzieje się podczas tworzenia, a nie to, czy wyszło ładnie. Psycholog nie chwali i nie gani wyglądu pracy, tylko ciekawi się tym, jak powstawała.</p></div>" +
      "<p>Paradygmat <b>„tu i teraz”</b>. U dorosłych często liczy się produkt końcowy (książka, obraz, projekt). U dzieci i młodzieży największą wartość terapeutyczną i rozwojową ma <b>sam akt tworzenia</b>.</p>" +
      "<p>Psycholog nie ocenia estetyki dzieła. Zamiast „piękny rysunek” czy „super” mówi:</p>" +
      "<blockquote>„Widzę, że użyłeś dużo czerwieni i mocno naciskałeś kredkę (opowiesz mi o tym?)”</blockquote>" +
      "<p><b>Cel:</b> uwolnienie od presji perfekcjonizmu.</p>" +
      "<div class='oral'><ul><li>„Co dostałeś z kartkówki?” to typowe nastawienie dorosłych na wynik zamiast na to, jak dziecko pracowało.</li>" +
      "<li>„Wylewanie dziecka z kąpielą”: oceniając tylko efekt, tracimy to, co w pracy twórczej najcenniejsze.</li>" +
      "<li>Pytanie otwarte („opowiedz mi o tym misiu, o czym on myśli?”) uruchamia <b>projekcję</b>: mówiąc o misiu, dziecko mówi o sobie.</li>" +
      "<li><b>Projekcja myśli</b> to przypisywanie obiektowi zewnętrznemu własnych stanów wewnętrznych.</li></ul></div>" +
      "<aside class='extra'><p>W psychoanalizie projekcja to mechanizm obronny. Tu chodzi o sens z technik projekcyjnych, bez założenia obrony. Na teście trzymaj się definicji z wykładu.</p></aside>" },
    { id: "p2", n: 2, title: "Psychologiczne bezpieczeństwo", html:
      "<div class='plain'><p>Dziecko pokaże coś z siebie tylko tam, gdzie nikt go nie oceni. Dlatego psycholog patrzy na mocne strony i pozwala nie pokazywać pracy.</p></div>" +
      "<p>Twórczość wymaga odsłonięcia się, a to ryzyko emocjonalne (szczególnie u młodzieży). Specyfika tych zajęć to <b>całkowite zawieszenie krytyki i ocen szkolnych</b>.</p>" +
      "<p><b>Zasada zielonego ołówka:</b> zamiast wytykać błędy (czerwony ołówek) psycholog zauważa i wzmacnia to, co unikalne, nietypowe i ciekawe. Hasło ze slajdu: <mark>ZASOBY</mark>.</p>" +
      "<p><b>Prawo do odmowy:</b> uczestnik zawsze może powiedzieć „NIE” i nie pokazywać pracy grupie.</p>" +
      "<div class='oral'><p>„Nie da się uciec od oceniania”, więc psycholog świadomie zmienia jej <b>kierunek</b>: zasoby, nie błędy.</p></div>" +
      "<aside class='extra'><p>„Zielony ołówek” jest znany z oceniania kształtującego. Łączy się z tematem 4 (etyka oceniania wytworów).</p></aside>" },
    { id: "p3", n: 3, title: "Aktywacja polisensoryczna", html:
      "<div class='plain'><p>Siedzenie przy biurku to za mało. Glina, farby na podłodze, muzyka i zapachy pomagają się uspokoić i wyrazić to, czego trudno powiedzieć słowami.</p></div>" +
      "<p>W dobie przebodźcowania cyfrowego dzieci i młodzież potrzebują <b>zakotwiczenia w ciele</b>. Praca twórcza nie może opierać się wyłącznie na myśleniu pojęciowym.</p>" +
      "<p>Przykłady: glina przy muzyce, malowanie wielkoformatowe na podłodze, zapachy, faktury (multi-sensory environments).</p>" +
      "<p><b>Efekt:</b> regulacja układu nerwowego i łatwiejsza ekspresja dla osób, którym trudno mówić o emocjach.</p>" +
      "<div class='oral'><p>Samo siedzenie przy biurku to praca wyłącznie na myśleniu pojęciowym.</p></div>" +
      "<aside class='extra'><p>Najbardziej znana realizacja: <b>Snoezelen</b>, sala doświadczania świata z Holandii.</p></aside>" },
    { id: "p4", n: 4, title: "Elastyczność struktury", html:
      "<div class='plain'><p>Plan zajęć jest tylko propozycją. Jeśli grupa przychodzi z czymś ważnym, zajmujesz się tym, a twórczość pomaga to przepracować.</p></div>" +
      "<p><b>Sztywny scenariusz zajęć jest największym wrogiem kreatywności.</b> Prowadzący musi być gotowy na <mark>ZWROTY AKCJI</mark>.</p>" +
      "<p>Jeśli zaplanowałeś bajkę o lęku, a grupa wchodzi poruszona konfliktem w klasie, porzucasz plan i zamieniasz metodę w narzędzie do przepracowania kryzysu. Twórczość staje się <b>wentylem bezpieczeństwa</b>.</p>" +
      "<div class='oral'><p>Scenariusz jest punktem wyjścia, a nie obowiązkiem.</p></div>" },
    { id: "p5", n: 5, title: "Metaforyzacja i projekcja", html:
      "<div class='plain'><p>O sobie mówić trudno, o potworze z bajki łatwo. Bajka i odgrywana rola dają bezpieczny dystans.</p></div>" +
      "<p>Dzieciom i młodzieży trudno mówić wprost o lękach, kompleksach i traumach, więc korzystamy z narzędzi projekcyjnych.</p>" +
      "<p>Łatwiej opowiedzieć o „smutnym potworze, który zgubił się w lesie” (bajkoterapia) albo zagrać zbuntowanego bohatera (drama), niż powiedzieć „czuję się samotny i nierozumiany przez rodziców”. <b>Metafora i symbolika dają dziecku bezpieczeństwo.</b></p>" },
    { id: "p6", n: 6, title: "Rytualizacja i ramy czasowo-przestrzenne", html:
      "<div class='plain'><p>Stałe rytuały na początek i koniec oraz inna przestrzeń (krąg zamiast ławek) mówią: teraz jesteśmy w innym, bezpiecznym miejscu.</p></div>" +
      "<p>Jasne granice oddzielają przestrzeń twórczą od „zwykłej rzeczywistości”. Hasło ze slajdu: <mark>SETTING</mark>.</p>" +
      "<p>Stałe rytuały rozpoczęcia (Iskierka przyjaźni, rundka „jakim kolorem dziś jesteś?”) i zakończenia. Fizyczna zmiana przestrzeni: odsunięte ławki, krąg na poduszkach.</p>" +
      "<aside class='extra'><p>Iskierka przyjaźni: uczestnicy w kręgu kolejno przekazują sobie uścisk dłoni. Setting w psychoterapii: stałe ramy spotkań, czyli miejsce, czas i zasady.</p></aside>" },
    { id: "p7", n: 7, title: "Ambiwalencja oporu", html:
      "<div class='plain'><p>„To jest bez sensu” zwykle znaczy „boję się”. Psycholog tego nie przełamuje, tylko daje czas i pozwala popatrzeć.</p></div>" +
      "<p>U dorosłych opór pojawia się rzadko (ale bywa zakamuflowany). U dzieci, a zwłaszcza młodzieży, <b>opór jest naturalnym elementem procesu</b>.</p>" +
      "<p>Za tekstami „to jest dla dzieci”, „nie umiem rysować” kryje się <b>lęk</b> przed oceną, odrzuceniem przez grupę lub trudnymi emocjami. Psycholog nie walczy i nie zmusza:</p>" +
      "<blockquote>„Masz prawo uważać to zadanie za nudne. Możesz po prostu posiedzieć z nami i popatrzeć.”</blockquote>" +
      "<p>Młodzież bez nacisku często po kilkunastu minutach sama dołącza.</p>" +
      "<div class='oral'><p>Opór jest normalny i uczestnik ma do niego prawo. To łączy się z prawem do odmowy (zasada 2).</p></div>" },
    { id: "p8", n: 8, title: "Egocentryzm i teoria umysłu", html:
      "<div class='plain'><p>Dzieci i nastolatki są mocno skupione na sobie. Zabawy w odgrywanie ról uczą patrzeć oczami innych.</p></div>" +
      "<p>Grupowa praca twórcza (drama, wspólny scenariusz) to trening społeczny. Młodsze dzieci tkwią w <b>egocentryzmie poznawczym</b>, młodzież w <b>egocentryzmie adolescentnym</b>.</p>" +
      "<p>Zadania wymuszają cudzą perspektywę: „zagraj zepsutą zabawkę zostawioną na deszczu”, „napisz list z perspektywy nauczyciela”. Buduje to empatię i elastyczność poznawczą.</p>" +
      "<div class='oral'><ul><li>Poznawczy: dziecko oczekuje, że wszyscy znają zasady, które samo wymyśliło.</li>" +
      "<li>Afektywny: „idę na imprezę z pryszczem, to wina świata”.</li>" +
      "<li>Marki (np. kosmetyczne) budują warunki, w których odbiorca projektuje na siebie przeżycie.</li></ul></div>" +
      "<aside class='extra'><p>Poznawczy opisał <b>Piaget</b> (stadium przedoperacyjne), adolescentny <b>Elkind</b>: wyobrażona publiczność i baśń osobista. Teoria umysłu to przypisywanie innym stanów psychicznych odmiennych od własnych. Na teście używaj nazwy ze slajdu: <b>egocentryzm adolescentny</b>.</p></aside>" },
    { id: "p9", n: 9, title: "Sprawczość i poczucie kontroli (LOC)", html:
      "<div class='plain'><p>Wielu młodych ludzi czuje, że nic od nich nie zależy. W pracy twórczej to oni decydują o wszystkim, więc uczą się, że ich głos się liczy.</p></div>" +
      "<p>Wielu młodych ludzi z trudnościami czuje, że nie ma wpływu na swoje życie (<b>zewnętrzne umiejscowienie kontroli</b>).</p>" +
      "<p>Czysta kartka, glina czy pusta scena dają dziecku absolutną władzę nad tworzonym światem. Każda decyzja należy do młodego człowieka. Czarne słońce i niebieska trawa? Akceptujemy.</p>" +
      "<blockquote>„Ja decyduję, ja kreuję, mój głos ma znaczenie.”</blockquote>" +
      "<div class='oral'><p>Nauczyciel plastyki poprawi czarne słońce. Psycholog zastanowi się, dlaczego dziecko tak namalowało. Ważne jest też, jak ktoś przeżywa narzucone ramy.</p></div>" +
      "<aside class='extra'><p>LOC to koncepcja <b>J. Rottera</b>. Internalizacja: od „decydują za mnie” do „to zależy ode mnie”.</p></aside>" },
    { id: "p10", n: 10, title: "Kanalizacja i sublimacja", html:
      "<div class='plain'><p>Złość i napięcie nie znikają, kiedy się je ucisza. Lepiej dać im ujście w czymś twórczym: w glinie, tańcu, piosence.</p></div>" +
      "<p>Dzieci i młodzież noszą w sobie napięcie, złość, lęk, energię seksualną. Według nurtu psychodynamicznego twórczość jest <b>najwyższą formą obrony przed lękiem (sublimacją)</b>: zamienia destrukcyjną energię w wytwór.</p>" +
      "<p>Agresja? Ciężka glina do uderzania albo buntowniczy tekst piosenki. Nadaktywność? Ekspresyjny taniec.</p>" +
      "<div class='oral'><p>Zadaniem psychologa nie jest wygaszenie napięcia, lecz nadanie mu kierunku.</p></div>" +
      "<aside class='extra'><p>Sublimację opisał <b>Freud</b>. <b>Vaillant</b> zalicza ją do mechanizmów dojrzałych.</p></aside>" }

  notes: [
    { id: "n1", n: 1, title: "Dlaczego potrzebna jest filozofia człowieka", html:
      "<div class='plain'><p>Człowiekiem zajmuje się mnóstwo nauk, ale każda patrzy tylko na swój kawałek. Anatom widzi ciało, psycholog psychikę, etnolog kulturę. Wychodzi z tego wiele różnych obrazów człowieka, a żaden nie jest całością.</p></div>" +
      "<div class='tscroll'><table><thead><tr><th>Człowiek badany w aspekcie…</th><th>Nauka</th></tr></thead><tbody>" +
      "<tr><td>cielesności</td><td>anatomia, fizjologia</td></tr><tr><td>procesów życiowych</td><td>biologia</td></tr>" +
      "<tr><td>psychiki</td><td>psychologia</td></tr><tr><td>przynależności do świata przyrody</td><td>przyrodoznawstwo (= antropologia przyrodnicza)</td></tr>" +
      "<tr><td>różnych kultur</td><td>etnologia (= antropologia kulturowa)</td></tr><tr><td>kultury</td><td>kulturoznawstwo</td></tr>" +
      "<tr><td>myślenia</td><td>kognitywistyka, neuronauki</td></tr></tbody></table></div>" +
      "<p><b>Efekt:</b> różne koncepcje człowieka, akcent na jeden wymiar ludzkiego bytu. Stąd pytanie o ujęcie <b>całościowe, integralne i uniwersalne</b>, które będzie fundamentem dla bardziej szczegółowych wyjaśnień. Według skryptu taki fundament daje filozofia.</p>" +
      "<aside class='extra'><p>Pomylenie kawałka z całością („człowiek to tylko mózg”) to redukcjonizm. Psychologia jest tu jedną z nauk szczegółowych.</p></aside>" },
    { id: "n2", n: 2, title: "Jedna filozofia czy wiele?", html:
      "<div class='plain'><p>Kłopot: filozofii jest dużo i każda widzi człowieka inaczej, bo każda inaczej rozumie, co w ogóle istnieje. Wykład rozwiązuje to tak: jest jedna „podstawowa” filozofia, klasyczna, i na niej budujemy.</p></div>" +
      "<ul><li>Wielość koncepcji filozofii (różny przedmiot, cel, metody), więc wiele interpretacji człowieka.</li>" +
      "<li>Wiele modeli antropologii, <b>zależnych od koncepcji bytu</b>.</li></ul>" +
      "<p><b>Bardziej podstawowy typ:</b> <mark>filozofia klasyczna</mark> · philosophia perennis · realizm · charakter metafizyczny. Odwołuje się do wielkich filozofów-mistrzów. Cel: wyjaśniać realnie istniejący świat i w nim człowieka. Wyjaśnia fakty przez ich <b>realne racje (przyczyny)</b>.</p>" +
      "<p>Skrypt: jest jedna filozofia, tak jak ucząc się matematyki czy fizyki nie uczymy się „jednej z wielu koncepcji” matematyki czy fizyki.</p>" +
      "<aside class='extra'><p>Przykłady koncepcji bytu: materialista widzi w człowieku układ materii, Platon duszę uwięzioną w ciele, Arystoteles i Tomasz jedność duszy i ciała. Inne nurty (fenomenologia, filozofia analityczna) nie zgodziłyby się, że klasyczna to „ta jedna”, ale na teście trzymaj się wykładu.</p></aside>" },
    { id: "n3", n: 3, title: "Po co to komu: służebna rola filozofii", html:
      "<div class='plain'><p>Nauczyciel, lekarz, sędzia czy terapeuta zawsze zakładają jakąś odpowiedź na pytanie „kim jest człowiek”. Filozofia ma im dać spójną odpowiedź, która nie kłóci się z tym, co ustaliły nauki.</p></div>" +
      "<ul><li>Rozwój nauki zależy dziś od motywów <b>bardziej praktycznych niż teoretycznych</b>.</li>" +
      "<li>Dyscypliny praktyczne szukają filozoficznego obrazu człowieka: <b>pedagogika, polityka, prawo, medycyna, bioetyka, teologia</b>.</li>" +
      "<li>Filozofia jest <b>służebna</b> wobec innych nauk. Jej antropologia <b>integruje, a nie rozbija</b> spojrzenie na człowieka i jest <b>w zgodzie z dorobkiem nauk szczegółowych</b>.</li></ul>" +
      "<aside class='extra'><p>Dla psychologa: każda szkoła terapii (psychoanaliza, behawioryzm, psychologia humanistyczna) stoi na jakimś obrazie człowieka.</p></aside>" },
    { id: "n4", n: 4, title: "Czego nauki szczegółowe nie powiedzą", html:
      "<div class='plain'><p>Nauki świetnie opisują szczegóły, ale nie odpowiedzą na wielkie pytania: kim jestem jako całość, z czego się „składam”, co mnie trzyma w jedności i jaki to ma sens.</p></div>" +
      "<p>Nauki szczegółowe są znakomicie rozwinięte <b>od strony treściowej</b>, ale nie mówią:</p>" +
      "<ul><li>kim jest człowiek <b>całościowo wzięty</b>;</li><li>w jakich relacjach jest do innych bytów: gatunku, społeczeństwa, kultury, przyrody, ponadczasowych wartości, <b>Absolutu</b>;</li>" +
      "<li>czy jest treściowo <b>prosty czy złożony</b> w swojej strukturze ontycznej;</li><li>jaki typ <b>więzi bytowej</b> ma natura ludzka;</li><li>jaki jest <b>sens</b> człowieka w perspektywie ontycznej.</li></ul>" +
      "<p><b>Dychotomie</b> (skrypt powołuje się tu na S. Kamińskiego): człowiek – świat · wolność – konieczność · immanentność – transcendentność · dualizm – monizm czy jedność duszy i ciała. <b>Stąd konieczność antropologii filozoficznej.</b></p>" +
      "<aside class='extra'><p>Po ludzku: czy jesteśmy częścią przyrody, czy czymś więcej? Czy jesteśmy wolni? Czy wychodzimy poza siebie? Czy jesteśmy dwiema rzeczami (Platon, Kartezjusz), jedną materią, czy jednym bytem z duszą i ciałem (Arystoteles, Tomasz)? Ostatnia para to filozoficzna wersja problemu umysł – mózg.</p></aside>" },
    { id: "n5", n: 5, title: "Czym jest antropologia filozoficzna", html:
      "<div class='plain'><p>To filozofia człowieka. Człowiek jest w niej tym, co się bada, a nie punktem widzenia na resztę świata. Ma go objąć ze wszystkich stron i powiedzieć, co spaja go w jedną całość.</p></div>" +
      "<div class='key'><p><b>Najogólniej:</b> wyjaśniająca interpretacja bytu ludzkiego, czyli człowieka i jego istotnie ludzkiego działania.</p></div>" +
      "<p><b>Etymologia</b> (gr.): ánthropos – człowiek · legein – zbierać, mówić, myśleć · logos – mowa, rozum, prawo, nauka.</p>" +
      "<p>To <b>nie</b> odczytanie ze stanowiska człowieka tez o przyrodzie, społeczeństwie i poznaniu, ale <b>odrębna dziedzina filozofii</b>, której głównym przedmiotem jest człowiek. Ujmuje go w wymiarach metafizyczno-ontologicznym, moralno-etycznym, estetycznym, społeczno-kulturowym, czyli inaczej <b>wegetatywnym, sensytywnym i duchowym</b>. Szuka odpowiedzi, kim jest człowiek jako jedność tych porządków, jaka jest jego struktura ontyczna i miejsce wśród innych bytów.</p>" +
      "<p>Skrypt (Kamiński): bez wiedzy o obiektywnej rzeczywistości filozofia człowieka nie uchroni się przed <b>subiektywizmem</b>. Nie może abstrahować od metafizyki, ale nie jest tylko jej rozwinięciem: jest <b>metafizyką człowieka</b>.</p>" +
      "<aside class='extra'><p>Wegetatywny, sensytywny, duchowy to trzy „piętra” życia według Arystotelesa: roślinne, zmysłowe i rozumne. Istotnie ludzkie działania to np. myślenie pojęciami, wolne decyzje, miłość, twórczość, religia.</p></aside>" },
    { id: "n6", n: 6, title: "Cztery antropologie", html:
      "<div class='plain'><p>Słowo „antropologia” ma cztery znaczenia. Przyrodnicza patrzy na gatunek, kulturowa na to, co ludzie tworzą, teologiczna na relację z Bogiem, a filozoficzna na to, czym człowiek jest jako byt. Pełne porównanie jest w tabeli niżej.</p></div>" +
      "<p><b>Przyrodnicza:</b> metody nauk szczegółowych, człowiek na gruncie przyrody; <b>niejednolita</b> (brak jednej metody), zlepek wielu nauk. Gatunek na tle innych gatunków, rozwój gatunkowy i osobniczy, otoczenie, procesy życiowe. Dziś także <b>neuronauki</b>, których wnioski stają się elementami <b>nieautonomicznych</b> antropologii filozoficznych.</p>" +
      "<p><b>Kulturowa (społeczna):</b> nauki humanistyczne (skrypt: postkantowskie; tradycja niemiecka i anglosaska), zlepek wielu nauk, bada wytwory kulturowe i z nich wnioskuje o „naturze” człowieka, najczęściej psychologicznie lub socjologicznie. <b>Problem:</b> przeważnie odrzuca wspólną gatunkowo naturę ludzką; przyjmuje <b>kontekstualizm i historyzm</b>.</p>" +
      "<p><b>Teologiczna:</b> dział nauk teologicznych; człowiek jako adresat Objawienia (tak na slajdzie; w skrypcie: Zbawienia). Bada związek człowieka z Bogiem na bazie <b>tez Objawienia</b>; korzysta z antropologii filozoficznej i kulturowej.</p>" +
      "<p><b>Filozoficzna:</b> dziedzina filozofii badająca człowieka na bazie rozumienia rzeczywistości (bytu). Człowiek jako specyficzny element świata o właściwej sobie naturze.</p>" +
      "<aside class='extra'><p>Kontekstualizm: człowieka zrozumiesz tylko w jego kulturze. Historyzm: człowiek jest wytworem epoki. Filogeneza to rozwój gatunku, ontogeneza rozwój jednostki.</p></aside>" },
    { id: "n7", n: 7, title: "Drzewko: jaka filozofia człowieka?", html:
      "<div class='plain'><p>Skrypt pokazuje, jak dochodzi się do antropologii z tego kursu. To cztery rozwidlenia, a na każdym wybieramy jedną drogę. Gdy zrozumiesz drzewko, cechy R-A-R-A przestaną być listą do wykucia.</p></div>" +
      "<ul class='tree'><li><b>Antropologia filozoficzna</b><ul>" +
      "<li class='no'><b>nieautonomiczna</b>: uzależnia twierdzenia od wyników innych nauk; dziś dominuje; wyrosła z pozytywizmu (filozofia jako metanauka); wnosi niewiele ponad nauki.</li>" +
      "<li><b>autonomiczna</b>: własna metoda, przedmiot i cel<ul>" +
      "<li class='no'><b>dopuszcza źródła pozaracjonalne</b>, np. egzystencjalizm</li>" +
      "<li><b>tylko źródła rozumowe</b> (racjonalna)<ul>" +
      "<li class='no'><b>aprioryczna</b>: czysto spekulatywna</li>" +
      "<li class='yes'><b>aposterioryczna</b>: od opisu i uzasadnienia specyficznie ludzkiego doświadczenia. <em>To antropologia z wykładu.</em></li>" +
      "</ul></li></ul></li></ul></li></ul>" +
      "<p>Dzieje namysłu nad człowiekiem zaczynają się od <b>Sokratesa</b>. Najostrzej problem człowieka postawiono w <b>XVI–XVII wieku</b> (teoriopoznawczy antropocentryzm).</p>" },
    { id: "n8", n: 8, title: "Przedmiot, cel, metoda", html:
      "<div class='plain'><p>Trzy pytania: co badamy, po co i jak. Najtrudniejsze słowo to „uniesprzecznianie”, ale chodzi o zwykłe rozumowanie detektywa: skoro ten fakt zachodzi, co musi być prawdą o człowieku, żeby był możliwy?</p></div>" +
      "<div class='key'><p>Antropologia filozoficzna jest dziedziną filozofii badającą człowieka na bazie rozumienia rzeczywistości (koncepcji bytu – podejście metafizyczne).</p></div>" +
      "<div class='tscroll'><table><tbody>" +
      "<tr><th>Przedmiot</th><td>człowiek jako specyficzny element rzeczywistości, byt posiadający sobie właściwą naturę</td></tr>" +
      "<tr><th>Cel</th><td>szukanie ostatecznych ontycznych racji bytu ludzkiego i wszystkich jego istotnych aspektów</td></tr>" +
      "<tr><th>Metoda</th><td>wyjaśnianie, czyli wskazywanie racji podmiotowych i przedmiotowych dla faktów (metafizyczne uniesprzecznianie stanów bytowych)</td></tr>" +
      "</tbody></table></div>" +
      "<p>Podkreśla <b>egzystencjalny</b> aspekt rzeczywistości (to, że człowiek realnie istnieje), a nie tylko treść pojęcia „człowiek”.</p>" +
      "<p>Jest: <mark>R</mark>ealistyczna · <mark>A</mark>utonomiczna · <mark>R</mark>acjonalna · <mark>A</mark>posterioryczna.</p>" +
      "<aside class='extra'><p>Uniesprzecznianie w czterech krokach: (1) fakt z doświadczenia → (2) co musi istnieć, żeby nie był sprzeczny? → (3) wskazanie tej racji → (4) bez niej fakt byłby niemożliwy. Przykład: myślimy pojęciami ogólnymi, a materia jest zawsze jednostkowa, więc w człowieku musi być czynnik niematerialny. Racje podmiotowe są po stronie człowieka (rozum, wola), przedmiotowe po stronie tego, do czego się odnosi (świat, dobro).</p></aside>" },
    { id: "n9", n: 9, title: "Definicja do wykucia i miejsce w filozofii", html:
      "<div class='plain'><p>Antropologa nie interesuje, co człowiek robi, tylko co z tego wynika o tym, kim on jest. Działania i wytwory to ślady, po których się do tego dochodzi.</p></div>" +
      "<div class='key'><p>Dziedzina filozofii, która bada człowieka i jego działania i wytwory, <b>o ile</b> wskazują one na jego określoną <b>strukturę ontyczną</b> i <b>egzystencjalną pozycję w świecie</b>. (Krąpiec)</p></div>" +
      "<ul><li>Z racji <b>przedmiotu</b>: podstawa dla <b>etyki, estetyki, filozofii kultury</b>.</li>" +
      "<li>Z racji <b>metody</b>: jedna z tzw. <b>metafizyk szczegółowych</b>.</li></ul>" +
      "<p>Skrypt: antropologia <b>zakłada</b> metafizykę ogólną i filozofię przyrody, a <b>wyprzedza</b> psychologię (rozumianą jako nauka o duszy), etykę, estetykę i całą filozofię kultury.</p>" +
      "<aside class='extra'><p>Dlaczego podstawa etyki? Żeby wiedzieć, co jest dobre dla człowieka, trzeba najpierw wiedzieć, kim on jest.</p></aside>" },
    { id: "n10", n: 10, title: "Plan kursu", html:
      "<div class='plain'><p>Ten wykład był wstępem. Najważniejsza będzie część systematyczna: co wiemy o człowieku i jak to uzasadniamy. Historia filozofii pojawi się wybiórczo, już po części systemowej.</p></div>" +
      "<ol><li><b>Wstępna</b>: zagadnienia metodologiczne (ten wykład).</li>" +
      "<li><b>Historyczna</b> (zgodnie z koncepcją historyzmu): najważniejsze koncepcje człowieka od starożytności po współczesność.</li>" +
      "<li><b>Systematyczna</b> (centralna i najistotniejsza): od specyficznie ludzkiego doświadczenia, przez uzasadnienie (uniesprzecznienie) struktury bytowej, do istotnie ludzkich działań.</li></ol>" +
      "<p>Porządek badawczy: <b>od opisu danego faktu do jego uzasadnienia</b>.</p>" +
      "<p><b>Co dalej według tez:</b> fakt ludzki „od zewnątrz” i „od wewnątrz” (Ja i akty „moje”), dusza i ciało, osoba – natura – kultura, poznanie i prawda, działanie (miłość, wolność, moralność, uczucia, dobro i zło), człowiek wobec społeczności, sztuka i piękno, człowiek jako byt religijny, śmierć. Potem historia: źródła biblijne i orfickie, starożytność, średniowiecze (Augustyn, Nemezjusz z Emezy, Boecjusz, Tomasz) i nowożytność (od Kartezjusza po postmodernizm).</p>" +
      "<p><b>Podręcznik:</b> M. A. Krąpiec, „Ja – człowiek”. Wersja skrócona: „Człowiek jako osoba”. Antropologia w pigułce: „Rozmowy z Ojcem Krąpcem: O człowieku”.</p>" +
      "<aside class='extra'><p>Uwaga na dwa „historyzmy”: na slajdzie 09 to pogląd, że człowiek jest wytworem epoki (problem antropologii kulturowej), a w planie kursu to sposób wykładania przedmiotu przez jego dzieje.</p></aside>" }
  ]

  notes: [
    { id: "l1", n: 1, title: "Po co logika", html:
      "<div class='plain'><p>Logika to skrzynka z narzędziami do myślenia i mówienia. Na tym kursie ma się przydać w praktyce: jasno mówić, dobrze argumentować i nie dać się zmanipulować.</p></div>" +
      "<p>Logika jest <b>narzędziem poprawnego myślenia i mówienia</b>.</p>" +
      "<p><b>Działy logiki ogólnej</b> (tradycyjnie):</p><ul><li><b>semiotyka logiczna</b>: teoria języka rozumianego jako system znaków,</li>" +
      "<li><b>logika formalna</b>: teoria wynikania,</li><li><b>metodologia nauk</b>: teoria procedur badawczych i ich wytworów.</li></ul>" +
      "<p><b>Cele zajęć:</b> kultura logiczna (podstawowa aparatura pojęciowa logiki ogólnej), jasne, ścisłe i uporządkowane myślenie i mówienie, argumentowanie, kontrola poprawności argumentów, dostrzeganie manipulacji i radzenie sobie z nią.</p>" +
      "<p>Kurs: wykład 10 h + ćwiczenia 15 h.</p>" },
    { id: "l2", n: 2, title: "Przedmiot materialny i formalny", html:
      "<div class='plain'><p>Każda nauka ma CO bada (przedmiot materialny) i Z JAKIEJ STRONY to bada (przedmiot formalny). Anatom i psycholog badają tego samego człowieka, ale każdy od innej strony.</p></div>" +
      "<ul><li><b>Materialny</b>: wyznaczony przedmiot badań, wzięty w całym uposażeniu.</li><li><b>Formalny</b>: przedmiot materialny rozpatrywany z pewnego punktu widzenia.</li></ul>" +
      "<p><b>Problem przedmiotowy</b> dotyczy rzeczywistości (świata); <b>metaprzedmiotowy</b> dotyczy poglądów na rzeczywistość.</p>" },
    { id: "l3", n: 3, title: "Kto bada język", html:
      "<div class='plain'><p>Język badają cztery rodziny nauk, każda patrzy na niego inaczej. Logika i semiotyka są wśród badań formalnych.</p></div>" +
      "<ul><li><b>humanistyczne</b> (język jako twór człowieka): historia języka, lingwistyka, filologie, psychologia, socjologia, etnolingwistyka;</li>" +
      "<li><b>formalne</b> (język jako struktura): logika formalna, semiotyka, teoria informacji, teoria komunikacji, cybernetyka;</li>" +
      "<li><b>filozoficzne</b> (język jako byt szczególnego rodzaju): filozofia klasyczna uważa język za <b>bierny</b> w poznaniu (Platon, Arystoteles, Krąpiec, Gilson); filozofia współczesna za <b>współtworzący</b> poznanie: szkoła języka idealnego (Cambridge: Frege, Russell, Wittgenstein I, Salamucha) i szkoła języka potocznego (Oxford: Ayer, Wittgenstein II, Strawson, Searle, Austin);</li>" +
      "<li><b>przyrodnicze</b> (język jako zjawisko przyrodnicze): akustyka, fonetyka, fizjologia mowy, logopedia.</li></ul>" },
    { id: "l4", n: 4, title: "Definicja semiotyki", html:
      "<div class='plain'><p>Semiotyka to logiczna teoria języka. Patrzy na język jak na system znaków i sprawdza, jak dobrze służy do poznawania świata i porozumiewania się.</p></div>" +
      "<div class='key'><p>Semiotyka to ogólna, formalna (logiczna) teoria języka rozumianego jako system znakowy, która zajmuje się językiem w aspekcie jego racjonalności i sprawności w aktach poznania i komunikowania.</p></div>" +
      "<p><b>Słowo po słowie:</b></p><ul><li><b>ogólna</b>: poszukuje konstytutywnych własności języka jako takiego;</li>" +
      "<li><b>formalna</b>: nie interesuje się treścią wyrażeń, tylko ich strukturą;</li>" +
      "<li><b>język jako system znakowy</b>: coś uporządkowanego, w czym wskażemy elementy i relacje między nimi oraz między systemem a otoczeniem;</li>" +
      "<li><b>teoria</b>: uporządkowany logicznie i rzeczowo zbiór twierdzeń, który opisuje i wyjaśnia język;</li>" +
      "<li><b>racjonalność i sprawność w poznaniu i komunikowaniu</b>: język jako narzędzie.</li></ul>" +
      "<div class='key'><p>Przedmiot materialny semiotyki: język. Przedmiot formalny: język jako system znaków, będący narzędziem poznania i komunikowania się.</p></div>" },
    { id: "l5", n: 5, title: "Działy semiotyki", html:
      "<div class='plain'><p>Trzy relacje, trzy działy: jak znaki łączą się ze sobą, jak odnoszą się do świata i jak używają ich ludzie.</p></div>" +
      "<div class='tscroll'><table><thead><tr><th>Dział</th><th>Bada relację</th><th>Główne pojęcia</th></tr></thead><tbody>" +
      "<tr><th>Syntaktyka</th><td>znak – znak („od wewnątrz”): własności, funkcje elementów języka, relacje między nimi</td><td>kategorie syntaktyczne, wynikanie, zastępowanie, dowodzenie, tekst, system</td></tr>" +
      "<tr><th>Semantyka</th><td>znak – świat pozajęzykowy</td><td>prawda (Tarski 1933), oznaczanie, denotowanie, desygnowanie, supozycja, model</td></tr>" +
      "<tr><th>Pragmatyka</th><td>znak – użytkownik (twórca, nadawca, odbiorca)</td><td>znaczenie, rozumienie, wyrażanie, komunikowanie, asercja</td></tr>" +
      "</tbody></table></div>" },
    { id: "l6", n: 6, title: "Język i znak", html:
      "<div class='plain'><p>Język to słownik i reguły. Znak to coś, co widzisz lub słyszysz, a co naprowadza cię na coś innego. Zawsze ktoś musi go odczytać, dlatego znak ma trzy człony.</p></div>" +
      "<div class='key'><p>Język jest zbiorem znaków formalnych scharakteryzowanych możliwie jednoznacznie za pomocą reguł używania i służącym grupie ludzi do poznania i komunikowania się.</p></div>" +
      "<p>Struktura formalna: <b>J = {zbiór znaków formalnych, czyli słownik; reguły użycia}</b>.</p>" +
      "<div class='key'><p>Znak to coś podpadającego pod zmysły (zawsze istnieje substrat materialny znaku), przy pomocy czego ktoś (użytkownik znaku) dochodzi do poznania czegoś innego niż ów znak (bytu oznaczanego przez znak).</p></div>" +
      "<p>Dla semiotyki znak to <b>relacja trójczłonowa</b>: <b>coś jest znakiem czegoś dla kogoś</b>.</p>" },
    { id: "l7", n: 7, title: "Rodzaje znaków", html:
      "<div class='plain'><p>Znaki dzielimy na dwa sposoby: skąd się wzięły (natura czy umowa) i czy najpierw zauważasz sam znak, czy od razu rzecz. Słowa to znaki „przezroczyste”: czytając „kot”, myślisz o kocie, nie o literach.</p></div>" +
      "<p><b>Ze względu na genezę:</b> <b>naturalne</b> (związek przyczynowo-skutkowy lub współwystępowanie: dym i ogień), <b>konwencjonalne</b> (ustanowione przez ludzi: czarna opaska i śmierć bliskiej osoby), <b>ikoniczne</b> (ustanowione jak konwencjonalne, ale oparte na podobieństwie: makieta, mapa, zdjęcie).</p>" +
      "<p><b>Ze względu na stosunek do świadomości użytkownika:</b> <b>instrumentalne</b> (działają, o ile same zostaną poznane: ślady) i <b>formalne</b> (odsyłają wprost do przedmiotu: znaki językowe).</p>" +
      "<p><b>Natura znaku językowego:</b> (a) taka sama struktura jak inne znaki (nośnik materialny, relacja trójczłonowa); (b) <b>przezroczysty</b>; (c) <b>wielopostaciowy</b> (różne nośniki bez zmiany znaczenia).</p>" +
      "<p><b>Szczególne typy:</b> symptom (część zjawiska: wysypka), wskaźnik (współwystępuje, pozwala coś odkryć), oznaka (przyczynowo-skutkowo: zamarzanie wody i mróz), indeks (konwencjonalny, identyfikuje, nie charakteryzuje), hasło (umowny znak rozpoznawczy), ślad (pozostałość po zadziałaniu przyczyny), symbol. Konspekt wymienia też kod i sygnał.</p>" },
    { id: "l8", n: 8, title: "Reguły używania znaków", html:
      "<div class='plain'><p>Żeby porozumieć się językiem, trzeba znać trzy rodzaje reguł: jak składać słowa, do czego się odnoszą i co wypada powiedzieć w danej sytuacji. Na egzaminie to pytanie teoretyczne, więc przygotuj własne przykłady.</p></div>" +
      "<ul><li><b>syntaktyczne</b>: <b>składania</b> (konstrukcji: budowanie wyrażeń złożonych) i <b>przekształcania</b> (transformacji: jak przekształcić wyrażenie poprawne, by wynik też był poprawny). Ciąg zbudowany zgodnie z nimi to <b>wyrażenie syntaktycznie spójne</b>;</li>" +
      "<li><b>semantyczne</b>: rządzą odnoszeniem się znaków do rzeczywistości pozajęzykowej;</li>" +
      "<li><b>pragmatyczne</b>: rządzą używaniem wyrażeń w określonych sytuacjach, np. grzeczne zwracanie się do nieznajomych dorosłych.</li></ul>" +
      "<p><b>Afektony</b>: wyrażenia niezgodne z regułami semantycznymi, ale pragmatycznie dopuszczalne, bo wyrażają emocje.</p>" +
      "<aside class='extra'><p>Gotowe przykłady na ustny: syntaktyczna: „kot śpi” jest poprawne, „śpi kot się na” nie; semantyczna: „kot” nazywa koty, nie psy; pragmatyczna: do profesora „Dzień dobry, panie profesorze”, a nie „siema”; afekton: „zabiję cię, jak się spóźnisz” powiedziane do przyjaciela.</p></aside>" },
    { id: "l9", n: 9, title: "Funkcje języka", html:
      "<div class='plain'><p>Językiem nie tylko opisujemy świat. Wyrażamy uczucia, wydajemy polecenia, pytamy, oceniamy, a czasem samym mówieniem coś robimy („ogłaszam”, „obiecuję”). Jedno zdanie zwykle robi kilka z tych rzeczy naraz.</p></div>" +
      "<p><b>Poznawcza (deskryptywna)</b>: opis stanu rzeczy i stwierdzenie, że zachodzi lub nie. Z punktu widzenia semiotyki logicznej <b>najważniejsza</b>.</p>" +
      "<p><b>Pozapoznawcze</b>, np.: informatywna; <b>ekspresywna</b> (stany psychiczne nadawcy); <b>ewokatywna</b> (przeżycie emocjonalne u odbiorcy); <b>perswazyjna</b> (skłonienie do działania lub poglądu); <b>dyrektywna</b> (polecenia); <mark>performatywna</mark> (spowodowanie stanu rzeczy, o którym mówi wyrażenie, przez samo jego wypowiedzenie); <b>interrogatywna</b> (pytania); <b>estymatywna</b> (oceny); terapeutyczna; <b>ludyczna</b> (zabawianie); <b>fatyczna</b> (podtrzymywanie kontaktu); <b>integrująca/dzieląca</b> („swoi” i „obcy”).</p>" +
      "<p>Wyrażenia często pełnią <b>więcej niż jedną funkcję</b>, a <b>struktura gramatyczna nie zawsze odzwierciedla funkcję</b>: „Jak mogłeś mi to zrobić?!” wygląda jak pytanie, ale pełni funkcję ekspresywną, emotywną i oceniającą.</p>" +
      "<aside class='extra'><p>Performatyw rozpoznasz po tym, że zwykle jest w 1. osobie czasu teraźniejszego i da się dodać „niniejszym”: „niniejszym ogłaszam”, „niniejszym przepraszam”. „Obiecałem” to już tylko relacja, a nie performatyw.</p></aside>" },
    { id: "l10", n: 10, title: "Typy języków", html:
      "<div class='plain'><p>Języki dzielimy na cztery sposoby. Najważniejszy praktycznie jest ostatni: czy mówimy o świecie, czy o słowach. Pomylenie tych poziomów to klasyczne zadanie z kartki („mysz to sylaba”).</p></div>" +
      "<ul><li><b>geneza</b>: naturalne (spontaniczne, etniczne), sztuczne (zaprojektowane, np. komputerowe), mieszane (esperanto);</li>" +
      "<li><b>najmniejsza jednostka</b>: obrazkowe, pojęciowe, sylabiczne, literowe/głoskowe;</li>" +
      "<li><b>spójniki (funktory)</b>: ekstensjonalne i intensjonalne;</li>" +
      "<li><b>poziom mówienia</b>: <b>język przedmiotowy</b> (o świecie: kot ma cztery łapy) i <b>metajęzyk</b> (o wyrażeniach: „kot” jest rzeczownikiem).</li></ul>" +
      "<p>Konspekt przypomina też, że języki wymierają: Sercquiais z wyspy Sark ma już tylko trzech rodzimych użytkowników.</p>" }
  ]

      a: "Robot też przyjmuje informacje i reaguje. Ty dodatkowo coś przeżywasz: czerwień jest dla ciebie jakaś, ból boli. Wykład: doświadczeń subiektywnych nikt dobrze nie rozumie, ale to one nas wyróżniają. Pytanie, jak procesom fizycznym w mózgu towarzyszy przeżycie, to problem umysł–ciało. ★ Filozof David Chalmers nazwał je „trudnym problemem świadomości”.",
      link: "★ Połączenie z Antropologią: dychotomia „dualizm – monizm – jedność duszy i ciała”." },
    { q: "Tylko około 4 rzeczy naraz",
      a: "Według wykładu tylko około 4 reprezentacje poznawcze mogą zostać „zraportowane”, bo zmieniają się co chwilę. ★ Zgadza się to z badaniami pojemności pamięci roboczej (Nelson Cowan: około 4 elementy).",
      link: "Zestaw to z 10 bitami na sekundę: świadomy umysł to bardzo wąskie gardło." },
    { q: "Dlaczego możesz zareagować, zanim wiesz na co?",
      a: "Na schemacie „od bodźca do spostrzeżenia” strzałka do działania wychodzi już z organizacji percepcyjnej (etap 5), a nie dopiero z rozpoznania (etap 6). Dlatego działanie może nastąpić „także bez pełnego świadomego rozpoznania”: łapiesz spadający kubek, zanim pomyślisz „kubek”. ★ Pasuje to do koncepcji Milnera i Goodale’a: w mózgu są dwie drogi wzrokowe, jedna służy rozpoznawaniu („co to jest”), druga sterowaniu ruchem („jak to złapać”).",
      link: "Możliwe, że wróci przy percepcji wzrokowej (wykłady 3–4)." },
    { q: "Schopenhauer: czy masz wpływ na swoje myśli?",
      a: "Na wykładzie padło odwołanie do Schopenhauera: nie mamy wpływu na to, co myślimy, ani na nasze decyzje, jedynie ich doświadczamy. ★ Jego najsłynniejsze zdanie na ten temat: „Człowiek może robić, co chce, ale nie może chcieć tego, co chce”.",
      link: "★ Połączenie z Antropologią: dychotomia „wolność – konieczność”." },
    { q: "Miliard bitów wchodzi, dziesięć zostaje",
      a: "Układ nerwowy dostaje około 10⁹ bitów na sekundę, a świadomie używamy około 10. To stosunek mniej więcej 100 milionów do jednego. Bez filtra, czyli uwagi, bylibyśmy zalani bodźcami.",
      link: "Do zapamiętania liczby i autorzy: Zheng i Meister, 2025." },
    { q: "Kiedy behawioryzm „się wywalił”?",
      a: "W notatkach zapisano, że psychologia poznawcza wyłoniła się w latach 90. ★ W podręcznikach zwrot poznawczy datuje się na lata 50.–60. XX wieku (np. książka Ulrica Neissera „Cognitive Psychology”, 1967). Lata 90. to „dekada mózgu” i rozkwit neuronauki poznawczej, więc możliwe, że chodziło o połączenie umysłu z mózgiem.",
      link: "Warto dopytać prowadzącego albo sprawdzić w slajdach, jeśli je udostępni." }
