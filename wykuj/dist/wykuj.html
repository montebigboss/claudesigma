<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wykuj</title>
    <meta name="description" content="Nauka materiału z wykładów: ścieżka lekcji, fiszki, quiz na czas, pary, sortownia i egzamin próbny." />
    <style>
@import url("https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;700;800&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap");

/* Kartka w kratkę i kredki: papier zeszytu, zielony ołówek jako akcent,
   cztery kredki do quizu. Jedna kolumna do 720 px, wszystko w kciuku. */
:root {
  --paper: #eef2ec;
  --grid: #dde6de;
  --surface: #fbfcfa;
  --surface-2: #e4ebe4;
  --ink: #1d2321;
  --ink-2: #4b5551;
  --ink-3: #78837e;
  --line: #ccd6ce;
  --accent: #1e8a4c;
  --accent-2: #146a38;
  --accent-soft: #d3eedc;
  --on-accent: #ffffff;
  --red: #cf3a35;
  --red-2: #a42a26;
  --red-soft: #f8dcd9;
  --gold: #c98e00;
  --gold-2: #9c6e00;
  --gold-soft: #fbefc8;
  --blue: #2f64d6;
  --blue-soft: #dce6fb;
  --violet: #8248bb;
  --violet-soft: #ece0f7;
  --k-red: #e0413a;
  --k-blue: #2c6be0;
  --k-yellow: #d99b00;
  --k-green: #1f9a55;
  --shadow: 0 1px 0 var(--line), 0 6px 18px -12px rgba(20, 40, 30, 0.35);

  --f-display: "Shantell Sans", "Comic Neue", "Segoe Print", ui-rounded, system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;

  --r: 14px;
  --r-lg: 20px;
  --tap: 52px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121614;
    --grid: #1b211e;
    --surface: #1a201d;
    --surface-2: #242c28;
    --ink: #e7ece8;
    --ink-2: #b2bcb6;
    --ink-3: #849089;
    --line: #313b36;
    --accent: #45cc80;
    --accent-2: #24945a;
    --accent-soft: #183a27;
    --on-accent: #0b1a12;
    --red: #ff6c64;
    --red-2: #b7403a;
    --red-soft: #3d1e1c;
    --gold: #f2bc3a;
    --gold-2: #b98a17;
    --gold-soft: #3a3013;
    --blue: #86a9ff;
    --blue-soft: #1d2843;
    --violet: #c9a0f2;
    --violet-soft: #2e2341;
    --k-red: #e5544d;
    --k-blue: #3f7bea;
    --k-yellow: #e0a614;
    --k-green: #2aa862;
    --shadow: 0 1px 0 var(--line), 0 8px 20px -14px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121614;
  --grid: #1b211e;
  --surface: #1a201d;
  --surface-2: #242c28;
  --ink: #e7ece8;
  --ink-2: #b2bcb6;
  --ink-3: #849089;
  --line: #313b36;
  --accent: #45cc80;
  --accent-2: #24945a;
  --accent-soft: #183a27;
  --on-accent: #0b1a12;
  --red: #ff6c64;
  --red-2: #b7403a;
  --red-soft: #3d1e1c;
  --gold: #f2bc3a;
  --gold-2: #b98a17;
  --gold-soft: #3a3013;
  --blue: #86a9ff;
  --blue-soft: #1d2843;
  --violet: #c9a0f2;
  --violet-soft: #2e2341;
  --k-red: #e5544d;
  --k-blue: #3f7bea;
  --k-yellow: #e0a614;
  --k-green: #2aa862;
  --shadow: 0 1px 0 var(--line), 0 8px 20px -14px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html,
body {
  min-height: 100%;
}
body {
  margin: 0;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-attachment: fixed;
  color: var(--ink);
  font: 400 16px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 720px;
  margin: 0 auto;
  padding-inline: 16px;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:disabled {
  cursor: default;
}
:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}
h1,
h2,
h3 {
  text-wrap: balance;
  margin: 0;
}
p {
  margin: 0;
}
.display {
  font-family: var(--f-display);
  font-weight: 800;
  letter-spacing: -0.01em;
}
.eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.ic {
  width: 1.25em;
  height: 1.25em;
  flex: none;
}
.ic.flip {
  transform: scaleX(-1);
}
kbd {
  font: 700 11px/1 var(--f-body);
  min-width: 20px;
  padding: 4px 5px;
  border-radius: 6px;
  border: 1.5px solid var(--line);
  color: var(--ink-3);
  text-align: center;
}
@media (hover: none) {
  kbd {
    display: none !important;
  }
}

/* ---------- buttons ---------- */
.btn {
  min-height: var(--tap);
  padding: 0 22px;
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.02em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 4px 0 var(--line);
  transition: transform 0.06s, box-shadow 0.06s, background 0.15s;
}
.btn:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: 0 0 0 var(--line);
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 4px 0 var(--accent-2);
}
.btn.primary:active:not(:disabled) {
  box-shadow: 0 0 0 var(--accent-2);
}
.btn.primary:disabled {
  background: var(--surface-2);
  border-color: var(--surface-2);
  color: var(--ink-3);
  box-shadow: 0 4px 0 var(--line);
}
.btn.ghost {
  background: transparent;
}
.btn.danger {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
  box-shadow: 0 4px 0 var(--red-2);
}
.btn.danger-ghost {
  background: transparent;
  color: var(--red);
  border-color: var(--red-soft);
  box-shadow: 0 4px 0 var(--red-soft);
}
.btn.big {
  min-height: 60px;
  font-size: 18px;
  width: 100%;
}
.icon-btn {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 0;
  background: transparent;
  color: var(--ink-2);
  display: grid;
  place-items: center;
}
.icon-btn:hover {
  background: var(--surface-2);
}
.icon-btn .ic {
  width: 24px;
  height: 24px;
}
.pill-btn {
  border: 2px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
  white-space: nowrap;
}
.row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.row .btn {
  flex: 1 1 140px;
}

/* ---------- top bars ---------- */
.topbar,
.apphead {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: 10px;
  background: var(--paper);
  margin-inline: -16px;
  padding-inline: 8px 16px;
  border-bottom: 2px solid var(--line);
}
.tb-title {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  line-height: 1.25;
}
.tb-title b {
  font-family: var(--f-display);
  font-size: 19px;
}
.tb-title span {
  font-size: 13px;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tb-right {
  display: flex;
  align-items: center;
}
.clock {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--ink-2);
}
.page {
  padding-block: 20px 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ---------- shared ---------- */
.lbar {
  flex: 1;
  height: 16px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
}
.lbar i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--accent);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12), inset 0 4px 0 rgba(255, 255, 255, 0.25);
  transition: width 0.4s cubic-bezier(0.3, 1.4, 0.5, 1);
}
.lbar.slim {
  height: 10px;
  flex: none;
}
.src {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  white-space: nowrap;
}
.src-u {
  background: var(--blue-soft);
  color: var(--blue);
}
.src-d {
  background: var(--violet-soft);
  color: var(--violet);
}
.src-redo {
  background: var(--red-soft);
  color: var(--red);
}
.stars {
  display: inline-flex;
  gap: 2px;
}
.st {
  color: var(--line);
  display: inline-flex;
}
.st .ic {
  fill: currentColor;
}
.st.on {
  color: var(--gold);
}
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(10, 16, 13, 0.55);
  display: grid;
  place-items: center;
  padding: 16px;
}
.modal-card {
  width: min(420px, 100%);
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  border: 2px solid var(--line);
}
.modal-card h3 {
  font-family: var(--f-display);
  font-size: 22px;
}
.modal-card p {
  color: var(--ink-2);
}
#toasts {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(380px, calc(100% - 32px));
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: var(--paper);
  border-radius: var(--r);
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  animation: toastIn 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
}
.toast span {
  font-size: 14px;
  opacity: 0.8;
}
.toast.gold {
  background: var(--gold);
  color: #1f1600;
}
.toast.green {
  background: var(--accent);
  color: var(--on-accent);
}
.toast.out {
  opacity: 0;
  transform: translateY(-10px);
  transition: 0.35s;
}
@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(-16px) scale(0.96);
  }
}
.confetti {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 40;
}
.empty {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding-block: 40px;
}
.empty h2 {
  font-family: var(--f-display);
  font-size: 26px;
}
.empty p {
  color: var(--ink-2);
  max-width: 44ch;
}
.empty-ic {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
}
.empty-ic .ic {
  width: 36px;
  height: 36px;
}
.switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.switch input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}
.switch > span {
  width: 46px;
  height: 28px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 2px solid var(--line);
  position: relative;
  flex: none;
  transition: background 0.2s;
}
.switch > span::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--ink-3);
  transition: transform 0.2s, background 0.2s;
}
.switch input:checked + span {
  background: var(--accent);
  border-color: var(--accent);
}
.switch input:checked + span::after {
  transform: translateX(18px);
  background: var(--on-accent);
}
.switch input:focus-visible + span {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}
.search {
  width: 100%;
  min-height: 48px;
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 0 14px;
  font: inherit;
}

/* ---------- home ---------- */
.apphead {
  padding-inline: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}
.brand .display {
  font-size: 26px;
}
.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--on-accent);
  display: grid;
  place-items: center;
  transform: rotate(-6deg);
}
.hstats {
  display: flex;
  align-items: center;
  gap: 6px;
}
.hs {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  padding: 4px 8px;
  color: var(--ink-3);
}
.hs.streak.on {
  color: var(--k-red);
}
.hs.streak.on .ic {
  fill: currentColor;
}
.hs.xp {
  color: var(--blue);
}
.cloud {
  display: inline-flex;
  color: var(--ink-3);
  padding: 4px;
}
.cloud.ok {
  color: var(--accent);
}
.cloud.syncing {
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  to {
    opacity: 0.3;
  }
}
.today {
  display: flex;
  gap: 18px;
  align-items: center;
  padding-block: 8px;
}
.ring {
  width: 96px;
  height: 96px;
  position: relative;
  flex: none;
}
.ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.ring circle {
  fill: none;
  stroke-width: 8;
}
.ring-bg {
  stroke: var(--surface-2);
}
.ring-fg {
  stroke: var(--accent);
  stroke-linecap: round;
  transition: stroke-dashoffset 0.8s;
}
.ring span {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  font-size: 13px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.ring b {
  display: block;
  font-size: 24px;
  color: var(--ink);
  font-family: var(--f-display);
  line-height: 1;
}
.today-txt {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  flex: 1;
}
.today-txt h1 {
  font-size: clamp(22px, 5vw, 30px);
  line-height: 1.15;
}
.today-txt p {
  color: var(--ink-2);
}
.rankline {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-3);
  margin-top: 6px;
}
.rbar {
  flex: 1;
  height: 8px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
  min-width: 40px;
}
.rbar i {
  display: block;
  height: 100%;
  background: var(--gold);
  border-radius: inherit;
}
.cta {
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  width: 100%;
  padding: 16px;
  border-radius: var(--r-lg);
  background: var(--accent);
  color: var(--on-accent);
  border: 0;
  box-shadow: 0 6px 0 var(--accent-2);
  transition: transform 0.06s, box-shadow 0.06s;
}
.cta:active {
  transform: translateY(6px);
  box-shadow: 0 0 0 var(--accent-2);
}
.cta-ic {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.18);
  display: grid;
  place-items: center;
  flex: none;
}
.cta-ic .ic {
  width: 30px;
  height: 30px;
}
.cta-t {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.cta-t small {
  opacity: 0.85;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
}
.cta-t b {
  font-family: var(--f-display);
  font-size: 21px;
  line-height: 1.2;
}
.cta-t span {
  opacity: 0.9;
  font-size: 14px;
}
.cta-go {
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 13px;
  background: var(--on-accent);
  color: var(--accent);
  padding: 8px 12px;
  border-radius: 10px;
}
.todo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.todo-i {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
  text-align: left;
  font-size: 14px;
  color: var(--ink-2);
  box-shadow: 0 3px 0 var(--line);
}
.todo-i b {
  font-size: 18px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.todo-i .ic {
  color: var(--blue);
  width: 26px;
  height: 26px;
}
.todo-i:disabled {
  opacity: 0.55;
  box-shadow: none;
}
.course {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}
.course h2 {
  font-size: 24px;
  line-height: 1.2;
  margin-bottom: 8px;
}
.mods {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.modcard {
  display: flex;
  align-items: stretch;
  gap: 14px;
  padding: 14px;
  border-radius: var(--r-lg);
  border: 2px solid var(--line);
  background: var(--surface);
  text-align: left;
  box-shadow: 0 4px 0 var(--line);
}
.modcard.ghost {
  background: transparent;
  border-style: dashed;
  box-shadow: none;
  color: var(--ink-3);
}
.mc-num {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 34px;
  width: 52px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
  flex: none;
}
.modcard.ghost .mc-num {
  background: var(--surface-2);
  color: var(--ink-3);
}
.mc-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.mc-body small {
  color: var(--ink-3);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.mc-body b {
  font-family: var(--f-display);
  font-size: 20px;
}
.mc-bar {
  height: 8px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
  margin-top: 4px;
}
.mc-bar i {
  display: block;
  height: 100%;
  background: var(--accent);
}
.mc-meta {
  font-size: 13px;
  color: var(--ink-3);
}

/* ---------- module ---------- */
.mhero {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.mhero h1 {
  font-size: clamp(36px, 9vw, 56px);
  line-height: 1;
  text-decoration: underline wavy var(--accent);
  text-decoration-thickness: 3px;
  text-underline-offset: 10px;
  margin-bottom: 8px;
}
.lect {
  color: var(--ink-2);
}
.mprog {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.mprog-bar {
  flex: 1;
  height: 12px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
}
.mprog-bar i {
  display: block;
  height: 100%;
  background: var(--accent);
}
.mfacts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  font-size: 13px;
  color: var(--ink-2);
}
.mfacts span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.mfacts .ic {
  color: var(--ink-3);
  width: 16px;
  height: 16px;
}
.modes {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.mode {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  padding: 16px;
  text-align: left;
  border-radius: var(--r-lg);
  border: 2px solid var(--line);
  background: var(--surface);
  box-shadow: 0 4px 0 var(--line);
  transition: transform 0.06s, box-shadow 0.06s;
}
.mode:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 var(--line);
}
.mode b {
  font-family: var(--f-display);
  font-size: 19px;
  line-height: 1.2;
}
.mode-ic {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  color: var(--ink-2);
  position: relative;
  margin-bottom: 6px;
}
.mode-ic .ic {
  width: 24px;
  height: 24px;
}
.badge {
  position: absolute;
  top: -6px;
  right: -8px;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--red);
  color: #fff;
  font: 700 12px/22px var(--f-body);
  text-align: center;
}
.mode-d {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.35;
}
.mode-m {
  margin-top: auto;
  padding-top: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-3);
  letter-spacing: 0.03em;
}
.mode.hero {
  grid-column: 1 / -1;
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent);
  box-shadow: 0 5px 0 var(--accent-2);
}
.mode.hero .mode-ic {
  background: rgba(255, 255, 255, 0.2);
  color: inherit;
}
.mode.hero .mode-d,
.mode.hero .mode-m {
  color: inherit;
  opacity: 0.9;
}
.mode:last-child:nth-child(even) {
  grid-column: 1 / -1;
}
.mode.off {
  opacity: 0.6;
}
.mode[data-go="cards"] .mode-ic {
  color: var(--blue);
  background: var(--blue-soft);
}
.mode[data-go="kahoot"] .mode-ic {
  color: var(--k-red);
  background: var(--red-soft);
}
.mode[data-go="match"] .mode-ic {
  color: var(--violet);
  background: var(--violet-soft);
}
.mode[data-go="sort"] .mode-ic {
  color: var(--gold);
  background: var(--gold-soft);
}
.mode[data-go="exam"] .mode-ic {
  color: var(--ink);
}
.mode[data-go="review"] .mode-ic {
  color: var(--red);
  background: var(--red-soft);
}
.mode[data-go="notes"] .mode-ic {
  color: var(--accent);
  background: var(--accent-soft);
}

/* ---------- path ---------- */
.path {
  list-style: none;
  margin: 0;
  padding: 12px 0 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}
.node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transform: translateX(var(--x));
  position: relative;
}
.nbtn {
  width: 76px;
  height: 70px;
  border-radius: 50%;
  border: 0;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  color: var(--ink-3);
  box-shadow: 0 7px 0 var(--line);
  transition: transform 0.06s, box-shadow 0.06s;
}
.nbtn .ic {
  width: 32px;
  height: 32px;
}
.nbtn:active {
  transform: translateY(6px);
  box-shadow: 0 1px 0 var(--line);
}
.node.open .nbtn {
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 7px 0 var(--accent-2);
}
.node.done .nbtn {
  background: var(--gold);
  color: #2a1d00;
  box-shadow: 0 7px 0 var(--gold-2);
}
.node.boss .nbtn {
  width: 92px;
  height: 84px;
}
.node.current .nbtn {
  animation: bob 1.6s ease-in-out infinite;
}
.node.current .nbtn::after {
  content: "";
  position: absolute;
  inset: -9px;
  border-radius: 50%;
  border: 4px solid var(--accent-soft);
}
.node .nbtn {
  position: relative;
}
@keyframes bob {
  50% {
    transform: translateY(-4px);
  }
}
.stars-ph {
  height: 20px;
}
.node .stars .ic {
  width: 18px;
  height: 18px;
}
.nlabel {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
  max-width: 140px;
  text-align: center;
  line-height: 1.25;
}
.node.locked .nlabel {
  color: var(--ink-3);
}
.start-tag {
  position: absolute;
  top: -32px;
  background: var(--surface);
  border: 2px solid var(--line);
  color: var(--accent);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 10px;
  animation: bob 1.6s ease-in-out infinite;
  z-index: 1;
}
.bubble {
  margin-top: 8px;
  width: min(300px, calc(100vw - 48px));
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: center;
  box-shadow: var(--shadow);
  transform: translateX(calc(var(--x) * -1));
  animation: pop 0.2s cubic-bezier(0.3, 1.5, 0.5, 1);
}
.bubble b {
  font-family: var(--f-display);
  font-size: 19px;
}
.bubble span,
.bubble small {
  color: var(--ink-2);
  font-size: 14px;
}
@keyframes pop {
  from {
    transform: translateX(calc(var(--x, 0px) * -1)) scale(0.9);
    opacity: 0;
  }
}

/* ---------- lesson ---------- */
.lesson {
  display: flex;
  flex-direction: column;
  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.l-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-block: 14px 6px;
}
.hearts {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--k-red);
  font-weight: 800;
  font-size: 18px;
  font-variant-numeric: tabular-nums;
}
.hearts .ic {
  fill: currentColor;
  width: 26px;
  height: 26px;
}
.combo {
  align-self: center;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  color: var(--k-red);
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.combo .ic {
  fill: currentColor;
}
.combo.pop {
  animation: popc 0.4s cubic-bezier(0.3, 1.8, 0.5, 1);
}
@keyframes popc {
  from {
    transform: scale(0.6);
  }
}
.l-body {
  flex: 1;
  padding-block: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.l-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.l-label {
  font-weight: 700;
  color: var(--ink-3);
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.l-q {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(21px, 5vw, 27px);
  line-height: 1.3;
}
.l-ex {
  margin-top: 6px;
}
.l-foot {
  position: sticky;
  bottom: 0;
  margin-inline: -16px;
  padding: 14px 16px calc(14px + var(--safe-b));
  background: var(--paper);
  border-top: 2px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.l-foot-row {
  display: flex;
  gap: 12px;
  justify-content: space-between;
}
.l-foot-row .btn.primary {
  flex: 1;
  max-width: 320px;
  margin-left: auto;
}
.l-foot.ok {
  background: var(--accent-soft);
  border-top-color: transparent;
}
.l-foot.bad {
  background: var(--red-soft);
  border-top-color: transparent;
}
.l-foot.bad .btn.primary {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
  box-shadow: 0 4px 0 var(--red-2);
}
.fb {
  display: flex;
  flex-direction: column;
  gap: 4px;
  animation: slideUp 0.22s ease-out;
}
@keyframes slideUp {
  from {
    transform: translateY(12px);
    opacity: 0;
  }
}
.fb-h {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--f-display);
  font-size: 22px;
}
.l-foot.ok .fb-h {
  color: var(--accent);
}
.l-foot.bad .fb-h,
.l-foot.bad .fb-a {
  color: var(--red);
}
.fb-h .ic {
  width: 28px;
  height: 28px;
  stroke-width: 3;
}
.fb-a {
  font-weight: 700;
}
.fb-x {
  color: var(--ink-2);
  font-size: 15px;
}
.shake {
  animation: shake 0.35s;
}
@keyframes shake {
  20%,
  60% {
    transform: translateX(-6px);
  }
  40%,
  80% {
    transform: translateX(6px);
  }
}

/* ---------- exercises ---------- */
.opts {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.opts-tf {
  flex-direction: row;
}
.opts-tf .opt {
  flex: 1;
  justify-content: center;
  font-size: 18px;
  min-height: 72px;
}
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 14px 16px;
  min-height: var(--tap);
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
  box-shadow: 0 4px 0 var(--line);
  line-height: 1.35;
  transition: transform 0.06s, box-shadow 0.06s, border-color 0.15s, background 0.15s;
}
.opt:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--line);
}
.opt.sel {
  border-color: var(--blue);
  background: var(--blue-soft);
  box-shadow: 0 4px 0 var(--blue);
}
.opt.sel kbd {
  border-color: var(--blue);
  color: var(--blue);
}
.locked .opt {
  pointer-events: none;
}
.opt.right {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 4px 0 var(--accent);
}
.opt.wrong {
  border-color: var(--red);
  background: var(--red-soft);
  box-shadow: 0 4px 0 var(--red);
}
.cloze-s {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(21px, 5vw, 27px);
  line-height: 1.6;
}
.blank {
  display: inline-block;
  min-width: 120px;
  border-bottom: 3px dashed var(--ink-3);
  text-align: center;
  padding: 0 6px;
  color: var(--blue);
}
.blank.filled {
  border-bottom-style: solid;
  border-color: var(--blue);
}
.blank.right {
  color: var(--accent);
  border-color: var(--accent);
}
.blank.wrong {
  color: var(--red);
  border-color: var(--red);
  text-decoration: line-through;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  min-height: 48px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--surface);
  box-shadow: 0 3px 0 var(--line);
  font-weight: 600;
}
.chip.sel {
  border-color: var(--blue);
  background: var(--blue-soft);
  box-shadow: 0 3px 0 var(--blue);
}
.locked .chip {
  pointer-events: none;
}
.typed input {
  width: 100%;
  min-height: 60px;
  padding: 0 16px;
  font: 600 20px var(--f-body);
  color: var(--ink);
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
}
.typed input:focus {
  outline: none;
  border-color: var(--blue);
}
.typed input.right {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.typed input.wrong {
  border-color: var(--red);
  background: var(--red-soft);
}
.hint {
  margin-top: 8px;
  color: var(--ink-3);
  font-size: 14px;
}
.match,
.mg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.mcol {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.tile {
  min-height: 60px;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
  box-shadow: 0 4px 0 var(--line);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  overflow-wrap: anywhere;
  transition: transform 0.06s, opacity 0.3s, border-color 0.15s, background 0.15s;
}
.tile.big {
  min-height: 72px;
}
.tile.sel {
  border-color: var(--blue);
  background: var(--blue-soft);
  box-shadow: 0 4px 0 var(--blue);
}
.tile.done {
  border-color: var(--accent-soft);
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: none;
  opacity: 0.55;
  pointer-events: none;
}
.tile.bad {
  border-color: var(--red);
  background: var(--red-soft);
  animation: shake 0.35s;
}
.sortex {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.srow {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
  flex-wrap: wrap;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
}
.stext {
  font-weight: 600;
  min-width: 0;
  flex: 1 1 160px;
}
.sbtns {
  display: flex;
  gap: 6px;
}
.sb {
  min-height: 40px;
  padding: 0 12px;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: var(--surface-2);
  font-size: 14px;
  font-weight: 700;
}
.sb.sel {
  border-color: var(--blue);
  background: var(--blue-soft);
  color: var(--blue);
}
.locked .sb {
  pointer-events: none;
}
.srow.right {
  border-color: var(--accent);
}
.srow.wrong {
  border-color: var(--red);
  background: var(--red-soft);
}

/* ---------- result ---------- */
.result {
  padding-block: 40px 48px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  align-items: stretch;
}
.r-hero {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.r-stars .ic {
  width: 52px;
  height: 52px;
}
.r-stars .st {
  animation: starIn 0.5s cubic-bezier(0.3, 1.8, 0.5, 1) both;
}
.r-stars .st:nth-child(2) {
  animation-delay: 0.15s;
  transform: translateY(-10px);
}
.r-stars .st:nth-child(3) {
  animation-delay: 0.3s;
}
@keyframes starIn {
  from {
    transform: scale(0) rotate(-40deg);
  }
}
.r-hero h1 {
  font-size: clamp(40px, 11vw, 64px);
  line-height: 1;
  color: var(--accent);
}
.result.fail .r-hero h1 {
  color: var(--red);
}
.r-sub {
  color: var(--ink-2);
  max-width: 46ch;
}
.r-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}
.r-stat {
  border: 2px solid var(--line);
  border-radius: var(--r);
  padding: 10px 12px;
  background: var(--surface);
  display: flex;
  flex-direction: column;
}
.r-stat span {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
}
.r-stat b {
  font-size: 22px;
  font-variant-numeric: tabular-nums;
}
.r-stat.good b {
  color: var(--accent);
}
.r-stat.bad b {
  color: var(--red);
}
.r-stat.gold b {
  color: var(--gold);
}
.r-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.r-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.r-list li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface);
  border: 2px solid var(--line);
  font-size: 14px;
}
.r-list b {
  color: var(--accent);
  white-space: nowrap;
}
.stamp {
  align-self: center;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 30px;
  letter-spacing: 0.12em;
  padding: 6px 18px;
  border: 4px solid currentColor;
  border-radius: 10px;
  transform: rotate(-7deg);
  animation: stamp 0.45s cubic-bezier(0.3, 1.6, 0.5, 1) both 0.2s;
}
.stamp.pass {
  color: var(--accent);
}
.stamp.fail {
  color: var(--red);
}
@keyframes stamp {
  from {
    transform: rotate(-7deg) scale(2.2);
    opacity: 0;
  }
}
.r-h {
  font-family: var(--f-display);
  font-size: 20px;
}
.review {
  margin: 0;
  padding-left: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.review li {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.review p {
  font-weight: 700;
}
.rv-bad {
  color: var(--red);
  font-size: 14px;
}
.rv-good {
  color: var(--accent);
  font-size: 14px;
  font-weight: 700;
}
.rv-x {
  color: var(--ink-2);
  font-size: 14px;
}

/* ---------- flashcards ---------- */
.fc-wrap {
  perspective: 1400px;
}
.fc {
  display: block;
  width: 100%;
  min-height: 300px;
  border: 0;
  padding: 0;
  background: none;
  text-align: left;
}
.fc-in {
  position: relative;
  display: grid;
  min-height: 300px;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.3, 1.3, 0.5, 1);
}
.fc.flipped .fc-in {
  transform: rotateY(180deg);
}
.fc-face {
  grid-area: 1 / 1;
  position: relative;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--r-lg);
  border: 2px solid var(--line);
  background: var(--surface);
  box-shadow: 0 6px 0 var(--line);
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  overflow: auto;
}
.fc-front {
  background-image: linear-gradient(var(--surface) 31px, var(--accent-soft) 32px);
  background-size: 100% 32px;
}
.fc-back {
  transform: rotateY(180deg);
  border-color: var(--accent);
  box-shadow: 0 6px 0 var(--accent-2);
}
.fc-face h2 {
  font-size: clamp(28px, 7vw, 40px);
  line-height: 1.1;
}
.fc-face p {
  font-size: 18px;
  line-height: 1.5;
}
.fc-face .src {
  align-self: flex-start;
}
.fc-k {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}
.fc-box {
  position: absolute;
  top: 14px;
  right: 16px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-3);
}
.fc-small {
  color: var(--ink-2);
}
.fc-tip {
  text-align: center;
  color: var(--ink-3);
  font-size: 14px;
}
.grade {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.grade .btn {
  padding: 0 8px;
  font-size: 15px;
  flex-direction: column;
  gap: 2px;
  min-height: 64px;
}
.g-again {
  color: var(--red);
}
.g-hard {
  color: var(--gold);
}
.g-good {
  background: var(--accent) !important;
  border-color: var(--accent) !important;
  color: var(--on-accent);
  box-shadow: 0 4px 0 var(--accent-2) !important;
}
.boxes {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
}
.box {
  border-radius: 10px;
  padding: 8px 2px;
  text-align: center;
  background: var(--surface);
  border: 2px solid var(--line);
  display: flex;
  flex-direction: column;
}
.box b {
  font-size: 18px;
  font-variant-numeric: tabular-nums;
}
.box span {
  font-size: 10px;
  color: var(--ink-3);
  font-weight: 700;
}
.box.b3,
.box.b4,
.box.b5 {
  border-color: var(--accent);
}
.box.b5 {
  background: var(--accent-soft);
}

/* ---------- kahoot ---------- */
.kh {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  padding-block: 10px 20px;
}
.kh-intro {
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 16px;
}
.kh-intro p {
  color: var(--ink-2);
  max-width: 34ch;
}
.kh-eyebrow {
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--k-red) !important;
}
.kh-count {
  font-size: 140px;
  line-height: 1;
  color: var(--k-blue);
  animation: popc 0.5s cubic-bezier(0.3, 1.8, 0.5, 1);
}
.kh-top {
  display: flex;
  align-items: center;
  gap: 10px;
}
.kh-n {
  flex: 1;
  font-weight: 700;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.kh-score {
  font-variant-numeric: tabular-nums;
  background: var(--ink);
  color: var(--paper);
  padding: 6px 12px;
  border-radius: 10px;
  font-size: 14px;
}
.kh-score b {
  font-size: 18px;
}
.kh-q {
  background: var(--surface);
  border-radius: var(--r-lg);
  border: 2px solid var(--line);
  padding: 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.kh-q h2 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(20px, 5vw, 26px);
  line-height: 1.3;
}
.kh-timer {
  display: flex;
  align-items: center;
  gap: 12px;
}
.kh-sec {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--violet);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  flex: none;
}
.kh-tbar {
  flex: 1;
  height: 10px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
}
.kh-tbar i {
  display: block;
  height: 100%;
  width: 100%;
  background: var(--violet);
  transition: width linear;
}
.kh-tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  flex: 1;
}
.kt {
  border: 0;
  border-radius: var(--r);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 14px;
  min-height: 92px;
  font-weight: 700;
  font-size: 16px;
  line-height: 1.3;
  position: relative;
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.2);
  transition: transform 0.08s, opacity 0.3s, filter 0.3s;
}
.kt:active {
  transform: scale(0.97);
}
.kt kbd {
  position: absolute;
  top: 6px;
  right: 8px;
  border-color: rgba(255, 255, 255, 0.5);
  color: rgba(255, 255, 255, 0.85);
}
.kt-ic {
  width: 28px !important;
  height: 28px !important;
}
.kt.k-red {
  background: var(--k-red);
}
.kt.k-blue {
  background: var(--k-blue);
}
.kt.k-yellow {
  background: var(--k-yellow);
  color: #241900;
}
.kt.k-green {
  background: var(--k-green);
}
.kt.dim {
  opacity: 0.28;
  filter: saturate(0.4);
}
.kt.right {
  outline: 4px solid var(--ink);
  outline-offset: 3px;
}
.kt.wrong {
  opacity: 0.5;
}
.kh-tiles.two .kt {
  min-height: 140px;
  font-size: 22px;
  justify-content: center;
}
.kh-reveal {
  position: sticky;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  justify-content: space-between;
  padding: 14px 16px calc(14px + var(--safe-b));
  margin-inline: -16px;
  animation: slideUp 0.22s ease-out;
}
.kh-reveal > div {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.kh-reveal b {
  font-family: var(--f-display);
  font-size: 22px;
}
.kh-reveal p {
  font-size: 14px;
  color: var(--ink-2);
}
.kh-reveal.ok {
  background: var(--accent-soft);
}
.kh-reveal.ok b {
  color: var(--accent);
}
.kh-reveal.bad {
  background: var(--red-soft);
}
.kh-reveal.bad b {
  color: var(--red);
}
.kh-streak {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 800;
  color: var(--k-red);
  font-size: 13px;
  text-transform: uppercase;
}
.kh-streak .ic {
  fill: currentColor;
}

/* ---------- match game ---------- */
.mg-info {
  color: var(--ink-2);
  font-size: 14px;
}

/* ---------- sort ---------- */
.deck-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.deck {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  padding: 16px;
  border-radius: var(--r-lg);
  border: 2px solid var(--line);
  background: var(--surface);
  box-shadow: 0 4px 0 var(--line);
}
.deck b {
  font-family: var(--f-display);
  font-size: 21px;
}
.deck > span:not(.deck-cats) {
  color: var(--ink-2);
  font-size: 14px;
}
.deck-cats {
  display: flex;
  gap: 6px;
}
.deck-cats i {
  font-style: normal;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--red-soft);
  color: var(--red);
}
.deck-cats i + i {
  background: var(--accent-soft);
  color: var(--accent);
}
.deck[data-d="wiek"] .deck-cats i {
  background: var(--gold-soft);
  color: var(--gold);
}
.deck[data-d="wiek"] .deck-cats i + i {
  background: var(--blue-soft);
  color: var(--blue);
}
.deck-meta {
  font-weight: 700;
  color: var(--ink-3) !important;
  font-size: 12px !important;
}
.sw-page {
  overflow: hidden;
}
.sw-zones {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.sw-z {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  font-size: 14px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px dashed var(--line);
  color: var(--ink-3);
  transition: 0.15s;
}
.sw-z.hot {
  border-style: solid;
  transform: scale(1.06);
}
.sw-z.z0.hot {
  color: var(--red);
  border-color: var(--red);
}
.sw-z.z1.hot {
  color: var(--accent);
  border-color: var(--accent);
}
.sw-stage {
  display: grid;
  place-items: center;
  min-height: 260px;
}
.sw-card {
  width: min(340px, 100%);
  min-height: 220px;
  padding: 28px 22px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 2px solid var(--line);
  box-shadow: 0 8px 0 var(--line), 0 18px 30px -18px rgba(0, 0, 0, 0.4);
  display: grid;
  place-items: center;
  text-align: center;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 22px;
  line-height: 1.3;
  touch-action: none;
  user-select: none;
  cursor: grab;
  transition: transform 0.26s cubic-bezier(0.3, 1.2, 0.5, 1), border-color 0.15s;
}
.sw-card.in {
  animation: cardIn 0.25s ease-out;
}
@keyframes cardIn {
  from {
    transform: translateY(24px) scale(0.94);
    opacity: 0;
  }
}
.sw-card.drag {
  transition: none;
  cursor: grabbing;
}
.sw-card.ok {
  border-color: var(--accent);
}
.sw-card.bad {
  border-color: var(--red);
  background: var(--red-soft);
}
.sw-btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.sw-btns .btn {
  padding: 0 10px;
  font-size: 15px;
}
.sw-b0 {
  color: var(--red);
}
.sw-b1 {
  color: var(--accent);
}
.s-sort .deck[data-d] ~ * {
  display: block;
}
.sw-fb {
  text-align: center;
  font-weight: 700;
  min-height: 24px;
}
.sw-fb.ok {
  color: var(--accent);
}
.sw-fb.bad {
  color: var(--red);
}

/* ---------- exam ---------- */
.exam-intro {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.exam-intro h1 {
  font-size: clamp(36px, 9vw, 52px);
  line-height: 1;
}
.rules {
  margin: 0;
  padding: 18px 18px 18px 38px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 2px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
  background-image: linear-gradient(90deg, transparent 26px, var(--red-soft) 26px, var(--red-soft) 28px, transparent 28px);
}
.hist {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hist > span {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
}
.hist-bars {
  height: 80px;
  display: flex;
  align-items: flex-end;
  gap: 6px;
  border-bottom: 2px solid var(--line);
  background-image: linear-gradient(transparent calc(50% - 1px), var(--line) calc(50% - 1px), var(--line) 50%, transparent 50%);
}
.hist-bars i {
  flex: 0 1 28px;
  border-radius: 6px 6px 0 0;
}
.hist-bars i.pass {
  background: var(--accent);
}
.hist-bars i.fail {
  background: var(--red);
}
.ex-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.dot {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 2px solid var(--line);
  background: var(--surface);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.dot.on {
  background: var(--blue-soft);
  border-color: var(--blue-soft);
  color: var(--blue);
}
.dot.cur {
  border-color: var(--ink);
  color: var(--ink);
}
.ex-sheet {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.ex-n {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.ex-q {
  font-size: 20px;
  line-height: 1.35;
  font-weight: 700;
}
.ex-opts {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ex-o {
  display: flex;
  gap: 12px;
  text-align: left;
  align-items: baseline;
  padding: 12px 14px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: transparent;
  line-height: 1.35;
}
.ex-o.sel {
  border-color: var(--ink);
  background: var(--surface-2);
}
.ex-l {
  font-weight: 800;
  font-family: var(--f-display);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  flex: none;
}
.ex-o.sel .ex-l {
  outline: 2.5px solid var(--ink);
  outline-offset: 3px;
}
.ex-nav {
  display: flex;
  gap: 12px;
}
.ex-nav .btn {
  flex: 1;
}

/* ---------- notes ---------- */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  align-items: center;
  font-size: 13px;
  color: var(--ink-2);
}
.legend > span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.lg {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  display: inline-block;
}
.lg-s {
  background: var(--surface);
  border: 2px solid var(--line);
}
.lg-u {
  background: var(--blue);
}
.lg-d {
  background: var(--violet);
}
.legend .switch {
  margin-left: auto;
  font-weight: 700;
}
.toc {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 66px);
  z-index: 3;
  background: var(--paper);
  padding-block: 8px;
}
.toc a {
  min-width: 38px;
  height: 38px;
  padding: 0 8px;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: var(--surface);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 14px;
  color: var(--ink-2);
  text-decoration: none;
}
.note {
  background: var(--surface);
  border-radius: var(--r-lg);
  border: 2px solid var(--line);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-margin-top: 130px;
  line-height: 1.6;
}
.note h2 {
  font-family: var(--f-display);
  font-size: 22px;
  display: flex;
  align-items: center;
  gap: 10px;
  line-height: 1.2;
}
.nn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  display: grid;
  place-items: center;
  font-size: 18px;
  flex: none;
}
.note ul {
  margin: 0;
  padding-left: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.note blockquote {
  margin: 0;
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--accent-soft);
  font-family: var(--f-display);
  font-weight: 500;
  font-size: 17px;
}
.note mark {
  background: var(--gold-soft);
  color: var(--ink);
  padding: 0 4px;
  border-radius: 4px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.oral {
  border-left: 4px solid var(--blue);
  padding-left: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.oral::before {
  content: "ustnie na wykładzie";
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--blue);
}
aside.extra {
  border-left: 4px solid var(--violet);
  padding-left: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  color: var(--ink-2);
}
aside.extra::before {
  content: "★ spoza wykładu";
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--violet);
}
.no-extra aside.extra,
.no-extra .extra-sec,
.no-extra .gi.extra {
  display: none;
}
.tscroll {
  overflow-x: auto;
  margin-inline: -4px;
}
.note table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
  line-height: 1.4;
}
.note table:has(thead th:nth-child(4)) {
  min-width: 560px;
}
.note th,
.note td {
  text-align: left;
  vertical-align: top;
  padding: 10px;
  border-bottom: 1.5px solid var(--line);
}
.note thead th {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
}
.note tbody th {
  font-weight: 700;
  width: 22%;
}
.note thead th:nth-child(2) {
  color: var(--gold);
}
.note thead th:nth-child(3) {
  color: var(--blue);
}
.story-k {
  color: var(--violet);
  font-size: 14px;
}
.story {
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.story li {
  counter-increment: s;
  display: grid;
  grid-template-columns: 34px 1fr;
  column-gap: 10px;
}
.story li::before {
  content: counter(s);
  grid-row: span 2;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
}
.story b {
  font-family: var(--f-display);
}
.story span {
  color: var(--ink-2);
}
.gloss {
  margin: 0;
  display: flex;
  flex-direction: column;
}
.gi {
  padding-block: 12px;
  border-bottom: 1.5px solid var(--line);
}
.gi dt {
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.gi dd {
  margin: 4px 0 0;
  color: var(--ink-2);
}

/* ---------- profile ---------- */
.rankcard {
  display: flex;
  gap: 16px;
  align-items: center;
  padding: 18px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 2px solid var(--line);
}
.rankcard > div {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.rankcard h1 {
  font-size: 30px;
  line-height: 1.1;
}
.rankcard small {
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.rk-lv {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  background: var(--gold);
  color: #2a1d00;
  display: grid;
  place-items: center;
  font-size: 36px;
  flex: none;
  transform: rotate(-5deg);
  box-shadow: 0 5px 0 var(--gold-2);
}
.pstats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.ps {
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
}
.ps span {
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 700;
}
.ps b {
  font-size: 20px;
  font-variant-numeric: tabular-nums;
}
.sec-h {
  font-family: var(--f-display);
  font-size: 22px;
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 8px;
}
.sec-h small {
  font-family: var(--f-body);
  font-size: 14px;
  color: var(--ink-3);
}
.achs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
.ach {
  border-radius: var(--r);
  border: 2px dashed var(--line);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: var(--ink-3);
}
.ach b {
  font-size: 15px;
}
.ach small {
  font-size: 13px;
  line-height: 1.3;
}
.ach-ic {
  margin-bottom: 4px;
}
.ach.got {
  border-style: solid;
  border-color: var(--gold);
  background: var(--gold-soft);
  color: var(--ink);
}
.ach.got .ach-ic {
  color: var(--gold);
}
.ach.got .ach-ic .ic {
  fill: currentColor;
}
.sets {
  display: flex;
  flex-direction: column;
  border-radius: var(--r-lg);
  border: 2px solid var(--line);
  background: var(--surface);
  overflow: hidden;
}
.set {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 16px;
  flex-wrap: wrap;
}
.set + .set {
  border-top: 2px solid var(--line);
}
.set > span:first-child {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1 1 200px;
}
.set small {
  color: var(--ink-3);
  font-size: 13px;
}
.seg {
  display: inline-flex;
  border: 2px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.seg button {
  border: 0;
  background: transparent;
  padding: 8px 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.seg button + button {
  border-left: 2px solid var(--line);
}
.seg button.on {
  background: var(--accent);
  color: var(--on-accent);
}
.cloudline {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--ink-2);
  font-size: 14px;
}
.danger {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.confirm {
  padding: 16px;
  border-radius: var(--r);
  background: var(--red-soft);
  display: flex;
  flex-direction: column;
  gap: 12px;
}


/* ---------- subjects: each course carries its own accent ---------- */
.theme-indigo {
  --accent: #3d4ec2;
  --accent-2: #2a3894;
  --accent-soft: #e1e5fb;
  --on-accent: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-indigo {
    --accent: #93a0ff;
    --accent-2: #5664d8;
    --accent-soft: #222a52;
    --on-accent: #0c1033;
  }
}
:root[data-theme="dark"] .theme-indigo {
  --accent: #93a0ff;
  --accent-2: #5664d8;
  --accent-soft: #222a52;
  --on-accent: #0c1033;
}
.focus {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.focus-k {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}
.focus-k .ic {
  width: 18px;
  height: 18px;
}
.subjects {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 6px;
}
.subj-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.subj-head h2 {
  font-size: 26px;
}
.subj-head span {
  font-weight: 700;
  color: var(--ink-3);
}
.filter {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.filter button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  padding: 0 14px;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: var(--surface);
  font-weight: 700;
  font-size: 14px;
  color: var(--ink-2);
}
.filter button.on {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.fdot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
}
.course {
  margin-top: 4px;
}
.course-h {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}
.course-h > div {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.course-h h3 {
  font-family: var(--f-display);
  font-size: 21px;
  line-height: 1.2;
}
.course-h small {
  color: var(--ink-3);
  font-size: 13px;
  font-weight: 700;
}
.course-ic {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--accent);
  color: var(--on-accent);
  display: grid;
  place-items: center;
  flex: none;
  transform: rotate(-4deg);
}
.course-ic .ic {
  width: 24px;
  height: 24px;
}

/* ---------- plain-language and word-for-word blocks ---------- */
.src-k {
  background: var(--gold-soft);
  color: var(--gold-2);
}
.lg-k {
  background: var(--gold);
}
.plain {
  background: var(--accent-soft);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 16.5px;
}
.plain::before {
  content: "po ludzku";
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
}
.key {
  border: 2px solid var(--gold);
  background: var(--gold-soft);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-family: var(--f-display);
  font-weight: 500;
}
.key::before {
  content: "na teście: słowo w słowo";
  font-family: var(--f-body);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--gold-2);
}
.note ol {
  margin: 0;
  padding-left: 22px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.minimum {
  border-color: var(--accent);
  box-shadow: 0 4px 0 var(--accent-soft);
}
.min-k {
  color: var(--ink-2);
}
.minimum ol {
  list-style: none;
  padding: 0;
  counter-reset: m;
  gap: 12px;
}
.minimum li {
  counter-increment: m;
  display: grid;
  grid-template-columns: 30px 1fr;
  column-gap: 10px;
  row-gap: 2px;
}
.minimum li::before {
  content: counter(m);
  grid-row: span 2;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--on-accent);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
}
.minimum li span {
  color: var(--ink-2);
}
.xlate {
  margin: 0;
  display: flex;
  flex-direction: column;
}
.xlate div {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
  gap: 12px;
  padding-block: 8px;
  border-bottom: 1.5px solid var(--line);
}
.xlate dt {
  font-weight: 700;
  font-family: var(--f-display);
}
.xlate dd {
  margin: 0;
  color: var(--ink-2);
}
.gi .gi-plain {
  color: var(--ink);
  font-weight: 600;
}
.fc-def {
  font-size: 15px !important;
  color: var(--ink-2);
}
.tree,
.tree ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.tree ul {
  margin-left: 10px;
  padding-left: 16px;
  border-left: 2px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.tree li {
  position: relative;
  line-height: 1.45;
}
.tree ul > li::before {
  content: "";
  position: absolute;
  left: -16px;
  top: 0.75em;
  width: 12px;
  border-top: 2px solid var(--line);
}
.tree li.no > b {
  color: var(--ink-3);
  text-decoration: line-through;
  text-decoration-thickness: 2px;
}
.tree li.yes {
  background: var(--accent-soft);
  border-radius: 10px;
  padding: 6px 10px;
}
.tree li.yes > b {
  color: var(--accent);
}


/* ---------- logic: teal subject ---------- */
.theme-teal {
  --accent: #0e7a83;
  --accent-2: #0a5960;
  --accent-soft: #d3eef0;
  --on-accent: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-teal {
    --accent: #4fd0d9;
    --accent-2: #2a9aa3;
    --accent-soft: #123a3d;
    --on-accent: #05211f;
  }
}
:root[data-theme="dark"] .theme-teal {
  --accent: #4fd0d9;
  --accent-2: #2a9aa3;
  --accent-soft: #123a3d;
  --on-accent: #05211f;
}

/* ---------- multi-select ---------- */
.multi .box-ic {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid var(--line);
  flex: none;
  display: grid;
  place-items: center;
}
.multi .opt.sel .box-ic {
  background: var(--blue);
  border-color: var(--blue);
}
.multi .opt.sel .box-ic::after {
  content: "";
  width: 10px;
  height: 6px;
  border-left: 2.5px solid #fff;
  border-bottom: 2.5px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}
.multi .opt.right .box-ic {
  border-color: var(--accent);
}

/* ---------- guide ---------- */
.guide-btn {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  padding: 0 12px;
  border-radius: 12px;
  border: 2px solid var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 800;
  font-size: 14px;
  white-space: nowrap;
  flex: none;
}
.guide-btn .ic {
  width: 18px;
  height: 18px;
}
.guide-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  text-align: left;
  border-radius: var(--r-lg);
  border: 2px dashed var(--accent);
  background: var(--accent-soft);
  color: var(--ink);
}
.guide-card b {
  display: block;
  font-family: var(--f-display);
  font-size: 19px;
  color: var(--accent);
}
.guide-card small {
  color: var(--ink-2);
  font-size: 14px;
}
.gc-ic {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--accent);
  color: var(--on-accent);
  display: grid;
  place-items: center;
  flex: none;
}
.g-sec {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.g-lead,
.g-note {
  color: var(--ink-2);
}
.g-note {
  font-size: 13px;
  color: var(--ink-3);
}
.steps {
  list-style: none;
  margin: 0;
  padding: 0;
  counter-reset: st;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.steps li {
  counter-increment: st;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 16px 14px 58px;
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
}
.steps li::before {
  content: counter(st);
  position: absolute;
  left: 14px;
  top: 14px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  display: grid;
  place-items: center;
  font-weight: 800;
}
.steps li > b {
  font-family: var(--f-display);
  font-size: 18px;
}
.steps li span {
  color: var(--ink-2);
}
.shortcuts {
  margin: 0;
  padding-left: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  color: var(--ink-2);
}
.sheet-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.sheet-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  padding: 16px;
  border-radius: var(--r-lg);
  border: 2px solid var(--line);
  background: var(--surface);
  box-shadow: 0 4px 0 var(--line);
  color: var(--ink-2);
  font-size: 14px;
  background-image: linear-gradient(90deg, transparent 22px, var(--red-soft) 22px, var(--red-soft) 24px, transparent 24px);
}
.sc-fix {
  font-size: 12px;
  font-weight: 700;
  color: var(--red);
}
.sheet-card {
  padding: 14px 12px 14px 34px;
}
.sc-name {
  font-size: 24px;
  color: var(--ink);
}
.sc-best {
  margin-top: 6px;
  font-weight: 800;
  font-size: 13px;
  color: var(--ink-3);
}
.sc-best.pass {
  color: var(--accent);
}
.sc-best.fail {
  color: var(--red);
}
.theory {
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: th;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.th {
  counter-increment: th;
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.th.in {
  border-color: var(--accent);
}
.th summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  gap: 8px;
  align-items: baseline;
  justify-content: space-between;
}
.th summary::-webkit-details-marker {
  display: none;
}
.th-line {
  display: flex;
  gap: 8px;
  align-items: baseline;
  justify-content: space-between;
}
.th-q {
  font-weight: 700;
  min-width: 0;
}
.th-q::before {
  content: counter(th) ". ";
  color: var(--ink-3);
}
.th-tag {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
  flex: none;
}
.th-tag.later {
  background: var(--surface-2);
  color: var(--ink-3);
}
.th-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-top: 10px;
  line-height: 1.55;
}
.th-k,
.ans-k {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
}
.th-ok {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-3);
  align-self: flex-end;
}
.th .row {
  align-items: center;
  justify-content: space-between;
}
.th .row .btn {
  flex: 0 1 auto;
  min-height: 44px;
}
.task {
  position: relative;
  padding: 22px 20px 18px 64px;
  border-radius: var(--r-lg);
  border: 2px solid var(--line);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 12px;
  background-image: linear-gradient(90deg, transparent 46px, var(--red-soft) 46px, var(--red-soft) 48px, transparent 48px);
}
.task-n {
  position: absolute;
  left: 14px;
  top: 16px;
  font-size: 28px;
  color: var(--accent);
}
.task-q {
  font-size: 19px;
  line-height: 1.4;
  font-weight: 700;
}
.task-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.draft-l {
  font-size: 13px;
  color: var(--ink-3);
  font-weight: 700;
}
.draft {
  width: 100%;
  border-radius: var(--r);
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font: 400 16px/1.5 var(--f-body);
  padding: 12px 14px;
  resize: vertical;
}
.draft:focus {
  outline: none;
  border-color: var(--blue);
}
.reveal {
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-margin-top: 80px;
}
.answer,
.how,
.fixnote {
  border-radius: var(--r);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  line-height: 1.55;
}
.answer {
  background: var(--accent-soft);
  border: 2px solid var(--accent);
}
.how {
  background: var(--surface);
  border: 2px solid var(--line);
}
.fixnote {
  background: var(--red-soft);
  border: 2px solid var(--red);
}
.fixnote .ans-k {
  color: var(--red);
}
.self-k {
  text-align: center;
  font-weight: 700;
  color: var(--ink-2);
}
.grade.two {
  grid-template-columns: 1fr 1fr;
}
.sheet-act {
  display: flex;
  flex-direction: column;
  gap: 10px;
}


/* ---------- cognitive processes: plum subject ---------- */
.theme-plum {
  --accent: #8b3a8f;
  --accent-2: #66296a;
  --accent-soft: #f1def2;
  --on-accent: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-plum {
    --accent: #e09be4;
    --accent-2: #b065b5;
    --accent-soft: #3a2140;
    --on-accent: #2a0d2d;
  }
}
:root[data-theme="dark"] .theme-plum {
  --accent: #e09be4;
  --accent-2: #b065b5;
  --accent-soft: #3a2140;
  --on-accent: #2a0d2d;
}

/* ---------- ordering exercise ---------- */
.ord-seq {
  list-style: none;
  margin: 0 0 6px;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ord-seq li {
  min-height: 48px;
  display: flex;
}
.ord-seq .chip {
  width: 100%;
  justify-content: flex-start;
}
.ord-empty {
  border: 2px dashed var(--line);
  border-radius: 12px;
  align-items: center;
  padding-left: 14px;
  color: var(--ink-3);
  font-weight: 800;
}
.ord-seq .chip.right {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 3px 0 var(--accent);
}
.ord-seq .chip.wrong {
  border-color: var(--red);
  background: var(--red-soft);
  box-shadow: 0 3px 0 var(--red);
}
.locked .chip {
  pointer-events: none;
}

/* ---------- deep-dive questions ---------- */
.deep {
  border-color: var(--accent);
}
.dq {
  border-top: 1.5px solid var(--line);
  padding-block: 10px;
}
.dq summary {
  cursor: pointer;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 17px;
  list-style: none;
  display: flex;
  gap: 10px;
  align-items: baseline;
}
.dq summary::-webkit-details-marker {
  display: none;
}
.dq summary::before {
  content: "?";
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  display: grid;
  place-items: center;
  font-size: 14px;
}
.dq[open] summary::before {
  content: "!";
}
.dq p {
  margin-top: 8px;
  color: var(--ink-2);
}
.dq-link {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent) !important;
}


/* ---------- figures for visual learners ---------- */
.fig {
  margin: 4px 0;
  padding: 14px 12px 10px;
  border-radius: var(--r);
  background: var(--paper);
  border: 2px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
  color: var(--ink);
}
.fig > svg {
  display: block;
  width: 100%;
  max-width: 480px;
  height: auto;
  margin: 0 auto;
  overflow: visible;
}
.fig figcaption {
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--ink-2);
  text-align: center;
  max-width: 52ch;
  margin: 0 auto;
}
.fig-sm {
  padding: 8px;
  background: var(--surface);
  border-style: dashed;
}
.fig-sm > svg {
  max-width: 300px;
}
.fig .bx,
.fig .bx-a,
.fig .bx-g,
.fig .bx-r,
.fig .bx-x {
  stroke-width: 2;
}
.fig .bx {
  fill: var(--surface);
  stroke: var(--line);
}
.fig .bx-a {
  fill: var(--accent-soft);
  stroke: var(--accent);
}
.fig .bx-g {
  fill: var(--gold-soft);
  stroke: var(--gold);
}
.fig .bx-r {
  fill: var(--red-soft);
  stroke: var(--red);
}
.fig .bx-x {
  fill: var(--surface-2);
  stroke: var(--line);
  stroke-dasharray: 5 4;
}
.fig .ln {
  stroke: var(--ink-2);
  stroke-width: 1.8;
  fill: none;
}
.fig .ln-a {
  stroke: var(--accent);
}
.fig .ln-d {
  stroke-dasharray: 5 4;
}
.fig .ar {
  fill: var(--ink-2);
}
.fig .ar-a,
.fig .acf {
  fill: var(--accent);
}
.fig .soft {
  fill: var(--accent-soft);
}
.fig .dot {
  fill: var(--ink-3);
}
.fig .obj {
  fill: var(--ink-2);
}
.fig .obj-a {
  fill: var(--accent);
}
.fig .water {
  fill: var(--blue-soft);
}
.fig .wave {
  stroke: var(--blue);
}
.fig .ice {
  fill: var(--surface);
  stroke: var(--ink-2);
  stroke-width: 2;
  stroke-linejoin: round;
}
.fig .tip-r {
  fill: var(--red);
}
.fig .tip-a {
  fill: var(--accent);
}
.fig .pic {
  fill: none;
  stroke: var(--accent);
}
.fig text {
  fill: var(--ink);
}
.fig .t {
  font: 600 13px var(--f-body);
}
.fig .tb {
  font: 700 13px var(--f-display);
}
.fig .ts {
  font: 600 11px var(--f-body);
  fill: var(--ink-2);
}
.fig .ta {
  fill: var(--accent);
}
.fig .tr {
  fill: var(--red);
}
.fig .tx {
  font: 600 9.5px var(--f-body);
  fill: var(--ink-2);
}
.fig .numx {
  font: 800 9px var(--f-body);
  fill: var(--on-accent);
}
.fig .num {
  font: 800 12px var(--f-body);
  fill: var(--on-accent);

    <script>
/* Wykuj: rejestr modułów, stan, postępy, synchronizacja. */
(function () {
  "use strict";

  var W = (window.Wykuj = window.Wykuj || {});
  W.modules = [];
  W.byId = {};

  /* ---------- helpers ---------- */

  W.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  };

  W.sample = function (arr, n) {
    return W.shuffle(arr).slice(0, n);
  };

  W.hash = function (str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  };

  W.esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  /* Text normalisation for typed answers: case, Polish diacritics, spacing. */
  W.norm = function (s) {
    return String(s)
      .toLowerCase()
      .replace(/ł/g, "l")
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9 ]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  };

  W.lev = function (a, b) {
    if (a === b) return 0;
    var prev = [];
    for (var j = 0; j <= b.length; j++) prev[j] = j;
    for (var i = 1; i <= a.length; i++) {
      var cur = [i];
      for (var k = 1; k <= b.length; k++) {
        cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + (a[i - 1] === b[k - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  };

  /* Polski cudzysłów wokół tekstu, chyba że tekst już się w nim zaczyna. */
  W.quote = function (t) {
    t = String(t);
    return /^[„"]/.test(t) ? t : "„" + t + "”";
  };

  W.days = function (n) {
    return n + (n === 1 ? " dzień" : " dni");
  };

  W.today = function (d) {
    d = d || new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  };

  function dayDiff(a, b) {
    var pa = a.split("-"), pb = b.split("-");
    var da = Date.UTC(+pa[0], +pa[1] - 1, +pa[2]);
    var db = Date.UTC(+pb[0], +pb[1] - 1, +pb[2]);
    return Math.round((db - da) / 86400000);
  }

  /* ---------- module registry ---------- */

  W.registerModule = function (m) {
    var unitIdx = {};
    m.units.forEach(function (u, i) {
      unitIdx[u.id] = i;
    });
    m.exercises.forEach(function (e) {
      e.s = e.s || "S";
      e.id = m.id + ":" + W.hash(e.t + "|" + (e.q || JSON.stringify(e.pairs || "")));
    });
    m.concepts.forEach(function (c) {
      c.s = c.s || "S";
    });
    m.unitIdx = unitIdx;
    m.sets = m.sets || {};
    m.sourceNames = m.sourceNames || { S: "slajd", U: "ustnie na wykładzie", D: "★ spoza wykładu" };
    m.course.theme = m.course.theme || "green";
    m.course.icon = m.course.icon || "pencil";
    m.passRatio = m.passRatio || 0.5;
    W.modules.push(m);
    W.byId[m.id] = m;
  };

  W.courseMeta = {};
  W.registerCourse = function (c) {
    W.courseMeta[c.id] = c;
  };
  W.guide = function (courseId) {
    var c = W.courseMeta[courseId];
    return c && c.guide ? c.guide : null;
  };

  W.lastModule = function () {
    return W.byId[W.Store.state.lastMod] || W.modules[0];
  };

  W.courses = function () {
    var out = [], seen = {};
    W.modules.forEach(function (m) {
      if (!seen[m.course.id]) {
        seen[m.course.id] = { course: m.course, modules: [] };
        out.push(seen[m.course.id]);
      }
      seen[m.course.id].modules.push(m);
    });
    out.forEach(function (c) {
      c.modules.sort(function (a, b) {
        return a.number - b.number;
      });
    });
    return out;
  };

  /* ---------- ranks ---------- */

  W.RANKS = [
    [0, "Świeżak"], [60, "Słuchacz"], [150, "Notujący"], [280, "Bywalec sal"], [450, "Kujon"],
    [680, "Prymus"], [960, "Stypendysta"], [1300, "Magister"], [1750, "Doktorant"],
    [2300, "Doktor"], [3000, "Habilitowany"], [4000, "Profesor"]
  ];

  W.rank = function (xp) {
    var i = 0;
    while (i + 1 < W.RANKS.length && xp >= W.RANKS[i + 1][0]) i++;
    var cur = W.RANKS[i], next = W.RANKS[i + 1];
    return {
      level: i + 1,
      name: cur[1],
      from: cur[0],
      to: next ? next[0] : null,
      nextName: next ? next[1] : null,
      pct: next ? (xp - cur[0]) / (next[0] - cur[0]) : 1
    };
  };

  /* ---------- achievements ---------- */

  W.ACH = [
    { id: "first", name: "Pierwszy krok", desc: "Ukończ pierwszą lekcję" },
    { id: "perfect", name: "Bez skazy", desc: "Lekcja bez ani jednego błędu" },
    { id: "streak3", name: "Rozpęd", desc: "3 dni nauki z rzędu" },
    { id: "streak7", name: "Tydzień z głową", desc: "7 dni nauki z rzędu" },
    { id: "goal", name: "Cel dnia", desc: "Zrealizuj dzienny cel XP" },
    { id: "cards20", name: "Fiszkarz", desc: "Powtórz 20 fiszek" },
    { id: "deck", name: "Cała talia", desc: "Każda fiszka modułu co najmniej w pudełku 3" },
    { id: "kahoot", name: "Refleks", desc: "Zdobądź 9000 pkt w quizie na czas" },
    { id: "match", name: "Błyskawica", desc: "Połącz pary w mniej niż 25 s" },
    { id: "sort", name: "Sortownik", desc: "Talia w Sortowni bez błędu" },
    { id: "exam", name: "Zdane!", desc: "Zalicz egzamin próbny" },
    { id: "exam90", name: "Piątka", desc: "Egzamin próbny na 90% lub więcej" },
    { id: "path", name: "Cała ścieżka", desc: "Ukończ wszystkie lekcje modułu" },
    { id: "stars", name: "Gwiazdozbiór", desc: "Trzy gwiazdki w każdej lekcji modułu" },
    { id: "hundred", name: "Setka", desc: "Odpowiedz poprawnie 100 razy" },
    { id: "notes", name: "Czytelnik", desc: "Otwórz notatki z wykładu" }
  ];

  /* ---------- state ---------- */

  var KEY = "wykuj.v1";

  function blank() {
    return {
      v: 1,
      updated: 0,
      xp: 0,
      day: { date: W.today(), xp: 0 },
      goal: 50,
      streak: { n: 0, last: null, best: 0 },
      settings: { sound: true, extras: true, free: false },
      mods: {},
      courses: {},
      ach: {},
      stats: { answers: 0, correct: 0, cards: 0 }
    };
  }

  function merge(base, over) {
    Object.keys(over || {}).forEach(function (k) {
      var v = over[k];
      if (v && typeof v === "object" && !Array.isArray(v) && base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) {
        merge(base[k], v);
      } else {
        base[k] = v;
      }
    });
    return base;
  }

  var listeners = {};
  var Store = (W.Store = {
    state: blank(),
    cloud: "off", // off | syncing | ok | local
    on: function (ev, fn) {
      (listeners[ev] = listeners[ev] || []).push(fn);
    },
    emit: function (ev, data) {
      (listeners[ev] || []).forEach(function (fn) {
        fn(data);
      });
    }
  });

  try {
    var raw = window.localStorage.getItem(KEY);
    if (raw) Store.state = merge(blank(), JSON.parse(raw));
  } catch (e) {
    /* storage unavailable: run in memory */
  }

  Store.course = function (id) {
    var all = (Store.state.courses = Store.state.courses || {});
    var c = all[id] || (all[id] = { sheets: {}, oral: {} });
    c.sheets = c.sheets || {};
    c.oral = c.oral || {};
    return c;
  };

  Store.mod = function (id) {
    var m = Store.state.mods[id];
    if (!m) {
      m = Store.state.mods[id] = { path: {}, cards: {}, items: {}, best: {}, exams: [] };
    }
    m.path = m.path || {};
    m.cards = m.cards || {};
    m.items = m.items || {};
    m.best = m.best || {};
    m.exams = m.exams || [];
    return m;
  };

  var cloudTimer = null;
  Store.save = function () {
    Store.state.updated = Date.now();
    try {
      window.localStorage.setItem(KEY, JSON.stringify(Store.state));
    } catch (e) {
      /* ignore */
    }
    if (cloudRef) {
      clearTimeout(cloudTimer);
      cloudTimer = setTimeout(pushCloud, 1500);
    }
    Store.emit("change");
  };

  Store.reset = function () {
    var keepSettings = Store.state.settings;
    Store.state = blank();
    Store.state.settings = keepSettings;
    Store.save();
  };

  /* Day rollover and streak, called whenever XP is earned. */
  function touchDay() {
    var st = Store.state, t = W.today();
    if (st.day.date !== t) st.day = { date: t, xp: 0 };
    if (st.streak.last !== t) {
      var gap = st.streak.last ? dayDiff(st.streak.last, t) : 99;
      st.streak.n = gap === 1 ? st.streak.n + 1 : 1;
      st.streak.last = t;
      st.streak.best = Math.max(st.streak.best || 0, st.streak.n);
      if (st.streak.n >= 3) Store.unlock("streak3");
      if (st.streak.n >= 7) Store.unlock("streak7");
    }
  }

  Store.streakAlive = function () {
    var s = Store.state.streak;
    if (!s.last) return 0;
    var gap = dayDiff(s.last, W.today());
    return gap <= 1 ? s.n : 0;
  };

  Store.todayXP = function () {
    return Store.state.day.date === W.today() ? Store.state.day.xp : 0;
  };

  Store.addXP = function (n) {
    if (!n) return;
    touchDay();
    var st = Store.state;
    var before = W.rank(st.xp).level;
    var goalBefore = st.day.xp >= st.goal;
    st.xp += n;
    st.day.xp += n;
    if (!goalBefore && st.day.xp >= st.goal) {

            Store.emit("cloud");
          }
        });
      })
      .catch(function () {
        Store.cloud = "local";
        Store.emit("cloud");
      });
  };
})();

(function () {

  var W = window.Wykuj;

  var ctx = null;
  function audio() {
    if (!W.Store.state.settings.sound) return null;
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) {
      return null;
    }
    return ctx;
  }

  function tone(freq, dur, type, gain, delay, slideTo) {
    var a = audio();
    if (!a) return;
    var t0 = a.currentTime + (delay || 0);
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.14, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(a.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  var SOUNDS = {
    tap: function () {
      tone(620, 0.04, "sine", 0.06);
    },
    correct: function (combo) {
      var f = 587.33 * Math.pow(1.0595, Math.min(12, (combo || 1) - 1));
      tone(f, 0.1, "triangle", 0.13);
      tone(f * 1.5, 0.16, "sine", 0.08, 0.06);
    },
    wrong: function () {
      tone(220, 0.18, "sawtooth", 0.07, 0, 110);
    },
    flip: function () {
      tone(400, 0.06, "sine", 0.05, 0, 700);
    },
    tick: function () {
      tone(1000, 0.03, "square", 0.025);
    },
    finish: function () {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
        tone(f, 0.24, "triangle", 0.12, i * 0.09);
      });
    },
    fail: function () {

    level: function () {

  W.confetti = function (n) {

    cv.className = "confetti";
    document.body.appendChild(cv);
    var dpr = window.devicePixelRatio || 1;
    var w = window.innerWidth, h = window.innerHeight;
    cv.width = w * dpr;
    cv.height = h * dpr;

    c.scale(dpr, dpr);

    var colors = ["--k-red", "--k-blue", "--k-yellow", "--k-green", "--accent"].map(function (v) {
      return cs.getPropertyValue(v).trim() || "#2a9d5c";
    });
    var parts = [];
    for (var i = 0; i < (n || 120); i++) {
      parts.push({
        x: w / 2 + (Math.random() - 0.5) * w * 0.3,
        y: h * 0.35,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 13 - 4,
        r: Math.random() * Math.PI,

        s: 5 + Math.random() * 7,
        c: colors[i % colors.length]
