  notes: [
    { id: "n1", n: 1, title: "Dlaczego potrzebna jest filozofia człowieka", html:
      "<div class='plain'><p>Człowiekiem zajmuje się mnóstwo nauk, ale każda patrzy tylko na swój kawałek. Anatom widzi ciało, psycholog psychikę, etnolog kulturę. Wychodzi z tego wiele różnych obrazów człowieka, a żaden nie jest całością.</p></div>" +
      "<div class='tscroll'><table><thead><tr><th>Człowiek badany w aspekcie…</th><th>Nauka</th></tr></thead><tbody>" +
      "<tr><td>cielesności</td><td>anatomia, fizjologia</td></tr><tr><td>procesów życiowych</td><td>biologia</td></tr>" +
      "<tr><td>psychiki</td><td>psychologia</td></tr><tr><td>przynależności do świata przyrody</td><td>przyrodoznawstwo (= antropologia przyrodnicza)</td></tr>" +
      "<tr><td>różnych kultur</td><td>etnologia (= antropologia kulturowa)</td></tr><tr><td>kultury</td><td>kulturoznawstwo</td></tr>" +
      "<tr><td>myślenia</td><td>kognitywistyka, neuronauki</td></tr></tbody></table></div>" +
      "<p><b>Efekt:</b> różne koncepcje człowieka, akcent na jeden wymiar ludzkiego bytu. Stąd pytanie o ujęcie <b>całościowe, integralne i uniwersalne</b>, które będzie fundamentem dla bardziej szczegółowych wyjaśnień. Według skryptu taki fundament daje filozofia.</p>" +
      "<aside class='extra'><p>Pomylenie kawałka z całością („człowiek to tylko mózg”) to redukcjonizm. Psychologia jest tu jedną z nauk szczegółowych.</p></aside>" },
    { id: "n2", n: 2, title: "Jedna filozofia czy wiele?", html:
      "<div class='plain'><p>Kłopot: filozofii jest dużo i każda widzi człowieka inaczej, bo każda inaczej rozumie, co w ogóle istnieje. Wykład rozwiązuje to tak: jest jedna „podstawowa” filozofia, klasyczna, i na niej budujemy.</p></div>" +
      "<ul><li>Wielość koncepcji filozofii (różny przedmiot, cel, metody), więc wiele interpretacji człowieka.</li>" +
      "<li>Wiele modeli antropologii, <b>zależnych od koncepcji bytu</b>.</li></ul>" +
      "<p><b>Bardziej podstawowy typ:</b> <mark>filozofia klasyczna</mark> · philosophia perennis · realizm · charakter metafizyczny. Odwołuje się do wielkich filozofów-mistrzów. Cel: wyjaśniać realnie istniejący świat i w nim człowieka. Wyjaśnia fakty przez ich <b>realne racje (przyczyny)</b>.</p>" +
      "<p>Skrypt: jest jedna filozofia, tak jak ucząc się matematyki czy fizyki nie uczymy się „jednej z wielu koncepcji” matematyki czy fizyki.</p>" +
      "<aside class='extra'><p>Przykłady koncepcji bytu: materialista widzi w człowieku układ materii, Platon duszę uwięzioną w ciele, Arystoteles i Tomasz jedność duszy i ciała. Inne nurty (fenomenologia, filozofia analityczna) nie zgodziłyby się, że klasyczna to „ta jedna”, ale na teście trzymaj się wykładu.</p></aside>" },
    { id: "n3", n: 3, title: "Po co to komu: służebna rola filozofii", html:
      "<div class='plain'><p>Nauczyciel, lekarz, sędzia czy terapeuta zawsze zakładają jakąś odpowiedź na pytanie „kim jest człowiek”. Filozofia ma im dać spójną odpowiedź, która nie kłóci się z tym, co ustaliły nauki.</p></div>" +
      "<ul><li>Rozwój nauki zależy dziś od motywów <b>bardziej praktycznych niż teoretycznych</b>.</li>" +
      "<li>Dyscypliny praktyczne szukają filozoficznego obrazu człowieka: <b>pedagogika, polityka, prawo, medycyna, bioetyka, teologia</b>.</li>" +
      "<li>Filozofia jest <b>służebna</b> wobec innych nauk. Jej antropologia <b>integruje, a nie rozbija</b> spojrzenie na człowieka i jest <b>w zgodzie z dorobkiem nauk szczegółowych</b>.</li></ul>" +
      "<aside class='extra'><p>Dla psychologa: każda szkoła terapii (psychoanaliza, behawioryzm, psychologia humanistyczna) stoi na jakimś obrazie człowieka.</p></aside>" },
    { id: "n4", n: 4, title: "Czego nauki szczegółowe nie powiedzą", html:
      "<div class='plain'><p>Nauki świetnie opisują szczegóły, ale nie odpowiedzą na wielkie pytania: kim jestem jako całość, z czego się „składam”, co mnie trzyma w jedności i jaki to ma sens.</p></div>" +
      "<p>Nauki szczegółowe są znakomicie rozwinięte <b>od strony treściowej</b>, ale nie mówią:</p>" +
      "<ul><li>kim jest człowiek <b>całościowo wzięty</b>;</li><li>w jakich relacjach jest do innych bytów: gatunku, społeczeństwa, kultury, przyrody, ponadczasowych wartości, <b>Absolutu</b>;</li>" +
      "<li>czy jest treściowo <b>prosty czy złożony</b> w swojej strukturze ontycznej;</li><li>jaki typ <b>więzi bytowej</b> ma natura ludzka;</li><li>jaki jest <b>sens</b> człowieka w perspektywie ontycznej.</li></ul>" +
      "<p><b>Dychotomie</b> (skrypt powołuje się tu na S. Kamińskiego): człowiek – świat · wolność – konieczność · immanentność – transcendentność · dualizm – monizm czy jedność duszy i ciała. <b>Stąd konieczność antropologii filozoficznej.</b></p>" +
      "<aside class='extra'><p>Po ludzku: czy jesteśmy częścią przyrody, czy czymś więcej? Czy jesteśmy wolni? Czy wychodzimy poza siebie? Czy jesteśmy dwiema rzeczami (Platon, Kartezjusz), jedną materią, czy jednym bytem z duszą i ciałem (Arystoteles, Tomasz)? Ostatnia para to filozoficzna wersja problemu umysł – mózg.</p></aside>" },
    { id: "n5", n: 5, title: "Czym jest antropologia filozoficzna", html:
      "<div class='plain'><p>To filozofia człowieka. Człowiek jest w niej tym, co się bada, a nie punktem widzenia na resztę świata. Ma go objąć ze wszystkich stron i powiedzieć, co spaja go w jedną całość.</p></div>" +
      "<div class='key'><p><b>Najogólniej:</b> wyjaśniająca interpretacja bytu ludzkiego, czyli człowieka i jego istotnie ludzkiego działania.</p></div>" +
      "<p><b>Etymologia</b> (gr.): ánthropos – człowiek · legein – zbierać, mówić, myśleć · logos – mowa, rozum, prawo, nauka.</p>" +
      "<p>To <b>nie</b> odczytanie ze stanowiska człowieka tez o przyrodzie, społeczeństwie i poznaniu, ale <b>odrębna dziedzina filozofii</b>, której głównym przedmiotem jest człowiek. Ujmuje go w wymiarach metafizyczno-ontologicznym, moralno-etycznym, estetycznym, społeczno-kulturowym, czyli inaczej <b>wegetatywnym, sensytywnym i duchowym</b>. Szuka odpowiedzi, kim jest człowiek jako jedność tych porządków, jaka jest jego struktura ontyczna i miejsce wśród innych bytów.</p>" +
      "<p>Skrypt (Kamiński): bez wiedzy o obiektywnej rzeczywistości filozofia człowieka nie uchroni się przed <b>subiektywizmem</b>. Nie może abstrahować od metafizyki, ale nie jest tylko jej rozwinięciem: jest <b>metafizyką człowieka</b>.</p>" +
      "<aside class='extra'><p>Wegetatywny, sensytywny, duchowy to trzy „piętra” życia według Arystotelesa: roślinne, zmysłowe i rozumne. Istotnie ludzkie działania to np. myślenie pojęciami, wolne decyzje, miłość, twórczość, religia.</p></aside>" },
    { id: "n6", n: 6, title: "Cztery antropologie", html:
      "<div class='plain'><p>Słowo „antropologia” ma cztery znaczenia. Przyrodnicza patrzy na gatunek, kulturowa na to, co ludzie tworzą, teologiczna na relację z Bogiem, a filozoficzna na to, czym człowiek jest jako byt. Pełne porównanie jest w tabeli niżej.</p></div>" +
      "<p><b>Przyrodnicza:</b> metody nauk szczegółowych, człowiek na gruncie przyrody; <b>niejednolita</b> (brak jednej metody), zlepek wielu nauk. Gatunek na tle innych gatunków, rozwój gatunkowy i osobniczy, otoczenie, procesy życiowe. Dziś także <b>neuronauki</b>, których wnioski stają się elementami <b>nieautonomicznych</b> antropologii filozoficznych.</p>" +
      "<p><b>Kulturowa (społeczna):</b> nauki humanistyczne (skrypt: postkantowskie; tradycja niemiecka i anglosaska), zlepek wielu nauk, bada wytwory kulturowe i z nich wnioskuje o „naturze” człowieka, najczęściej psychologicznie lub socjologicznie. <b>Problem:</b> przeważnie odrzuca wspólną gatunkowo naturę ludzką; przyjmuje <b>kontekstualizm i historyzm</b>.</p>" +
      "<p><b>Teologiczna:</b> dział nauk teologicznych; człowiek jako adresat Objawienia (tak na slajdzie; w skrypcie: Zbawienia). Bada związek człowieka z Bogiem na bazie <b>tez Objawienia</b>; korzysta z antropologii filozoficznej i kulturowej.</p>" +
      "<p><b>Filozoficzna:</b> dziedzina filozofii badająca człowieka na bazie rozumienia rzeczywistości (bytu). Człowiek jako specyficzny element świata o właściwej sobie naturze.</p>" +
      "<aside class='extra'><p>Kontekstualizm: człowieka zrozumiesz tylko w jego kulturze. Historyzm: człowiek jest wytworem epoki. Filogeneza to rozwój gatunku, ontogeneza rozwój jednostki.</p></aside>" },
    { id: "n7", n: 7, title: "Drzewko: jaka filozofia człowieka?", html:
      "<div class='plain'><p>Skrypt pokazuje, jak dochodzi się do antropologii z tego kursu. To cztery rozwidlenia, a na każdym wybieramy jedną drogę. Gdy zrozumiesz drzewko, cechy R-A-R-A przestaną być listą do wykucia.</p></div>" +
      "<ul class='tree'><li><b>Antropologia filozoficzna</b><ul>" +
      "<li class='no'><b>nieautonomiczna</b>: uzależnia twierdzenia od wyników innych nauk; dziś dominuje; wyrosła z pozytywizmu (filozofia jako metanauka); wnosi niewiele ponad nauki.</li>" +
      "<li><b>autonomiczna</b>: własna metoda, przedmiot i cel<ul>" +
      "<li class='no'><b>dopuszcza źródła pozaracjonalne</b>, np. egzystencjalizm</li>" +
      "<li><b>tylko źródła rozumowe</b> (racjonalna)<ul>" +
      "<li class='no'><b>aprioryczna</b>: czysto spekulatywna</li>" +
      "<li class='yes'><b>aposterioryczna</b>: od opisu i uzasadnienia specyficznie ludzkiego doświadczenia. <em>To antropologia z wykładu.</em></li>" +
      "</ul></li></ul></li></ul></li></ul>" +
      "<p>Dzieje namysłu nad człowiekiem zaczynają się od <b>Sokratesa</b>. Najostrzej problem człowieka postawiono w <b>XVI–XVII wieku</b> (teoriopoznawczy antropocentryzm).</p>" },
    { id: "n8", n: 8, title: "Przedmiot, cel, metoda", html:
      "<div class='plain'><p>Trzy pytania: co badamy, po co i jak. Najtrudniejsze słowo to „uniesprzecznianie”, ale chodzi o zwykłe rozumowanie detektywa: skoro ten fakt zachodzi, co musi być prawdą o człowieku, żeby był możliwy?</p></div>" +
      "<div class='key'><p>Antropologia filozoficzna jest dziedziną filozofii badającą człowieka na bazie rozumienia rzeczywistości (koncepcji bytu – podejście metafizyczne).</p></div>" +
      "<div class='tscroll'><table><tbody>" +
      "<tr><th>Przedmiot</th><td>człowiek jako specyficzny element rzeczywistości, byt posiadający sobie właściwą naturę</td></tr>" +
      "<tr><th>Cel</th><td>szukanie ostatecznych ontycznych racji bytu ludzkiego i wszystkich jego istotnych aspektów</td></tr>" +
      "<tr><th>Metoda</th><td>wyjaśnianie, czyli wskazywanie racji podmiotowych i przedmiotowych dla faktów (metafizyczne uniesprzecznianie stanów bytowych)</td></tr>" +
      "</tbody></table></div>" +
      "<p>Podkreśla <b>egzystencjalny</b> aspekt rzeczywistości (to, że człowiek realnie istnieje), a nie tylko treść pojęcia „człowiek”.</p>" +
      "<p>Jest: <mark>R</mark>ealistyczna · <mark>A</mark>utonomiczna · <mark>R</mark>acjonalna · <mark>A</mark>posterioryczna.</p>" +
      "<aside class='extra'><p>Uniesprzecznianie w czterech krokach: (1) fakt z doświadczenia → (2) co musi istnieć, żeby nie był sprzeczny? → (3) wskazanie tej racji → (4) bez niej fakt byłby niemożliwy. Przykład: myślimy pojęciami ogólnymi, a materia jest zawsze jednostkowa, więc w człowieku musi być czynnik niematerialny. Racje podmiotowe są po stronie człowieka (rozum, wola), przedmiotowe po stronie tego, do czego się odnosi (świat, dobro).</p></aside>" },
    { id: "n9", n: 9, title: "Definicja do wykucia i miejsce w filozofii", html:
      "<div class='plain'><p>Antropologa nie interesuje, co człowiek robi, tylko co z tego wynika o tym, kim on jest. Działania i wytwory to ślady, po których się do tego dochodzi.</p></div>" +
      "<div class='key'><p>Dziedzina filozofii, która bada człowieka i jego działania i wytwory, <b>o ile</b> wskazują one na jego określoną <b>strukturę ontyczną</b> i <b>egzystencjalną pozycję w świecie</b>. (Krąpiec)</p></div>" +
      "<ul><li>Z racji <b>przedmiotu</b>: podstawa dla <b>etyki, estetyki, filozofii kultury</b>.</li>" +
      "<li>Z racji <b>metody</b>: jedna z tzw. <b>metafizyk szczegółowych</b>.</li></ul>" +
      "<p>Skrypt: antropologia <b>zakłada</b> metafizykę ogólną i filozofię przyrody, a <b>wyprzedza</b> psychologię (rozumianą jako nauka o duszy), etykę, estetykę i całą filozofię kultury.</p>" +
      "<aside class='extra'><p>Dlaczego podstawa etyki? Żeby wiedzieć, co jest dobre dla człowieka, trzeba najpierw wiedzieć, kim on jest.</p></aside>" },
    { id: "n10", n: 10, title: "Plan kursu", html:
      "<div class='plain'><p>Ten wykład był wstępem. Najważniejsza będzie część systematyczna: co wiemy o człowieku i jak to uzasadniamy. Historia filozofii pojawi się wybiórczo, już po części systemowej.</p></div>" +
      "<ol><li><b>Wstępna</b>: zagadnienia metodologiczne (ten wykład).</li>" +
      "<li><b>Historyczna</b> (zgodnie z koncepcją historyzmu): najważniejsze koncepcje człowieka od starożytności po współczesność.</li>" +
      "<li><b>Systematyczna</b> (centralna i najistotniejsza): od specyficznie ludzkiego doświadczenia, przez uzasadnienie (uniesprzecznienie) struktury bytowej, do istotnie ludzkich działań.</li></ol>" +
      "<p>Porządek badawczy: <b>od opisu danego faktu do jego uzasadnienia</b>.</p>" +
      "<p><b>Co dalej według tez:</b> fakt ludzki „od zewnątrz” i „od wewnątrz” (Ja i akty „moje”), dusza i ciało, osoba – natura – kultura, poznanie i prawda, działanie (miłość, wolność, moralność, uczucia, dobro i zło), człowiek wobec społeczności, sztuka i piękno, człowiek jako byt religijny, śmierć. Potem historia: źródła biblijne i orfickie, starożytność, średniowiecze (Augustyn, Nemezjusz z Emezy, Boecjusz, Tomasz) i nowożytność (od Kartezjusza po postmodernizm).</p>" +
      "<p><b>Podręcznik:</b> M. A. Krąpiec, „Ja – człowiek”. Wersja skrócona: „Człowiek jako osoba”. Antropologia w pigułce: „Rozmowy z Ojcem Krąpcem: O człowieku”.</p>" +
      "<aside class='extra'><p>Uwaga na dwa „historyzmy”: na slajdzie 09 to pogląd, że człowiek jest wytworem epoki (problem antropologii kulturowej), a w planie kursu to sposób wykładania przedmiotu przez jego dzieje.</p></aside>" }

  notes: [
    { id: "l1", n: 1, title: "Po co logika", html:
      "<div class='plain'><p>Logika to skrzynka z narzędziami do myślenia i mówienia. Na tym kursie ma się przydać w praktyce: jasno mówić, dobrze argumentować i nie dać się zmanipulować.</p></div>" +
      "<p>Logika jest <b>narzędziem poprawnego myślenia i mówienia</b>.</p>" +
      "<p><b>Działy logiki ogólnej</b> (tradycyjnie):</p><ul><li><b>semiotyka logiczna</b>: teoria języka rozumianego jako system znaków,</li>" +
      "<li><b>logika formalna</b>: teoria wynikania,</li><li><b>metodologia nauk</b>: teoria procedur badawczych i ich wytworów.</li></ul>" +
      "<p><b>Cele zajęć:</b> kultura logiczna (podstawowa aparatura pojęciowa logiki ogólnej), jasne, ścisłe i uporządkowane myślenie i mówienie, argumentowanie, kontrola poprawności argumentów, dostrzeganie manipulacji i radzenie sobie z nią.</p>" +
      "<p>Kurs: wykład 10 h + ćwiczenia 15 h.</p>" },
    { id: "l2", n: 2, title: "Przedmiot materialny i formalny", html:
      "<div class='plain'><p>Każda nauka ma CO bada (przedmiot materialny) i Z JAKIEJ STRONY to bada (przedmiot formalny). Anatom i psycholog badają tego samego człowieka, ale każdy od innej strony.</p></div>" +
      "<ul><li><b>Materialny</b>: wyznaczony przedmiot badań, wzięty w całym uposażeniu.</li><li><b>Formalny</b>: przedmiot materialny rozpatrywany z pewnego punktu widzenia.</li></ul>" +
      "<p><b>Problem przedmiotowy</b> dotyczy rzeczywistości (świata); <b>metaprzedmiotowy</b> dotyczy poglądów na rzeczywistość.</p>" },
    { id: "l3", n: 3, title: "Kto bada język", html:
      "<div class='plain'><p>Język badają cztery rodziny nauk, każda patrzy na niego inaczej. Logika i semiotyka są wśród badań formalnych.</p></div>" +
      "<ul><li><b>humanistyczne</b> (język jako twór człowieka): historia języka, lingwistyka, filologie, psychologia, socjologia, etnolingwistyka;</li>" +
      "<li><b>formalne</b> (język jako struktura): logika formalna, semiotyka, teoria informacji, teoria komunikacji, cybernetyka;</li>" +
      "<li><b>filozoficzne</b> (język jako byt szczególnego rodzaju): filozofia klasyczna uważa język za <b>bierny</b> w poznaniu (Platon, Arystoteles, Krąpiec, Gilson); filozofia współczesna za <b>współtworzący</b> poznanie: szkoła języka idealnego (Cambridge: Frege, Russell, Wittgenstein I, Salamucha) i szkoła języka potocznego (Oxford: Ayer, Wittgenstein II, Strawson, Searle, Austin);</li>" +
      "<li><b>przyrodnicze</b> (język jako zjawisko przyrodnicze): akustyka, fonetyka, fizjologia mowy, logopedia.</li></ul>" },
    { id: "l4", n: 4, title: "Definicja semiotyki", html:
      "<div class='plain'><p>Semiotyka to logiczna teoria języka. Patrzy na język jak na system znaków i sprawdza, jak dobrze służy do poznawania świata i porozumiewania się.</p></div>" +
      "<div class='key'><p>Semiotyka to ogólna, formalna (logiczna) teoria języka rozumianego jako system znakowy, która zajmuje się językiem w aspekcie jego racjonalności i sprawności w aktach poznania i komunikowania.</p></div>" +
      "<p><b>Słowo po słowie:</b></p><ul><li><b>ogólna</b>: poszukuje konstytutywnych własności języka jako takiego;</li>" +
      "<li><b>formalna</b>: nie interesuje się treścią wyrażeń, tylko ich strukturą;</li>" +
      "<li><b>język jako system znakowy</b>: coś uporządkowanego, w czym wskażemy elementy i relacje między nimi oraz między systemem a otoczeniem;</li>" +
      "<li><b>teoria</b>: uporządkowany logicznie i rzeczowo zbiór twierdzeń, który opisuje i wyjaśnia język;</li>" +
      "<li><b>racjonalność i sprawność w poznaniu i komunikowaniu</b>: język jako narzędzie.</li></ul>" +
      "<div class='key'><p>Przedmiot materialny semiotyki: język. Przedmiot formalny: język jako system znaków, będący narzędziem poznania i komunikowania się.</p></div>" },
    { id: "l5", n: 5, title: "Działy semiotyki", html:
      "<div class='plain'><p>Trzy relacje, trzy działy: jak znaki łączą się ze sobą, jak odnoszą się do świata i jak używają ich ludzie.</p></div>" +
      "<div class='tscroll'><table><thead><tr><th>Dział</th><th>Bada relację</th><th>Główne pojęcia</th></tr></thead><tbody>" +
      "<tr><th>Syntaktyka</th><td>znak – znak („od wewnątrz”): własności, funkcje elementów języka, relacje między nimi</td><td>kategorie syntaktyczne, wynikanie, zastępowanie, dowodzenie, tekst, system</td></tr>" +
      "<tr><th>Semantyka</th><td>znak – świat pozajęzykowy</td><td>prawda (Tarski 1933), oznaczanie, denotowanie, desygnowanie, supozycja, model</td></tr>" +
      "<tr><th>Pragmatyka</th><td>znak – użytkownik (twórca, nadawca, odbiorca)</td><td>znaczenie, rozumienie, wyrażanie, komunikowanie, asercja</td></tr>" +
      "</tbody></table></div>" },
    { id: "l6", n: 6, title: "Język i znak", html:
      "<div class='plain'><p>Język to słownik i reguły. Znak to coś, co widzisz lub słyszysz, a co naprowadza cię na coś innego. Zawsze ktoś musi go odczytać, dlatego znak ma trzy człony.</p></div>" +
      "<div class='key'><p>Język jest zbiorem znaków formalnych scharakteryzowanych możliwie jednoznacznie za pomocą reguł używania i służącym grupie ludzi do poznania i komunikowania się.</p></div>" +
      "<p>Struktura formalna: <b>J = {zbiór znaków formalnych, czyli słownik; reguły użycia}</b>.</p>" +
      "<div class='key'><p>Znak to coś podpadającego pod zmysły (zawsze istnieje substrat materialny znaku), przy pomocy czego ktoś (użytkownik znaku) dochodzi do poznania czegoś innego niż ów znak (bytu oznaczanego przez znak).</p></div>" +
      "<p>Dla semiotyki znak to <b>relacja trójczłonowa</b>: <b>coś jest znakiem czegoś dla kogoś</b>.</p>" },
    { id: "l7", n: 7, title: "Rodzaje znaków", html:
      "<div class='plain'><p>Znaki dzielimy na dwa sposoby: skąd się wzięły (natura czy umowa) i czy najpierw zauważasz sam znak, czy od razu rzecz. Słowa to znaki „przezroczyste”: czytając „kot”, myślisz o kocie, nie o literach.</p></div>" +
      "<p><b>Ze względu na genezę:</b> <b>naturalne</b> (związek przyczynowo-skutkowy lub współwystępowanie: dym i ogień), <b>konwencjonalne</b> (ustanowione przez ludzi: czarna opaska i śmierć bliskiej osoby), <b>ikoniczne</b> (ustanowione jak konwencjonalne, ale oparte na podobieństwie: makieta, mapa, zdjęcie).</p>" +
      "<p><b>Ze względu na stosunek do świadomości użytkownika:</b> <b>instrumentalne</b> (działają, o ile same zostaną poznane: ślady) i <b>formalne</b> (odsyłają wprost do przedmiotu: znaki językowe).</p>" +
      "<p><b>Natura znaku językowego:</b> (a) taka sama struktura jak inne znaki (nośnik materialny, relacja trójczłonowa); (b) <b>przezroczysty</b>; (c) <b>wielopostaciowy</b> (różne nośniki bez zmiany znaczenia).</p>" +
      "<p><b>Szczególne typy:</b> symptom (część zjawiska: wysypka), wskaźnik (współwystępuje, pozwala coś odkryć), oznaka (przyczynowo-skutkowo: zamarzanie wody i mróz), indeks (konwencjonalny, identyfikuje, nie charakteryzuje), hasło (umowny znak rozpoznawczy), ślad (pozostałość po zadziałaniu przyczyny), symbol. Konspekt wymienia też kod i sygnał.</p>" },
    { id: "l8", n: 8, title: "Reguły używania znaków", html:
      "<div class='plain'><p>Żeby porozumieć się językiem, trzeba znać trzy rodzaje reguł: jak składać słowa, do czego się odnoszą i co wypada powiedzieć w danej sytuacji. Na egzaminie to pytanie teoretyczne, więc przygotuj własne przykłady.</p></div>" +
      "<ul><li><b>syntaktyczne</b>: <b>składania</b> (konstrukcji: budowanie wyrażeń złożonych) i <b>przekształcania</b> (transformacji: jak przekształcić wyrażenie poprawne, by wynik też był poprawny). Ciąg zbudowany zgodnie z nimi to <b>wyrażenie syntaktycznie spójne</b>;</li>" +
      "<li><b>semantyczne</b>: rządzą odnoszeniem się znaków do rzeczywistości pozajęzykowej;</li>" +
      "<li><b>pragmatyczne</b>: rządzą używaniem wyrażeń w określonych sytuacjach, np. grzeczne zwracanie się do nieznajomych dorosłych.</li></ul>" +
      "<p><b>Afektony</b>: wyrażenia niezgodne z regułami semantycznymi, ale pragmatycznie dopuszczalne, bo wyrażają emocje.</p>" +
      "<aside class='extra'><p>Gotowe przykłady na ustny: syntaktyczna: „kot śpi” jest poprawne, „śpi kot się na” nie; semantyczna: „kot” nazywa koty, nie psy; pragmatyczna: do profesora „Dzień dobry, panie profesorze”, a nie „siema”; afekton: „zabiję cię, jak się spóźnisz” powiedziane do przyjaciela.</p></aside>" },
    { id: "l9", n: 9, title: "Funkcje języka", html:
      "<div class='plain'><p>Językiem nie tylko opisujemy świat. Wyrażamy uczucia, wydajemy polecenia, pytamy, oceniamy, a czasem samym mówieniem coś robimy („ogłaszam”, „obiecuję”). Jedno zdanie zwykle robi kilka z tych rzeczy naraz.</p></div>" +
      "<p><b>Poznawcza (deskryptywna)</b>: opis stanu rzeczy i stwierdzenie, że zachodzi lub nie. Z punktu widzenia semiotyki logicznej <b>najważniejsza</b>.</p>" +
      "<p><b>Pozapoznawcze</b>, np.: informatywna; <b>ekspresywna</b> (stany psychiczne nadawcy); <b>ewokatywna</b> (przeżycie emocjonalne u odbiorcy); <b>perswazyjna</b> (skłonienie do działania lub poglądu); <b>dyrektywna</b> (polecenia); <mark>performatywna</mark> (spowodowanie stanu rzeczy, o którym mówi wyrażenie, przez samo jego wypowiedzenie); <b>interrogatywna</b> (pytania); <b>estymatywna</b> (oceny); terapeutyczna; <b>ludyczna</b> (zabawianie); <b>fatyczna</b> (podtrzymywanie kontaktu); <b>integrująca/dzieląca</b> („swoi” i „obcy”).</p>" +
      "<p>Wyrażenia często pełnią <b>więcej niż jedną funkcję</b>, a <b>struktura gramatyczna nie zawsze odzwierciedla funkcję</b>: „Jak mogłeś mi to zrobić?!” wygląda jak pytanie, ale pełni funkcję ekspresywną, emotywną i oceniającą.</p>" +

  notes: [
    { id: "p1", n: 1, title: "Czy widzimy świat takim, jaki jest?", html:
      "<div class='plain'><p>Wydaje się, że patrzymy na świat jak przez szybę. Wykład zaczyna od rozbicia tego złudzenia: widzimy tylko wycinek, a mózg sam dopowiada resztę.</p></div>" +
      "<div class='oral'><p>Zdrowy rozsądek mówi „tak”, ale widzimy zmysłami tylko mały fragment rzeczywistości. Percepcja nie jest tylko ograniczona: znaczenie nadajemy automatycznie, a odbieramy często biernie. <b>Rzeczywistość, którą widzimy, jest interpretacją.</b></p>" +
      "<p><b>Trzy główne problemy:</b> stymulacja → percepcja → uwaga, czyli: co dociera do systemu → jak zostaje zinterpretowane → co uzyskuje priorytet.</p></div>" },
    { id: "p2", n: 2, title: "Od behawioryzmu do psychologii poznawczej", html:
      "<div class='plain'><p>Behawioryści patrzyli tylko na wejście i wyjście. Psychologia poznawcza mówi, że trzeba zajrzeć do środka, nawet jeśli tego środka nie da się bezpośrednio zmierzyć.</p></div>" +
      "<div class='oral'><ul><li><b>Behawioryzm:</b> sytuacja → zachowanie. Nurt ten „się wywalił”.</li>" +
      "<li><b>Zmienne latentne:</b> zmienne, których nie można (bezpośrednio) zmierzyć. Psycholodzy uznali, że bez nich się nie da.</li>" +
      "<li><b>Psychologia poznawcza:</b> sytuacja → procesy poznawcze (umysł i mózg, mind and brain) → zachowanie.</li>" +
      "<li>Analogia: bez założenia, że istnieje ciemna materia, teorie nie miałyby racji bytu.</li></ul></div>" +
      "<aside class='extra'><p>W notatkach zapisano „lata 90.”, ale zwrot poznawczy datuje się na lata 50.–60. XX wieku (Neisser, „Cognitive Psychology”, 1967). Lata 90. to „dekada mózgu”. Szczegóły w sekcji „Do przemyślenia”.</p></aside>" },
    { id: "p3", n: 3, title: "Czym zajmuje się psychologia poznawcza", html:
      "<div class='plain'><p>Umysł ma trzy „warstwy”: to, co w nim jest (reprezentacje), to, co się w nim dzieje (procesy), i to, co z tego przeżywamy (świadomość).</p></div>" +
      "<div class='key'><p><b>Reprezentacje poznawcze:</b> względnie trwałe lub chwilowe stany umysłu, które niosą informację.</p>" +
      "<p><b>Świadomość:</b> kiedy i w jakich warunkach reprezentacje i procesy poznawcze stają się treścią doświadczenia.</p>" +
      "<p><b>Procesy poznawcze:</b> operacje lub zmiany zachodzące w umyśle, czyli jak informacje są przetwarzane w czasie.</p></div>" +
      "<div class='oral'><p>Doświadczeń subiektywnych nikt nie rozumie, ale to one odróżniają nas od przyjmowania informacji jak roboty. Jak to jest, że procesom fizycznym towarzyszy coś, co fizycznego charakteru nie ma, czyli przeżycie? To <b>mind–body problem</b>.</p>" +
      "<p>Tylko około <b>4 reprezentacje</b> poznawcze mogą zostać „zraportowane”, bo zmieniają się co chwilę.</p>" +
      "<p>Odwołanie do Schopenhauera: nie mamy wpływu na to, co myślimy, ani na nasze decyzje, jedynie ich doświadczamy.</p></div>" },
    { id: "p4", n: 4, title: "Rodzaje procesów poznawczych", html:
      "<div class='plain'><p>Na dole schematu są procesy podstawowe, czyli percepcja i uwaga (o nich jest ten kurs). Im wyżej, tym więcej informacji proces łączy. Wszystko jest połączone strzałkami w obie strony.</p></div>" +
      "<p>Od dołu: <b>percepcja</b>, <b>uwaga</b> → <b>uczenie się</b>, <b>pamięć</b> → <b>język</b>, <b>myślenie</b> → <b>podejmowanie decyzji</b>, <b>kontrola poznawcza</b>. Obok: <b>świadomość</b>. Strzałka w górę: rosnąca złożoność i zakres integracji.</p>" +
      "<aside class='extra'><p>Opisy na schemacie były na zdjęciu nieczytelne. Prawdopodobnie położenie pionowe pokazuje orientacyjny zakres integracji, a nie sztywną hierarchię, a strzałki rozróżniają wzajemne wpływy i główny kierunek wpływu.</p></aside>" },
    { id: "p5", n: 5, title: "Po co nam percepcja", html:
      "<div class='plain'><p>Percepcja nie jest po to, żeby świat był ładny. Jest po to, żeby przeżyć: zauważyć drapieżnika, znaleźć wodę, jedzenie i partnera.</p></div>" +
      "<ol><li><b>Cel:</b> przeżyć na tyle długo, by móc przekazać swój materiał genetyczny.</li>" +
      "<li>Aby przeżyć w określonym środowisku, trzeba się do niego efektywnie <b>adaptować</b>.</li>" +
      "<li>Adaptacja wymaga <b>interakcji</b> ze środowiskiem.</li>" +
      "<li>Interakcja oznacza konieczność <b>orientacji</b> w nim i <b>rozpoznania</b> zagrożeń i możliwości.</li></ol>" },
    { id: "p6", n: 6, title: "Problem odwrotny percepcji", html:
      "<div class='plain'><p>Mózg siedzi w zamkniętej czaszce i dostaje tylko impulsy elektryczne. Jak detektyw musi zgadnąć, co je wywołało. A ten sam ślad może zostawić kilku sprawców.</p></div>" +
      "<p>Mózg <b>nie ma bezpośredniego dostępu do świata zewnętrznego</b>, dostaje tylko sygnał w postaci <b>elektrycznych impulsów</b> ze zmysłów, więc <b>musi wnioskować o ich przyczynach</b>.</p>" +
      "<div class='tscroll'><table><tbody><tr><th>Fizyka</th><td>jak przyczyny wytwarzają sygnał? (obiekt + warunki obserwacji → sygnał na siatkówce)</td></tr>" +
      "<tr><th>Percepcja</th><td>jaka przyczyna mogła wytworzyć ten sygnał? (od niepełnego sygnału do prawdopodobnej przyczyny)</td></tr></tbody></table></div>" +
      "<p>Przykład: A (duży, daleko) i B (mały, blisko) przy tym samym kącie widzenia α dają <b>taki sam rozmiar obrazu</b> na siatkówce. Sam sygnał nie rozstrzyga. Pomagają: <b>kontekst, wiedza, dodatkowe wskazówki zmysłowe</b>. <b>Różne przyczyny mogą prowadzić do takiego samego sygnału.</b></p>" +
      "<aside class='extra'><p>To współczesna wersja pomysłu Hermanna von Helmholtza z XIX wieku: percepcja to „nieświadome wnioskowanie”.</p></aside>" },
    { id: "p7", n: 7, title: "Od bodźca do spostrzeżenia", html:
      "<div class='plain'><p><b>W jednym zdaniu:</b> światło (albo dźwięk, zapach) trafia do wyspecjalizowanej komórki, ta tłumaczy je na sygnał elektrochemiczny, układ nerwowy zapisuje go jako wzór aktywności neuronów, składa z niego przedmioty i na końcu rozpoznaje, co to jest. Po drodze pomaga mu to, co już wiesz, a ty sam ruszasz się, żeby zobaczyć lepiej.</p></div>" +
      "<p>Slajd nazywa się „Od bodźca do spostrzeżenia. Etapy analizy oraz dwie pętle zwrotne: neuronalna i sensoryczno-ruchowa”. Najłatwiej podzielić go na dwie połowy po trzy etapy.</p>" +
      "<h3>Krok po kroku na jednym przykładzie</h3>" +
      "<p>Wchodzisz do kuchni, a na stole stoi kubek. <i>(Przykład z kubkiem to ilustracja, nazwy i opisy etapów są ze slajdu.)</i></p>" +
      "<p><b>Etapy 1–3: od świata do sygnału</b></p>" +
      "<ol class='walk'>" +
      "<li><b>Bodziec fizyczny</b><span class='where'>gdzie: w świecie</span><span>Slajd: <i>energia lub zdarzenie dostępne dla zmysłu</i>. Światło odbija się od kubka i leci do oka. W tobie jeszcze nic się nie dzieje.</span><span class='chk'>czy to już jest w tobie? Nie, to energia na zewnątrz.</span></li>" +
      "<li><b>Receptor</b><span class='where'>gdzie: w narządzie zmysłu</span><span>Slajd: <i>wyspecjalizowana komórka lub zakończenie nerwowe</i>. Światło pada na czopki i pręciki w siatkówce. Reagują na światło, ale nie na dźwięk: każdy receptor ma swój rodzaj energii.</span><span class='chk'>receptor to KTO czy CO? KTO: komórka.</span></li>" +
      "<li><b>Transdukcja</b><span class='where'>gdzie: w receptorze</span><span>Slajd: <i>energia fizyczna → sygnał elektrochemiczny, zachodzi w receptorze</i>. Czopki i pręciki zamieniają światło na sygnał. Od tej chwili informacja jest w „języku” układu nerwowego.</span><span class='chk'>gdzie zachodzi transdukcja? W receptorze, nie w mózgu.</span></li>" +
      "</ol>" +
      "<p><b>Etapy 4–6: od sygnału do znaczenia</b></p>" +
      "<ol class='walk' start='4' style='counter-reset: w 3'>" +
      "<li><b>Kodowanie neuronalne</b><span class='where'>gdzie: w neuronach</span><span>Slajd: <i>wzorce aktywności neuronów i populacji</i>. Kubek to teraz wzór: które neurony strzelają, jak często i w jakich grupach. „Kubka” jeszcze nie ma, jest kod.</span><span class='chk'>czy mózg już wie, że to kubek? Jeszcze nie.</span></li>" +
      "<li><b>Organizacja percepcyjna</b><span class='where'>gdzie: w mózgu</span><span>Slajd: <i>cechy → powierzchnie, obiekty i zdarzenia</i>. Z krawędzi, koloru i kształtu powstaje całość: jeden okrągły przedmiot z uchem, oddzielony od blatu. Wiesz, że coś tam jest, ale nie wiesz jeszcze co.</span><span class='chk'>co jest wejściem, a co wyjściem? Cechy wchodzą, obiekty wychodzą.</span></li>" +
      "<li><b>Rozpoznanie</b><span class='where'>gdzie: w mózgu, z pomocą pamięci</span><span>Slajd: <i>kategoria, obiekt, osoba lub znaczenie</i>. „To mój kubek z herbatą”: kategoria (kubek), konkretny obiekt (mój), znaczenie (można się napić, gorące).</span><span class='chk'>wymień cztery możliwe wyniki rozpoznania: kategoria, obiekt, osoba, znaczenie.</span></li>" +
      "</ol>" +
      "<h3>Co dzieje się z boku i wstecz</h3>" +
      "<div class='loops'>" +
      "<div class='lp-g'><p><b>Wpływy odgórne: kontekst, cele, pamięć, oczekiwania.</b> Na slajdzie to ramka nad schematem z przerywanymi strzałkami do <b>etapów 4, 5 i 6</b>. W kuchni spodziewasz się kubka (oczekiwania), znasz swój kubek (pamięć), chcesz się napić (cele), jesteś w kuchni, a nie w lesie (kontekst). To przyspiesza rozpoznanie, ale czasem prowadzi na manowce. Na etapy 1–3 strzałki odgórne nie idą: światło leci do oka tak samo, czego byś się nie spodziewał.</p></div>" +
      "<div><p><b>Pętla neuronalna: strzałki wstecz.</b> Między kodowaniem, organizacją i rozpoznaniem strzałki biegną w obie strony (4 ⇄ 5 ⇄ 6). Legenda slajdu: strzałki wstecz to sprzężenia neuronalne. Wyższe etapy odsyłają informację niższym, np. gdy już wiesz, że to twój kubek, łatwiej „domknąć” jego kształt, choć ucho zasłania ręka.</p></div>" +
      "<div><p><b>Pętla sensoryczno-ruchowa: działanie.</b> Z organizacji (5) i z rozpoznania (6) wychodzą strzałki do <b>działania</b>. Działanie <b>zmienia dostępną stymulację</b>, np. ruch oczu, podejście, dotknięcie przedmiotu, więc do zmysłów trafia nowy bodziec i proces startuje od etapu 1. Podchodzisz i bierzesz kubek do ręki, żeby sprawdzić, czy gorący.</p></div>" +
      "<div><p><b>Działanie także bez pełnego świadomego rozpoznania.</b> Skoro strzałka do działania wychodzi już z etapu 5, możesz zareagować, zanim wiesz, na co: odsuwasz rękę od czegoś, co się przewraca, zanim pomyślisz „to kubek”.</p></div>" +
      "</div>" +
      "<h3>Pary, które łatwo pomylić</h3>" +
      "<div class='pairs-x'>" +
      "<div><b>Receptor czy transdukcja?</b>Receptor to komórka (KTO). Transdukcja to zamiana energii na sygnał (CO ROBI). Transdukcja zachodzi w receptorze, ale na schemacie to dwa etapy: 2 i 3.</div>" +
      "<div><b>Kodowanie czy organizacja?</b>Kodowanie to zapis w aktywności neuronów, jeszcze bez „rzeczy”. Organizacja to składanie cech w powierzchnie, obiekty i zdarzenia.</div>" +
      "<div><b>Organizacja czy rozpoznanie?</b>Organizacja: „jest tu jakiś przedmiot”. Rozpoznanie: „to kubek”, „to mama”.</div>" +
      "<div><b>Pętla neuronalna czy sensoryczno-ruchowa?</b>Neuronalna dzieje się w układzie nerwowym (strzałki wstecz między 4, 5 i 6). Sensoryczno-ruchowa idzie przez ciało: działanie zmienia bodziec i wraca do etapu 1.</div>" +
      "<div><b>Wpływy odgórne czy pętla neuronalna?</b>Wpływy odgórne przychodzą z ramki nad schematem (kontekst, cele, pamięć, oczekiwania). Pętla neuronalna to strzałki wstecz między samymi etapami.</div>" +
      "</div>" +
      "<p>Pełna ściąga w tabeli niżej, a zdanie do zapamiętania kolejności w sekcji ★.</p>" },
    { id: "p8", n: 8, title: "Dystalne, proksymalne, oddolne, odgórne", html:
      "<div class='plain'><p>Dystalny to rzecz w świecie, proksymalny to to, co ta rzecz robi z twoim receptorem. Oddolnie buduje spostrzeżenie sam bodziec, odgórnie dokłada się twoja głowa.</p></div>" +
      "<div class='key'><p><b>Bodziec dystalny:</b> obiekt lub zdarzenie w środowisku.</p><p><b>Bodziec proksymalny:</b> wzorzec energii docierający do receptorów.</p></div>" +
      "<p>Przykład ze slajdu: litera A na tablicy (dystalny) i jej odwrócony obraz na siatkówce (proksymalny).</p>" +
      "<p><b>Procesy odgórne (top-down):</b> wiedza, oczekiwania, cele, pamięć, kultura i inne. <b>Procesy oddolne (bottom-up):</b> dźwięk, kolor, kształt, lokalizacja, ruch i inne. Razem dają <b>spostrzeżenie</b>.</p>" },
    { id: "p9", n: 9, title: "Dlaczego percepcja bywa zawodna", html:
      "<div class='plain'><p>Sygnał bywa dwuznaczny, zaszumiony i mało szczegółowy. A to, co zwykle pomaga (kontekst, wiedza, cele), czasem prowadzi na manowce.</p></div>" +
      "<ul><li>niejednoznaczność stymulacji</li><li>szum</li><li>ograniczona rozdzielczość</li><li>kontekst</li><li>wcześniejsza wiedza</li><li>cele i uwaga</li></ul>" +
      "<p>Złudzenia i błędy percepcji będą osobnym wykładem (nr 10).</p>" },
    { id: "p10", n: 10, title: "Dlaczego organizm potrzebuje uwagi", html:
      "<div class='plain'><p>Do głowy wpada lawina informacji, a świadomie mieścimy kroplę. Uwaga decyduje, która kropla przejdzie.</p></div>" +
      "<ul><li>Cały układ nerwowy odbiera w przybliżeniu <b>ok. 10⁹ bitów/s</b> informacji z otoczenia.</li>" +
      "<li>Informacje, które faktycznie przetwarzamy i świadomie wykorzystujemy do działania, to tylko <b>ok. 10 bitów/s</b>.</li>" +
      "<li>Mózg <b>filtruje i redukuje</b> informację zmysłową, zostawiając do świadomości i działania ułamek.</li>" +
      "<li>Uwaga pomaga w <b>redukcji i selekcji</b> informacji istotnych w danym kontekście.</li></ul><p>(Zheng i Meister, 2025)</p>" +
      "<p><b>Plan kursu.</b> Percepcja: 1 wprowadzenie; 2 jak bada się percepcję i uwagę; 3 percepcja wzrokowa I (od światła do wczesnego widzenia); 4 percepcja wzrokowa II (przestrzeń, ruch, obiekty); 5 percepcja słuchowa; 6 smak, węch, dotyk, równowaga i ból; 7 integracja multisensoryczna; 8 teorie percepcji I (klasyczne); 9 teorie percepcji II (współczesne i obliczeniowe); 10 złudzenia i błędy percepcji. Uwaga: 11 funkcje i mechanizmy; 12 teorie uwagi i kontrola wykonawcza; 13 neurobiologia uwagi i kontroli wykonawczej; 14 uwaga, świadomość i ograniczenia przetwarzania; 15 różnice indywidualne.</p>" }
  ]

        "maleńkie ciała, duże rozgałęzienia: para niebieski–żółty, ok. 10% włókien"] }
  },

  units: [
    { id: "zielen", title: "Zieleń jest w nas", sub: "Ogólne prawa percepcji (Kalat)", icon: "bulb", seq: true,
      teach: "<p><b>Myśl przewodnia całej czytanki:</b> nie widzimy świata „jak przez szybę”. Oko i mózg nie robią kopii widoku, tylko <b>tłumaczą</b> światło na sygnały nerwowe i z nich <b>budują</b> to, co widzisz.</p>" +
        "<p>Kalat zaczyna od przykładu: dla kawałka żelaza woda jest „rdzawa”, ale rdza powstaje w żelazie, nie w wodzie. Tak samo zieleń liści powstaje w twoim oku i mózgu, nie w liściach.</p>" },
    { id: "scena", title: "Scena wizualna: rzeczy i relacje", sub: "Cztery cechy, dwie kategorie (Francuz)", icon: "shapes", seq: true,
      teach: "<p>Francuz rozkłada każdy widok na <b>cztery cechy</b>: <b>kształt, barwa, organizacja przestrzenna, dynamika (ruch)</b>.</p>" +
        "<p>Łączy je w <b>dwie kategorie</b>: <b>rzeczy</b> (kształt i barwa: CO to jest) i <b>relacji</b> (położenie i ruch: GDZIE i JAK się rusza). Kategorie nie są rozłączne: szybki ruch zaciera kształt i kolor.</p>" },
    { id: "kreacja", title: "Widzenie to akt kreacji", sub: "Dekompozycja i kompozycja", icon: "spark", seq: true,
      teach: "<p>Widzenie to <b>nie kamera</b>. Mózg najpierw <b>rozkłada</b> obraz z siatkówki na cechy i bada je osobnymi ścieżkami (<b>dekompozycja</b>), a potem <b>składa</b> wyniki w całość, dokładając wiedzę z pamięci wizualnej (<b>kompozycja</b>).</p>" +
        "<p>Dlatego Francuz pisze, że to, co widzisz, jest raczej <b>wytwarzane</b> niż <b>odtwarzane</b>, a widzenie to <b>akt kreacji</b>.</p>" },
    { id: "oko", title: "Oko jak aparat (prawie)", sub: "Rogówka, soczewka, akomodacja", icon: "eye", seq: true,
      teach: "<p>Droga światła: <b>rogówka → źrenica (w tęczówce) → soczewka → siatkówka</b>. Twardówka to obudowa.</p>" +
        "<p>Oko przypomina aparat, ale <b>działa inaczej</b>: ostrość ustawia przez <b>zmianę grubości soczewki</b> (akomodacja), a siatkówka, w przeciwieństwie do matrycy, nie rejestruje obrazu wszędzie tak samo dobrze.</p>" },
    { id: "siatkowka", title: "Siatkówka zbudowana na opak", sub: "Warstwy komórek i plamka ślepa", icon: "wall", seq: true,
      teach: "<p>Sygnał idzie: <b>receptory → komórki dwubiegunowe → komórki zwojowe → nerw wzrokowy</b>. Z boku pracują <b>horyzontalne</b> i <b>amakrynowe</b>.</p>" +
        "<p>Haczyk: receptory leżą <b>z tyłu</b> oka, więc światło przechodzi przez pozostałe warstwy. Aksony komórek zwojowych muszą jakoś wyjść z oka: wychodzą w jednym miejscu, gdzie nie ma receptorów. To <b>plamka ślepa</b>.</p>" },
    { id: "receptory", title: "Pręciki i czopki", sub: "Noc, dzień i zmierzch", icon: "moon", seq: true,
      teach: "<p><b>Pręciki</b> (walce): czułe na słabe światło, bez kolorów, najwięcej na obwodzie, jest ich ok. 20 razy więcej. <b>Czopki</b> (stożki): jasne światło, kolory i szczegóły, najwięcej w dołku.</p>" +
        "<p>Stąd trzy rodzaje widzenia: <b>fotopowe</b> (dzień, czopki), <b>skotopowe</b> (noc, pręciki), <b>mezopowe</b> (zmierzch, oba, żaden na 100%).</p>" },
    { id: "dolek", title: "Dołek środkowy a obwód", sub: "Ostrość czy czułość", icon: "target", seq: true, table: true,
      teach: "<p>To, na co patrzysz, pada na <b>plamkę żółtą</b>, a jej środek to <b>dołek środkowy</b>: same czopki, każdy z „prywatnym kablem” do mózgu. Wynik: <b>najostrzejsze widzenie</b>.</p>" +
        "<p>Na <b>obwodzie</b> wiele pręcików zbiega się na jedną komórkę. Szczegóły się gubią, ale słabe światło się sumuje: <b>lepsza czułość</b>. Dlatego słabą gwiazdę lepiej widać, patrząc trochę obok.</p>" },
    { id: "droga", title: "Droga do mózgu", sub: "Od nerwu wzrokowego do kory", icon: "path", seq: true,
      teach: "<p>Kolejność do zapamiętania: <b>nerw wzrokowy → skrzyżowanie wzrokowe → trakt wzrokowy → ciało kolankowate boczne (LGN, we wzgórzu) → promienistość wzrokowa → pierwotna kora wzrokowa</b> (płat potyliczny).</p>" +
        "<p>Na skrzyżowaniu u człowieka <b>połowa</b> włókien z każdego oka przechodzi na drugą stronę. Część aksonów skręca do <b>wzgórków górnych</b>.</p>" },
    { id: "pola", title: "Pola recepcyjne", sub: "Na co reaguje neuron", icon: "spiral", seq: true,
      teach: "<p><b>Pole widzenia</b> to wszystko, co widzisz naraz. <b>Pole recepcyjne</b> neuronu to kawałek pola widzenia, na który ten neuron reaguje.</p>" +
        "<p>Receptor ma pole jak punkt. Komórka zwojowa zbiera sygnały z wielu receptorów, więc jej pole jest większe i ma kształt <b>obwarzanka</b>: centrum działa w jedną stronę, otoczka w przeciwną.</p>" },
    { id: "hamowanie", title: "Hamowanie oboczne", sub: "Jak siatkówka wyostrza krawędzie", icon: "split", seq: true,
      teach: "<p><b>Hamowanie oboczne</b>: aktywny neuron hamuje sąsiadów. W siatkówce robią to <b>komórki horyzontalne</b>, a ich wpływ słabnie z odległością.</p>" +
        "<p>Skutek: na granicy jasne–ciemne komórki po jasnej stronie brzegu są pobudzone <b>najmocniej</b>, a tuż za brzegiem po ciemnej <b>najsłabiej</b>. Krawędzie wychodzą wyraźniej. Pobaw się symulatorem:</p>" +
        "<div class='li-box' data-widget='hamowanie'></div>" },
    { id: "zwojowe", title: "Trzy rodzaje komórek zwojowych", sub: "Karłowate, parasolowe, pyłkowe", icon: "pairs", seq: true,
      teach: "<p>Francuz dzieli komórki zwojowe na trzy grupy:</p>" +
        "<ul><li><b>Karłowate</b>: małe, ze środka siatkówki; szczegóły i para <b>czerwony–zielony</b>; ok. <b>80%</b> włókien nerwu.</li>" +
        "<li><b>Pyłkowe</b>: maleńkie ciała; para <b>niebieski–żółty</b>; ok. 10%.</li>" +
        "<li><b>Parasolowe</b>: duże; bez kolorów, ale łapią <b>różnice jasności 1–2%</b>, krawędzie i <b>ruch</b>, przewodzą <b>dwa razy szybciej</b>; ok. 10%.</li></ul>" },
    { id: "barwy", title: "Skąd się biorą kolory", sub: "Fale, czopki i porównywanie", icon: "sun", seq: true,
      teach: "<p>Kolor zależy od <b>długości fali</b> światła (fiolet najkrótsze, czerwień najdłuższe). Ale jedna komórka nerwowa nie może naraz zakodować i jasności, i barwy, więc kolor to zawsze <b>porównanie aktywności wielu neuronów</b>, np. różnych typów czopków.</p>" +
        "<p>Teoria <b>trichromatyczna</b> (Younga–Helmholtza): <b>trzy typy czopków</b>, każdy najczulszy na inny zakres fal.</p>" },
    { id: "boss", title: "Test z całej czytanki", sub: "15 pytań ze wszystkich lekcji", icon: "crown", boss: true }
  ],

  concepts: [
    /* ---------- zieleń jest w nas ---------- */
    { id: "zielen", u: "zielen", term: "Zieleń jest w nas",
      plain: "Liście nie są „zielone same z siebie”. Zieleń powstaje dopiero, gdy odbite od nich światło zadziała na neurony oka i mózgu. Tak jak rdza powstaje w żelazie, a nie w wodzie.",
      def: "Kolor nie jest cechą przedmiotu, tylko tym, co się dzieje, gdy światło odbite od przedmiotu oddziałuje na neurony w oku i w mózgu. Każdy koloruje swój własny świat (Kalat: przykład żelaza i rdzy).",
      sh: "kolor powstaje w nas, nie w przedmiocie" },
    { id: "transdukcja", u: "zielen", term: "Transdukcja",
      plain: "Receptor „tłumaczy” energię ze świata (np. światło) na język układu nerwowego, czyli na sygnał elektrochemiczny.",
      def: "Każdy receptor pochłania tylko jeden rodzaj energii i przekształca go we wzorzec aktywności elektrochemicznej. Receptory wzrokowe reagują nawet na pojedynczy foton.",
      sh: "zamiana energii bodźca na sygnał nerwowy" },
    { id: "pot-receptorowy", u: "zielen", term: "Potencjał receptorowy",
      plain: "Mała zmiana napięcia na błonie receptora. Im większa, tym mocniej receptor pobudza albo hamuje kolejny neuron.",
      def: "Lokalna depolaryzacja lub hiperpolaryzacja błony komórkowej receptora. Jego wielkość określa siłę pobudzenia lub hamowania następnego neuronu na drodze do mózgu.",
      sh: "lokalna zmiana napięcia błony receptora" },
    { id: "ludzik", u: "zielen", term: "Mały ludzik w głowie (błąd Kartezjusza)",
      plain: "Kartezjusz myślał, że mózg robi „kopię” widoku, którą ktoś w środku ogląda. Ale kto ogląda tę kopię? I kto siedzi w nim? Błędne koło.",
      def: "Pogląd, że mózgowa reprezentacja bodźca musi go przypominać (Kartezjusz, XVII w.). Zakłada istnienie małego ludzika, który ogląda obraz w głowie, więc niczego nie wyjaśnia.",
      sh: "błąd: mózg robi kopię widoku dla „ludzika”" },
    { id: "bez-kopii", u: "zielen", term: "Kodowanie bez kopiowania",
      plain: "Mózg nie przechowuje obrazka stołu. Blat stołu nie musi być „na górze” siatkówki ani na górze głowy.",
      def: "Kodowanie informacji wzrokowych w mózgu nie polega na duplikowaniu kształtu widzianego przedmiotu (Kalat).",
      sh: "w mózgu nie ma obrazka, jest kod" },
    { id: "muller", u: "zielen", term: "Prawo specyficznych energii nerwowych",
      plain: "Każdy nerw „mówi” jednym językiem: wzrokowy zawsze o świetle, słuchowy zawsze o dźwięku. Mózg wie, co czujesz, po tym, KTÓRY nerw jest aktywny.",
      def: "Johannes Müller (1838): wszelka aktywność w danym nerwie zawsze przenosi do mózgu ten sam rodzaj informacji. Nerwy przesyłają tylko potencjały czynnościowe, a mózg interpretuje je zależnie od tego, z którego nerwu przyszły.",
      sh: "dany nerw zawsze niesie ten sam rodzaj informacji" },

    /* ---------- scena ---------- */
    { id: "cechy-sceny", u: "scena", term: "Cztery cechy sceny wizualnej",
      plain: "Patrząc na widok, rejestrujesz: jaki kształt mają rzeczy, jaki mają kolor, jak są rozmieszczone i czy się ruszają.",
      def: "Kształt, barwa, organizacja przestrzenna i dynamika (Francuz).",
      sh: "kształt, barwa, organizacja przestrzenna, dynamika" },
    { id: "kat-rzeczy", u: "scena", term: "Kategoria rzeczy",
      plain: "CO to jest i jak wygląda: forma i kolor. Kubek rozpoznasz tak samo, czy stoi po lewej, czy po prawej, czy się rusza.",
      def: "Kształt i barwa: własności sceny, dzięki którym rozpoznajemy przedmioty i orzekamy o ich formach i barwach. Ich analiza nie zależy od położenia względem obserwatora ani od ruchu.",
      sh: "kształt i barwa: CO to jest" },
    { id: "kat-relacji", u: "scena", term: "Kategoria relacji",
      plain: "GDZIE co jest i JAK się porusza. To zawsze relacja czegoś do czegoś, np. „kubek jest na prawo ode mnie”.",
      def: "Organizacja przestrzenna i ruch obiektów. Zawsze dotyczą czegoś, co ma kształt i barwę; wiążą się z reprezentacją ciała obserwatora i z motoryką.",
      sh: "położenie i ruch: GDZIE i JAK się rusza" },
    { id: "egocentryczna", u: "scena", term: "Egocentryczna pozycja obserwatora",
      plain: "Punktem odniesienia jesteś ty: „po lewej”, „po prawej”, „nade mną” liczysz od swojego ciała.",
      def: "Uprzywilejowanie obserwatora w scenie (Goodale i Milner, 2008): relacje w płaszczyźnie prostopadłej do osi widzenia ustala się intuicyjnie względem stron ciała i naturalnych ram pola widzenia lub ramy obrazu.",
      sh: "relacje liczone względem ciała patrzącego" },
    { id: "glebia", u: "scena", term: "Relacje w głąb",
      plain: "Co jest bliżej, a co dalej, nie widać „za darmo”. Mózg musi to wyliczyć z danych siatkówki i ze wskazówek głębi.",
      def: "Dostrzeżenie relacji wzdłuż linii równoległych do osi widzenia (w głąb) nie jest oczywiste i wymaga specjalnych procedur przetwarzania danych siatkówkowych oraz wiedzy o wskaźnikach głębi.",
      sh: "odległość w głąb trzeba wyliczyć" },
    { id: "dynamika", u: "scena", term: "Dynamika sceny",
      plain: "Ruch: rzeczy się przesuwają, ty idziesz, twoje oczy skaczą po widoku. To najbardziej komplikuje analizę.",
      def: "Czwarta cecha sceny: pochodna szybkości, zmienności, przyspieszenia i trajektorii ruchu przedmiotów i obserwatora. Liczy się też ruch oczu, który przenosi oś widzenia na różne fragmenty sceny.",
      sh: "ruch przedmiotów, obserwatora i oczu" },
    { id: "na-styku", u: "scena", term: "Doświadczenia na styku kategorii",
      plain: "Gdy coś mknie bardzo szybko, kształt i kolor się rozmywają, a zostaje samo wrażenie ruchu. Dlatego rzeczy i relacje to kategorie, które się zazębiają.",
      def: "Np. bardzo szybko poruszający się obiekt lub obserwator: całkowite zatarcie konturów i barw daje doświadczenie ruchu, który nie jest ruchem rzeczy o określonym kształcie. Takich doświadczeń przybywa (szybkie podróże, media), a ewolucja nie wykształciła jeszcze mechanizmów radzenia sobie z nimi (złudzenia ruchu, złudzenia pilotów).",
      sh: "szybki ruch zaciera kształt i barwę" },

    /* ---------- kreacja ---------- */
    { id: "cztery-sciezki", u: "kreacja", term: "Cztery częściowo niezależne ścieżki",
      plain: "Kształt, kolor, położenie i ruch mózg analizuje osobnymi „liniami produkcyjnymi”, trochę niezależnie od siebie.",
      def: "Od komórek siatkówki do struktur mózgu cechy sceny (kształt, barwa, orientacja przestrzenna 2D i 3D, ruch) są analizowane przez cztery częściowo niezależne ścieżki (podsystemy) neuronalne. Źródło: artykuł Livingstone i Hubela w „Science” (1988).",
      sh: "cechy sceny analizują osobne podsystemy" },
    { id: "dekompozycja", u: "kreacja", term: "Dekompozycja",
      plain: "Faza 1 widzenia: mózg rozkłada widok na cechy i każdą bada osobno.",
      def: "Pierwsza faza widzenia: analityczna i względnie niezależna analiza cech sceny, po wyabstrahowaniu ich z obrazu siatkówkowego (Francuz).",
      sh: "rozkład widoku na cechy analizowane osobno" },
    { id: "kompozycja", u: "kreacja", term: "Kompozycja",
      plain: "Faza 2 widzenia: mózg skleja wyniki z powrotem w całość i dokłada to, co pamięta z wcześniejszych widoków.",
      def: "Druga faza widzenia: integrowanie (syntetyzowanie) wyników analiz z fazy pierwszej z uwzględnieniem danych zapisanych wcześniej w pamięci wizualnej.",
      sh: "składanie wyników w całość z pomocą pamięci" },
    { id: "akt-kreacji", u: "kreacja", term: "Widzenie jako akt kreacji",
      plain: "To, co widzisz, mózg raczej wytwarza, niż odtwarza. Wynik zawsze trochę różni się od tego, co padło na siatkówkę.",
      def: "Wynik integracji sensorycznej zawsze (w mniejszym lub większym stopniu) odbiega od danych źródłowych, więc treści doświadczenia wzrokowego są wytwarzane przez system wzrokowy, a nie odtwarzane z obrazów siatkówkowych (Francuz).",
      sh: "obraz jest wytwarzany, nie odtwarzany" },
    { id: "bez-procesora", u: "kreacja", term: "Brak centralnego procesora",
      plain: "Nie ma w mózgu jednego miejsca, które widzi wszystko naraz. Różne części kory zajmują się różnymi stronami widoku.",
      def: "W głowie nie ma małego ludzika ani centralnego procesora, który widziałby naraz wszystkie aspekty bodźca. Różne części kory przetwarzają odrębne aspekty (co to jest, położenie, kolor, ruch) do pewnego stopnia niezależnie (Kalat).",
      sh: "różne części kory, różne aspekty widoku" },
    { id: "slepota-ruch", u: "kreacja", term: "Ślepota na ruch",
      plain: "Niektórzy ludzie widzą dobrze, a mimo to nie widzą ruchu albo nie umieją ocenić jego kierunku i prędkości. To znak, że ruch analizuje osobny system.",
      def: "Zjawisko, które zaskoczyło psychologów końca XX wieku: osoby, które poza tym dobrze widzą, nie zauważają, że przedmiot się porusza, albo mają duże problemy z określeniem kierunku lub prędkości ruchu (Kalat).",
      sh: "dobrze widzi, ale nie dostrzega ruchu" },

    /* ---------- oko ---------- */
    { id: "rogowka", u: "oko", term: "Rogówka",
      plain: "Przezroczysta „szybka” z przodu oka. Chroni je i działa jak soczewka, która nie zmienia kształtu.",
      def: "Najbardziej wysunięta na zewnątrz, przezroczysta część oka. Chroni je przed uszkodzeniem mechanicznym, pełni funkcję filtra ochronnego i soczewki o stałej ogniskowej (stałym kształcie).",
      sh: "przezroczysta osłona o stałym kształcie" },
    { id: "zrenica", u: "oko", term: "Źrenica i tęczówka",
      plain: "Źrenica to dziurka, przez którą wpada światło. Tęczówka to kolorowy pierścień wokół niej, który ją zwęża i rozszerza jak przysłona w aparacie.",
      def: "Źrenica: otwór w środku tęczówki, przez który światło wpada do oka. Tęczówka: przysłona, która reguluje średnicę źrenicy.",
      sh: "otwór na światło i regulująca go przysłona" },
    { id: "soczewka", u: "oko", term: "Soczewka",
      plain: "„Biologiczny kryształ” za tęczówką: prawie idealnie przezroczysty i zmienia grubość, żeby ostro widzieć blisko i daleko.",
      def: "Soczewka zmiennoogniskowa (o zmiennym kształcie) za tęczówką. Przepuszcza niemal 100% światła i pozwala ostro widzieć rzeczy w różnej odległości. Ralf Dahm nazywa ją „kryształem biologicznym”.",
      sh: "przezroczysta, zmienia kształt, ustawia ostrość" },
    { id: "akomodacja", u: "oko", term: "Akomodacja",
      plain: "Ustawianie ostrości przez zmianę grubości soczewki: rzecz blisko, soczewka grubsza; rzecz daleko, soczewka cieńsza. Aparat robi to inaczej.",
      def: "Mięśnie rzęskowe, kurcząc się, rozciągają soczewkę (staje się cieńsza), a rozluźniając się, pozwalają jej się uwypuklić. Im bliżej obiekt, tym grubsza soczewka. Grubsza soczewka załamuje promienie pod większym kątem.",
      sh: "ostrość przez zmianę grubości soczewki" },
    { id: "twardowka", u: "oko", term: "Twardówka",
      plain: "Twarda, biała obudowa gałki ocznej, jak korpus aparatu.",
      def: "Szczelna i sztywna obudowa oka. Chroni gałkę oczną przed uszkodzeniami mechanicznymi i stabilizuje jej kształt.",
      sh: "sztywna obudowa gałki ocznej" },
    { id: "siatkowka", u: "oko", term: "Siatkówka",
      plain: "Światłoczuła „matryca” na tylnej ścianie oka, wyściela ok. 70% wnętrza gałki. Obraz pada na nią pomniejszony i do góry nogami.",
      def: "Tylna powierzchnia gałki ocznej pokryta receptorami wzrokowymi (pręcikami i czopkami). Obraz siatkówkowy jest sferyczny, pomniejszony i odwrócony.",
      sh: "światłoczuła warstwa z receptorami na dnie oka" },
    { id: "odwrocony", u: "oko", term: "Odwrócony obraz",
      plain: "Obraz na siatkówce jest do góry nogami i lewa strona jest po prawej. Mózgowi to nie przeszkadza, bo nie potrzebuje „prostego” obrazka, tylko kodu.",
      def: "Światło z lewej pada na prawą połowę siatkówki, z góry na dolną. Układ wzrokowy nie duplikuje obrazu, więc odwrócenie nie jest problemem, tak jak komputer nie musi trzymać komend z góry ekranu w „górnej” części pamięci (Kalat).",
      sh: "do góry nogami, ale mózgowi to nie przeszkadza" },
    { id: "ekran", u: "oko", term: "Siatkówka jak zniszczony ekran",
      plain: "Matryca aparatu rejestruje każdy punkt tak samo. Siatkówka nie: w jednych miejscach jest świetna, w innych słaba, a w jednym ma dziurę.",
      def: "Obraz pada na siatkówkę ostro, ale siatkówka nie odwzorowuje go wszędzie z tą samą jakością. Przypomina mocno zniszczony ekran kinowy: pofałdowany, zabrudzony, miejscami podziurawiony. Budowa oka i aparatu jest podobna, działanie niemal całkowicie odmienne (Francuz za Duchowskim, 2007).",
      sh: "siatkówka odwzorowuje obraz nierówno" },

    /* ---------- siatkówka ---------- */
    { id: "dwubiegunowe", u: "siatkowka", term: "Komórki dwubiegunowe",
      plain: "Pierwszy „przekaźnik” za receptorami. Nazwa od tego, że ich wypustki wychodzą z dwóch przeciwnych końców (biegunów).",
      def: "Neurony siatkówki położone bliżej środka oka niż receptory; dostają od receptorów sygnały i przekazują je komórkom zwojowym. Ich wypustki wychodzą z przeciwległych końców (biegunów) neuronu.",
      sh: "przekaźnik między receptorem a komórką zwojową" },
    { id: "zwojowe", u: "siatkowka", term: "Komórki zwojowe",
      plain: "Ostatnia warstwa siatkówki. Ich długie aksony to „kable”, które wychodzą z oka jako nerw wzrokowy.",
      def: "Neurony siatkówki położone najbliżej środka oka. Dostają sygnały od komórek dwubiegunowych, a ich aksony grupują się, splatają i jako nerw wzrokowy biegną do mózgu.",
      sh: "ich aksony tworzą nerw wzrokowy" },
    { id: "horyzontalne", u: "siatkowka", term: "Komórki horyzontalne",
      plain: "Leżą „w poprzek” siatkówki. Receptory je pobudzają, a one hamują komórki dwubiegunowe dookoła.",
      def: "Komórki siatkówki, z którymi pręciki i czopki tworzą synapsy; tworzą połączenia hamujące z komórkami dwubiegunowymi. To neurony lokalne: bez aksonu i bez potencjałów czynnościowych.",
      sh: "hamują komórki dwubiegunowe w okolicy" },
    { id: "amakrynowe", u: "siatkowka", term: "Komórki amakrynowe",
      plain: "Bardzo różnorodni „pośrednicy”: biorą informacje od komórek dwubiegunowych i rozsyłają je dalej. Znamy co najmniej 29 ich rodzajów.",
      def: "Otrzymują informacje od komórek dwubiegunowych i przesyłają je do innych komórek dwubiegunowych, amakrynowych lub zwojowych. Zidentyfikowano co najmniej 29 odmian, co daje wiele możliwości złożonego przetwarzania (Kalat za Maslandem, 2001).",
      sh: "zróżnicowani pośrednicy, co najmniej 29 odmian" },
    { id: "na-opak", u: "siatkowka", term: "Siatkówka zbudowana na opak",
      plain: "Receptory są na samym tyle oka, więc światło musi najpierw przejść przez warstwy innych komórek. Na szczęście te komórki są przezroczyste.",
      def: "Receptory z tyłu oka wysyłają sygnały nie do mózgu, tylko do komórek dwubiegunowych i zwojowych położonych bliżej środka oka. Światło przechodzi przez te warstwy, zanim dotrze do receptorów; komórki są przezroczyste, więc go nie zniekształcają.",
      sh: "światło mija inne warstwy, zanim trafi do receptorów" },
    { id: "plamka-slepa", u: "siatkowka", term: "Plamka ślepa (tarcza nerwu wzrokowego)",
      plain: "Miejsce, gdzie nerw wzrokowy i naczynia krwionośne wychodzą z oka. Nie ma tam receptorów, więc nic tam nie widzisz.",
      def: "Miejsce wyjścia nerwu wzrokowego i naczyń krwionośnych z gałki ocznej, pozbawione fotoreceptorów. Według Francuza ok. 15° od dołka w stronę nosa, średnica ok. 1,5 mm, powierzchnia ok. 1,2 mm².",
      sh: "wyjście nerwu z oka, brak receptorów" },
    { id: "nic-nie-czern", u: "siatkowka", term: "Nic, a nie czerń",
      plain: "W plamce ślepej nie widzisz czarnej dziury, tylko po prostu NIC, jak z tyłu głowy. Dlatego jej nie zauważasz.",
      def: "W ślepych obszarach nie widzi się czerni, tylko po prostu nic, czyli brak jakichkolwiek doznań. Dlatego nawet duże ubytki pola widzenia (np. po jaskrze, która zniszczyła część nerwu wzrokowego) bywają niezauważone (Kalat).",
      sh: "w ślepym miejscu brak doznań, nie czerń" },
    { id: "dwoje-oczu", u: "siatkowka", term: "Dwoje oczu łata plamkę ślepą",
      plain: "Każde oko ma plamkę ślepą w trochę innym miejscu widoku, więc to, czego nie widzi jedno oko, widzi drugie.",
      def: "Oczy są od siebie odsunięte, więc w plamkę ślepą każdego oka rzutują się nieco inne fragmenty sceny. Ten fragment, którego nie widzi jedno oko, widzi drugie i odwrotnie (Francuz).",
      sh: "jedno oko widzi to, czego nie widzi drugie" },

    /* ---------- receptory ---------- */
    { id: "precik", u: "receptory", term: "Pręciki",
      plain: "Receptory „nocne”: bardzo czułe na słabe światło, ale nie rozróżniają kolorów. Najwięcej ich na obwodzie siatkówki i jest ich ok. 20 razy więcej niż czopków.",
      def: "Fotoreceptory w kształcie walców. Reagują na słabe światło, a silne je oślepia; nie różnicują barw (obraz achromatyczny). Najwięcej w obwodowej części siatkówki. Liczba: 78–107 mln, średnio ok. 92 mln (Francuz), ok. 120 mln (Kalat).",
      sh: "czułe na słabe światło, bez kolorów" },
    { id: "czopek", u: "receptory", term: "Czopki",
      plain: "Receptory „dzienne”: potrzebują dużo światła, ale dają kolory i ostrość. Najwięcej ich w dołku środkowym.",
      def: "Fotoreceptory w kształcie stożków. Mniej aktywne w słabym świetle, silnie reagują w jasnym; reagują z różną siłą na różne długości fal, więc są kluczowe dla widzenia barw. Najwięcej w dołku środkowym i wokół niego. Liczba: ok. 4,6 mln (Francuz), ok. 6 mln (Kalat).",
      sh: "jasne światło, kolory, ostrość" },
    { id: "barwnik", u: "receptory", term: "Barwniki wzrokowe",
      plain: "Substancje w pręcikach i czopkach, które „łapią” światło. Retinal (pochodna witaminy A) pod wpływem światła zmienia kształt i uruchamia komórkę.",
      def: "Światłoczułe substancje, które pod wpływem padającego światła wydzielają energię. Zawierają 11-cis-retinal (pochodna witaminy A) i białko opsynę. Światło niemal natychmiast przekształca 11-cis-retinal w trans-retinal, a powstała energia steruje aktywnością komórki (Kalat).",
      sh: "światłoczuła substancja z retinalem i opsyną" },
    { id: "fotopowe", u: "receptory", term: "Widzenie fotopowe",
      plain: "Widzenie w pełnym świetle, głównie czopkami: kolory i szczegóły.",
      def: "Widzenie w warunkach bardzo dobrego oświetlenia, w którym biorą udział przede wszystkim czopki.",
      sh: "dzienne, głównie czopki" },
    { id: "skotopowe", u: "receptory", term: "Widzenie skotopowe",
      plain: "Widzenie po ciemku, pręcikami: odcienie szarości, bez kolorów.",
      def: "Widzenie w warunkach słabego oświetlenia, wynik aktywności pręcików.",
      sh: "nocne, głównie pręciki" },
    { id: "mezopowe", u: "receptory", term: "Widzenie mezopowe",
      plain: "Zmierzch, świt, noc przy księżycu: pracują oba rodzaje receptorów, ale żaden na 100%. Dlatego to groźna pora dla kierowców.",
      def: "Widzenie podczas zmierzchu, wczesnym rankiem lub w księżycową noc. Pracują pręciki i czopki, ale żaden z systemów nie działa w pełni; szczególnie niebezpieczny czas dla kierowców (Francuz).",
      sh: "zmierzch: oba systemy, żaden na 100%" },

    /* ---------- dołek ---------- */
    { id: "plamka-zolta", u: "dolek", term: "Plamka żółta",

      def: "Obszar w miejscu przecięcia osi widzenia z siatkówką. Według Francuza elipsa ok. 1,5 × 2 mm (ok. 2,4 mm²), ponad pół miliona czopków, ponad 200 tys. na mm² (według Kalata ok. 3 × 5 mm).",
      sh: "środek siatkówki z najgęstszymi czopkami" },
    { id: "dolek", u: "dolek", term: "Dołek środkowy (centralny)",

      def: "Obszar ok. 1 mm² w środku plamki żółtej, wyspecjalizowany w ostrym i szczegółowym widzeniu. Nie ma w nim pręcików; w samym środku (dołeczek) nawet 324 tys. czopków na mm². Zajmuje tylko ok. 0,1% powierzchni siatkówki.",

    { id: "os-widzenia", u: "dolek", term: "Oś widzenia a oś optyczna",

      def: "Oś widzenia przecina siatkówkę tam, gdzie jest największe skupisko czopków, a drugim końcem trafia w to, na czym skupiamy wzrok. Jest nachylona o ok. 5° (5–7°) do osi optycznej, która biegnie przez środki rogówki, źrenicy i soczewki.",
      sh: "kierunek patrzenia, ok. 5° od osi optycznej" },
    { id: "zbieznosc", u: "dolek", term: "Konwergencja (zbieżność) receptorów",
      plain: "Ile receptorów „zrzuca się” na jedną komórkę dalej. W dołku jeden. Na obwodzie dziesiątki albo setki.",
      def: "Liczba receptorów wysyłających sygnały do jednej komórki postsynaptycznej. W widzeniu centralnym jeden lub kilka, w obwodowym rośnie w miarę oddalania się od środka (Kalat, tabela 6.1).",
      sh: "ile receptorów przypada na jedną komórkę dalej" },
    { id: "ostrosc-czulosc", u: "dolek", term: "Ostrość kontra czułość",
      plain: "Dołek: widzisz szczegóły, ale potrzebujesz światła. Obwód: wyłapujesz słabe światło, ale bez szczegółów.",
      def: "Widzenie przez dołek ma lepszą ostrość (wrażliwość na szczegóły), widzenie obwodowe lepszą wrażliwość na słabe światło. Na obwodzie sumowanie sygnałów z wielu receptorów zwiększa czułość, ale mózg nie zna dokładnego położenia ani kształtu źródła światła.",
      sh: "dołek: szczegóły; obwód: słabe światło" },
    { id: "katem-oka", u: "dolek", term: "Patrzenie kątem oka",
      plain: "Po ciemku coś lepiej widać, gdy patrzysz trochę obok (ok. 20°), bo tam jest najwięcej pręcików.",
      def: "W słabym świetle widzimy wyraźniej, gdy przesuniemy oś widzenia o ok. 20° od miejsca, które chcemy zobaczyć, bo tam jest najwięcej pręcików (ok. 150 tys. na mm²) (Francuz). U Kalata: słabą gwiazdę łatwiej zobaczyć, patrząc obok niej.",
      sh: "po ciemku patrz ok. 20° obok" },
    { id: "otoczenie", u: "dolek", term: "Zakłócający wpływ otoczenia",
      plain: "Na obwodzie pola widzenia kształt rozpoznajesz dużo lepiej, gdy stoi sam, niż gdy otaczają go inne kształty.",
      def: "Widzenie obwodowe znacznie lepiej identyfikuje kształt, gdy występuje on samodzielnie, niż gdy otaczają go inne bodźce. Ten zakłócający wpływ nie występuje, gdy bodziec pada na dołek środkowy (Kalat za Parkes i in., 2001).",
      sh: "sąsiednie kształty psują rozpoznanie na obwodzie" },
    { id: "ptaki", u: "dolek", term: "Receptory a tryb życia",

      def: "Ptaki drapieżne mają więcej receptorów w górnej części siatkówki: dobrze widzą w dół w locie, a żeby spojrzeć w górę, muszą odwrócić głowę. Zwierzęta będące ofiarami, np. szczury, mają ich więcej w dolnej części i lepiej widzą obiekty nad sobą. Wiele ptaków ma po dwa dołki środkowe w oku.",
      sh: "rozmieszczenie receptorów dopasowane do trybu życia" },

    /* ---------- droga ---------- */

      sh: "odcinek od skrzyżowania do LGN" },
    { id: "lgn", u: "droga", term: "Ciało kolankowate boczne (LGN)",

      def: "Jądro wzgórza wyspecjalizowane w percepcji wzrokowej (lateral geniculate nucleus), u niektórych gatunków przypomina kolano. Pierwsza struktura w mózgu, do której dociera większość informacji z siatkówki. Wysyła aksony do innych części wzgórza i do kory wzrokowej.",
      sh: "stacja we wzgórzu między okiem a korą" },
    { id: "promienistosc", u: "droga", term: "Promienistość wzrokowa",

    { id: "v1", u: "droga", term: "Pierwotna kora wzrokowa",

      def: "Kora w płacie potylicznym (primary visual cortex, striate cortex), do której impulsy z LGN docierają przez promienistość wzrokową.",

    { id: "wzgorki", u: "droga", term: "Wzgórki górne",
      plain: "Boczna odnoga drogi: część aksonów z oka idzie nie do LGN, tylko do wzgórków górnych.",
      def: "Struktura, do której dochodzą niektóre aksony komórek zwojowych. Nieliczne aksony trafiają też do kilku innych obszarów, m.in. do części podwzgórza, która steruje cyklem snu i czuwania (Kalat).",
      sh: "boczna droga części aksonów z oka" },
    { id: "zwrotne", u: "droga", term: "Sprzężenie zwrotne kora–wzgórze",

    { id: "roznice", u: "droga", term: "Różnice indywidualne w drodze wzrokowej",

      def: "Niektórzy ludzie mają w nerwie wzrokowym dwa lub trzy razy więcej aksonów niż inni i odpowiednio więcej komórek w LGN i w korze wzrokowej. To prowadzi do dużych różnic w dostrzeganiu krótkich, słabych lub szybko zmieniających się bodźców (Kalat).",
      sh: "2–3 razy więcej aksonów, lepsze wychwytywanie bodźców" },

  minimum: [
    ["Myśl przewodnia", "Nie widzimy świata „jak przez szybę”. Receptory <b>tłumaczą</b> światło na impulsy (<b>transdukcja</b>), a mózg z nich <b>buduje</b> widok. Kolor jest w nas („<b>zieleń jest w nas</b>”, jak rdza w żelazie). W głowie nie ma kopii obrazu ani <b>ludzika</b>, który by ją oglądał (błąd Kartezjusza)."],
    ["Prawo specyficznych energii nerwowych", "<b>Müller, 1838</b>: dany nerw zawsze niesie ten sam rodzaj informacji. Wszystkie nerwy przesyłają tylko <b>potencjały czynnościowe</b>; mózg „widzi” nerw wzrokowy i „słyszy” słuchowy."],
    ["Scena wizualna (Francuz)", "Cztery cechy: <b>kształt, barwa, organizacja przestrzenna, dynamika</b>. Dwie kategorie: <b>rzeczy</b> (kształt i barwa: CO) i <b>relacji</b> (położenie i ruch: GDZIE i JAK). Nie są rozłączne: szybki ruch zaciera kontury i barwy."],
    ["Widzenie to akt kreacji", "Cechy analizują <b>cztery częściowo niezależne ścieżki</b> (Livingstone i Hubel, 1988). Dwie fazy: <b>dekompozycja</b> (rozkład na cechy) i <b>kompozycja</b> (składanie z pomocą pamięci wizualnej). Obraz jest <b>wytwarzany, nie odtwarzany</b>. Kalat: nie ma centralnego procesora; dowód: <b>ślepota na ruch</b>."],
    ["Oko", "Światło: <b>rogówka → źrenica (w tęczówce) → soczewka → siatkówka</b>; twardówka to obudowa. Ostrość przez <b>akomodację</b>: blisko soczewka grubsza, daleko cieńsza. Obraz na siatkówce jest <b>sferyczny, pomniejszony i odwrócony</b>, ale mózgowi to nie przeszkadza, bo nie robi kopii. Oko jest zbudowane jak aparat, ale <b>działa inaczej</b>: siatkówka rejestruje obraz nierówno („zniszczony ekran”)."],
    ["Siatkówka na opak", "Sygnał: <b>receptory → komórki dwubiegunowe → komórki zwojowe → nerw wzrokowy</b>; z boku <b>horyzontalne</b> (hamują) i <b>amakrynowe</b> (≥29 odmian). Światło mija warstwy, zanim dotrze do receptorów. Tam, gdzie wychodzi nerw, jest <b>plamka ślepa</b>: brak receptorów, ok. 15° od dołka w stronę nosa. Nie zauważamy jej, bo widzimy <b>„nic”, a nie czerń</b>, mamy <b>dwoje oczu</b>, a mózg domyka obraz."],
    ["Pręciki i czopki", "<b>Pręciki</b>: walce, słabe światło, bez barw, obwód, ok. 92 mln (F) / 120 mln (K). <b>Czopki</b>: stożki, jasne światło, barwy, ostrość, dołek, ok. 4,6 mln (F) / 6 mln (K). Pręcików ok. <b>20 razy więcej</b>, ale czopki mają bardziej bezpośrednie połączenie z mózgiem (10 : 1 reakcji). Barwnik: <b>11-cis-retinal + opsyna</b>."],
    ["Trzy rodzaje widzenia", "<b>Fotopowe</b> (dzień, czopki), <b>skotopowe</b> (noc, pręciki, szarości), <b>mezopowe</b> (zmierzch, oba systemy, żaden na 100%, groźne dla kierowców). Jasność w <b>kandelach na m²</b>."],
    ["Dołek a obwód", "Oś widzenia trafia w <b>plamkę żółtą</b>, jej środek to <b>dołek środkowy</b>: same czopki (nawet 324 tys./mm²), 0,1% siatkówki. Każdy czopek ma własną drogę przez <b>karłowatą komórkę zwojową</b>, więc <b>ostrość</b>. Na obwodzie wiele receptorów na jedną komórkę (<b>konwergencja</b>), więc <b>czułość</b> na słabe światło. Po ciemku patrz ok. <b>20° obok</b> (słaba gwiazda)."],
    ["Droga do mózgu", "<b>Nerw wzrokowy</b> (ok. 1 mln aksonów) → <b>skrzyżowanie</b> (u człowieka połowa włókien przechodzi na drugą stronę) → <b>trakt</b> → <b>LGN</b> we wzgórzu → <b>promienistość</b> → <b>pierwotna kora wzrokowa</b> (płat potyliczny). Część aksonów idzie do <b>wzgórków górnych</b>. Kora odsyła sygnały do wzgórza (sprzężenie zwrotne)."],
    ["Pola recepcyjne", "<b>Pole widzenia</b>: to, co widać naraz. <b>Pole recepcyjne</b>: kawałek pola widzenia, na który reaguje neuron. Receptor ma pole punktowe, komórka zwojowa ma pole typu <b>centrum–otoczka</b> (obwarzanek). Wyżej na szlaku pola <b>rosną</b>."],
    ["Hamowanie oboczne", "Aktywny neuron hamuje sąsiadów (<b>Hartline, 1949</b>). W siatkówce przez <b>komórki horyzontalne</b> (neuron lokalny: wpływ słabnie z odległością). Skutek: <b>krawędzie podkreślone</b>, bo brzeg jasnego pola jest najmocniej pobudzony, a obszar tuż za nim najsłabiej. Analogia: <b>klocki na żelatynie</b>."],
    ["Trzy rodzaje komórek zwojowych", "<b>Karłowate</b> (ok. 80%): szczegóły i czerwień–zieleń. <b>Pyłkowe</b> (ok. 10%): niebieski–żółty. <b>Parasolowe</b> (ok. 10%): różnice jasności 1–2%, krawędzie, <b>ruch</b>, dwa razy szybsze (ok. 4 m/s). Wniosek Francuza: widzimy tak, bo mamy taki <b>biologiczny hardware</b>."],
    ["Barwy", "Fiolet to najkrótsze fale, czerwień najdłuższe. Jeden neuron nie przekaże naraz jasności i barwy, więc barwa to <b>porównanie wielu neuronów</b>. <b>Teoria trichromatyczna</b> (Young, Helmholtz): <b>trzy typy czopków</b>. Druga teoria z XIX w.: <b>przeciwstawnych procesów</b>."]
  ],

  deep: [
    { q: "Kalat i Francuz podają różne liczby. Które zapamiętać?",
      a: "Pręciki: Kalat ok. 120 mln, Francuz 78–107 mln (średnio ok. 92 mln). Czopki: Kalat ok. 6 mln, Francuz ok. 4,6 mln. Plamka żółta: Kalat ok. 3 × 5 mm, Francuz ok. 1,5 × 2 mm (2,4 mm²). Najkrótsze widzialne fale: Kalat ok. 350 nm, Francuz od ok. 400 nm. Oba teksty zgadzają się co do proporcji: pręcików jest ponad 20 razy więcej. Najbezpieczniej pamiętać proporcję i podawać liczby z zaznaczeniem, kto je podaje (np. „u Kalata ok. 120 mln”).",
      link: "Różnice biorą się z różnych badań i sposobów liczenia (Francuz cytuje Curcio i in., 1990)." },
    { q: "Mięśnie rzęskowe: Francuz kontra podręczniki fizjologii",
      a: "Francuz pisze, że mięśnie rzęskowe, kurcząc się, rozciągają soczewkę (robi się cieńsza), a rozluźniając, pozwalają jej się uwypuklić. ★ W podręcznikach fizjologii opisuje się to odwrotnie: skurcz mięśnia rzęskowego luzuje więzadełka, na których wisi soczewka, i soczewka sama się zaokrągla (patrzenie z bliska). Pewne w obu wersjach jest to, co najważniejsze: blisko soczewka grubsza, daleko cieńsza.",
      link: "Jeśli na zajęciach padnie to pytanie, warto powiedzieć, co pisze Francuz, i zaznaczyć, że fizjologia opisuje mechanizm odwrotnie." },
    { q: "Czy siatkówka „na opak” to błąd projektu?",
      a: "Kalat żartuje, że gdybyśmy sami projektowali oko, wysyłalibyśmy sygnał z receptorów prosto do mózgu. U kręgowców jest odwrotnie: światło przechodzi przez warstwy komórek, a nerw musi przebić siatkówkę, co daje plamkę ślepą. Komórki są przezroczyste, a dwoje oczu i mózg łatają dziurę, więc w praktyce prawie nic nie tracimy. ★ Ośmiornice i kałamarnice mają oko zbudowane „odwrotnie” niż my: receptory od strony światła i bez plamki ślepej.",

    { q: "Dlaczego nie widzisz swojej plamki ślepej?",
      a: "Trzy powody, wszystkie z czytanki. (1) W plamce ślepej nie widzisz czerni, tylko „nic”, tak jak z tyłu głowy (Kalat). (2) Masz dwoje oczu, a plamki ślepe rzutują się na różne fragmenty sceny (Francuz). (3) Mózg domyka obraz: w teście Kalata z przerwaną linią przerwa znika i linia wydaje się ciągła. Dlatego nawet duże ubytki po jaskrze bywają niezauważone.",
      link: "Zrób test ze streszczenia (sekcja 5), żeby to poczuć na sobie." },
    { q: "280 megapikseli, a jednak oko nie jest aparatem",
      a: "Francuz liczy, że matryca z czopków ze środka dołka miałaby ok. 280 Mpix. Brzmi jak super-aparat, ale to tylko 0,1% siatkówki. Na obwodzie czopków jest ok. 30 razy mniej, a w jednym miejscu nie ma receptorów wcale. Do tego aparat zapisuje każdy piksel tak samo, a oko nie zapisuje nic: zamienia światło w kod, który mózg dopiero interpretuje.",

    { q: "Skąd wiadomo, że ruch analizuje osobny system?",

      link: "Ten sam argument działa dla koloru: ślepota barw." },
    { q: "Drapieżcy, małpy i banany: skąd nasze receptory?",

    { q: "„Zieleń jest w nas”, a obrazy i sztuka",
