  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 640px) {
  .pg-list {
    grid-template-columns: 1fr 1fr;
  }
}
.pg {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scroll-margin-top: 70px;
}
.pg-img {
  display: block;
  padding: 0;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid var(--line);
  background: #fff;
  box-shadow: var(--shadow);
}
.pg-img img {
  display: block;
  width: 100%;
  height: auto;
}
.pg figcaption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 14px;
}
.linkish {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 10px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 13px;
  color: var(--accent);
  background: var(--accent-soft);
}
.linkish .ic {
  width: 16px;
  height: 16px;
}
.pg-zoom {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  background: rgba(10, 12, 11, 0.94);
}
.pg-zoom[hidden] {
  display: none;
}
.pz-bar {
  background: rgba(10, 12, 11, 0.96);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  color: #fff;
}
.pz-t {
  flex: 1;
  min-width: 0;
  font-weight: 700;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pz-bar .btn {
  min-width: 46px;
  min-height: 42px;
  padding: 0 12px;
  color: #fff;
  border-color: rgba(255, 255, 255, 0.35);
  background: transparent;
  font-size: 20px;
}
.pz-bar .icon-btn {
  color: #fff;
}
.pz-scroll {
  flex: 1;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
.pz-scroll img {
  display: block;
  max-width: none;
  height: auto;
  background: #fff;
}
a[data-page] {
  color: var(--accent);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.srcline {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: -4px;
}

/* ---------- na zajęcia ---------- */
.talk-go {
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 8px;
}
.t-ans {
  line-height: 1.55;
}
.t-ans p + p {
  margin-top: 8px;
}
.t-keys {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.t-keys li {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-2);
  font-weight: 700;
  font-size: 13px;
}
.t-src {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 8px;
}
.t-hint {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin-top: 8px;
  color: var(--ink-2);
  font-size: 14px;
}
.t-hint .ic {
  width: 18px;
  height: 18px;
  flex: none;
  color: var(--gold);
}

/* ---------- symulator hamowania obocznego ---------- */
.li-box {
  margin: 10px 0;
  padding: 14px 12px;
  border-radius: var(--r);
  border: 2px solid var(--accent);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.li-k {
  font-family: var(--f-display);
  font-weight: 800;
  color: var(--accent);
}
.li-pre {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.li-pre .chip {
  min-height: 40px;
  padding: 6px 12px;
  font-size: 14px;
}
.li-svg svg {
  display: block;
  width: 100%;
  max-width: 480px;
  height: auto;
  margin: 0 auto;
}
.li-svg text {
  fill: var(--ink-2);
  font: 600 10.5px var(--f-body);
}
.li-r {
  cursor: pointer;
}
.li-r rect {
  fill: var(--surface-2);
  stroke: var(--line);
  stroke-width: 2;
}
.li-r.on rect {
  fill: var(--gold);
  stroke: var(--gold-2);
}
.li-r.on text {
  fill: var(--ink);
  font-weight: 800;
}
.li-r:focus-visible rect {
  stroke: var(--blue);
  stroke-width: 3;
}
.li-b {
  fill: var(--ink-3);
}
.li-b.up {
  fill: var(--accent);
}
.li-b.down {
  fill: var(--red);
}
.li-svg .ln {
  stroke: var(--ink-2);
  stroke-width: 1.5;
}
.li-svg .ln-d {
  stroke-dasharray: 5 4;
}
.li-msg {
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  min-height: 3em;
}
.fig .bx-b {
  fill: var(--blue-soft);
  stroke: var(--blue);
  stroke-width: 2;
}
.fig .fl-g {
  fill: var(--gold);
}
.fig .fl-b {
  fill: var(--blue);
}
.fig .fl-r {
  fill: var(--red);
}
.fig .fl-ink {
  fill: var(--ink);
}
.fig .fl-paper {
  fill: #ffffff;
}
.fig .st-a {
  stroke: var(--accent);
  stroke-width: 2.5;
  fill: none;
}
.fig .st-b {
  stroke: var(--blue);
  stroke-width: 2.5;
  fill: none;
}
.fig .st-g {
  stroke: var(--gold);
  stroke-width: 2.5;
  fill: none;
}
.fig .st-r {
  stroke: var(--red);
  stroke-width: 2.5;
  fill: none;
}
.fig .tw {
  font: 800 12px var(--f-body);
  fill: var(--on-accent);
}
.fig .ln-g {
  stroke: var(--gold);
}
.fig .ar-g {
  fill: var(--gold);
}
.fig .fl-black {
  fill: #141414;
}
.fig .st-black {
  stroke: #141414;
  stroke-width: 7;
  fill: none;
}

    <noscript><p style="padding: 40px">Wykuj potrzebuje JavaScriptu.</p></noscript>

    <!-- silnik -->
    <script>
/* Wykuj: rejestr modułów, stan, postępy, synchronizacja. */
(function () {
  "use strict";

  var W = (window.Wykuj = window.Wykuj || {});
  W.modules = [];
  W.byId = {};

  /* ---------- helpers ---------- */

  W.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  };

  W.sample = function (arr, n) {
    return W.shuffle(arr).slice(0, n);
  };

  W.hash = function (str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  };

  W.esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  /* Text normalisation for typed answers: case, Polish diacritics, spacing. */
  W.norm = function (s) {
    return String(s)
      .toLowerCase()
      .replace(/ł/g, "l")
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9 ]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  };

  W.lev = function (a, b) {
    if (a === b) return 0;
    var prev = [];
    for (var j = 0; j <= b.length; j++) prev[j] = j;
    for (var i = 1; i <= a.length; i++) {
      var cur = [i];
      for (var k = 1; k <= b.length; k++) {
        cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + (a[i - 1] === b[k - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  };

  /* Polski cudzysłów wokół tekstu, chyba że tekst już się w nim zaczyna. */
  W.quote = function (t) {
    t = String(t);
    return /^[„"]/.test(t) ? t : "„" + t + "”";
  };

  W.days = function (n) {
    return n + (n === 1 ? " dzień" : " dni");
  };

  W.today = function (d) {
    d = d || new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  };

  function dayDiff(a, b) {
    var pa = a.split("-"), pb = b.split("-");
    var da = Date.UTC(+pa[0], +pa[1] - 1, +pa[2]);
    var db = Date.UTC(+pb[0], +pb[1] - 1, +pb[2]);
    return Math.round((db - da) / 86400000);
  }

  /* ---------- module registry ---------- */

  W.registerModule = function (m) {
    var unitIdx = {};
    m.units.forEach(function (u, i) {
      unitIdx[u.id] = i;
    });
    m.exercises.forEach(function (e) {
      e.s = e.s || "S";
      e.id = m.id + ":" + W.hash(e.t + "|" + (e.q || JSON.stringify(e.pairs || "")));
    });
    m.concepts.forEach(function (c) {
      c.s = c.s || "S";
    });
    m.unitIdx = unitIdx;
    m.sets = m.sets || {};
    m.sourceNames = m.sourceNames || { S: "slajd", U: "ustnie na wykładzie", D: "★ spoza wykładu" };
    m.course.theme = m.course.theme || "green";
    m.course.icon = m.course.icon || "pencil";
    m.course.section = m.course.section || "wyk";
    m.kind = m.kind || "lecture";
    m.passRatio = m.passRatio || 0.5;
    W.modules.push(m);
    W.byId[m.id] = m;
  };

  /* Wykład albo czytanka: jak podpisać moduł i jak o nim mówić w zdaniu. */
  W.modLabel = function (m) {
    return m.label || "Wykład " + m.number;
  };
  W.modNoun = function (m, form) {
    var r = m.kind === "reading";
    return { gen: r ? "czytanki" : "wykładu", nom: r ? "czytanka" : "wykład" }[form || "gen"];
  };

  /* Obrazy z assets/: w pliku jednoplikowym siedzą w W.IMG jako data URI. */
  W.img = function (path) {
    return (W.IMG && W.IMG[path]) || path;
  };

  /* Czy są zdjęcia stron czytanki? W pliku jednoplikowym tylko, gdy zbudowano go z --with-pages. */
  W.pagesOk = function (m) {
    if (!m.pages || !m.pages.length) return false;
    if (!W.BUNDLED) return true;
    return !!(W.IMG && W.IMG["assets/" + m.pageDir + "/" + m.pages[0].items[0][0] + ".jpg"]);
  };

  W.courseMeta = {};
  W.registerCourse = function (c) {
    W.courseMeta[c.id] = c;
  };
  W.guide = function (courseId) {
    var c = W.courseMeta[courseId];
    return c && c.guide ? c.guide : null;
  };

  W.lastModule = function () {
    return W.byId[W.Store.state.lastMod] || W.modules[0];
  };

  W.courses = function (section) {
    var out = [], seen = {};
    W.modules.forEach(function (m) {
      if (section && m.course.section !== section) return;
      if (!seen[m.course.id]) {
        seen[m.course.id] = { course: m.course, modules: [] };
        out.push(seen[m.course.id]);
      }
      seen[m.course.id].modules.push(m);
    });
    out.forEach(function (c) {
      c.modules.sort(function (a, b) {
        return a.number - b.number;
      });
    });
    return out;
  };

  /* ---------- ranks ---------- */

  W.RANKS = [
    [0, "Świeżak"], [60, "Słuchacz"], [150, "Notujący"], [280, "Bywalec sal"], [450, "Kujon"],
    [680, "Prymus"], [960, "Stypendysta"], [1300, "Magister"], [1750, "Doktorant"],
    [2300, "Doktor"], [3000, "Habilitowany"], [4000, "Profesor"]
  ];

  W.rank = function (xp) {
    var i = 0;
    while (i + 1 < W.RANKS.length && xp >= W.RANKS[i + 1][0]) i++;
    var cur = W.RANKS[i], next = W.RANKS[i + 1];
    return {
      level: i + 1,
      name: cur[1],
      from: cur[0],
      to: next ? next[0] : null,
      nextName: next ? next[1] : null,
      pct: next ? (xp - cur[0]) / (next[0] - cur[0]) : 1
    };
  };

  /* ---------- achievements ---------- */

  W.ACH = [
    { id: "first", name: "Pierwszy krok", desc: "Ukończ pierwszą lekcję" },
    { id: "perfect", name: "Bez skazy", desc: "Lekcja bez ani jednego błędu" },
    { id: "streak3", name: "Rozpęd", desc: "3 dni nauki z rzędu" },
    { id: "streak7", name: "Tydzień z głową", desc: "7 dni nauki z rzędu" },
    { id: "goal", name: "Cel dnia", desc: "Zrealizuj dzienny cel XP" },
    { id: "cards20", name: "Fiszkarz", desc: "Powtórz 20 fiszek" },
    { id: "deck", name: "Cała talia", desc: "Każda fiszka modułu co najmniej w pudełku 3" },
    { id: "kahoot", name: "Refleks", desc: "Zdobądź 9000 pkt w quizie na czas" },
    { id: "match", name: "Błyskawica", desc: "Połącz pary w mniej niż 25 s" },
    { id: "sort", name: "Sortownik", desc: "Talia w Sortowni bez błędu" },
    { id: "exam", name: "Zdane!", desc: "Zalicz egzamin próbny" },
    { id: "exam90", name: "Piątka", desc: "Egzamin próbny na 90% lub więcej" },
    { id: "path", name: "Cała ścieżka", desc: "Ukończ wszystkie lekcje modułu" },
    { id: "stars", name: "Gwiazdozbiór", desc: "Trzy gwiazdki w każdej lekcji modułu" },
    { id: "hundred", name: "Setka", desc: "Odpowiedz poprawnie 100 razy" },
    { id: "notes", name: "Czytelnik", desc: "Otwórz notatki z wykładu albo streszczenie czytanki" }
  ];

  /* ---------- state ---------- */

  var KEY = "wykuj.v1";

  function blank() {
    return {
      v: 1,
      updated: 0,
      xp: 0,
      day: { date: W.today(), xp: 0 },
      goal: 50,
      streak: { n: 0, last: null, best: 0 },
      settings: { sound: true, extras: true, free: false },
      mods: {},
      courses: {},
      ach: {},
      stats: { answers: 0, correct: 0, cards: 0 }
    };
  }

  function merge(base, over) {
    Object.keys(over || {}).forEach(function (k) {
      var v = over[k];
      if (v && typeof v === "object" && !Array.isArray(v) && base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) {
        merge(base[k], v);
      } else {
        base[k] = v;
      }
    });
    return base;
  }

  var listeners = {};
  var Store = (W.Store = {
    state: blank(),
    cloud: "off", // off | syncing | ok | local
    on: function (ev, fn) {
      (listeners[ev] = listeners[ev] || []).push(fn);
    },
    emit: function (ev, data) {
      (listeners[ev] || []).forEach(function (fn) {
        fn(data);
      });
    }
  });

  try {
    var raw = window.localStorage.getItem(KEY);
    if (raw) Store.state = merge(blank(), JSON.parse(raw));
  } catch (e) {
    /* storage unavailable: run in memory */
  }

  Store.course = function (id) {
    var all = (Store.state.courses = Store.state.courses || {});
    var c = all[id] || (all[id] = { sheets: {}, oral: {} });
    c.sheets = c.sheets || {};
    c.oral = c.oral || {};
    return c;
  };

  Store.mod = function (id) {
    var m = Store.state.mods[id];
    if (!m) {
      m = Store.state.mods[id] = { path: {}, cards: {}, items: {}, best: {}, exams: [] };
    }
    m.path = m.path || {};
    m.cards = m.cards || {};
    m.items = m.items || {};
    m.best = m.best || {};
    m.exams = m.exams || [];
    return m;
  };

  var cloudTimer = null;
  Store.save = function () {
    Store.state.updated = Date.now();
    try {
      window.localStorage.setItem(KEY, JSON.stringify(Store.state));
    } catch (e) {
      /* ignore */
    }
    if (cloudRef) {
      clearTimeout(cloudTimer);
      cloudTimer = setTimeout(pushCloud, 1500);
    }
    Store.emit("change");
  };

  Store.reset = function () {
    var keepSettings = Store.state.settings;
    Store.state = blank();
    Store.state.settings = keepSettings;
    Store.save();
  };

  /* Day rollover and streak, called whenever XP is earned. */
  function touchDay() {
    var st = Store.state, t = W.today();
    if (st.day.date !== t) st.day = { date: t, xp: 0 };
    if (st.streak.last !== t) {
      var gap = st.streak.last ? dayDiff(st.streak.last, t) : 99;
      st.streak.n = gap === 1 ? st.streak.n + 1 : 1;
      st.streak.last = t;
      st.streak.best = Math.max(st.streak.best || 0, st.streak.n);
      if (st.streak.n >= 3) Store.unlock("streak3");
      if (st.streak.n >= 7) Store.unlock("streak7");
    }
  }

  Store.streakAlive = function () {
    var s = Store.state.streak;
    if (!s.last) return 0;
    var gap = dayDiff(s.last, W.today());
    return gap <= 1 ? s.n : 0;
  };

  Store.todayXP = function () {
    return Store.state.day.date === W.today() ? Store.state.day.xp : 0;
  };

  Store.addXP = function (n) {
    if (!n) return;
    touchDay();
    var st = Store.state;
    var before = W.rank(st.xp).level;
    var goalBefore = st.day.xp >= st.goal;
    st.xp += n;
    st.day.xp += n;
    if (!goalBefore && st.day.xp >= st.goal) {
      if (st.ach.goal) Store.emit("goal");
      else Store.unlock("goal");
    }
    var after = W.rank(st.xp).level;
    if (after > before) Store.emit("levelup", W.rank(st.xp));
    Store.save();
  };

  Store.unlock = function (id) {
    if (Store.state.ach[id]) return;
    Store.state.ach[id] = W.today();
    var a = W.ACH.filter(function (x) {
      return x.id === id;
    })[0];
    if (a) Store.emit("achievement", a);
  };

  /* Per-exercise memory: drives "Do poprawki" and weak-item weighting. */
  Store.record = function (modId, qid, ok) {
    var items = Store.mod(modId).items;
    var it = items[qid] || { ok: 0, bad: 0, last: 1 };
    if (ok) it.ok++;
    else it.bad++;
    it.last = ok ? 1 : 0;
    it.t = Date.now();
    items[qid] = it;
    Store.state.stats.answers++;
    if (ok) {
      Store.state.stats.correct++;
      if (Store.state.stats.correct >= 100) Store.unlock("hundred");
    }
  };

  Store.weight = function (modId, qid) {
    var it = Store.mod(modId).items[qid];
    if (!it) return 2;
    if (it.last === 0) return 4;
    return Math.max(0.5, 2 + it.bad - it.ok * 0.6);
  };

  /* ---------- flashcards (Leitner) ---------- */

  var BOX_DAYS = [0, 1, 2, 4, 8, 16];

  Store.card = function (modId, cid) {
    return Store.mod(modId).cards[cid] || null;
  };

  Store.gradeCard = function (modId, cid, grade) {
    var cards = Store.mod(modId).cards;
    var c = cards[cid] || { box: 0, due: 0, seen: 0 };
    if (grade === "again") c.box = 0;
    else if (grade === "good") c.box = Math.min(5, c.box + 1);
    else c.box = Math.max(1, c.box);
    c.seen++;
    var days = grade === "again" ? 0 : BOX_DAYS[c.box] || 1;
    c.due = grade === "again" ? Date.now() : Date.now() + days * 86400000 - 3600000;
    cards[cid] = c;
    Store.state.stats.cards = (Store.state.stats.cards || 0) + 1;
    if (Store.state.stats.cards >= 20) Store.unlock("cards20");
  };

  Store.dueCards = function (m) {
    var now = Date.now();
    return m.concepts.filter(function (c) {
      var st = Store.card(m.id, c.id);
      return st && st.due <= now && W.allowed(c);
    });
  };

  Store.newCards = function (m) {
    return m.concepts.filter(function (c) {
      return !Store.card(m.id, c.id) && W.allowed(c);
    });
  };

  W.allowed = function (item) {
    return Store.state.settings.extras || item.s !== "D";
  };

  /* ---------- module progress ---------- */

  W.unitDone = function (m, uid) {
    var p = Store.mod(m.id).path[uid];
    return !!(p && p.stars > 0);
  };

  W.unitOpen = function (m, idx) {
    if (Store.state.settings.free || idx === 0) return true;
    return W.unitDone(m, m.units[idx - 1].id);
  };

  W.nextUnit = function (m) {
    for (var i = 0; i < m.units.length; i++) {
      if (!W.unitDone(m, m.units[i].id)) return i;
    }
    return -1;
  };

  W.progress = function (m) {
    var ms = Store.mod(m.id);
    var stars = 0;
    m.units.forEach(function (u) {
      stars += (ms.path[u.id] && ms.path[u.id].stars) || 0;
    });
    var learned = m.concepts.filter(function (c) {
      var st = ms.cards[c.id];
      return st && st.box >= 3;
    }).length;
    var p = 0.6 * (stars / (m.units.length * 3)) + 0.4 * (learned / m.concepts.length);
    return { pct: p, stars: stars, maxStars: m.units.length * 3, learned: learned, total: m.concepts.length };
  };

  W.mistakes = function (m) {
    var items = Store.mod(m.id).items;
    return m.exercises.filter(function (e) {
      return items[e.id] && items[e.id].last === 0 && W.allowed(e);
    });
  };

  /* ---------- cloud sync (claude.ai artifact db, per viewer) ---------- */

  var cloudRef = null;

  function pushCloud() {
    if (!cloudRef) return;
    Store.cloud = "syncing";
    Store.emit("cloud");
    cloudRef
      .set({ json: JSON.stringify(Store.state), updated: Store.state.updated })
      .then(function () {
        Store.cloud = "ok";
        Store.emit("cloud");
      })
      .catch(function () {
        Store.cloud = "local";
        cloudRef = null;
        Store.emit("cloud");
      });
  }

  Store.initCloud = function () {
    var c = window.claude;
    if (!c || typeof c.use !== "function") return;
    Promise.all([c.use("db"), c.use("user")])
      .then(function (r) {
        var db = r[0], user = r[1];
        if (!db || !user) return null;
        return user.id().then(function (uid) {
          if (!uid) return null;
          return db.collection("data/users/" + uid).doc("wykuj");
        });
      })
      .then(function (ref) {
        if (!ref) return;
        Store.cloud = "syncing";
        Store.emit("cloud");
        return ref.get().then(function (snap) {
          cloudRef = ref;
          var data = snap.exists ? snap.data() : null;
          var remote = null;
          try {
            remote = data && data.json ? JSON.parse(data.json) : null;
          } catch (e) {
            remote = null;
          }
          if (remote && (remote.updated || 0) > (Store.state.updated || 0)) {
            Store.state = merge(blank(), remote);
            try {
              window.localStorage.setItem(KEY, JSON.stringify(Store.state));
            } catch (e) {
              /* ignore */
            }
            Store.cloud = "ok";
            Store.emit("remote");
            Store.emit("cloud");
          } else if (Store.state.updated) {
            pushCloud();
          } else {
            Store.cloud = "ok";
            Store.emit("cloud");
          }
        });
      })
      .catch(function () {
        Store.cloud = "local";
        Store.emit("cloud");
      });
  };
})();

</script>

(function () {
  "use strict";
  var W = window.Wykuj;

  var ctx = null;
  function audio() {
    if (!W.Store.state.settings.sound) return null;
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) {
      return null;
    }
    return ctx;
  }

  function tone(freq, dur, type, gain, delay, slideTo) {
    var a = audio();
    if (!a) return;
    var t0 = a.currentTime + (delay || 0);
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.14, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(a.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  var SOUNDS = {
    tap: function () {
      tone(620, 0.04, "sine", 0.06);
    },
    correct: function (combo) {
      var f = 587.33 * Math.pow(1.0595, Math.min(12, (combo || 1) - 1));
      tone(f, 0.1, "triangle", 0.13);
      tone(f * 1.5, 0.16, "sine", 0.08, 0.06);
    },
    wrong: function () {
      tone(220, 0.18, "sawtooth", 0.07, 0, 110);
    },
    flip: function () {
      tone(400, 0.06, "sine", 0.05, 0, 700);
    },
    tick: function () {
      tone(1000, 0.03, "square", 0.025);
    },
    finish: function () {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
        tone(f, 0.24, "triangle", 0.12, i * 0.09);
      });
    },
    fail: function () {
      [392, 349.23, 293.66].forEach(function (f, i) {
        tone(f, 0.22, "triangle", 0.1, i * 0.12);
      });
    },
    level: function () {
      [523.25, 783.99, 1046.5, 1318.5, 1567.98].forEach(function (f, i) {
        tone(f, 0.3, "sine", 0.1, i * 0.07);
      });
    }
  };

  W.sound = function (name, arg) {
    if (SOUNDS[name]) SOUNDS[name](arg);
  };

  W.buzz = function (ms) {
    try {
      if (navigator.vibrate) navigator.vibrate(ms || 12);
    } catch (e) {
      /* ignore */
    }
  };

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Konfetti w kolorach kredek. */
  W.confetti = function (n) {
    if (reduced) return;
    var cv = document.createElement("canvas");
    cv.className = "confetti";
    document.body.appendChild(cv);
    var dpr = window.devicePixelRatio || 1;
    var w = window.innerWidth, h = window.innerHeight;
    cv.width = w * dpr;
    cv.height = h * dpr;
    var c = cv.getContext("2d");
    c.scale(dpr, dpr);
    var cs = getComputedStyle(document.documentElement);
    var colors = ["--k-red", "--k-blue", "--k-yellow", "--k-green", "--accent"].map(function (v) {
      return cs.getPropertyValue(v).trim() || "#2a9d5c";
    });
    var parts = [];
    for (var i = 0; i < (n || 120); i++) {
      parts.push({
        x: w / 2 + (Math.random() - 0.5) * w * 0.3,
        y: h * 0.35,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 13 - 4,
        r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        s: 5 + Math.random() * 7,
        c: colors[i % colors.length]
      });
    }
    var start = performance.now();
    function frame(t) {
      var el = t - start;
      c.clearRect(0, 0, w, h);
      parts.forEach(function (p) {
        p.vy += 0.38;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.r += p.vr;
        c.save();
        c.translate(p.x, p.y);
        c.rotate(p.r);
        c.fillStyle = p.c;
        c.globalAlpha = Math.max(0, 1 - el / 2600);
        c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        c.restore();
      });
      if (el < 2600) requestAnimationFrame(frame);
      else cv.remove();
    }
    requestAnimationFrame(frame);
  };

  W.toast = function (title, body, kind) {
    var host = document.getElementById("toasts");
    if (!host) return;
    var t = document.createElement("div");
    t.className = "toast " + (kind || "");
    t.innerHTML = "<b>" + W.esc(title) + "</b>" + (body ? "<span>" + W.esc(body) + "</span>" : "");
    host.appendChild(t);
    setTimeout(function () {
      t.classList.add("out");
      setTimeout(function () {
        t.remove();
      }, 400);
    }, 3200);
  };

  W.Store.on("achievement", function (a) {
    W.sound("level");
    W.toast("Odznaka: " + a.name, a.desc, "gold");
  });
  W.Store.on("levelup", function (r) {
    W.sound("level");
    W.toast("Nowa ranga: " + r.name, "Poziom " + r.level, "gold");
    W.confetti(80);
  });
  W.Store.on("goal", function () {
    W.toast("Cel dnia zrealizowany", "Seria jest bezpieczna na dziś", "green");
  });
})();

    <script>
/* Renderery ćwiczeń. Każdy zwraca kontroler:
 *   el        element DOM
 *   ready()   czy można sprawdzić
 *   grade()   { ok, correct (html poprawnej odpowiedzi), note? }
 *   key(k)    obsługa klawiatury (opcjonalnie)
 *   auto      true, gdy ćwiczenie samo kończy się przez api.done(ok)
 */
(function () {
  "use strict";
  var W = window.Wykuj;
  var esc = W.esc;

  function el(html) {
    var d = document.createElement("div");
    d.innerHTML = html.trim();
    return d.firstChild;
  }
  W.el = el;

  var LABELS = {
    mcq: "Wybierz odpowiedź",
    tf: "Prawda czy fałsz?",
    cloze: "Uzupełnij lukę",
    type: "Wpisz z pamięci",
    match: "Połącz w pary",
    sort: "Przyporządkuj",
    multi: "Zaznacz wszystkie poprawne",
    order: "Ułóż we właściwej kolejności"
  };

  W.srcBadge = function (s, m) {
    var where = m ? W.modNoun(m) : "wykładu";
    if (s === "U") return '<span class="src src-u" title="Powiedziane ustnie na wykładzie">ustnie</span>';
    if (s === "K") return '<span class="src src-k" title="Definicja do zapamiętania słowo w słowo">słowo w słowo</span>';
    if (s === "D") return '<span class="src src-d" title="Dopowiedzenie spoza ' + where + '">★ spoza ' + where + "</span>";
    return "";
  };

  /* Lista do pytań „który to…”: zestaw z modułu albo dziesięć zasad (MPT). */
  W.whichList = function (ex, mod) {
    if (ex.set) return mod.sets[ex.set];
    return { items: mod.principles, why: mod.principleWhy, numbered: true };
  };

  /* Normalise mcq-like exercises into {q, options[], correct, notes}.
   * notes: tekst opcji → krótkie wyjaśnienie, czym ta opcja jest albo dlaczego nie pasuje. */
  W.asChoice = function (ex, mod) {
    var correct, pool, notes = {};
    if (ex.t === "which") {
      var set = W.whichList(ex, mod);
      var list = set.items;
      var fmt = function (p, i) {
        return set.numbered ? i + 1 + ". " + p : p;
      };
      list.forEach(function (p, i) {
        if (set.why && set.why[i]) notes[fmt(p, i)] = set.why[i];
      });
      correct = fmt(list[ex.a - 1], ex.a - 1);
      pool = list.map(fmt).filter(function (p) {
        return p !== correct;
      });
      pool = W.sample(pool, 3);
    } else if (ex.t === "tf") {
      return { q: ex.q, options: ["Prawda", "Fałsz"], correct: ex.a ? 0 : 1, fixed: true, notes: notes };
    } else {
      correct = ex.a[0];
      pool = ex.a.slice(1);
      pool.forEach(function (o, i) {
        if (ex.w && ex.w[i]) notes[o] = ex.w[i];
      });
    }
    var opts = W.shuffle([correct].concat(pool));
    return { q: ex.q, options: opts, correct: opts.indexOf(correct), notes: notes };
  };

  /* Wyjaśnienie po odpowiedzi. g: { notes, correctText, wrongPicks[] }.
   * Zawsze mówi, dlaczego poprawna odpowiedź jest poprawna, a przy błędzie
   * także, czym jest (albo dlaczego nie pasuje) to, co wybrałeś. */
  W.explain = function (ex, g) {
    g = g || {};
    var notes = g.notes || {};
    var out = "";
    var why = ex.x || (g.correctText && notes[g.correctText] ? W.quote(g.correctText) + " to " + notes[g.correctText] + "." : "");
    if (why) out += '<p class="why"><b>Dlaczego?</b> ' + esc(why) + "</p>";
    (g.wrongPicks || []).forEach(function (p) {
      var n = notes[p];
      if (!n) return;
      /* W pytaniach „który to…” notatka mówi, czym jest wybrana opcja. */
      if (ex.t === "which") n = "To coś innego: " + n + ".";
      out += '<p class="why-not"><b>A ' + esc(W.quote(p)) + "?</b> " + esc(n.charAt(0).toUpperCase() + n.slice(1)) + "</p>";
    });
    if (g.extra) out += g.extra;
    return out ? '<div class="explain">' + out + "</div>" : "";
  };

  function choice(ex, mod, api) {
    var c = W.asChoice(ex, mod);
    var sel = -1;
    var isTf = ex.t === "tf";
    var html =
      '<div class="opts ' + (isTf ? "opts-tf" : "") + '">' +
      c.options
        .map(function (o, i) {
          return (
            '<button class="opt" data-i="' + i + '"><kbd>' + (i + 1) + "</kbd><span>" + esc(o) + "</span></button>"
          );
        })
        .join("") +
      "</div>";
    var root = el(html);
    function pick(i) {
      if (root.classList.contains("locked")) return;
      sel = i;
      W.sound("tap");
      [].forEach.call(root.children, function (b, j) {

      });
      api.change();
    }
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".opt");
      if (b) pick(+b.dataset.i);
    });
    return {
      el: root,
      ready: function () {
        return sel >= 0;
      },
      grade: function () {
        root.classList.add("locked");
        var ok = sel === c.correct;
        root.children[c.correct].classList.add("right");
        if (!ok && sel >= 0) root.children[sel].classList.add("wrong");
        return {
          ok: ok,
          correct: esc(c.options[c.correct]),
          correctText: c.options[c.correct],
          wrongPicks: !ok && sel >= 0 ? [c.options[sel]] : [],
          notes: c.notes
        };
      },
      key: function (k) {
        var n = parseInt(k, 10);
        if (n >= 1 && n <= c.options.length) pick(n - 1);
      }
    };
  }

  function cloze(ex, mod, api) {
    var correct = ex.a[0];
    var opts = W.shuffle(ex.a);
    var sel = null;
    var parts = ex.q.split("___");
    var root = el(
      '<div class="cloze"><p class="cloze-s">' + esc(parts[0]) + '<span class="blank">&nbsp;</span>' + esc(parts[1] || "") +
        '</p><div class="chips">' +
        opts
          .map(function (o, i) {
            return '<button class="chip" data-i="' + i + '"><kbd>' + (i + 1) + "</kbd>" + esc(o) + "</button>";
          })
          .join("") +
        "</div></div>"
    );
    var blank = root.querySelector(".blank");
    function pick(i) {
      if (root.classList.contains("locked")) return;
      sel = opts[i];
      W.sound("tap");
      blank.textContent = sel;
      blank.classList.add("filled");
      [].forEach.call(root.querySelectorAll(".chip"), function (b, j) {
        b.classList.toggle("sel", j === i);
      });
      api.change();
    }
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".chip");
      if (b) pick(+b.dataset.i);
    });
    return {
      el: root,
      prompt: false,
      ready: function () {
        return sel !== null;
      },
      grade: function () {
        root.classList.add("locked");
        var ok = sel === correct;
        blank.classList.add(ok ? "right" : "wrong");
        var notes = {};
        ex.a.slice(1).forEach(function (o, i) {
          if (ex.w && ex.w[i]) notes[o] = ex.w[i];

        return { ok: ok, correct: esc(correct), correctText: correct, wrongPicks: !ok && sel ? [sel] : [], notes: notes };

      key: function (k) {

  function typed(ex, mod, api) {

      ready: function () {

        ex.a.forEach(function (a) {
          best = Math.min(best, W.lev(v, W.norm(a)));
        });
        var tol = ex.a[0].length <= 5 ? 1 : 2;
        var ok = best <= tol;
        input.classList.add(ok ? "right" : "wrong");
        var note = ok && best > 0 ? "Drobna literówka. Poprawnie: „" + ex.a[0] + "”." : null;
        return { ok: ok, correct: esc(ex.a[0]), note: note };
      }
    };
  }

  function match(ex, mod, api) {
    var pairs = ex.pairs;
    var left = W.shuffle(pairs.map(function (p, i) { return { t: p[0], i: i }; }));
    var right = W.shuffle(pairs.map(function (p, i) { return { t: p[1], i: i }; }));
    var root = el(
      '<div class="match"><div class="mcol">' +
        left.map(function (x) { return '<button class="tile" data-side="L" data-i="' + x.i + '">' + esc(x.t) + "</button>"; }).join("") +
        '</div><div class="mcol">' +
        right.map(function (x) { return '<button class="tile" data-side="R" data-i="' + x.i + '">' + esc(x.t) + "</button>"; }).join("") +
        "</div></div>"
    );
    var selL = null, selR = null, done = 0, mistakes = 0;
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".tile");
      if (!b || b.classList.contains("done")) return;
      W.sound("tap");
      if (b.dataset.side === "L") {
        if (selL) selL.classList.remove("sel");
        selL = b;
      } else {
        if (selR) selR.classList.remove("sel");
        selR = b;
      }
      b.classList.add("sel");
      if (selL && selR) {
        var a = selL, c = selR;
        selL = selR = null;
        if (a.dataset.i === c.dataset.i) {
          a.classList.remove("sel");
          c.classList.remove("sel");
          a.classList.add("done");
          c.classList.add("done");
          done++;
          W.sound("correct", done);
          if (done === pairs.length) {
            setTimeout(function () {
              api.done(mistakes <= 1, mistakes);
            }, 250);
          }
        } else {
          mistakes++;
          W.sound("wrong");
          a.classList.add("bad");
          c.classList.add("bad");
          setTimeout(function () {
            a.classList.remove("bad", "sel");
            c.classList.remove("bad", "sel");

      el: root,
      auto: true,
      ready: function () {
        return false;

      grade: function () {

  function multi(ex, mod, api) {

      b.setAttribute("aria-pressed", picked[i] ? "true" : "false");

    }
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".opt");

    });
    return {
      el: root,
      ready: function () {
        return Object.keys(picked).some(function (k) { return picked[k]; });
      },
      grade: function () {
        root.classList.add("locked");
        var ok = true, wrongPicks = [], notes = {};
        (ex.o || []).forEach(function (o, i) {
          if (ex.w && ex.w[i]) notes[o] = ex.w[i];
        });
        opts.forEach(function (o, i) {
          var should = ex.a.indexOf(o) >= 0;
          if (should) root.children[i].classList.add("right");
          else if (picked[i]) {
            root.children[i].classList.add("wrong");
            wrongPicks.push(o);
          }
          if (!!picked[i] !== should) ok = false;
        });
        return { ok: ok, correct: ex.a.map(esc).join(", "), wrongPicks: wrongPicks, notes: notes };
      },
      key: function (k) {
        var n = parseInt(k, 10);
        if (n >= 1 && n <= opts.length) toggle(n - 1);
      }
    };
  }

  function order(ex, mod, api) {
    var pool = W.shuffle(ex.a.map(function (t, i) { return { t: t, i: i }; }));
    var seq = [];
    var root = el('<div class="order"><ol class="ord-seq"></ol><div class="chips ord-pool"></div></div>');
    var seqEl = root.querySelector(".ord-seq"), poolEl = root.querySelector(".ord-pool");
    function paint() {
      seqEl.innerHTML = ex.a
        .map(function (_, k) {
          var it = seq[k];
          return it
            ? '<li><button class="chip sel" data-out="' + k + '">' + esc(it.t) + "</button></li>"
            : '<li class="ord-empty"><span>' + (k + 1) + "</span></li>";
        })
        .join("");
      poolEl.innerHTML = pool
        .map(function (it, k) {
          var used = seq.indexOf(it) >= 0;
          return '<button class="chip" data-in="' + k + '"' + (used ? " hidden" : "") + "><kbd>" + (k + 1) + "</kbd>" + esc(it.t) + "</button>";
        })
        .join("");
      api.change();
    }
    function put(k) {
      if (root.classList.contains("locked")) return;
      var it = pool[k];
      if (seq.indexOf(it) >= 0) return;
      seq.push(it);
      W.sound("tap");
      paint();
    }
    root.addEventListener("click", function (e) {
      if (root.classList.contains("locked")) return;
      var a = e.target.closest("[data-in]");
      if (a) return put(+a.dataset.in);
      var b = e.target.closest("[data-out]");
      if (b) {
        seq.splice(+b.dataset.out, 1);
        W.sound("tap");
        paint();
      }
    });
    paint();
    return {
      el: root,
      ready: function () {
        return seq.length === ex.a.length;
      },
      grade: function () {
        root.classList.add("locked");
        var ok = seq.every(function (it, k) { return it.i === k; });
        [].forEach.call(seqEl.querySelectorAll(".chip"), function (c, k) {
          c.classList.add(seq[k].i === k ? "right" : "wrong");
        });
        return { ok: ok, correct: ex.a.map(function (t, k) { return k + 1 + ". " + esc(t); }).join("<br>") };
      },
      key: function (k) {
        var n = parseInt(k, 10);
        if (n >= 1 && n <= pool.length) put(n - 1);
        if (k === "Backspace" && seq.length) {
          seq.pop();
          paint();
        }
      }
    };
  }

  function sorter(ex, mod, api) {
    var items = W.shuffle(ex.items).slice(0, 6);
    var picks = items.map(function () { return -1; });
    var root = el(
      '<div class="sortex">' +
        items
          .map(function (it, i) {
            return (
              '<div class="srow" data-i="' + i + '"><span class="stext">' + esc(it[0]) + '</span><span class="sbtns">' +
              '<button class="sb" data-c="0">' + esc(ex.cats[0]) + '</button><button class="sb" data-c="1">' + esc(ex.cats[1]) +
              "</button></span></div>"
            );
          })
          .join("") +
        "</div>"
    );
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".sb");
      if (!b || root.classList.contains("locked")) return;
      var row = b.closest(".srow");
      var i = +row.dataset.i;
      picks[i] = +b.dataset.c;
      W.sound("tap");
      [].forEach.call(row.querySelectorAll(".sb"), function (x) {
        x.classList.toggle("sel", x === b);
      });
      api.change();
    });
    return {
      el: root,
      ready: function () {
        return picks.indexOf(-1) === -1;
      },
      grade: function () {
        root.classList.add("locked");
        var wrong = [], notes = [];
        items.forEach(function (it, i) {
          var row = root.children[i];
          var ok = picks[i] === it[1];
          row.classList.add(ok ? "right" : "wrong");
          if (!ok) {
            wrong.push(esc(it[0]) + " → " + esc(ex.cats[it[1]]));
            var why = W.sortWhy(ex, it);
            if (why) notes.push("<li><b>" + esc(it[0]) + ":</b> " + esc(why) + "</li>");
          }
        });
        return {
          ok: wrong.length === 0,
          correct: wrong.join("<br>"),
          extra: notes.length ? '<ul class="why-list">' + notes.join("") + "</ul>" : ""
        };
      }
    };
  }

  /* Dlaczego karta należy do swojej kategorii: notatka przy karcie albo opis kategorii. */
  W.sortWhy = function (deck, it) {
    if (it[2]) return it[2];
    return deck.why ? deck.why[it[1]] : "";
  };

  W.Ex = {
    label: function (ex, mod) {
      if (ex.t === "which") return ex.set ? mod.sets[ex.set].label : mod.whichLabel || "Która to zasada?";
      return LABELS[ex.t] || "";
    },
    render: function (ex, mod, api) {
      switch (ex.t) {
        case "mcq":
        case "which":
        case "tf":
          return choice(ex, mod, api);
        case "cloze":
          return cloze(ex, mod, api);
        case "type":
          return typed(ex, mod, api);
        case "match":
          return match(ex, mod, api);
        case "sort":
          return sorter(ex, mod, api);
        case "multi":
          return multi(ex, mod, api);
        case "order":
          return order(ex, mod, api);
      }
      return choice(ex, mod, api);
    },
    /* Prompt shown above the widget (cloze carries its sentence inline). */
    prompt: function (ex) {
      if (ex.t === "cloze" || ex.t === "match") return "";
      return ex.q;
    },

    /* Generated exercises from flashcard concepts. */
    fromConcept: function (c, mod, reverse) {
      var others = mod.concepts.filter(function (o) {
        return o.id !== c.id && W.allowed(o);
      });
      others = W.sample(others, 3);
      var x = c.plain ? c.plain + " Na teście: " + c.def : c.def;
      if (reverse) {
        return {
          t: "mcq", s: c.s, id: mod.id + ":c:" + c.id + ":r",
          q: "Które pojęcie pasuje do opisu: „" + c.sh + "”?",
          a: [c.term].concat(others.map(function (o) { return o.term; })),
          w: others.map(function (o) { return "To pojęcie oznacza: " + o.sh + "."; }),
          x: x
        };
      }
      return {
        t: "mcq", s: c.s, id: mod.id + ":c:" + c.id,
        q: "Co oznacza pojęcie „" + c.term + "”?",
        a: [c.sh].concat(others.map(function (o) { return o.sh; })),
        w: others.map(function (o) { return "Tak opisujemy inne pojęcie: " + W.quote(o.term) + "."; }),
        x: x
      };
    },
    matchFromConcepts: function (list, mod) {
      return {
        t: "match", s: "S", id: mod.id + ":m:" + list.map(function (c) { return c.id; }).join(","),
        pairs: list.map(function (c) { return [c.term, c.sh]; })
      };
    }
  };

  /* Weighted sampling without replacement (Efraimidis–Spirakis). */
  W.weighted = function (modId, list, n) {
    return list
      .map(function (e) {
        return { e: e, k: Math.pow(Math.random(), 1 / W.Store.weight(modId, e.id)) };
      })
      .sort(function (a, b) {
        return b.k - a.k;
      })
      .slice(0, n)
      .map(function (x) {
        return x.e;
      });
  };

  /* Kolejność w lekcji: najpierw rozpoznawanie (prawda/fałsz, wybór), potem
   * dopasowywanie, na końcu przypominanie z pamięci (układanie, wpisywanie).
   * Lekcje z flagą seq idą w kolejności, w jakiej ćwiczenia stoją w module. */
  var TIER = { tf: 0, which: 1, mcq: 1, cloze: 2, multi: 2, match: 2, sort: 3, order: 3, type: 4 };
  function ramp(list, m, seq) {
    var pos = {};
    m.exercises.forEach(function (e, i) {
      pos[e.id] = i;
    });
    return list
      .map(function (e) {
        var k;
        if (seq) k = pos[e.id] != null ? pos[e.id] : e.t === "match" ? 1e6 : -1;
        else k = (TIER[e.t] != null ? TIER[e.t] : 1) + Math.random() * 1.5;
        return { e: e, k: k };
      })
      .sort(function (a, b) {
        return a.k - b.k;
      })
      .map(function (x) {
        return x.e;
      });
  }

  W.buildLesson = function (m, unit) {
    var all = m.exercises.filter(W.allowed);
    if (unit.boss) {
      var bossPool = all.filter(function (e) {
        return e.t !== "match" && e.t !== "sort";
      });
      return W.shuffle(W.weighted(m.id, bossPool, 15));
    }
    var pool = all.filter(function (e) {
      return e.u === unit.id;
    });
    var picked = W.weighted(m.id, pool, unit.size || 8);
    var concepts = m.concepts.filter(function (c) {
      return c.u === unit.id && W.allowed(c);
    });
    if (concepts.length) {
      var c = concepts[Math.floor(Math.random() * concepts.length)];
      picked.push(W.Ex.fromConcept(c, m, Math.random() < 0.5));
    }
    var hasMatch = picked.some(function (e) {
      return e.t === "match";
    });
    if (!hasMatch && concepts.length >= 2) {
      var fill = m.concepts.filter(function (c2) {
        return c2.u !== unit.id && W.allowed(c2);
      });
      var set = W.sample(concepts, 4);
      if (set.length < 4) set = set.concat(W.sample(fill, 4 - set.length));
      picked.push(W.Ex.matchFromConcepts(set, m));
    }
    var out = ramp(picked, m, unit.seq);
    /* Na koniec 1–2 pytania z wcześniejszych lekcji, żeby nie wypadły z głowy. */
    var idx = m.unitIdx[unit.id];
    var earlier = all.filter(function (e) {
      return m.unitIdx[e.u] < idx && e.t !== "match";
    });
    if (earlier.length) out = out.concat(W.weighted(m.id, earlier, idx >= 3 ? 2 : 1));
    return out;
  };
})();

</script>
    <script>
/* Przebieg lekcji w stylu Duolingo: serca, ponawianie błędów, pasek postępu. */
(function () {
  "use strict";
  var W = window.Wykuj;
  var esc = W.esc;
  var Store = W.Store;

  /* opts: { mod, unit?, items, title, hearts (number|null), onExit(), onFinish(result) } */
  W.runSession = function (root, opts) {
    var m = opts.mod;
    var queue = opts.items.slice();
    var total = queue.length;
    var solved = 0;
    var firstTry = 0;
    var seen = {};
    var hearts = opts.hearts;
    var combo = 0, bestCombo = 0;
    var t0 = Date.now();
    var cur = null, ctrl = null, phase = "answer";

    root.innerHTML =
      '<div class="lesson">' +
      '<header class="l-top">' +
      '<button class="icon-btn" data-act="quit" aria-label="Zakończ lekcję">' + W.icon("x") + "</button>" +
      '<div class="lbar" role="progressbar" aria-label="Postęp lekcji"><i></i></div>' +
      (hearts != null ? '<div class="hearts" aria-label="Serca">' + W.icon("heart") + "<b></b></div>" : "") +
      "</header>" +
      '<div class="combo" hidden></div>' +
      '<main class="l-body"></main>' +
      '<footer class="l-foot"><div class="fb" role="status" aria-live="polite" hidden></div><div class="l-foot-row">' +
      '<button class="btn ghost" data-act="skip">Nie wiem</button>' +
      '<button class="btn primary" data-act="check" disabled>Sprawdź</button></div></footer>' +
      '<div class="modal" hidden><div class="modal-card"><h3>Przerwać lekcję?</h3><p>Postęp tej lekcji przepadnie. XP za poprawne odpowiedzi zostaje.</p>' +
      '<div class="row"><button class="btn primary" data-act="stay">Zostaję</button><button class="btn danger-ghost" data-act="leave">Wyjdź</button></div></div></div>' +
      "</div>";

    var $ = function (s) { return root.querySelector(s); };
    var body = $(".l-body"), foot = $(".l-foot"), fb = $(".fb"), btn = $('[data-act="check"]');
    var skip = $('[data-act="skip"]'), bar = $(".lbar i"), comboEl = $(".combo"), modal = $(".modal");

    function paint() {
      bar.style.width = Math.round((solved / total) * 100) + "%";
      if (hearts != null) $(".hearts b").textContent = hearts;
    }

    function next() {
      if (!queue.length) return finish(true);
      cur = queue.shift();
      phase = "answer";
      foot.className = "l-foot";
      fb.hidden = true;
      btn.textContent = "Sprawdź";
      btn.disabled = true;
      skip.hidden = false;
      var prompt = W.Ex.prompt(cur);
      body.innerHTML =
        '<div class="l-head"><span class="l-label">' + W.Ex.label(cur, m) + "</span>" + W.srcBadge(cur.s, m) +
        (seen[cur.id] ? '<span class="src src-redo">powtórka błędu</span>' : "") +
        (opts.unit && !opts.unit.boss && cur.u && cur.u !== opts.unit.id && !seen[cur.id] ? '<span class="src src-redo">z wcześniejszej lekcji</span>' : "") + "</div>" +
        (prompt ? '<h2 class="l-q">' + esc(prompt) + "</h2>" : "") +
        '<div class="l-ex"></div>';
      ctrl = W.Ex.render(cur, m, {
        change: function () {
          btn.disabled = !ctrl.ready();
        },
        submit: function () {
          if (ctrl.ready()) check();
        },
        done: function (ok) {
          check(ok);
        }
      });
      body.querySelector(".l-ex").appendChild(ctrl.el);
      if (ctrl.auto) {
        btn.hidden = true;
      } else {
        btn.hidden = false;
      }
      body.scrollTop = 0;
      paint();
    }

    function check(forced) {
      if (phase !== "answer") return;
      phase = "feedback";
      var g = ctrl.grade();
      var ok = forced === undefined ? g.ok : forced;
      if (forced === false && g.ok) ok = false;
      var retry = !!seen[cur.id];
      if (cur.id) Store.record(m.id, cur.id, ok);
      if (ok) {
        solved++;
        if (!retry) firstTry++;
        combo++;
        bestCombo = Math.max(bestCombo, combo);
        Store.addXP(retry ? 1 : 2);
        W.sound("correct", combo);
        W.buzz(10);
      } else {
        combo = 0;
        seen[cur.id] = true;
        if (hearts != null) hearts--;
        queue.push(cur);
        W.sound("wrong");
        W.buzz([30, 40, 30]);
        root.querySelector(".lesson").classList.add("shake");
        setTimeout(function () {
          var l = root.querySelector(".lesson");
          if (l) l.classList.remove("shake");
        }, 400);
      }
      if (combo >= 3 && combo % 1 === 0) {
        comboEl.hidden = false;
        comboEl.innerHTML = W.icon("flame") + combo + " z rzędu";
        comboEl.classList.remove("pop");
        void comboEl.offsetWidth;
        comboEl.classList.add("pop");
      } else {
        comboEl.hidden = true;
      }
      var praise = ["Świetnie!", "Dokładnie tak!", "Brawo!", "Zgadza się!", "Tak trzymaj!"];
      var head = ok ? praise[Math.floor(Math.random() * praise.length)] : "Poprawna odpowiedź:";
      var html = "<b class='fb-h'>" + W.icon(ok ? "check" : "x") + esc(head) + "</b>";
      if (!ok && g.correct) html += "<div class='fb-a'>" + g.correct + "</div>";
      if (g.note) html += "<p class='fb-x'>" + esc(g.note) + "</p>";
      html += W.explain(cur, g);
      fb.innerHTML = html;
      fb.scrollTop = 0;
      fb.hidden = false;
      foot.className = "l-foot " + (ok ? "ok" : "bad");
      skip.hidden = true;
      btn.hidden = false;
      btn.disabled = false;
      btn.textContent = "Dalej";
      paint();
      btn.focus({ preventScroll: true });
    }

    function finish(completed) {
      phase = "done";
      var secs = Math.round((Date.now() - t0) / 1000);
      var acc = total ? firstTry / total : 0;
      var res = {
        completed: completed && (hearts == null || hearts > 0),
        acc: acc,
        firstTry: firstTry,
        total: total,
        secs: secs,
        bestCombo: bestCombo,
        hearts: hearts
      };
      opts.onFinish(res);
    }

    function onClick(e) {
      var a = e.target.closest("[data-act]");
      if (!a) return;
      var act = a.dataset.act;
      if (act === "check") {
        if (phase === "answer") check();
        else if (phase === "feedback") {
          if (hearts != null && hearts <= 0) finish(false);
          else next();
        }
      } else if (act === "skip") {
        if (phase === "answer") check(false);
      } else if (act === "quit") {
        modal.hidden = false;
      } else if (act === "stay") {
        modal.hidden = true;
      } else if (act === "leave") {
        opts.onExit();
      }
    }
    root.addEventListener("click", onClick);

    W.setKeys(function (e) {
      if (!modal.hidden) {
        if (e.key === "Escape") modal.hidden = true;
        return;
      }
      if (e.key === "Escape") {
        modal.hidden = false;
        return;
      }
      if (e.key === "Enter") {
        if (e.target && e.target.tagName === "BUTTON") return;
        e.preventDefault();
        if (!btn.disabled && !btn.hidden) btn.click();
        return;
      }
      if (phase === "answer" && ctrl && ctrl.key && !(e.target && e.target.tagName === "INPUT")) ctrl.key(e.key);
    });

    next();
  };

  W.starsFor = function (acc) {
    return acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1;
  };

  W.starRow = function (n, max) {
    var s = "";
    for (var i = 0; i < (max || 3); i++) s += '<span class="st ' + (i < n ? "on" : "") + '">' + W.icon("star") + "</span>";
    return '<span class="stars">' + s + "</span>";
  };

  W.fmtTime = function (secs) {
    var m = Math.floor(secs / 60), s = secs % 60;
    return m + ":" + ("0" + s).slice(-2);
  };

  /* Ekran wyniku wspólny dla lekcji, quizów i gier. */
  W.resultScreen = function (root, o) {
    root.innerHTML =
      '<div class="result ' + (o.fail ? "fail" : "") + '">' +
      '<div class="r-hero">' +
      (o.stars != null ? '<div class="r-stars">' + W.starRow(o.stars) + "</div>" : "") +
      '<h1 class="display">' + esc(o.title) + "</h1>" +
      (o.sub ? '<p class="r-sub">' + esc(o.sub) + "</p>" : "") +
      "</div>" +
      '<div class="r-stats">' +
      o.stats
        .map(function (s) {
          return '<div class="r-stat ' + (s.tone || "") + '"><span>' + esc(s.label) + "</span><b>" + esc(s.value) + "</b></div>";
        })
        .join("") +
      "</div>" +
      (o.extra || "") +
      '<div class="r-actions">' +
      o.actions
        .map(function (a, i) {
          return '<button class="btn ' + (i === 0 ? "primary" : "ghost") + '" data-r="' + i + '">' + esc(a.label) + "</button>";
        })
        .join("") +
      "</div></div>";
    root.querySelectorAll("[data-r]").forEach(function (b) {
      b.addEventListener("click", function () {
        o.actions[+b.dataset.r].fn();
      });
    });
    W.setKeys(function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        o.actions[0].fn();
      }
    });
    if (!o.fail) {
      W.sound("finish");
      if (o.confetti) W.confetti();
    } else {
      W.sound("fail");
    }
    var first = root.querySelector('[data-r="0"]');
    if (first) first.focus({ preventScroll: true });
  };
})();

</script>

    <script>
/* Moduł: Metody pracy twórczej z dziećmi i młodzieżą, wykład 1: Specyfika.
 *
 * Źródło każdej pozycji (pole s):
 *   "S" slajd lub sylabus (domyślne, pomijane)
 *   "U" powiedziane ustnie na wykładzie
 *   "D" dopowiedzenie spoza wykładu (★). Egzamin próbny je pomija.
 *
 * Typy ćwiczeń (pole t):
 *   mcq    q, a[] (pierwsza odpowiedź jest poprawna), x
 *   tf     q, a (true/false), x
 *   cloze  q z luką ___, a[] (pierwsza poprawna), x
 *   type   q, a[] (akceptowane odpowiedzi), x
 *   which  q (sytuacja), a (numer zasady 1-10), x
 *   match  pairs[[lewo, prawo], ...]
 *   sort   q, cats[2], items[[tekst, 0|1], ...]
 */
Wykuj.registerModule({
  id: "mpt-w1",
  course: { id: "mpt", name: "Metody pracy twórczej z dziećmi i młodzieżą", short: "MPT", theme: "green", icon: "pencil" },
  number: 1,
  title: "Specyfika",
  lecturer: "dr Barbara Cichy-Jasiocha",
  term: "semestr zimowy 2026/2027",
  passing: "Obecność + test pisemny z pytaniami zamkniętymi. Trzeba uzyskać więcej niż 50% punktów.",
  passRatio: 0.5,

  principles: [
    "Prymat procesu nad efektem",
    "Psychologiczne bezpieczeństwo",
    "Aktywacja polisensoryczna",
    "Elastyczność struktury",
    "Metaforyzacja i projekcja",
    "Rytualizacja i ramy (setting)",
    "Ambiwalencja oporu",
    "Przekraczanie egocentryzmu, teoria umysłu",
    "Sprawczość i poczucie kontroli (LOC)",
    "Kanalizacja i sublimacja"
  ],
  /* Czym jest każda zasada: podpowiedź po odpowiedzi w pytaniach „która to zasada?”. */
  principleWhy: ["zasada 1: liczy się sam akt tworzenia, a nie estetyka gotowego dzieła",
    "zasada 2: klimat bez oceniania, zielony ołówek (zasoby zamiast błędów) i prawo do odmowy",
    "zasada 3: angażowanie wielu zmysłów naraz (glina, muzyka, zapachy, faktury)",
    "zasada 4: scenariusz to punkt wyjścia, a prowadzący jest gotowy na zwroty akcji",

  concepts: [
    { id: "facylitacja", u: "wstep", s: "U", term: "Facylitacja",
      plain: "Psycholog samą swoją obecnością sprawia, że łatwiej zacząć i ciągnąć rozmowę o trudnych uczuciach. Nie prowadzi za rękę, tylko ułatwia.",
      def: "Sytuacja, w której obecność psychologa umożliwia rozpoczęcie i kontynuowanie procesu rozmawiania o trudnych emocjach.",
      sh: "obecność psychologa umożliwia rozmowę o trudnych emocjach" },
    { id: "facylitator", u: "wstep", s: "D", term: "Facylitator",
      plain: "Ktoś, kto nie naprawia dziecka, tylko stwarza warunki, w których dziecko samo zaczyna działać i mówić.",
      def: "Nie jest ekspertem, który „naprawia”. Tworzy warunki, w których proces może zajść sam. Termin spopularyzował m.in. Carl Rogers (nurt humanistyczny).",
      sh: "tworzy warunki, by proces zaszedł sam (Rogers)" },
    { id: "socjoterapia", u: "wstep", s: "D", term: "Socjoterapia",
      plain: "Pomoc w grupie: dzieci przeżywają razem coś dobrego (akceptację, współpracę), co prostuje ich złe doświadczenia z ludźmi.",
      def: "Grupowa forma pomocy psychologicznej dla dzieci i młodzieży z trudnościami emocjonalnymi i w relacjach. Opiera się na doświadczeniach korektywnych w bezpiecznej grupie.",
      sh: "grupowa pomoc oparta na doświadczeniach korektywnych" },
    { id: "cele-socjo", u: "wstep", s: "D", term: "Cele socjoterapii",
      plain: "Trzy cele: ulżyć i zmienić złe przekonania (terapeutyczne), nauczyć się dogadywać z innymi (edukacyjne), wspierać to, czego dziecko potrzebuje do rozwoju (rozwojowe).",
      def: "Terapeutyczne (odreagowanie, korekta przekonań o sobie i innych), edukacyjne (umiejętności społeczne, komunikacja) i rozwojowe (wspieranie potrzeb rozwojowych).",
      sh: "terapeutyczne, edukacyjne, rozwojowe" },
    { id: "zaliczenie", u: "wstep", term: "Zaliczenie przedmiotu",
      plain: "Chodzisz na zajęcia i piszesz test z odpowiedziami do wyboru. Trzeba mieć ponad połowę punktów.",
      def: "Obecność plus egzamin: test pisemny z pytaniami zamkniętymi. Trzeba uzyskać więcej niż 50% punktów.",
      sh: "obecność + test zamknięty, ponad 50%" },
    { id: "proces", u: "z1", term: "Prymat procesu nad efektem",
      plain: "Liczy się samo tworzenie, a nie to, czy wyszło ładnie. Rysunek może być „brzydki”, ważne, co działo się podczas rysowania.",
      def: "Największą wartość terapeutyczną i rozwojową ma sam akt tworzenia, a nie produkt końcowy. Paradygmat „tu i teraz”. Cel: uwolnienie od presji perfekcjonizmu.",
      sh: "liczy się akt tworzenia, nie produkt" },
    { id: "projekcja", u: "z1", s: "U", term: "Projekcja myśli",
      plain: "Dziecko mówi o misiu, a tak naprawdę mówi o sobie: przypisuje misiowi swoje myśli i uczucia.",
      def: "Przypisywanie obiektowi zewnętrznemu własnych stanów wewnętrznych. Uruchamia ją pytanie otwarte: „opowiedz mi o tym misiu, o czym on myśli?”.",
      sh: "przypisywanie obiektowi własnych stanów" },
    { id: "projekcja-psa", u: "z1", s: "D", term: "Projekcja w psychoanalizie",
      plain: "W psychoanalizie projekcja to obrona: swoje nieakceptowane uczucia „wrzucam” w innych. Na teście używaj wersji z wykładu, bez obrony.",
      def: "Mechanizm obronny: przypisywanie innym własnych nieakceptowanych impulsów. Na teście trzymaj się definicji z wykładu (projekcja myśli, bez założenia obrony).",
      sh: "mechanizm obronny: moje impulsy przypisuję innym" },
    { id: "bezpieczenstwo", u: "z2", term: "Psychologiczne bezpieczeństwo",
      plain: "Na tych zajęciach nikt nie ocenia ani nie krytykuje. Tylko wtedy dziecko odważy się pokazać coś z siebie.",
      def: "Klimat bez oceniania: całkowite zawieszenie krytyki i ocen szkolnych. Twórczość wymaga odsłonięcia się, a to ryzyko emocjonalne (szczególnie u młodzieży).",
      sh: "klimat bez oceniania i krytyki" },
    { id: "zielony", u: "z2", term: "Zasada zielonego ołówka",
      plain: "Zamiast zaznaczać na czerwono błędy, zaznaczasz na zielono to, co ciekawe i udane. Szukasz mocnych stron, czyli zasobów.",
      def: "Zauważanie i wzmacnianie tego, co unikalne, nietypowe i ciekawe w pomyśle uczestnika (ZASOBY), zamiast wytykania błędów.",

    { id: "czerwony", u: "z2", term: "Czerwony ołówek",
      plain: "Szkolne wytykanie błędów. Psycholog odkłada ten ołówek.",
      def: "Wytykanie błędów i tego, co „nie wyszło”. Tego psycholog unika.",
      sh: "wytykanie błędów i tego, co nie wyszło" },
    { id: "odmowa", u: "z2", term: "Prawo do odmowy",
      plain: "Każdy może powiedzieć „nie” i nie pokazywać swojej pracy. Bez tłumaczenia się.",
      def: "Uczestnik zawsze może powiedzieć „NIE” i nie pokazywać pracy grupie, gdy temat jest zbyt intymny albo gdy po prostu nie chce.",
      sh: "zawsze można nie pokazać pracy grupie" },
    { id: "kierunek", u: "z2", s: "U", term: "Kierunek oceny",
      plain: "Oceniamy zawsze, więc psycholog świadomie patrzy na to, co wychodzi, a nie na to, co nie wychodzi.",

    { id: "polisensoryka", u: "z34", term: "Aktywacja polisensoryczna",

      sh: "angażowanie wielu zmysłów naraz" },
    { id: "snoezelen", u: "z34", s: "D", term: "Snoezelen",

    { id: "elastycznosc", u: "z34", term: "Elastyczność struktury",

      def: "Podążanie za dynamiką grupy. Sztywny scenariusz to największy wróg kreatywności, prowadzący musi być gotowy na ZWROTY AKCJI. Twórczość staje się wentylem bezpieczeństwa.",

    { id: "metafora", u: "z56", term: "Metaforyzacja",

    { id: "bajkoterapia", u: "z56", term: "Bajkoterapia",

    { id: "drama", u: "z56", term: "Drama",

    { id: "setting", u: "z56", term: "Setting",

    { id: "opor", u: "z7", term: "Ambiwalencja oporu",

  /* Notatki do czytania. Klasy: .oral = ustnie, .extra = dopowiedzenie (★). */
  notes: [
    { id: "intro", title: "O czym jest ten wykład", html:
      "<div class='plain'><p>Na tych zajęciach nie uczysz się plastyki, tylko tego, jak psycholog prowadzi zajęcia twórcze z dziećmi i nastolatkami. Wykład daje dziesięć zasad, które odróżniają to od szkolnej lekcji i od pracy z dorosłymi.</p></div>" +
      "<p>Wykład otwiera kurs (temat 1 z sylabusa). Pokazuje uniwersalne elementy, które odróżniają zajęcia twórcze z dziećmi i młodzieżą od standardowej edukacji i od pracy z dorosłymi. Prowadząca nazywa je <b>kluczowymi zasadami psychopedagogicznymi</b>, które każdy przyszły psycholog powinien wdrożyć w praktyce.</p>" +
      "<p><b>Zaliczenie:</b> obecność plus egzamin, czyli test pisemny z pytaniami zamkniętymi. Trzeba uzyskać <b>więcej niż 50%</b> punktów.</p>" +
      "<div class='oral'><p><b>Facylitacja</b> to sytuacja, w której obecność psychologa umożliwia rozpoczęcie i kontynuowanie procesu rozmawiania o trudnych emocjach. Obok facylitacji prowadząca wprowadziła pojęcie socjoterapii.</p></div>" +
      "<aside class='extra'><p>Termin „facylitator” spopularyzował m.in. <b>Carl Rogers</b> w nurcie humanistycznym. Facylitator nie jest ekspertem, który „naprawia”. Tworzy warunki, w których proces może zajść sam.</p>" +
      "<p><b>Socjoterapia</b> to grupowa forma pomocy psychologicznej dla dzieci i młodzieży z trudnościami emocjonalnymi i w relacjach. Opiera się na doświadczeniach korektywnych. Cele: terapeutyczne (odreagowanie, korekta przekonań), edukacyjne (umiejętności społeczne, komunikacja) i rozwojowe. Metody twórcze (rysunek, drama, ruch) są jej podstawowym narzędziem. W Polsce spopularyzowała ją m.in. K. Sawicka.</p></aside>" },
    { id: "p1", n: 1, title: "Prymat procesu nad efektem", html:
      "<div class='plain'><p>Ważne jest to, co dzieje się podczas tworzenia, a nie to, czy wyszło ładnie. Psycholog nie chwali i nie gani wyglądu pracy, tylko ciekawi się tym, jak powstawała.</p></div>" +
      "<p>Paradygmat <b>„tu i teraz”</b>. U dorosłych często liczy się produkt końcowy (książka, obraz, projekt). U dzieci i młodzieży największą wartość terapeutyczną i rozwojową ma <b>sam akt tworzenia</b>.</p>" +
      "<p>Psycholog nie ocenia estetyki dzieła. Zamiast „piękny rysunek” czy „super” mówi:</p>" +
      "<blockquote>„Widzę, że użyłeś dużo czerwieni i mocno naciskałeś kredkę (opowiesz mi o tym?)”</blockquote>" +
      "<p><b>Cel:</b> uwolnienie od presji perfekcjonizmu.</p>" +
      "<div class='oral'><ul><li>„Co dostałeś z kartkówki?” to typowe nastawienie dorosłych na wynik zamiast na to, jak dziecko pracowało.</li>" +
      "<li>„Wylewanie dziecka z kąpielą”: oceniając tylko efekt, tracimy to, co w pracy twórczej najcenniejsze.</li>" +
      "<li>Pytanie otwarte („opowiedz mi o tym misiu, o czym on myśli?”) uruchamia <b>projekcję</b>: mówiąc o misiu, dziecko mówi o sobie.</li>" +
      "<li><b>Projekcja myśli</b> to przypisywanie obiektowi zewnętrznemu własnych stanów wewnętrznych.</li></ul></div>" +
      "<aside class='extra'><p>W psychoanalizie projekcja to mechanizm obronny. Tu chodzi o sens z technik projekcyjnych, bez założenia obrony. Na teście trzymaj się definicji z wykładu.</p></aside>" },
    { id: "p2", n: 2, title: "Psychologiczne bezpieczeństwo", html:
      "<div class='plain'><p>Dziecko pokaże coś z siebie tylko tam, gdzie nikt go nie oceni. Dlatego psycholog patrzy na mocne strony i pozwala nie pokazywać pracy.</p></div>" +
      "<p>Twórczość wymaga odsłonięcia się, a to ryzyko emocjonalne (szczególnie u młodzieży). Specyfika tych zajęć to <b>całkowite zawieszenie krytyki i ocen szkolnych</b>.</p>" +
      "<p><b>Zasada zielonego ołówka:</b> zamiast wytykać błędy (czerwony ołówek) psycholog zauważa i wzmacnia to, co unikalne, nietypowe i ciekawe. Hasło ze slajdu: <mark>ZASOBY</mark>.</p>" +
      "<p><b>Prawo do odmowy:</b> uczestnik zawsze może powiedzieć „NIE” i nie pokazywać pracy grupie.</p>" +
      "<div class='oral'><p>„Nie da się uciec od oceniania”, więc psycholog świadomie zmienia jej <b>kierunek</b>: zasoby, nie błędy.</p></div>" +
      "<aside class='extra'><p>„Zielony ołówek” jest znany z oceniania kształtującego. Łączy się z tematem 4 (etyka oceniania wytworów).</p></aside>" },
    { id: "p3", n: 3, title: "Aktywacja polisensoryczna", html:
      "<div class='plain'><p>Siedzenie przy biurku to za mało. Glina, farby na podłodze, muzyka i zapachy pomagają się uspokoić i wyrazić to, czego trudno powiedzieć słowami.</p></div>" +
      "<p>W dobie przebodźcowania cyfrowego dzieci i młodzież potrzebują <b>zakotwiczenia w ciele</b>. Praca twórcza nie może opierać się wyłącznie na myśleniu pojęciowym.</p>" +
      "<p>Przykłady: glina przy muzyce, malowanie wielkoformatowe na podłodze, zapachy, faktury (multi-sensory environments).</p>" +
      "<p><b>Efekt:</b> regulacja układu nerwowego i łatwiejsza ekspresja dla osób, którym trudno mówić o emocjach.</p>" +
      "<div class='oral'><p>Samo siedzenie przy biurku to praca wyłącznie na myśleniu pojęciowym.</p></div>" +
      "<aside class='extra'><p>Najbardziej znana realizacja: <b>Snoezelen</b>, sala doświadczania świata z Holandii.</p></aside>" },
    { id: "p4", n: 4, title: "Elastyczność struktury", html:
      "<div class='plain'><p>Plan zajęć jest tylko propozycją. Jeśli grupa przychodzi z czymś ważnym, zajmujesz się tym, a twórczość pomaga to przepracować.</p></div>" +
      "<p><b>Sztywny scenariusz zajęć jest największym wrogiem kreatywności.</b> Prowadzący musi być gotowy na <mark>ZWROTY AKCJI</mark>.</p>" +
      "<p>Jeśli zaplanowałeś bajkę o lęku, a grupa wchodzi poruszona konfliktem w klasie, porzucasz plan i zamieniasz metodę w narzędzie do przepracowania kryzysu. Twórczość staje się <b>wentylem bezpieczeństwa</b>.</p>" +
      "<div class='oral'><p>Scenariusz jest punktem wyjścia, a nie obowiązkiem.</p></div>" },
    { id: "p5", n: 5, title: "Metaforyzacja i projekcja", html:
      "<div class='plain'><p>O sobie mówić trudno, o potworze z bajki łatwo. Bajka i odgrywana rola dają bezpieczny dystans.</p></div>" +
      "<p>Dzieciom i młodzieży trudno mówić wprost o lękach, kompleksach i traumach, więc korzystamy z narzędzi projekcyjnych.</p>" +
      "<p>Łatwiej opowiedzieć o „smutnym potworze, który zgubił się w lesie” (bajkoterapia) albo zagrać zbuntowanego bohatera (drama), niż powiedzieć „czuję się samotny i nierozumiany przez rodziców”. <b>Metafora i symbolika dają dziecku bezpieczeństwo.</b></p>" },
    { id: "p6", n: 6, title: "Rytualizacja i ramy czasowo-przestrzenne", html:
      "<div class='plain'><p>Stałe rytuały na początek i koniec oraz inna przestrzeń (krąg zamiast ławek) mówią: teraz jesteśmy w innym, bezpiecznym miejscu.</p></div>" +
      "<p>Jasne granice oddzielają przestrzeń twórczą od „zwykłej rzeczywistości”. Hasło ze slajdu: <mark>SETTING</mark>.</p>" +
      "<p>Stałe rytuały rozpoczęcia (Iskierka przyjaźni, rundka „jakim kolorem dziś jesteś?”) i zakończenia. Fizyczna zmiana przestrzeni: odsunięte ławki, krąg na poduszkach.</p>" +
      "<aside class='extra'><p>Iskierka przyjaźni: uczestnicy w kręgu kolejno przekazują sobie uścisk dłoni. Setting w psychoterapii: stałe ramy spotkań, czyli miejsce, czas i zasady.</p></aside>" },
    { id: "p7", n: 7, title: "Ambiwalencja oporu", html:
      "<div class='plain'><p>„To jest bez sensu” zwykle znaczy „boję się”. Psycholog tego nie przełamuje, tylko daje czas i pozwala popatrzeć.</p></div>" +
      "<p>U dorosłych opór pojawia się rzadko (ale bywa zakamuflowany). U dzieci, a zwłaszcza młodzieży, <b>opór jest naturalnym elementem procesu</b>.</p>" +
      "<p>Za tekstami „to jest dla dzieci”, „nie umiem rysować” kryje się <b>lęk</b> przed oceną, odrzuceniem przez grupę lub trudnymi emocjami. Psycholog nie walczy i nie zmusza:</p>" +
      "<blockquote>„Masz prawo uważać to zadanie za nudne. Możesz po prostu posiedzieć z nami i popatrzeć.”</blockquote>" +
      "<p>Młodzież bez nacisku często po kilkunastu minutach sama dołącza.</p>" +
      "<div class='oral'><p>Opór jest normalny i uczestnik ma do niego prawo. To łączy się z prawem do odmowy (zasada 2).</p></div>" },
    { id: "p8", n: 8, title: "Egocentryzm i teoria umysłu", html:
      "<div class='plain'><p>Dzieci i nastolatki są mocno skupione na sobie. Zabawy w odgrywanie ról uczą patrzeć oczami innych.</p></div>" +
      "<p>Grupowa praca twórcza (drama, wspólny scenariusz) to trening społeczny. Młodsze dzieci tkwią w <b>egocentryzmie poznawczym</b>, młodzież w <b>egocentryzmie adolescentnym</b>.</p>" +
      "<p>Zadania wymuszają cudzą perspektywę: „zagraj zepsutą zabawkę zostawioną na deszczu”, „napisz list z perspektywy nauczyciela”. Buduje to empatię i elastyczność poznawczą.</p>" +
      "<div class='oral'><ul><li>Poznawczy: dziecko oczekuje, że wszyscy znają zasady, które samo wymyśliło.</li>" +
      "<li>Afektywny: „idę na imprezę z pryszczem, to wina świata”.</li>" +
      "<li>Marki (np. kosmetyczne) budują warunki, w których odbiorca projektuje na siebie przeżycie.</li></ul></div>" +
      "<aside class='extra'><p>Poznawczy opisał <b>Piaget</b> (stadium przedoperacyjne), adolescentny <b>Elkind</b>: wyobrażona publiczność i baśń osobista. Teoria umysłu to przypisywanie innym stanów psychicznych odmiennych od własnych. Na teście używaj nazwy ze slajdu: <b>egocentryzm adolescentny</b>.</p></aside>" },
    { id: "p9", n: 9, title: "Sprawczość i poczucie kontroli (LOC)", html:
      "<div class='plain'><p>Wielu młodych ludzi czuje, że nic od nich nie zależy. W pracy twórczej to oni decydują o wszystkim, więc uczą się, że ich głos się liczy.</p></div>" +
      "<p>Wielu młodych ludzi z trudnościami czuje, że nie ma wpływu na swoje życie (<b>zewnętrzne umiejscowienie kontroli</b>).</p>" +
      "<p>Czysta kartka, glina czy pusta scena dają dziecku absolutną władzę nad tworzonym światem. Każda decyzja należy do młodego człowieka. Czarne słońce i niebieska trawa? Akceptujemy.</p>" +
      "<blockquote>„Ja decyduję, ja kreuję, mój głos ma znaczenie.”</blockquote>" +
      "<div class='oral'><p>Nauczyciel plastyki poprawi czarne słońce. Psycholog zastanowi się, dlaczego dziecko tak namalowało. Ważne jest też, jak ktoś przeżywa narzucone ramy.</p></div>" +
      "<aside class='extra'><p>LOC to koncepcja <b>J. Rottera</b>. Internalizacja: od „decydują za mnie” do „to zależy ode mnie”.</p></aside>" },
    { id: "p10", n: 10, title: "Kanalizacja i sublimacja", html:
      "<div class='plain'><p>Złość i napięcie nie znikają, kiedy się je ucisza. Lepiej dać im ujście w czymś twórczym: w glinie, tańcu, piosence.</p></div>" +
      "<p>Dzieci i młodzież noszą w sobie napięcie, złość, lęk, energię seksualną. Według nurtu psychodynamicznego twórczość jest <b>najwyższą formą obrony przed lękiem (sublimacją)</b>: zamienia destrukcyjną energię w wytwór.</p>" +
      "<p>Agresja? Ciężka glina do uderzania albo buntowniczy tekst piosenki. Nadaktywność? Ekspresyjny taniec.</p>" +
      "<div class='oral'><p>Zadaniem psychologa nie jest wygaszenie napięcia, lecz nadanie mu kierunku.</p></div>" +
      "<aside class='extra'><p>Sublimację opisał <b>Freud</b>. <b>Vaillant</b> zalicza ją do mechanizmów dojrzałych.</p></aside>" }
  ],
